name = "founder-control-room"
account_id = "9b59861bd1747cf7525571b4c51d2aa0"
main = "src/worker/cf-entry.ts"
compatibility_date = "2026-07-20"
compatibility_flags = [
  "nodejs_compat",
  "enable_nodejs_http_modules",
  "enable_nodejs_http_server_modules",
]
workers_dev = true
preview_urls = true

# Every Wrangler build passes through the repository-owned authority membrane.
# Native Cloudflare Workers Builds may verify/upload versions, but they may not
# promote production. Canonical production promotion remains the exact-main,
# founder-approved GitHub Deploy / Worker Reconcile workflows.
[build]
command = "node scripts/verify-worker-build-authority.mjs"

# Cloudflare Pages owns foundercontrolroom.org and serves ./public.
# This single surviving Worker owns backend, auth, MCP, and reconciliation
# traffic at api.foundercontrolroom.org. The deleted founder-control-room2
# identity must never be recreated or targeted by deployment automation.
# The account ID is a public provider identifier and is kept here as
# declarative Worker authority; deployment credentials remain GitHub secrets.

[observability]
enabled = true

# Private, same-account RPC only. FCR is the caller/authority membrane; Chief
# receives sanitized evidence and may reason over it, but this binding does not
# grant Chief repository, approval, deployment, publication, or provider
# mutation authority.
[[services]]
binding = "CHIEF_AI"
service = "chief-ai"
entrypoint = "FounderControlRoomEntrypoint"

# Durable release-proof orchestration only. No route creates instances yet,
# and the Workflow receipt explicitly grants no merge, deploy, or provider
# mutation authority. A later trigger must use the existing FCR authority
# membrane and preserve exact candidate/evidence fingerprints.
[[workflows]]
binding = "RELEASE_PROOF_WORKFLOW"
name = "fcr-release-proof-v0"
class_name = "ReleaseProofWorkflowV0"

# Outbound transactional email capability. This binding alone sends nothing;
# application code must explicitly invoke it. Keep the provider boundary
# project-scoped: FCR code uses FCR_EMAIL and may send only from the checked-in
# FCR sender identity below. Do not replace this with a generic EMAIL binding.
[[send_email]]
name = "FCR_EMAIL"
allowed_sender_addresses = ["welcome@api.foundercontrolroom.org"]

[[routes]]
pattern = "api.foundercontrolroom.org"
custom_domain = true

# Public-safe runtime variables. Auth callbacks intentionally return through
# the Pages origin so browser sessions and relative /control-room redirects
# remain same-origin from the founder's point of view.
[vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://oojzfmmywbvficgybaxd.supabase.co"
SUPABASE_PROJECT_REF = "oojzfmmywbvficgybaxd"
FOUNDER_ALLOWED_ORIGINS = "https://foundercontrolroom.org"
FOUNDER_API_URL = "https://foundercontrolroom.org"
FCR_EMAIL_FROM = "welcome@api.foundercontrolroom.org"
FCR_REMOTE_MCP_READ_PROJECTS = "chief-ai-machine,founder-control-room"
FCR_RELAY_MUSE_MODEL = "muse-spark-1.3"
FCR_V10_CAPABILITY_PLAN_CONTRACT = "juss-v10/capability-plan@v1"
FCR_V10_CONVEYOR_CONTRACT = "founder-control-room/n8n-conveyor@v3"
FCR_V10_MAX_RUNTIME_AUTHORITY = "draft"
FCR_V10_REGISTRY_RESOLUTION_REQUIRED = "true"
FCR_V10_RECEIPT_PERSISTENCE_REQUIRED = "true"
MCP_EXA_URL = "https://mcp.exa.ai/mcp"
MCP_RESEND_URL = "https://mcp.resend.com/mcp"
MCP_CLOUDFLARE_API_URL = "https://mcp.cloudflare.com/mcp"

# Founder-approved source activation for the governed founder-content n8n lane.
# Buffer is the only enabled provider, share-now remains forbidden, and runtime
# identity must match the exact workflow fingerprint and pinned n8n version.
# These vars express source intent only. Production use still requires its
# provider-held capability secrets, exact-main deployment, and live readback.
N8N_FOUNDER_CONTENT_ENABLED = "true"
N8N_FOUNDER_CONTENT_ENABLED_PROVIDERS = "buffer"
N8N_FOUNDER_CONTENT_EXPECTED_WORKFLOW_ID = "fcrFounderContentV1"
N8N_FOUNDER_CONTENT_EXPECTED_RUNTIME_VERSION = "2.32.6"

# Wrangler's native secrets.required list is a deployment/startup membrane.
# Keep only secrets required for the Worker to boot safely. Capability-specific
# credentials are declared in config/worker-capability-secrets.json and fail
# closed at the owning route or capability rather than blocking all of FCR.
[secrets]
required = [
  "SUPABASE_SERVICE_ROLE_KEY",
  "SUPABASE_PUBLISHABLE_KEY",
  "FOUNDER_SESSION_ENCRYPTION_KEY",
  "GITHUB_WEBHOOK_SECRET",
  "GITHUB_APP_ID",
  "GITHUB_PRIVATE_KEY",
  "FOUNDER_SIGNAL_AUTOMATION_GRANT_JSON",
]

# With the duplicate API Worker deleted, this Worker is also the sole owner of
# the reconciliation schedule. Keeping the cron here prevents silent loss of
# the control loop without duplicating execution.
[triggers]
crons = ["* * * * *"]