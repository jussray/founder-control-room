services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10

  buffer-mock:
    image: node:24-alpine
    profiles: ["proof"]
    restart: "no"
    working_dir: /proof
    command: ["node", "mock-buffer-graphql.mjs"]
    environment:
      BUFFER_MOCK_API_KEY: ${BUFFER_MOCK_API_KEY:-}
    volumes:
      - ./mock-buffer-graphql.mjs:/proof/mock-buffer-graphql.mjs:ro

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.32.6
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${N8N_LOCAL_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_PUBLIC_HOST:?set N8N_PUBLIC_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: ${N8N_PUBLIC_BASE_URL:?set N8N_PUBLIC_BASE_URL}
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_BASE_URL:?set N8N_PUBLIC_BASE_URL}
      N8N_SECURE_COOKIE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      # Repo-controlled Jira/founder-content workflows intentionally read a
      # narrow set of runtime bindings in Code/expressions. n8n 2.x otherwise
      # blocks $env access by default, which would make the imported workflow
      # appear valid but fail only at execution time.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_FOUNDER_CONTENT_EXPECTED_WORKFLOW_ID: ${N8N_FOUNDER_CONTENT_EXPECTED_WORKFLOW_ID:-fcrFounderContentV1}
      N8N_FOUNDER_CONTENT_EXPECTED_WORKFLOW_FINGERPRINT: ${N8N_FOUNDER_CONTENT_EXPECTED_WORKFLOW_FINGERPRINT:-}
      N8N_FOUNDER_CONTENT_EXPECTED_RUNTIME_VERSION: ${N8N_FOUNDER_CONTENT_EXPECTED_RUNTIME_VERSION:-2.32.6}
      N8N_FOUNDER_CONTENT_IDENTITY_HMAC_SECRET: ${N8N_FOUNDER_CONTENT_IDENTITY_HMAC_SECRET:-}
      # Proof mode is derived only from the ephemeral Buffer-mock key generated
      # by the dedicated CI lane. Generic/self-hosted runtimes remain false.
      N8N_FOUNDER_CONTENT_PROOF_MODE: ${BUFFER_MOCK_API_KEY:+true}
      BUFFER_API_URL: ${BUFFER_API_URL:-https://api.buffer.com}
      BUFFER_FOUNDER_LINKEDIN_CHANNEL_ID: ${BUFFER_FOUNDER_LINKEDIN_CHANNEL_ID:-}
      BUFFER_FOUNDER_FACEBOOK_CHANNEL_ID: ${BUFFER_FOUNDER_FACEBOOK_CHANNEL_ID:-}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/New_York}
      TZ: ${GENERIC_TIMEZONE:-America/New_York}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
  n8n_postgres_data:
