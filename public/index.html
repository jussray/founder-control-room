<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Founder Control Room turns an intention into an action you can prove." />
  <meta name="color-scheme" content="dark" />
  <title>Founder Control Room</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #0a0a0a;
      --paper: #f5f1e8;
      --muted: #aaa59b;
      --signal: #ff5a36;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--ink); }
    body { margin: 0; min-height: 100svh; background: var(--ink); color: var(--paper); }
    a { color: inherit; }
    .threshold { min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; padding: clamp(1.2rem, 3vw, 2.2rem); }
    .masthead, .foot { display: flex; align-items: center; justify-content: space-between; gap: 1rem; font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; }
    .masthead strong { font-size: .9rem; letter-spacing: -.01em; text-transform: none; }
    .masthead span, .foot { color: var(--muted); }
    .stage { display: grid; grid-template-columns: minmax(0, 1fr) 1px minmax(16rem, .52fr); gap: clamp(1.5rem, 5vw, 5rem); align-items: stretch; min-height: 0; padding: clamp(4rem, 10vh, 7.5rem) 0; }
    .statement { align-self: center; max-width: 13ch; margin: 0; font-size: clamp(4.4rem, 11vw, 10.5rem); font-weight: 720; line-height: .82; letter-spacing: -.075em; }
    .line { width: 1px; min-height: 100%; background: var(--signal); transform-origin: center; }
    .entry { align-self: center; display: grid; align-content: center; gap: 1.5rem; min-height: 16rem; }
    .entry p { max-width: 27rem; margin: 0; color: var(--muted); font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.55; }
    .enter { width: max-content; display: inline-flex; align-items: center; gap: 2.75rem; padding: .9rem 0; border-bottom: 1px solid var(--paper); text-decoration: none; font-size: clamp(1.05rem, 2vw, 1.35rem); font-weight: 760; letter-spacing: -.02em; }
    .enter span:last-child { display: inline-block; transition: transform 180ms ease; }
    .enter:hover span:last-child, .enter:focus-visible span:last-child { transform: translateX(.5rem); }
    .enter:focus-visible { outline: 2px solid var(--signal); outline-offset: .45rem; }
    .foot strong { color: var(--paper); font-weight: 650; }
    @media (max-width: 760px) {
      .masthead span { display: none; }
      .stage { grid-template-columns: 1fr; grid-template-rows: auto 1px auto; gap: 2.25rem; padding: 3rem 0; }
      .statement { max-width: 9ch; font-size: clamp(4rem, 22vw, 7rem); }
      .line { width: 100%; min-height: 1px; height: 1px; }
      .entry { min-height: 12rem; }
      .foot span:last-child { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { .enter span:last-child { transition: none; } }
  </style>
</head>
<body>
  <main class="threshold">
    <header class="masthead">
      <strong>FCR</strong>
      <span>Founder Control Room</span>
    </header>
    <section class="stage" aria-labelledby="welcome-title">
      <h1 class="statement" id="welcome-title">Move one thing forward.</h1>
      <div class="line" aria-hidden="true"></div>
      <div class="entry">
        <p>Turn an intention into an action you can prove.</p>
        <a class="enter" href="/control-room/"><span>Enter Control Room</span><span aria-hidden="true">→</span></a>
      </div>
    </section>
    <footer class="foot"><strong>Intent → Action → Proof</strong><span>Founder authority stays explicit.</span></footer>
  </main>
</body>
</html>
