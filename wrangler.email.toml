name = "founder-control-room-review-email"
account_id = "9b59861bd1747cf7525571b4c51d2aa0"
main = "src/worker/founderSignalReviewEmail.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Canonical inbound Email Routing desired state.
# Wrangler 4.113+ reconciles Worker Email Routing rules declared by top-level
# `addresses` during deploy. This declaration authorizes only the literal
# review@ route; it is not proof that the live provider rule exists.
addresses = ["review@foundercontrolroom.org"]
# Cloudflare provider readback must independently verify the rule after deploy.
# Subaddressing is a separate zone setting and must be enabled provider-side
# before review+<context-uuid>@foundercontrolroom.org can match this base rule.

[observability]
enabled = true

# Keep founder review-email ingestion on Cloudflare's private Worker fabric.
# The request URL remains the canonical API route for downstream routing, but
# the transport uses this Service Binding instead of the public Internet.
[[services]]
binding = "FOUNDER_CONTROL_ROOM_API"
service = "founder-control-room"

# Non-secret values only. Email Routing must already be enabled for the domain,
# and subaddressing must be enabled provider-side before review+UUID replies are live.
[vars]
FOUNDER_REVIEW_EMAIL_DOMAIN = "foundercontrolroom.org"
FOUNDER_REVIEW_INGEST_URL = "https://api.foundercontrolroom.org/ingest/founder-review-email"

# Required Worker secrets:
#   FOUNDER_REVIEW_FOUNDER_EMAIL
#   FOUNDER_REVIEW_EMAIL_INGRESS_SECRET
#
# The same FOUNDER_REVIEW_EMAIL_INGRESS_SECRET value must be installed in the
# surviving founder-control-room API Worker secret store. Never place either
# value here.
