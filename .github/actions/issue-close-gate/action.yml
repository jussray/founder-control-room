name: Issue Close Gate
description: Reopen issues that are closed without founder-approved closure evidence.
inputs:
  token:
    description: GitHub token with issues:write permission.
    required: true
  issue-number:
    description: Issue number from the issues.closed event.
    required: true
  founder-login:
    description: GitHub login authorized to submit closure evidence.
    required: false
    default: jussray
runs:
  using: composite
  steps:
    - name: Verify closure evidence
      shell: bash
      env:
        ISSUE_CLOSE_GATE_TOKEN: ${{ inputs.token }}
        ISSUE_CLOSE_GATE_NUMBER: ${{ inputs.issue-number }}
        ISSUE_CLOSE_GATE_FOUNDER: ${{ inputs.founder-login }}
      run: node "$GITHUB_ACTION_PATH/index.mjs"
