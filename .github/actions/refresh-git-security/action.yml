name: Refresh runner Git security updates
description: Install the latest Git package published by the runner's Ubuntu security repositories before repository operations.
runs:
  using: composite
  steps:
    - name: Refresh Ubuntu package metadata
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
    - name: Upgrade runner Git package
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get install --only-upgrade --yes git
        printf 'git executable: '
        command -v git
        git --version
        dpkg-query -W -f='${Package} ${Version}\n' git
        apt-cache policy git
