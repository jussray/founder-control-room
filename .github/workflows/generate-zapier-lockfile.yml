name: Generate Zapier lockfile

on:
  pull_request:
    paths:
      - "tools/zapier/package.json"
      - ".github/workflows/generate-zapier-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate package lock
        run: npm install --prefix tools/zapier --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/zapier/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: lock Zapier tooling dependencies"
          git push origin HEAD:${{ github.head_ref }}
