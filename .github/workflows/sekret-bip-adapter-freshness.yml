name: Se'kret Bip Adapter Freshness

on:
  pull_request:
    branches: [main]
    paths:
      - "src/founder-os-lab/projectAdapters.ts"
      - "src/founder-os-lab/projectAdapterFreshness.ts"
      - "src/founder-os-lab/__tests__/projectAdapters.test.ts"
      - "src/founder-os-lab/__tests__/projectAdapterFreshness.test.ts"
      - "scripts/verify-sekret-bip-adapter-freshness.ts"
      - ".github/workflows/sekret-bip-adapter-freshness.yml"
      - "docs/FOUNDER_OS_LAB_V1.md"
  push:
    branches: [main]
    paths:
      - "src/founder-os-lab/projectAdapters.ts"
      - "src/founder-os-lab/projectAdapterFreshness.ts"
      - "src/founder-os-lab/__tests__/projectAdapters.test.ts"
      - "src/founder-os-lab/__tests__/projectAdapterFreshness.test.ts"
      - "scripts/verify-sekret-bip-adapter-freshness.ts"
      - ".github/workflows/sekret-bip-adapter-freshness.yml"
      - "docs/FOUNDER_OS_LAB_V1.md"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SEKRET_BIP_ADAPTER_FRESHNESS_RECEIPT: test-results/sekret-bip-adapter-freshness.json

concurrency:
  group: sekret-bip-adapter-freshness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Verify exact Se'kret Bip source and canon blobs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove pure freshness states and project adapter contracts
        run: >-
          npx vitest run
          src/founder-os-lab/__tests__/projectAdapterFreshness.test.ts
          src/founder-os-lab/__tests__/projectAdapters.test.ts

      - name: Verify live Se'kret Bip main and audited canon blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/verify-sekret-bip-adapter-freshness.ts

      - name: Retain sanitized freshness receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sekret-bip-adapter-freshness-${{ env.EXPECTED_HEAD_SHA }}
          path: ${{ env.SEKRET_BIP_ADAPTER_FRESHNESS_RECEIPT }}
          if-no-files-found: error
          retention-days: 30
