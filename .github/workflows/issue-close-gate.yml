name: Issue Close Gate

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-close-gate-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  enforce:
    if: ${{ github.event.issue.pull_request == null }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out gate implementation
        uses: actions/checkout@v4

      - name: Enforce founder-approved closure evidence
        uses: ./.github/actions/issue-close-gate
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          founder-login: jussray
