name: Cloudflare Worker Git Authority Audit

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact current main commit whose provider-authority audit code is approved to run
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Read-only Worker Git authority receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      CF_WORKER_NAME: founder-control-room
      CF_API_HOSTNAME: api.foundercontrolroom.org
      CF_ACCOUNT_ID: 9b59861bd1747cf7525571b4c51d2aa0
      CF_WORKER_GIT_AUTHORITY_POLICY: config/cloudflare-worker-git-authority-policy.json
      CF_API_TOKEN: ${{ secrets.FCR_CLOUDFLARE_BUILDS_USER_TOKEN }}
      CF_REQUEST_TRACE_POLICY: config/cloudflare-request-trace-host-policy.json
      CF_REQUEST_TRACE_METHOD: GET
      CF_REQUEST_TRACER_TOKEN: ${{ secrets.FCR_CLOUDFLARE_REQUEST_TRACER_TOKEN }}
      CF_DNS_INVENTORY_TOKEN: ${{ secrets.FCR_CLOUDFLARE_DNS_INVENTORY_TOKEN }}

    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact audit head is current main
        id: verify_head
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid exact head::expected_head_sha must be a lowercase 40-character commit SHA."
            exit 1
          fi

          git fetch --no-tags --depth=1 origin refs/heads/main:refs/remotes/origin/main

          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          CURRENT_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"

          echo "Expected audit SHA: $EXPECTED_HEAD_SHA"
          echo "Checked-out SHA:    $ACTUAL_HEAD_SHA"
          echo "Current main SHA:    $CURRENT_MAIN_SHA"

          test "$ACTUAL_HEAD_SHA" = "$EXPECTED_HEAD_SHA"
          test "$CURRENT_MAIN_SHA" = "$EXPECTED_HEAD_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Verify core read-only Cloudflare Builds token is available
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::FCR_CLOUDFLARE_BUILDS_USER_TOKEN is not available to this workflow."
            exit 1
          fi

      - name: Audit provider truth against current Worker Git authority policy
        id: core_authority
        run: node scripts/inspect-cloudflare-build.mjs

      - name: Preserve core authority verdict before optional enrichment
        if: always() && steps.verify_head.outcome == 'success'
        shell: bash
        run: |
          if [ -f test-results/cloudflare-build-diagnostic.json ]; then
            cp test-results/cloudflare-build-diagnostic.json test-results/cloudflare-build-diagnostic.core.json
          fi

      - name: Discover and trace FCR Cloudflare host inventory
        id: trace_enrichment
        if: always() && steps.verify_head.outcome == 'success' && env.CF_REQUEST_TRACER_TOKEN != '' && env.CF_DNS_INVENTORY_TOKEN != ''
        continue-on-error: true
        run: node scripts/trace-cloudflare-request.mjs

      - name: Restore core authority verdict after optional enrichment
        if: always() && steps.verify_head.outcome == 'success'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const corePath = "test-results/cloudflare-build-diagnostic.core.json";
          const receiptPath = "test-results/cloudflare-build-diagnostic.json";

          try {
            const core = JSON.parse(await readFile(corePath, "utf8"));
            const receipt = JSON.parse(await readFile(receiptPath, "utf8"));
            if (receipt.requestTrace && typeof receipt.requestTrace === "object") {
              receipt.requestTrace.optionalForCoreAuthority = true;
            }
            receipt.ok = core.ok === true;
            receipt.error = core.error ?? null;
            await writeFile(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`, "utf8");
          } catch {
            // If no core receipt exists, do not manufacture or upgrade authority truth.
          }
          NODE

      - name: Publish authority summary
        if: always()
        shell: bash
        run: |
          if [ -f test-results/cloudflare-build-diagnostic.json ]; then
            {
              echo "## Cloudflare Worker Git Authority Audit"
              echo
              echo '```json'
              cat test-results/cloudflare-build-diagnostic.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload redacted authority receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker-git-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/cloudflare-build-diagnostic.json
          if-no-files-found: warn
          retention-days: 30
