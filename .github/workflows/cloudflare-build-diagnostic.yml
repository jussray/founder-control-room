name: Cloudflare Build Diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact 40-character commit SHA to inspect
        required: true
        type: string
  push:
    branches:
      - main
      - fix/cloudflare-build-observer-account-id # temporary diagnostic trigger; remove before merge

permissions:
  contents: read

jobs:
  inspect:
    name: Redacted provider receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.sha }}
      CF_WORKER_NAME: founder-control-room
      CF_API_HOSTNAME: api.foundercontrolroom.org
      CF_ACCOUNT_ID: 9b59861bd1747cf7525571b4c51d2aa0
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Inspect exact Cloudflare build and custom-domain ownership
        run: node scripts/inspect-cloudflare-build.mjs

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          if [ -f test-results/cloudflare-build-diagnostic.json ]; then
            {
              echo "## Cloudflare Build Diagnostic"
              echo
              echo '```json'
              cat test-results/cloudflare-build-diagnostic.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/cloudflare-build-diagnostic.json
          if-no-files-found: warn
          retention-days: 30