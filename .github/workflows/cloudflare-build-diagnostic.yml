name: Cloudflare Build Diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact 40-character commit SHA to inspect
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Redacted provider receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      CF_WORKER_NAME: founder-control-room
      CF_API_HOSTNAME: api.foundercontrolroom.org

    steps:
      - name: Checkout trusted main diagnostic code
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Validate inspection target and trusted code
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid inspection target::expected_head_sha must be a lowercase 40-character commit SHA."
            exit 1
          fi
          echo "Inspection target:       $EXPECTED_HEAD_SHA"
          echo "Trusted diagnostic code: $(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Inspect exact Cloudflare build and custom-domain ownership
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
        run: node scripts/inspect-cloudflare-build.mjs

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          if [ -f test-results/cloudflare-build-diagnostic.json ]; then
            {
              echo "## Cloudflare Build Diagnostic"
              echo
              echo '```json'
              cat test-results/cloudflare-build-diagnostic.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/cloudflare-build-diagnostic.json
          if-no-files-found: warn
          retention-days: 30
