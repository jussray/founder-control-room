name: Control Room Test Ledger

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CONTROL_ROOM_LEDGER_SELF_CHECK: Publish exact-head test ledger
  CONTROL_ROOM_TEST_LEDGER_PATH: artifacts/control-room-test-ledger.json

concurrency:
  group: control-room-test-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ledger-contract:
    name: Verify test-ledger contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify portable agent contract in required merge membrane
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const expectedFingerprint = 'sha256:f0262e382adb0c65bd7d430db92584cdc31316b2c0bbff07bc9afea0bab58f05';
          const path = '.control-room/agent-contract.v1.json';
          const fail = (message) => { console.error(`required-agent-contract: ${message}`); process.exit(1); };
          if (!fs.existsSync(path)) fail(`missing ${path}`);
          const contract = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (contract.contract !== 'juss/agent-contract@v1' || contract.version !== 1 || contract.status !== 'active') fail('identity/version/status drift');
          if (contract.binding?.repository !== process.env.GITHUB_REPOSITORY) fail('repository binding mismatch');
          if (contract.kernelFingerprint !== expectedFingerprint) fail('canonical kernel fingerprint drift');
          const actualFingerprint = `sha256:${crypto.createHash('sha256').update(JSON.stringify(contract.kernel)).digest('hex')}`;
          if (actualFingerprint !== expectedFingerprint) fail('kernel bytes no longer match canonical v1');
          for (const invariant of ['humanAuthorityIsRoot','consensusDoesNotAuthorizeMutation','mutationRequiresBoundAuthority','ambiguousMutationRequiresReconciliation','staleProofCannotCarryForward','localStricterRulesWin']) {
            if (contract.kernel?.invariants?.[invariant] !== true) fail(`merge invariant disabled: ${invariant}`);
          }
          const authority = String(contract.binding?.authorityRule ?? '');
          if (!authority.includes('no merge') || !authority.includes('deploy')) fail('contract may not grant merge/deploy authority');
          console.log(`required-agent-contract VERIFIED ${process.env.GITHUB_REPOSITORY} ${expectedFingerprint}`);
          NODE

      - name: Run control-room test-ledger contracts
        run: node --test test/control-room-test-ledger.test.mjs

  publish-ledger:
    name: Publish exact-head test ledger
    needs: ledger-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Observe every exact-head check lane
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/control-room-test-ledger.mjs

      - name: Upload repository-local Control Room ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-room-test-ledger-${{ env.EXPECTED_HEAD_SHA }}
          path: artifacts/control-room-test-ledger.json
          if-no-files-found: error
          retention-days: 14
