name: AI Company Lab Isolation

on:
  pull_request:
    paths:
      - 'labs/ai-company/**'
      - '.github/workflows/ai-company-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-company-lab-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-isolated-lab:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify no production capabilities entered the lab
        run: npm --prefix labs/ai-company run verify:isolation
      - name: Run deterministic synthetic scenarios
        run: npm --prefix labs/ai-company test