name: AI Company Adversarial Sandboxes

on:
  pull_request:
    paths:
      - 'src/founder-os-lab/**'
      - 'scripts/verify-founder-os-lab-isolation.mjs'
      - 'labs/ai-company/**'
      - 'test/ai-company-adversarial.test.ts'
      - 'test/ai-company-sandboxes.test.ts'
      - 'vitest.ai-company-adversarial.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ai-company-adversarial.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-company-adversarial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-adversarial-sandboxes:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate head
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$TARGET_SHA" || {
            echo "Expected $TARGET_SHA but checked out $actual_sha" >&2
            exit 1
          }
          echo "Verified exact candidate head: $actual_sha"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify adversarial and sandbox contracts
        run: npm run verify:ai-company-adversarial
