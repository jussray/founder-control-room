name: Temporary Jira secret registry patch

on:
  push:
    branches:
      - fix/jira-provider-live-probe-561dd06

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(jira): stage one-shot secret registry patcher'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/jira-provider-live-probe-561dd06
          fetch-depth: 0

      - name: Patch only canonical secret-name registry
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/SECRETS.md')
          text = path.read_text()
          names = (
              'FCR_JIRA_AUTOMATION_INGRESS_TOKEN',
              'FCR_JIRA_AUTOMATION_INGRESS_URL',
              'JIRA_AUTOMATION_PROBE_ISSUE_KEY',
          )
          if any(name in text for name in names):
              raise SystemExit('one or more Jira live-probe secret names already exist; refusing ambiguous patch')

          anchor = '| `N8N_CONVEYOR_BEARER_TOKEN` | `n8n-conveyor-live-probe.yml` | Required bearer credential paired with the live conveyor webhook probe. |\n'
          if text.count(anchor) != 1:
              raise SystemExit('canonical insertion anchor was not unique')

          rows = (
              '| `FCR_JIRA_AUTOMATION_INGRESS_TOKEN` | `jira-work-automation-live-probe.yml` | Required bearer credential for the bounded FCR Jira automation ingress. Never log or expose the value. |\n'
              '| `FCR_JIRA_AUTOMATION_INGRESS_URL` | `jira-work-automation-live-probe.yml` | Required HTTPS URL for the exact `/ingest/jira-work-automation` production route; name presence does not prove reachability. |\n'
              '| `JIRA_AUTOMATION_PROBE_ISSUE_KEY` | `jira-work-automation-live-probe.yml` | Protected identifier for the dedicated Jira control issue. It constrains the probe target and is not authority to select arbitrary issues. |\n'
          )
          path.write_text(text.replace(anchor, anchor + rows))

      - name: Remove temporary workflow and commit bounded patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-jira-secrets-registry-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SECRETS.md .github/workflows/tmp-jira-secrets-registry-patch.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/tmp-jira-secrets-registry-patch.yml\ndocs/SECRETS.md'
          git commit -m 'docs(jira): register live probe workflow secrets'
          git push origin HEAD:fix/jira-provider-live-probe-561dd06
