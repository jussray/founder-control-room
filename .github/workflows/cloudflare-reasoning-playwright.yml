name: Cloudflare Reasoning Playwright

on:
  pull_request:
    paths:
      - 'src/reasoning/cloudflare/**'
      - 'src/http/routes/cloudflareReasoning.ts'
      - 'src/http/server.ts'
      - 'src/test-server.ts'
      - 'e2e/cloudflare-reasoning.spec.ts'
      - 'playwright.cloudflare-reasoning.config.ts'
      - 'docs/CLOUDFLARE_REASONING.md'
      - '.github/workflows/cloudflare-reasoning-playwright.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-reasoning-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-cloudflare-reasoning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out current PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          printf 'Verified exact head: %s\n' "$actual"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
        env:
          NODE_ENV: test
          SUPABASE_URL: https://oojzfmmywbvficgybaxd.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          SUPABASE_PUBLISHABLE_KEY: test-publishable-key

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Cloudflare API Playwright checks
        run: npx playwright test -c playwright.cloudflare-reasoning.config.ts e2e/cloudflare-reasoning.spec.ts
        env:
          NODE_ENV: test
          SUPABASE_URL: https://oojzfmmywbvficgybaxd.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          SUPABASE_PUBLISHABLE_KEY: test-publishable-key
          GITHUB_TOKEN: test-github-token

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-reasoning-playwright-${{ env.EXPECTED_HEAD_SHA }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7