name: Founder Deploy Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  issues: read

concurrency:
  group: founder-deploy-command
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch bounded exact-head Worker reconcile
    if: >-
      github.event.issue.number == 182 &&
      github.event.comment.user.login == 'jussray' &&
      startsWith(github.event.comment.body, '/deploy-fcr ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Parse founder command
        id: command
        env:
          COMMAND_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          body = os.environ.get('COMMAND_BODY', '').strip()
          parts = body.split()
          if len(parts) != 3 or parts[0] != '/deploy-fcr':
              raise SystemExit('Expected exactly: /deploy-fcr <40-char-main-sha> <approval-reference>')

          sha, approval = parts[1], parts[2]
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Deploy command SHA must be a lowercase 40-character commit SHA.')
          if not re.fullmatch(r'[A-Za-z0-9._:-]{8,200}', approval):
              raise SystemExit('Approval reference must use 8-200 auditable characters: A-Z a-z 0-9 . _ : -')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'expected_head_sha={sha}\n')
              output.write(f'deployment_approval_id={approval}\n')
          PY

      - name: Verify requested SHA is current main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.command.outputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | jq -r '.object.sha')"

          echo "Requested exact head: $EXPECTED_HEAD_SHA"
          echo "Current main:         $CURRENT_MAIN_SHA"
          test "$CURRENT_MAIN_SHA" = "$EXPECTED_HEAD_SHA"

      - name: Dispatch bounded Worker reconciliation workflow
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.command.outputs.expected_head_sha }}
          DEPLOYMENT_APPROVAL_ID: ${{ steps.command.outputs.deployment_approval_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg sha "$EXPECTED_HEAD_SHA" \
            --arg approval "$DEPLOYMENT_APPROVAL_ID" \
            '{
              ref: "main",
              inputs: {
                expected_head_sha: $sha,
                deployment_approval_id: $approval,
                deployment_reason: "Reconcile api.foundercontrolroom.org to the canonical founder-control-room Worker for issue #182"
              }
            }')"

          curl --fail --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/worker-reconcile.yml/dispatches" \
            --data "$payload"

          {
            echo '## Founder Worker reconciliation command accepted'
            echo
            echo "- Exact head: \`$EXPECTED_HEAD_SHA\`"
            echo "- Approval reference: \`$DEPLOYMENT_APPROVAL_ID\`"
            echo '- Mutation authority: bounded `.github/workflows/worker-reconcile.yml` only'
            echo '- Supabase database mutation: absent from target workflow'
            echo '- Proof-of-ship/publication: absent from target workflow'
            echo '- Direct Cloudflare/Supabase/secret mutation in this bridge: none'
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch-production:
    name: Dispatch canonical exact-head production release
    if: >-
      github.event.issue.number == 247 &&
      github.event.comment.user.login == 'jussray' &&
      startsWith(github.event.comment.body, '/deploy-fcr-production ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Parse founder production command
        id: command
        env:
          COMMAND_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          body = os.environ.get('COMMAND_BODY', '').strip()
          parts = body.split()
          if len(parts) != 3 or parts[0] != '/deploy-fcr-production':
              raise SystemExit('Expected exactly: /deploy-fcr-production <40-char-main-sha> <approval-reference>')

          sha, approval = parts[1], parts[2]
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Production deploy SHA must be a lowercase 40-character commit SHA.')
          if not re.fullmatch(r'[A-Za-z0-9._:-]{8,200}', approval):
              raise SystemExit('Approval reference must use 8-200 auditable characters: A-Z a-z 0-9 . _ : -')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'expected_head_sha={sha}\n')
              output.write(f'deployment_approval_id={approval}\n')
          PY

      - name: Verify requested production SHA is current main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.command.outputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | jq -r '.object.sha')"

          echo "Requested exact head: $EXPECTED_HEAD_SHA"
          echo "Current main:         $CURRENT_MAIN_SHA"
          test "$CURRENT_MAIN_SHA" = "$EXPECTED_HEAD_SHA"

      - name: Dispatch canonical production Deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.command.outputs.expected_head_sha }}
          DEPLOYMENT_APPROVAL_ID: ${{ steps.command.outputs.deployment_approval_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg sha "$EXPECTED_HEAD_SHA" \
            --arg approval "$DEPLOYMENT_APPROVAL_ID" \
            '{
              ref: "main",
              inputs: {
                expected_head_sha: $sha,
                deployment_approval_id: $approval,
                deployment_reason: "Reconcile the canonical Founder Control Room production migration ledger and release for incident #247"
              }
            }')"

          curl --fail --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            --data "$payload"

          {
            echo '## Founder production Deploy command accepted'
            echo
            echo "- Exact head: \`$EXPECTED_HEAD_SHA\`"
            echo "- Approval reference: \`$DEPLOYMENT_APPROVAL_ID\`"
            echo '- Mutation authority: canonical `.github/workflows/deploy.yml` only'
            echo '- Direct Cloudflare/Supabase/secret mutation in this bridge: none'
            echo '- Existing Worker-only `/deploy-fcr` authority remains unchanged'
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch-review-email:
    name: Dispatch bounded review-email Worker reconcile
    if: >-
      github.event.issue.number == 395 &&
      github.event.comment.user.login == 'jussray' &&
      startsWith(github.event.comment.body, '/deploy-fcr-review-email ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Parse founder review-email command
        id: command
        env:
          COMMAND_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          body = os.environ.get('COMMAND_BODY', '').strip()
          parts = body.split()
          if len(parts) != 3 or parts[0] != '/deploy-fcr-review-email':
              raise SystemExit('Expected exactly: /deploy-fcr-review-email <40-char-main-sha> <approval-reference>')

          sha, approval = parts[1], parts[2]
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Deploy command SHA must be a lowercase 40-character commit SHA.')
          if not re.fullmatch(r'[A-Za-z0-9._:-]{8,200}', approval):
              raise SystemExit('Approval reference must use 8-200 auditable characters: A-Z a-z 0-9 . _ : -')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'expected_head_sha={sha}\n')
              output.write(f'deployment_approval_id={approval}\n')
          PY

      - name: Verify requested review-email SHA is current main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.command.outputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | jq -r '.object.sha')"

          echo "Requested exact head: $EXPECTED_HEAD_SHA"
          echo "Current main:         $CURRENT_MAIN_SHA"
          test "$CURRENT_MAIN_SHA" = "$EXPECTED_HEAD_SHA"

      - name: Dispatch bounded review-email Worker reconciliation workflow
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.command.outputs.expected_head_sha }}
          DEPLOYMENT_APPROVAL_ID: ${{ steps.command.outputs.deployment_approval_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg sha "$EXPECTED_HEAD_SHA" \
            --arg approval "$DEPLOYMENT_APPROVAL_ID" \
            '{
              ref: "main",
              inputs: {
                expected_head_sha: $sha,
                deployment_approval_id: $approval,
                deployment_reason: "Deploy privately bound founder-control-room-review-email Worker for issue #395"
              }
            }')"

          curl --fail --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/review-email-worker-reconcile.yml/dispatches" \
            --data "$payload"

          {
            echo '## Founder review-email Worker reconciliation command accepted'
            echo
            echo "- Exact head: \`$EXPECTED_HEAD_SHA\`"
            echo "- Approval reference: \`$DEPLOYMENT_APPROVAL_ID\`"
            echo '- Mutation authority: bounded `.github/workflows/review-email-worker-reconcile.yml` only'
            echo '- Canonical API Worker mutation: absent from target workflow'
            echo '- Supabase database mutation: absent from target workflow'
            echo '- Cloudflare Access mutation: absent from target workflow'
            echo '- Pages mutation: absent from target workflow'
            echo '- Proof-of-ship/publication: absent from target workflow'
            echo '- Direct Cloudflare/Supabase/secret mutation in this bridge: none'
          } >> "$GITHUB_STEP_SUMMARY"
