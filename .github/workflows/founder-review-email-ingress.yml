name: Founder Review Email Ingress

on:
  pull_request:
    paths:
      - '.env.example'
      - '.github/workflows/founder-review-email-ingress.yml'
      - 'package.json'
      - 'scripts/verify-founder-review-email-ingress.mjs'
      - 'scripts/verify-founder-review-email-routing.mjs'
      - 'scripts/verify-rls-contract.mjs'
      - 'src/founderSignalEmailIngress/**'
      - 'src/http/routes/founderSignalReviewContexts.ts'
      - 'src/http/routes/founderSignalReviewEmailIngress.ts'
      - 'src/http/routes/__tests__/founderSignalReviewContexts.integration.test.ts'
      - 'src/http/routes/__tests__/founderSignalReviewEmailIngress.integration.test.ts'
      - 'src/http/server.ts'
      - 'src/worker/founderSignalReviewEmail.ts'
      - 'src/worker/founderSignalReviewEmail.test.ts'
      - 'supabase/migrations/20260811004830_founder_signal_review_email_receipts.sql'
      - 'supabase/migrations/20260811004844_harden_founder_signal_review_email_receipts.sql'
      - 'supabase/migrations/20260812004000_founder_signal_review_execution_bridge.sql'
      - 'tools/zapier/buffer-review-window.cjs'
      - 'tools/zapier/test-buffer-review-window.cjs'
      - 'wrangler.worker.toml'
      - 'wrangler.email.toml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact candidate head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Classify email-ingress scope
        id: scope
        shell: bash
        run: |
          if test -f scripts/verify-founder-review-email-ingress.mjs \
            && node -e "const p=require('./package.json'); process.exit(p.scripts?.['verify:founder-review-email'] ? 0 : 1)"; then
            echo 'in_scope=true' >> "$GITHUB_OUTPUT"
          else
            echo 'in_scope=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Record refresh-only parent head
        if: steps.scope.outputs.in_scope != 'true'
        run: echo 'Email-ingress files are absent on this parent-refresh head; focused verification is not applicable.'

      - name: Install canonical dependencies
        if: steps.scope.outputs.in_scope == 'true'
        run: npm ci

      - name: Verify TypeScript contracts
        if: steps.scope.outputs.in_scope == 'true'
        run: npm run typecheck

      - name: Verify email routing trigger contract
        if: steps.scope.outputs.in_scope == 'true'
        run: node scripts/verify-founder-review-email-routing.mjs

      - name: Verify intake isolation, bounded execution bridge, tests, and email Worker bundle
        if: steps.scope.outputs.in_scope == 'true'
        run: npm run verify:founder-review-email

      - name: Verify public-table RLS inventory
        if: steps.scope.outputs.in_scope == 'true'
        run: npm run verify:rls-contract

      - name: Lint focused runtime files
        if: steps.scope.outputs.in_scope == 'true'
        run: >-
          npx eslint
          src/founderSignalEmailIngress/receipt.ts
          src/founderSignalEmailIngress/email.ts
          src/founderSignalEmailIngress/email.test.ts
          src/founderSignalEmailIngress/reviewAuthorization.ts
          src/founderSignalEmailIngress/reviewAuthorization.test.ts
          src/founderSignalEmailIngress/reviewExecution.ts
          src/founderSignalEmailIngress/reviewExecution.test.ts
          src/http/routes/founderSignalReviewContexts.ts
          src/http/routes/founderSignalReviewEmailIngress.ts
          src/http/routes/__tests__/founderSignalReviewContexts.integration.test.ts
          src/http/routes/__tests__/founderSignalReviewEmailIngress.integration.test.ts
          src/worker/founderSignalReviewEmail.ts
          src/worker/founderSignalReviewEmail.test.ts
          --max-warnings 0
