name: Main Release Provenance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA to verify
        required: false
        type: string

concurrency:
  group: main-release-provenance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TARGET_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    name: Main release provenance contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$TARGET_SHA" "$actual"
          test "$actual" = "$TARGET_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Run provenance adversarial tests
        run: node --test scripts/verify-main-release-provenance.node-test.mjs

  provenance:
    name: Main release provenance
    if: ${{ github.event_name != 'pull_request' }}
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Read current main and associated merged PRs
        id: provider
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/pulls" \
            > associated-pulls.json
          printf 'current_main_sha=%s\n' "$current_main_sha" >> "$GITHUB_OUTPUT"
      - name: Classify superseded push run
        id: supersession
        shell: bash
        env:
          CURRENT_MAIN_SHA: ${{ steps.provider.outputs.current_main_sha }}
        run: |
          set -euo pipefail
          superseded=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${TARGET_SHA}" != "${CURRENT_MAIN_SHA}" ]]; then
            superseded=true
            mkdir -p artifacts
            node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const receipt = {
            ok: false,
            reason: 'superseded_push',
            superseded: true,
            enforced: false,
            targetSha: process.env.TARGET_SHA,
            currentMainSha: process.env.CURRENT_MAIN_SHA,
          };

          writeFileSync('artifacts/main-release-provenance.json', `${JSON.stringify(receipt, null, 2)}\n`, 'utf8');
          process.stdout.write(`${JSON.stringify(receipt)}\n`);
          NODE
            echo "Superseded push run: ${TARGET_SHA} is no longer current main (${CURRENT_MAIN_SHA})."
          fi
          echo "superseded=${superseded}" >> "$GITHUB_OUTPUT"
      - name: Verify release provenance against live GitHub state
        if: ${{ steps.supersession.outputs.superseded != 'true' }}
        shell: bash
        env:
          CURRENT_MAIN_SHA: ${{ steps.provider.outputs.current_main_sha }}
          MAIN_RELEASE_EVENT_NAME: ${{ github.event_name }}
          MAIN_RELEASE_REF: ${{ github.ref }}
          MAIN_RELEASE_ACTOR: ${{ github.actor }}
          MAIN_RELEASE_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          export ASSOCIATED_PULLS_JSON="$(cat associated-pulls.json)"
          node scripts/verify-main-release-provenance.mjs
      - name: Upload provenance receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: main-release-provenance-${{ github.run_id }}
          path: artifacts/main-release-provenance.json
          if-no-files-found: error
          retention-days: 30

  live-main-audit:
    name: Live main and exact candidate ancestry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live main, current PR head, and ancestry (read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          [[ "$current_main" =~ $sha_pattern ]] || { echo "::error::Cannot resolve live main SHA"; exit 1; }
          [[ "$EVENT_HEAD_SHA" =~ $sha_pattern ]] || { echo "::error::Invalid candidate SHA"; exit 1; }
          candidate="$EVENT_HEAD_SHA"
          if [[ -n "$PR_NUMBER" ]]; then
            live_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            live_head="$(jq -r '.head.sha // empty' <<<"$live_pr")"
            live_base="$(jq -r '.base.sha // empty' <<<"$live_pr")"
            live_base_ref="$(jq -r '.base.ref // empty' <<<"$live_pr")"
            [[ "$live_base_ref" == "main" ]] || { echo "::error::PR targets ${live_base_ref}, not main"; exit 1; }
            [[ "$live_head" == "$EVENT_HEAD_SHA" ]] || { echo "::error::PR head advanced; event proof is stale"; exit 1; }
            [[ "$live_base" == "$current_main" ]] || { echo "::error::PR base differs from current main; refresh audit"; exit 1; }
            candidate="$live_head"
          fi
          merge_base="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${current_main}...${candidate}" --jq '.merge_base_commit.sha')"
          [[ "$merge_base" == "$current_main" ]] || {
            echo "::error::Candidate is not based on live main ${current_main}. Update the branch and rerun exact-head checks."
            exit 1
          }
          if [[ "$GITHUB_REF" == "refs/heads/main" && "$candidate" != "$current_main" ]]; then
            echo "::error::This main run is superseded by ${current_main}"
            exit 1
          fi
          final_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          [[ "$final_main" == "$current_main" ]] || { echo "::error::Main advanced during audit; evidence expired"; exit 1; }
          if [[ -n "$PR_NUMBER" ]]; then
            final_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            [[ "$final_head" == "$candidate" ]] || { echo "::error::PR head advanced during audit"; exit 1; }
          fi
          {
            echo "### Live main candidate audit"
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Live main: ${current_main}"
            echo "- Candidate: ${candidate}"
            echo "- Merge base: ${merge_base}"
            echo "- Scope: Git ancestry and exact SHA only; tests, merge authorization, deployment and runtime remain separate."
          } >> "$GITHUB_STEP_SUMMARY"
