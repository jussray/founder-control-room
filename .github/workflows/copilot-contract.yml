name: Copilot Contract

on:
  pull_request:
    paths:
      - '.mcp.json'
      - '.mcp.example.json'
      - '.vscode/mcp.json'
      - '.github/copilot-instructions.md'
      - 'config/mcp-skill-routing.json'
      - 'scripts/verify-mcp-config.mjs'
      - '.github/workflows/copilot-contract.yml'
  push:
    branches:
      - main
    paths:
      - '.mcp.json'
      - '.mcp.example.json'
      - '.vscode/mcp.json'
      - '.github/copilot-instructions.md'
      - 'config/mcp-skill-routing.json'
      - 'scripts/verify-mcp-config.mjs'
      - '.github/workflows/copilot-contract.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-copilot-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Verify MCP contract
        run: node scripts/verify-mcp-config.mjs

      - name: Verify Copilot operating contract
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/copilot-instructions.md
          grep -q 'VERIFIED' .github/copilot-instructions.md
          grep -q 'INFERRED' .github/copilot-instructions.md
          grep -q 'UNKNOWN' .github/copilot-instructions.md
          grep -q 'BLOCKED' .github/copilot-instructions.md
          grep -q 'Playwright' .github/copilot-instructions.md
          grep -q 'REALITY:' .github/copilot-instructions.md
          grep -q 'ROLLBACK:' .github/copilot-instructions.md
          grep -q 'NEXT GATE:' .github/copilot-instructions.md

      - name: Contract green
        run: echo 'Copilot MCP and operating contract verified.'