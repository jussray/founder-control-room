name: GitHub App Secret Shape Diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnose-fcr-github-app-key:
    if: >-
      github.event.issue.number == 418 &&
      github.event.comment.user.id == 286642846 &&
      github.event.comment.user.login == 'jussray' &&
      startsWith(github.event.comment.body, '/diagnose-fcr-github-app-key ')
    name: Diagnose FCR GitHub App private-key shape
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: fcr-github-app-secret-shape-diagnostic
      cancel-in-progress: false
    env:
      GITHUB_APP_ID: ${{ secrets.APP_ID }}
      GITHUB_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    steps:
      - name: Parse founder diagnostic command
        id: command
        env:
          COMMAND_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          body = os.environ.get('COMMAND_BODY', '').strip()
          parts = body.split()
          if len(parts) != 3 or parts[0] != '/diagnose-fcr-github-app-key':
              raise SystemExit(
                  'Expected exactly: /diagnose-fcr-github-app-key <40-char-current-main-sha> <approval-reference>'
              )

          main_sha = parts[1]
          approval = parts[2]
          if not re.fullmatch(r'[0-9a-f]{40}', main_sha):
              raise SystemExit('Current main SHA must be a lowercase 40-character commit SHA.')
          if not re.fullmatch(r'[A-Za-z0-9._:-]{8,200}', approval):
              raise SystemExit('Approval reference must use 8-200 auditable characters: A-Z a-z 0-9 . _ : -')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'expected_main_sha={main_sha}\n')
              output.write(f'approval_reference={approval}\n')
          PY

      - name: Fail closed unless command targets exact current main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ steps.command.outputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          printf 'requested_main=%s\ncurrent_main=%s\n' "$EXPECTED_MAIN_SHA" "$current_main"
          test "$current_main" = "$EXPECTED_MAIN_SHA"

      - name: Classify private-key shape without exposing secret material
        id: shape
        env:
          EXPECTED_MAIN_SHA: ${{ steps.command.outputs.expected_main_sha }}
          APPROVAL_REFERENCE: ${{ steps.command.outputs.approval_reference }}
          COMMAND_COMMENT_ID: ${{ github.event.comment.id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { createPrivateKey } from 'node:crypto';

          const secret = String(process.env.GITHUB_PRIVATE_KEY ?? '');
          const appId = String(process.env.GITHUB_APP_ID ?? '').trim();
          const expectedMainSha = String(process.env.EXPECTED_MAIN_SHA ?? '').trim().toLowerCase();
          const approvalReference = String(process.env.APPROVAL_REFERENCE ?? '').trim();
          const commandCommentId = String(process.env.COMMAND_COMMENT_ID ?? '').trim();

          function decodeJsonQuotedString(value) {
            if (!value.startsWith('"') || !value.endsWith('"')) return value;
            try {
              const decoded = JSON.parse(value);
              return typeof decoded === 'string' ? decoded : value;
            } catch {
              return value;
            }
          }

          function unwrapMatchingSingleQuotes(value) {
            return value.length >= 2 && value.startsWith("'") && value.endsWith("'")
              ? value.slice(1, -1)
              : value;
          }

          function decodeBase64Pem(value) {
            const compact = value.replace(/\s+/g, '');
            if (!compact || !/^[A-Za-z0-9+/_-]+={0,2}$/.test(compact)) return null;
            const standard = compact.replace(/-/g, '+').replace(/_/g, '/');
            if (standard.length % 4 === 1) return null;
            const padded = standard.padEnd(standard.length + ((4 - (standard.length % 4)) % 4), '=');
            try {
              const decoded = Buffer.from(padded, 'base64').toString('utf8').replace(/^\uFEFF/, '').trim();
              return decoded.includes('-----BEGIN') && decoded.includes('PRIVATE KEY-----') ? decoded : null;
            } catch {
              return null;
            }
          }

          const trimmed = secret.trim().replace(/^\uFEFF/, '');
          let transportClass = 'unknown';
          let normalized = trimmed;

          if (!trimmed) {
            transportClass = 'empty';
          } else if (trimmed.startsWith('-----BEGIN')) {
            transportClass = 'raw-pem';
          } else if (trimmed.startsWith('"') && trimmed.endsWith('"')) {
            normalized = decodeJsonQuotedString(trimmed);
            transportClass = normalized !== trimmed ? 'json-quoted-pem' : 'unknown';
          } else if (trimmed.startsWith("'") && trimmed.endsWith("'")) {
            normalized = unwrapMatchingSingleQuotes(trimmed);
            transportClass = 'single-quoted-pem';
          } else if (trimmed.includes('\\n') || trimmed.includes('\\r\\n')) {
            transportClass = 'escaped-newline-pem';
          } else {
            const decoded = decodeBase64Pem(trimmed);
            if (decoded !== null) {
              normalized = decoded;
              transportClass = 'base64-pem';
            }
          }

          normalized = unwrapMatchingSingleQuotes(decodeJsonQuotedString(normalized))
            .replace(/\\r\\n/g, '\n')
            .replace(/\\n/g, '\n')
            .replace(/\r\n/g, '\n')
            .trim();

          if (!normalized.includes('-----BEGIN')) {
            normalized = decodeBase64Pem(normalized) ?? normalized;
          }

          const present = secret.length > 0;
          const recognizedTransport = transportClass !== 'unknown' && transportClass !== 'empty';
          const pemBoundary = /^-----BEGIN (?:RSA )?PRIVATE KEY-----\n/.test(normalized)
            && /\n-----END (?:RSA )?PRIVATE KEY-----$/.test(normalized);

          let rsaParse = false;
          if (pemBoundary) {
            try {
              const key = createPrivateKey({ key: normalized, format: 'pem' });
              rsaParse = key.type === 'private' && key.asymmetricKeyType === 'rsa';
            } catch {
              rsaParse = false;
            }
          }

          const appIdNumeric = /^\d+$/.test(appId);
          const receipt = {
            schema: 'fcr/github-app-secret-shape@v1',
            expectedMainSha,
            approvalReference,
            commandCommentId,
            generatedAt: new Date().toISOString(),
            appIdNumeric,
            present,
            recognizedTransport,
            transportClass,
            pemBoundary,
            rsaParse,
            providerAuthenticationAttempted: false,
            providerMutationAttempted: false,
            secretMaterialLogged: false,
            reconstructableSecretMetadataLogged: false,
          };

          await fs.mkdir('artifacts', { recursive: true });
          await fs.writeFile(
            'artifacts/github-app-secret-shape.json',
            `${JSON.stringify(receipt, null, 2)}\n`,
            'utf8',
          );

          console.log(`app_id_numeric=${appIdNumeric}`);
          console.log(`present=${present}`);
          console.log(`recognized_transport=${recognizedTransport}`);
          console.log(`transport_class=${transportClass}`);
          console.log(`pem_boundary=${pemBoundary}`);
          console.log(`rsa_parse=${rsaParse}`);
          console.log('provider_authentication_attempted=false');
          console.log('provider_mutation_attempted=false');

          if (!appIdNumeric || !present || !recognizedTransport || !pemBoundary || !rsaParse) {
            process.exitCode = 1;
          }
          NODE

      - name: Retain secret-safe diagnostic receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-app-secret-shape-${{ steps.command.outputs.expected_main_sha }}-${{ github.run_id }}
          path: artifacts/github-app-secret-shape.json
          if-no-files-found: error
          retention-days: 30
