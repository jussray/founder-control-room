name: Exact-Head Recovery Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  issues: read
  pull-requests: read

concurrency:
  group: exact-head-recovery-command
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch bounded exact-head recovery diagnostics
    if: >-
      github.event.issue.number == 73 &&
      github.event.comment.user.login == 'jussray' &&
      startsWith(github.event.comment.body, '/recover-exact-head ')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Parse founder recovery command
        id: command
        env:
          COMMAND_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          body = os.environ.get('COMMAND_BODY', '').strip()
          parts = body.split()
          if len(parts) != 2 or parts[0] != '/recover-exact-head':
              raise SystemExit('Expected exactly: /recover-exact-head <40-char-sha>')

          sha = parts[1]
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Recovery SHA must be a lowercase 40-character commit SHA.')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'expected_head_sha={sha}\n')
          PY

      - name: Verify target commit exists in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.command.outputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          observed="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_HEAD_SHA}" --jq .sha)"
          printf 'requested_sha=%s\nobserved_sha=%s\n' "$EXPECTED_HEAD_SHA" "$observed"
          test "$observed" = "$EXPECTED_HEAD_SHA"

      - name: Dispatch immutable recovery driver
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.command.outputs.expected_head_sha }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        shell: bash
        run: |
          set -euo pipefail
          reason="founder exact-head recovery via issue #${ISSUE_NUMBER} comment ${COMMENT_ID}"
          payload="$(jq -n \
            --arg ref main \
            --arg sha "$EXPECTED_HEAD_SHA" \
            --arg reason "$reason" \
            '{ref:$ref, inputs:{expected_head_sha:$sha, reason:$reason}}')"

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/pr35-recovery-driver.yml/dispatches" \
            --input - <<< "$payload"

          {
            echo '## Exact-head recovery dispatched'
            echo
            echo "- Target SHA: \`$EXPECTED_HEAD_SHA\`"
            echo "- Authority: founder comment on issue #$ISSUE_NUMBER"
            echo "- Evidence cookie: comment \`$COMMENT_ID\`"
            echo '- Target workflow: `.github/workflows/pr35-recovery-driver.yml`'
            echo '- Deploy/provider/database/merge mutation authority: none'
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch-review-witness:
    name: Dispatch trusted deterministic review witness
    if: >-
      github.event.issue.number == 418 &&
      github.event.comment.user.login == 'jussray' &&
      startsWith(github.event.comment.body, '/review-witness ')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Parse founder review-witness command
        id: review_command
        env:
          COMMAND_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          body = os.environ.get('COMMAND_BODY', '').strip()
          parts = body.split()
          if len(parts) != 3 or parts[0] != '/review-witness':
              raise SystemExit('Expected exactly: /review-witness <pull-request-number> <40-char-current-main-sha>')

          pr_number = parts[1]
          main_sha = parts[2]

          if not re.fullmatch(r'[1-9][0-9]{0,8}', pr_number):
              raise SystemExit('Pull request number must be a positive decimal integer.')
          if not re.fullmatch(r'[0-9a-f]{40}', main_sha):
              raise SystemExit('Current main SHA must be a lowercase 40-character commit SHA.')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'pull_request_number={pr_number}\n')
              output.write(f'expected_main_sha={main_sha}\n')
          PY

      - name: Verify exact current main and open main-target PR
        id: review_target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.review_command.outputs.pull_request_number }}
          EXPECTED_MAIN_SHA: ${{ steps.review_command.outputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail

          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          printf 'requested_main=%s\ncurrent_main=%s\n' "$EXPECTED_MAIN_SHA" "$current_main"
          test "$current_main" = "$EXPECTED_MAIN_SHA"

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state' <<< "$pr_json")"
          base_ref="$(jq -r '.base.ref' <<< "$pr_json")"
          base_sha="$(jq -r '.base.sha' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha' <<< "$pr_json")"

          printf 'pr=%s\nstate=%s\nbase_ref=%s\nbase_sha=%s\nhead_sha=%s\n' \
            "$PR_NUMBER" "$state" "$base_ref" "$base_sha" "$head_sha"

          test "$state" = 'open'
          test "$base_ref" = 'main'
          test "$base_sha" = "$EXPECTED_MAIN_SHA"

          {
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch trusted-main deterministic witness publisher
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.review_command.outputs.pull_request_number }}
          EXPECTED_MAIN_SHA: ${{ steps.review_command.outputs.expected_main_sha }}
          TARGET_HEAD_SHA: ${{ steps.review_target.outputs.head_sha }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        shell: bash
        run: |
          set -euo pipefail

          payload="$(jq -n \
            --arg ref main \
            --argjson pr "$PR_NUMBER" \
            '{ref:$ref, inputs:{pull_request_number:$pr}}')"

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deterministic-review-core-advisory.yml/dispatches" \
            --input - <<< "$payload"

          {
            echo '## Trusted deterministic review witness requested'
            echo
            echo "- Target PR: #$PR_NUMBER"
            echo "- Target PR head observed before dispatch: \`$TARGET_HEAD_SHA\`"
            echo "- Trusted main bound by founder command: \`$EXPECTED_MAIN_SHA\`"
            echo "- Authority: founder comment on issue #$ISSUE_NUMBER"
            echo "- Evidence cookie: comment \`$COMMENT_ID\`"
            echo '- Target workflow: `.github/workflows/deterministic-review-core-advisory.yml`'
            echo '- Review verdict, Founder Final, merge, deploy, provider, database, secret, and publication authority: none granted by this dispatch'
          } >> "$GITHUB_STEP_SUMMARY"
