name: Repair PR 590 composite ruleset receipt

on:
  push:
    branches:
      - fix/fcr-integration-authority-a4ca515

permissions:
  contents: write

jobs:
  repair:
    name: Repair composite provider receipt
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify one-shot parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1dd6f28631127e32c7dcb3ea9452aacbaa36da70"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Apply composite receipt repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          repo_provider = Path('src/providers/RepositoryProvider.ts')
          text = repo_provider.read_text()
          old = '''export interface RulesetResult {
            /** Provider-specific ruleset identifier, for later reference or rollback. */
            id: string;
            name: string;
            enforcement: string;
          }
          '''.replace('          ', '')
          new = '''export interface RulesetResult {
            /** Provider-specific primary ruleset identifier. */
            id: string;
            name: string;
            enforcement: string;
            /**
             * Composite provider mutations expose every durable component
             * identity so caller ledgers can reconcile partial success without
             * guessing provider state.
             */
            components?: Array<{
              purpose: string;
              id: string;
              name: string;
              enforcement: string;
            }>;
          }
          '''.replace('          ', '')
          assert text.count(old) == 1, 'RulesetResult seam changed'
          repo_provider.write_text(text.replace(old, new, 1))

          provider = Path('src/providers/GitHubProvider.ts')
          text = provider.read_text()
          start = text.index('    const { data: existing } = await this.octokit.repos.getRepoRulesets({ owner, repo, per_page: 100 });')
          end_marker = '    return { id: String(data.id), name: data.name, enforcement: data.enforcement };'
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''    const { data: existing } = await this.octokit.repos.getRepoRulesets({ owner, repo, per_page: 100 });
    let freshnessComponent: NonNullable<RulesetResult["components"]>[number] | undefined;

    if (hardenFounderControlRoomMainReview) {
      // Apply and verify the no-bypass freshness membrane FIRST. If any provider
      // call or readback fails, the review membrane is left untouched rather
      // than creating a transient weakening while migrating the topology.
      const freshnessName = fcrMainFreshnessRulesetName(config.name);
      const freshnessRules: RepoRule[] = [{
        type: "required_status_checks",
        parameters: {
          do_not_enforce_on_create: false,
          required_status_checks: config.requiredStatusCheckNames.map((context) => ({ context })),
          strict_required_status_checks_policy: true,
        },
      }];
      const freshnessPayload = {
        owner,
        repo,
        name: freshnessName,
        target: "branch" as const,
        enforcement: config.enforcement,
        bypass_actors: [],
        conditions: {
          ref_name: {
            include: config.targetRefs.map((ref) => `refs/heads/${ref}`),
            exclude: [],
          },
        },
        rules: freshnessRules,
      };
      const freshnessMatch = existing.find((ruleset) => ruleset.name === freshnessName);
      const { data: freshnessData } = freshnessMatch
        ? await this.octokit.repos.updateRepoRuleset({ ...freshnessPayload, ruleset_id: freshnessMatch.id })
        : await this.octokit.repos.createRepoRuleset(freshnessPayload);
      const { data: freshnessReadback } = await this.octokit.repos.getRepoRuleset({
        owner,
        repo,
        ruleset_id: freshnessData.id,
      });
      const freshnessErrors = fcrMainFreshnessRulesetReadbackErrors(
        config,
        freshnessName,
        freshnessReadback,
      );
      if (freshnessErrors.length > 0) {
        throw new Error(
          `GitHubProvider: FCR strict-freshness ruleset ${freshnessData.id} read-back mismatch: ${freshnessErrors.join("; ")}`,
        );
      }
      freshnessComponent = {
        purpose: "strict_freshness",
        id: String(freshnessData.id),
        name: freshnessData.name,
        enforcement: freshnessData.enforcement,
      };
    }

    const applyReviewMembrane = async () => {
      const match = existing.find((ruleset) => ruleset.name === config.name);
      const { data } = match
        ? await this.octokit.repos.updateRepoRuleset({ ...payload, ruleset_id: match.id })
        : await this.octokit.repos.createRepoRuleset(payload);

      if (hardenFounderControlRoomMainReview) {
        const { data: readback } = await this.octokit.repos.getRepoRuleset({
          owner,
          repo,
          ruleset_id: data.id,
        });
        const errors = fcrMainReviewRulesetReadbackErrors(config, readback);
        if (errors.length > 0) {
          throw new Error(`GitHubProvider: FCR review ruleset ${data.id} read-back mismatch: ${errors.join("; ")}`);
        }
      }
      return data;
    };

    const data = await applyReviewMembrane().catch((error: unknown) => {
      if (!freshnessComponent) throw error;
      const message = error instanceof Error ? error.message : String(error);
      throw new Error(
        `GitHubProvider: FCR review membrane failed after verified strict-freshness ruleset ${freshnessComponent.name} (${freshnessComponent.id}): ${message}`,
      );
    });

    return {
      id: String(data.id),
      name: data.name,
      enforcement: data.enforcement,
      ...(freshnessComponent
        ? {
            components: [
              {
                purpose: "review",
                id: String(data.id),
                name: data.name,
                enforcement: data.enforcement,
              },
              freshnessComponent,
            ],
          }
        : {}),
    };'''
          provider.write_text(text[:start] + replacement + text[end:])

          test = Path('src/providers/__tests__/githubProvider.fcrRulesetHardening.test.ts')
          t = test.read_text()
          old_call = '''    const provider = buildProvider();
              await provider.applyBranchRuleset("founder-control-room", config);

              expect(mockCreateRepoRuleset).toHaveBeenCalledTimes(2);
          '''.replace('              ', '')
          new_call = '''    const provider = buildProvider();
              const result = await provider.applyBranchRuleset("founder-control-room", config);

              expect(result.components).toEqual([
                { purpose: "review", id: "1", name: config.name, enforcement: "active" },
                { purpose: "strict_freshness", id: "2", name: freshnessName(), enforcement: "active" },
              ]);
              expect(mockCreateRepoRuleset).toHaveBeenCalledTimes(2);
          '''.replace('              ', '')
          assert t.count(old_call) == 1, 'primary ruleset test seam changed'
          t = t.replace(old_call, new_call, 1)
          anchor = '''  it("updates both stable ruleset identities when they already exist", async () => {
          '''
          regression = '''  it("surfaces the verified freshness identity when the review mutation fails", async () => {
            mockCreateRepoRuleset.mockImplementation(async (payload: { name: string; enforcement: string }) => {
              if (payload.name === freshnessName()) {
                return { data: { id: 2, name: payload.name, enforcement: payload.enforcement } };
              }
              throw new Error("review write failed");
            });

            const provider = buildProvider();
            await expect(provider.applyBranchRuleset("founder-control-room", config))
              .rejects.toThrow(/strict-freshness ruleset .* \(2\).*review write failed/);

            expect(mockCreateRepoRuleset.mock.calls.map((call) => call[0].name))
              .toEqual([freshnessName(), config.name]);
          });

          '''.replace('          ', '')
          assert t.count(anchor) == 1, 'ruleset regression anchor changed'
          test.write_text(t.replace(anchor, regression + anchor, 1))

          route_test = Path('src/http/routes/__tests__/projects.ruleset.integration.test.ts')
          r = route_test.read_text()
          old_type = '''  applyResult?: { id: string; name: string; enforcement: string };
          '''.replace('          ', '')
          new_type = '''  applyResult?: {
            id: string;
            name: string;
            enforcement: string;
            components?: Array<{ purpose: string; id: string; name: string; enforcement: string }>;
          };
          '''.replace('          ', '')
          assert r.count(old_type) == 1, 'route applyResult seam changed'
          r = r.replace(old_type, new_type, 1)
          route_anchor = '''  it("records a failed execution and returns 502 when the provider call throws", async () => {
          '''
          route_regression = '''  it("persists composite provider component receipts in the execution result", async () => {
            const components = [
              { purpose: "review", id: "1", name: "protect-main", enforcement: "active" },
              { purpose: "strict_freshness", id: "2", name: "protect-main [strict freshness]", enforcement: "active" },
            ];
            const { updateMock } = stubRoute({
              applyResult: { id: "1", name: "protect-main", enforcement: "active", components },
            });
            const res = await request(buildApp())
              .post(`/projects/${PROJECT_SLUG}/ruleset`)
              .set("Authorization", BEARER)
              .send(validBody);

            expect(res.status).toBe(200);
            expect(res.body.result.components).toEqual(components);
            expect(updateMock).toHaveBeenCalledWith(
              expect.objectContaining({
                status: "succeeded",
                result: expect.objectContaining({ components }),
                success: true,
              }),
            );
          });

          '''.replace('          ', '')
          assert r.count(route_anchor) == 1, 'route regression anchor changed'
          route_test.write_text(r.replace(route_anchor, route_regression + route_anchor, 1))

          providers_doc = Path('docs/PROVIDERS.md')
          d = providers_doc.read_text()
          old_para = 'For active governance protecting `jussray/founder-control-room` `main`, repository identity is constitutional and mutable project slugs are not. One founder policy request is translated into **two aggregated GitHub rulesets**. The review membrane owns pull-request requirement, approving-review freshness, last-push approval, review-thread resolution, force-push protection, and deletion protection; it contains exactly one App actor whose numeric ID equals trusted `GITHUB_APP_ID`, and that bypass is constrained to GitHub `pull_request` mode. The strict-freshness companion owns the exact required status checks with `strict_required_status_checks_policy: true`, targets the same protected refs, contains zero bypass actors, and contains no pull-request or other rule types. The provider applies and reads back the no-bypass freshness membrane before changing the review membrane, so a partial reconciliation cannot remove the old status membrane before its stricter replacement is proven. Missing, widened, additional, stale, non-strict, or mismatched provider readback fails closed.'
          new_para = 'For active governance protecting `jussray/founder-control-room` `main`, repository identity is constitutional and mutable project slugs are not. One founder policy request is translated into **two aggregated GitHub rulesets**. The review membrane owns pull-request requirement, approving-review freshness, last-push approval, review-thread resolution, force-push protection, and deletion protection; it contains exactly one App actor whose numeric ID equals trusted `GITHUB_APP_ID`, and that bypass is constrained to GitHub `pull_request` mode. The strict-freshness companion owns the exact required status checks with `strict_required_status_checks_policy: true`, targets the same protected refs, contains zero bypass actors, and contains no pull-request or other rule types. The provider applies and reads back the no-bypass freshness membrane before changing the review membrane, so a partial active reconciliation cannot weaken the old membrane. A successful provider result receipts **both** ruleset component identities; if the later review mutation fails, the error retains the already-verified freshness ruleset name and ID for reconciliation. Missing, widened, additional, stale, non-strict, or mismatched provider readback fails closed.'
          assert d.count(old_para) == 1, 'provider doc governance paragraph changed'
          d = d.replace(old_para, new_para, 1)
          rollback_note = '\n\nThe canonical FCR ruleset cannot be disabled, demoted to evaluate mode, or retargeted away from `main` through the generic repository-administration route. A live provider rollback therefore means a separately authorized restoration to a previously proven **active** safe topology, with readback of both component identities; it does not mean turning governance off.'
          marker = '\n\nCanonical founder-final integration must use'
          assert d.count(marker) == 1, 'provider doc rollback insertion marker changed'
          providers_doc.write_text(d.replace(marker, rollback_note + marker, 1))

          receipt_path = Path('docs/DOCUMENTATION_TRUTH_RECEIPT.json')
          receipt = json.loads(receipt_path.read_text())
          changes = {entry['path']: entry for entry in receipt['changes']}
          gp = changes['src/providers/GitHubProvider.ts']['claims']
          gp[0] = 'src/providers/GitHubProvider.ts: an active FCR-main governance request must first apply and read back a separate strict required-status ruleset with zero bypass actors, exact requested checks, strict current-base policy, active enforcement, and no unexpected rule types before changing the review membrane; the composite result must receipt both component identities and partial failure after freshness verification must retain that component identity for reconciliation.'
          rp = changes['src/providers/RepositoryProvider.ts']['claims']
          rp.append('src/providers/RepositoryProvider.ts: composite ruleset mutations may return provider-neutral component receipts so durable caller ledgers can identify every mutated provider object without guessing state.')
          receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - name: Remove one-shot workflow before proof
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_repair-pr590-composite.yml

      - name: Run focused proof
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck
          npx vitest run \
            src/providers/__tests__/githubProvider.fcrRulesetHardening.test.ts \
            src/providers/__tests__/githubProvider.fcrPullRequestMerge.test.ts \
            src/http/routes/__tests__/projects.ruleset.integration.test.ts
          git diff --check

      - name: Commit clean repair
        shell: bash
        env:
          TARGET_BRANCH: fix/fcr-integration-authority-a4ca515
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/providers/GitHubProvider.ts \
            src/providers/RepositoryProvider.ts \
            src/providers/__tests__/githubProvider.fcrRulesetHardening.test.ts \
            src/http/routes/__tests__/projects.ruleset.integration.test.ts \
            docs/PROVIDERS.md \
            docs/DOCUMENTATION_TRUTH_RECEIPT.json
          git diff --cached --check
          git commit -m 'fix(governance): receipt split ruleset topology'
          git push origin "HEAD:${TARGET_BRANCH}"
