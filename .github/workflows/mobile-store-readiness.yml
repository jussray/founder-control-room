name: Mobile Store Readiness

on:
  push:
    branches:
      - feat/mobile-founder-client
    paths:
      - mobile/**
      - src/http/middleware/requireFounder.ts
      - src/http/routes/dashboard.ts
      - .github/workflows/mobile-store-readiness.yml
  pull_request:
    paths:
      - mobile/**
      - src/http/middleware/requireFounder.ts
      - src/http/routes/dashboard.ts
      - .github/workflows/mobile-store-readiness.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

jobs:
  native-source-contract:
    name: Native source contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact proof subject
        run: echo "proof_subject=$(git rev-parse HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install mobile dependencies
        run: npm install --prefix mobile --no-audit --no-fund

      - name: Verify native founder client contract
        run: npm --prefix mobile run verify

      - name: Export Android JavaScript bundle
        run: npm --prefix mobile run export:android
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-placeholder
          EXPO_PUBLIC_FCR_ORIGIN: https://example.invalid

      - name: Export iOS JavaScript bundle
        run: npm --prefix mobile run export:ios
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-placeholder
          EXPO_PUBLIC_FCR_ORIGIN: https://example.invalid

      - name: Retain bundle proof
        uses: actions/upload-artifact@v4
        with:
          name: fcr-mobile-bundles-${{ github.sha }}
          path: |
            mobile/dist/android
            mobile/dist/ios
          if-no-files-found: error
          retention-days: 30
