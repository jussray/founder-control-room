name: Mobile Store Readiness

on:
  push:
    branches:
      - feat/mobile-founder-client
      - main
    paths:
      - mobile/**
      - src/http/middleware/requireFounder.ts
      - src/http/routes/dashboard.ts
      - .github/workflows/mobile-store-readiness.yml
  pull_request:
    paths:
      - mobile/**
      - src/http/middleware/requireFounder.ts
      - src/http/routes/dashboard.ts
      - .github/workflows/mobile-store-readiness.yml
  workflow_dispatch:
    inputs:
      build_android_preview:
        description: 'After Expo robot check, build an internal Android preview (requires linked EAS project and public runtime variables)'
        type: boolean
        required: false
        default: false
      build_all_platforms:
        description: 'Build Android and iOS using the production EAS profile (may incur build charges; existing signing credentials required)'
        type: boolean
        required: false
        default: false
      existing_eas_project_id:
        description: 'UUID of the EXISTING Expo EAS project; omit only if already linked in mobile/app.json or EXPO_EAS_PROJECT_ID Actions variable'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Cancel superseded runs for the same pull request only; push, schedule and
  # dispatch runs get a unique group (run_id) and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

jobs:
  expo-robot-readiness:
    name: Expo fcr robot readiness
    # Secret-backed auth is limited to trusted main. PRs and feature-branch pushes cannot run it.
    # Main workflow changes provide a no-build credential check; manual dispatch can request a preview.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: expo-mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Require Actions Expo credential
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub Actions secret EXPO_TOKEN is missing. Copilot Agents secrets do not automatically reach Actions."
            exit 1
          fi

      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Record proof subject
        run: echo "proof_subject=$(git rev-parse HEAD)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure EAS CLI with robot token
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Authenticate Expo robot
        working-directory: mobile
        run: eas whoami

      - name: Verify linked EAS project (read-only)
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { expo } = require('./app.json');
          const id = expo?.extra?.eas?.projectId;
          if (!/^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$/.test(id ?? '')) {
            console.error('::error::FCR mobile lacks a valid linked EAS project ID.');
            process.exit(1);
          }
          console.log(`Checking configured EAS project ID: ${id}`);
          NODE
          # Provider validation; does not create a project or start a build.
          eas project:info

      - name: Discover existing EAS project (read-only)
        id: existing_eas_project
        working-directory: mobile
        env:
          EXPO_PROJECT_OWNER: ${{ vars.EXPO_PROJECT_OWNER }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const slug = require('./app.json')?.expo?.slug;
          const account = execFileSync('eas', ['whoami'], { encoding: 'utf8', timeout: 20000 }).trim().split(/\s+/)[0];
          const owner = process.env.EXPO_PROJECT_OWNER?.trim() || account;
          if (!/^[a-zA-Z0-9_-]+$/.test(owner) || !/^[a-zA-Z0-9_-]+$/.test(slug ?? '')) {
            console.log('::warning::Existing EAS project lookup skipped: unrecognized owner or slug.');
            process.exit(0);
          }
          // Read-only query: never call project:init without a verified ID, never create an Expo app.
          const query = 'query ExistingExpoApp($fullName: String!) { app { byFullName(fullName: $fullName) { id slug ownerAccount { name } } } }';
          let app;
          try {
            const response = await fetch('https://api.expo.dev/graphql', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${process.env.EXPO_TOKEN}`,
              },
              body: JSON.stringify({ query, variables: { fullName: `@${owner}/${slug}` } }),
              redirect: 'error',
              signal: AbortSignal.timeout(20000),
            });
            if (!response.ok) {
              console.log(`::warning::Existing EAS project lookup returned HTTP ${response.status}; no project link authorized.`);
              process.exit(0);
            }
            const payload = await response.json();
            if (payload.errors?.length) {
              const messages = payload.errors.map((error) => String(error?.message || ''));
              const reason = messages.some((message) => /not found|does not exist/i.test(message))
                ? 'NOT_FOUND'
                : messages.some((message) => /cannot query field|unknown argument|unknown type/i.test(message))
                  ? 'QUERY_SCHEMA'
                  : messages.some((message) => /unauthori[sz]ed|forbidden|permission|access denied/i.test(message))
                    ? 'ACCESS_DENIED' : 'PROVIDER_REJECTED';
              console.log(`::warning::Existing EAS project lookup: ${reason}. No project created or linked.`);
              process.exit(0);
            }
            app = payload.data?.app?.byFullName;
          } catch {
            console.log('::warning::Existing EAS project lookup failed before provider confirmation; explicit project ID remains required.');
            process.exit(0);
          }
          if (!app) {
            console.log('::notice::No existing EAS project confirmed under the authenticated Expo account and app slug. No project created.');
            process.exit(0);
          }
          if (app.slug !== slug || app.ownerAccount?.name !== owner || !/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(app.id)) {
            console.log('::warning::EAS project lookup returned unexpected identity; build link not authorized.');
            process.exit(0);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `project_id=${app.id}\n`);
          console.log(`Existing EAS project verified for @${owner}/${slug}; project ID: ${app.id}`);
          NODE

      - name: Discover existing org-owned EAS project (read-only)
        id: org_eas_project
        if: ${{ steps.existing_eas_project.outputs.project_id == '' }}
        working-directory: mobile
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const slug = require('./app.json')?.expo?.slug;
          // Discover accessible accounts only. Never create, modify, or publish projects.
          const query = 'query ExistingExpoOrgProjects { meUserActor { accounts { name apps(includeUnpublished: true, limit: 100, offset: 0) { id slug ownerAccount { name } } } } }';
          try {
            const response = await fetch('https://api.expo.dev/graphql', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${process.env.EXPO_TOKEN}`,
              },
              body: JSON.stringify({ query }),
              redirect: 'error',
              signal: AbortSignal.timeout(20000),
            });
            if (!response.ok) throw new Error('http');
            const payload = await response.json();
            if (payload.errors?.length) throw new Error('graphql');
            const accounts = payload.data?.meUserActor?.accounts;
            if (!Array.isArray(accounts)) throw new Error('no-accessible-accounts');
            const matches = accounts.flatMap((account) => (account.apps || [])
              .filter((app) => app.slug === slug && app.ownerAccount?.name === account.name));
            if (matches.length !== 1 || !/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(matches[0].id)) {
              console.log(matches.length > 1
                ? '::warning::Multiple accessible Expo projects share the FCR slug; an explicit verified project ID is required.'
                : '::notice::No unique existing FCR project found among accessible Expo accounts; no project created.');
              process.exit(0);
            }
            const app = matches[0];
            appendFileSync(process.env.GITHUB_OUTPUT, `project_id=${app.id}\n`);
            console.log(`Existing EAS project confirmed for @${app.ownerAccount.name}/${app.slug}; project ID: ${app.id}`);
          } catch {
            console.log('::warning::Expo accessible-account project lookup unavailable; explicit existing project ID required.');
            process.exit(0);
          }
          NODE

      - name: Require existing EAS project association
        if: ${{ inputs.build_android_preview || inputs.build_all_platforms }}
        working-directory: mobile
        env:
          EAS_PROJECT_ID: ${{ inputs.existing_eas_project_id || vars.EXPO_EAS_PROJECT_ID || steps.existing_eas_project.outputs.project_id || steps.org_eas_project.outputs.project_id }}
          DISCOVERED_EAS_PROJECT_ID: ${{ steps.existing_eas_project.outputs.project_id || steps.org_eas_project.outputs.project_id }}
          BUILD_ANDROID_PREVIEW: ${{ inputs.build_android_preview }}
          BUILD_ALL_PLATFORMS: ${{ inputs.build_all_platforms }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD_ANDROID_PREVIEW" = "true" ] && [ "$BUILD_ALL_PLATFORMS" = "true" ]; then
            echo "::error::Choose Android preview OR all-platform production, not both."
            exit 1
          fi
          configured_id="$(node -e "const id=require('./app.json').expo?.extra?.eas?.projectId; if (id) process.stdout.write(id)")"
          supplied_id="${EAS_PROJECT_ID:-}"
          if [ -n "${DISCOVERED_EAS_PROJECT_ID:-}" ] && [ -n "$supplied_id" ] && [ "$DISCOVERED_EAS_PROJECT_ID" != "$supplied_id" ]; then
            echo "::error::Requested EAS project ID differs from verified existing project identity."
            exit 1
          fi
          project_id="${configured_id:-$supplied_id}"
          if ! [[ "$project_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::Existing EAS project ID required; set the manual input or EXPO_EAS_PROJECT_ID. No new Expo project will be created."
            exit 1
          fi
          if [ -n "$configured_id" ] && [ -n "$supplied_id" ] && [ "$configured_id" != "$supplied_id" ]; then
            echo "::error::Existing app project ID does not match the supplied EAS project ID."
            exit 1
          fi
          if [ -z "$configured_id" ]; then
            # --id links an existing provider project in this ephemeral runner; never create a duplicate.
            npx eas-cli@latest project:init --id "$project_id" --non-interactive
          fi
          npx eas-cli@latest project:info

      - name: Require real public mobile runtime configuration
        if: ${{ inputs.build_android_preview || inputs.build_all_platforms }}
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_FCR_ORIGIN: ${{ vars.EXPO_PUBLIC_FCR_ORIGIN }}
        shell: bash
        run: |
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_FCR_ORIGIN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions variable $name required for usable Android preview."
              exit 1
            fi
          done

      - name: Build Android internal preview
        if: ${{ inputs.build_android_preview }}
        working-directory: mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_FCR_ORIGIN: ${{ vars.EXPO_PUBLIC_FCR_ORIGIN }}
        shell: bash
        run: |
          npm install --no-audit --no-fund
          eas build --platform android --profile preview --non-interactive --wait

      - name: Build Android and iOS via EAS (production)
        if: ${{ inputs.build_all_platforms }}
        working-directory: mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_FCR_ORIGIN: ${{ vars.EXPO_PUBLIC_FCR_ORIGIN }}
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npx eas-cli@latest build --platform all --non-interactive --wait

  native-source-contract:
    name: Native source contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact proof subject
        run: echo "proof_subject=$(git rev-parse HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install mobile dependencies
        run: npm install --prefix mobile --no-audit --no-fund

      - name: Verify native founder client contract
        run: npm --prefix mobile run verify

      - name: Export Android JavaScript bundle
        run: npm --prefix mobile run export:android
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-placeholder
          EXPO_PUBLIC_FCR_ORIGIN: https://example.invalid

      - name: Export iOS JavaScript bundle
        run: npm --prefix mobile run export:ios
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-placeholder
          EXPO_PUBLIC_FCR_ORIGIN: https://example.invalid

      - name: Retain bundle proof
        uses: actions/upload-artifact@v4
        with:
          name: fcr-mobile-bundles-${{ github.sha }}
          path: |
            mobile/dist/android
            mobile/dist/ios
          if-no-files-found: error
          retention-days: 30
