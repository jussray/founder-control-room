name: FCR Review Email Worker Reconcile

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact current main commit approved for review-email Worker reconciliation
        required: true
        type: string
      deployment_approval_id:
        description: Auditable founder approval reference
        required: true
        type: string
      deployment_reason:
        description: Short reason for this review-email Worker reconciliation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fcr-review-email-worker-reconcile-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  authority-gate:
    name: Review Email Worker Authority and Exact-Head Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      DEPLOYMENT_APPROVAL_ID: ${{ inputs.deployment_approval_id }}
      DEPLOYMENT_REASON: ${{ inputs.deployment_reason }}
    steps:
      - name: Checkout exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify production authority and current main
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid exact head::expected_head_sha must be a lowercase 40-character commit SHA."
            exit 1
          fi
          if [[ ! "$DEPLOYMENT_APPROVAL_ID" =~ ^[A-Za-z0-9._:-]{8,200}$ ]]; then
            echo "::error title=Invalid production approval reference::deployment_approval_id must be an auditable 8-200 character reference."
            exit 1
          fi

          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin refs/heads/main:refs/remotes/origin/main
          CURRENT_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"

          echo "Expected approved SHA: $EXPECTED_HEAD_SHA"
          echo "Checked-out SHA:       $ACTUAL_HEAD_SHA"
          echo "Current main SHA:       $CURRENT_MAIN_SHA"
          echo "Approval reference:     $DEPLOYMENT_APPROVAL_ID"

          test "$ACTUAL_HEAD_SHA" = "$EXPECTED_HEAD_SHA"
          test "$CURRENT_MAIN_SHA" = "$EXPECTED_HEAD_SHA"

      - name: Validate bounded review-email Worker authority
        env:
          CLOUDFLARE_REVIEW_EMAIL_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_REVIEW_EMAIL_DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_REVIEW_EMAIL_DEPLOY_TOKEN:-}" ]]; then
            echo '::error title=Missing review-email deploy credential::Set CLOUDFLARE_REVIEW_EMAIL_DEPLOY_TOKEN in the GitHub production environment before reconciliation.'
            exit 1
          fi

          ACCOUNT_ID="$(sed -nE 's/^account_id[[:space:]]*=[[:space:]]*"([0-9a-f]+)"[[:space:]]*$/\1/p' wrangler.email.toml | head -n 1)"
          if [[ ! "$ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo '::error title=Invalid review-email Worker account authority::wrangler.email.toml must declare a 32-character lowercase Cloudflare account_id.'
            exit 1
          fi

          grep -Eq '^name = "founder-control-room-review-email"$' wrangler.email.toml
          grep -Eq '^binding = "FOUNDER_CONTROL_ROOM_API"$' wrangler.email.toml
          grep -Eq '^service = "founder-control-room"$' wrangler.email.toml
          node scripts/verify-founder-review-email-routing.mjs

          echo 'Review-email Worker identity, account authority, top-level literal review@ routing desired state, private API binding, and dedicated deploy credential are declared. Wrangler may reconcile the route during deploy; provider readback and runtime invocation remain separate evidence.'

      - name: Record bounded authority receipt
        shell: bash
        run: |
          {
            echo "## Review-email Worker reconciliation authority"
            echo
            echo "- Exact approved head: \`$EXPECTED_HEAD_SHA\`"
            echo "- Approval reference: \`$DEPLOYMENT_APPROVAL_ID\`"
            echo "- Reason: ${DEPLOYMENT_REASON:-not supplied}"
            echo "- Mutation scope: Cloudflare Worker \`founder-control-room-review-email\` plus its Wrangler-managed literal Email Routing rule via \`wrangler.email.toml\`"
            echo "- Expected provider-side email rule: \`review@foundercontrolroom.org -> founder-control-room-review-email\`"
            echo "- Email rule desired-state reconciliation: included in Wrangler deploy"
            echo "- Email rule provider readback and runtime invocation: retained as separate receipts"
            echo "- Credential authority: dedicated \`CLOUDFLARE_REVIEW_EMAIL_DEPLOY_TOKEN\`"
            echo "- Intended private binding: \`FOUNDER_CONTROL_ROOM_API -> founder-control-room\`"
            echo "- Existing Worker secrets: preserved and validated by name before deploy"
            echo "- Supabase database mutation: absent by workflow design"
            echo "- Cloudflare Access mutation: absent by workflow design"
            echo "- Publication scheduling: absent by workflow design"
          } >> "$GITHUB_STEP_SUMMARY"

  reconcile:
    name: Reconcile Review Email Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    needs: authority-gate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Re-prove review-email Worker repository contract
        run: |
          node scripts/verify-founder-review-email-routing.mjs
          npm run verify:founder-review-email

      - name: Initialize redacted reconciliation receipt
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          jq -n \
            --arg scope 'review_email_worker_reconcile' \
            --arg expected_sha "$EXPECTED_HEAD_SHA" \
            --arg worker 'founder-control-room-review-email' \
            --arg address 'review@foundercontrolroom.org' \
            --arg binding 'FOUNDER_CONTROL_ROOM_API' \
            --arg service 'founder-control-room' \
            '{
              scope: $scope,
              expected_sha: $expected_sha,
              worker: $worker,
              expected_email_routing_address: $address,
              service_binding: {binding: $binding, service: $service},
              credential_header_safe: false,
              provider_worker_found: null,
              provider_error_class: null,
              provider_error_code: null,
              provider_cli_exit_status: null,
              required_secret_names_verified: false,
              provider_deploy_succeeded: false,
              service_binding_verified: false,
              email_trigger_reconciled: false,
              blocked_stage: "credential_header_safety",
              supabase_db_mutation: false,
              access_policy_mutation: false,
              runtime_email_invocation_proven: false
            }' > test-results/fcr-review-email-worker-reconcile.json

      - name: Validate dedicated review-email Cloudflare token header safety
        env:
          CLOUDFLARE_REVIEW_EMAIL_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_REVIEW_EMAIL_DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys

          token = os.environ.get('CLOUDFLARE_REVIEW_EMAIL_DEPLOY_TOKEN', '')
          if not token:
              print('::error title=Missing review-email deploy credential::CLOUDFLARE_REVIEW_EMAIL_DEPLOY_TOKEN is empty.')
              sys.exit(1)

          try:
              token.encode('ascii')
          except UnicodeEncodeError:
              print('::error title=Malformed review-email deploy credential::CLOUDFLARE_REVIEW_EMAIL_DEPLOY_TOKEN contains non-ASCII characters and cannot be used as an HTTP Authorization value. Re-copy the exact Cloudflare-issued token.')
              sys.exit(1)

          if any(ord(char) < 33 or ord(char) > 126 or char.isspace() for char in token):
              print('::error title=Malformed review-email deploy credential::CLOUDFLARE_REVIEW_EMAIL_DEPLOY_TOKEN contains whitespace or non-printable characters. Re-copy the exact Cloudflare-issued token.')
              sys.exit(1)

          print('Dedicated review-email Cloudflare deploy token is header-safe. The token value was not printed.')
          PY

          receipt='test-results/fcr-review-email-worker-reconcile.json'
          tmp="${receipt}.tmp"
          jq '.credential_header_safe = true | .blocked_stage = "existing_worker_secret_read"' "$receipt" > "$tmp"
          mv "$tmp" "$receipt"

      - name: Verify existing review-email Worker secret names
        id: secret_state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_REVIEW_EMAIL_DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          secret_receipt="$RUNNER_TEMP/review-email-secret-names.json"
          secret_error="$RUNNER_TEMP/review-email-secret-names.err"

          set +e
          ./node_modules/.bin/wrangler secret list \
            --config wrangler.email.toml \
            --format json > "$secret_receipt" 2> "$secret_error"
          secret_status=$?
          set -e

          receipt='test-results/fcr-review-email-worker-reconcile.json'
          tmp="${receipt}.tmp"

          if (( secret_status != 0 )); then
            provider_error_code="$(grep -Eo '\[code: [0-9]+\]' "$secret_error" | head -n 1 | grep -Eo '[0-9]+' || true)"
            provider_error_class='provider_read_failed'
            provider_worker_found='null'
            blocked_stage='existing_worker_secret_read'

            if grep -F 'Worker "founder-control-room-review-email" not found.' "$secret_error" >/dev/null; then
              provider_error_class='worker_not_found'
              provider_worker_found='false'
              blocked_stage='provider_worker_identity'
            elif grep -Eiq 'authentication|invalid api token|api token[^[:alnum:]]+invalid' "$secret_error"; then
              provider_error_class='authentication'
            elif grep -Eiq 'unauthorized|forbidden|not authorized|permission denied|insufficient permission' "$secret_error"; then
              provider_error_class='authorization'
            elif grep -Eiq 'rate limit|too many requests|\b429\b' "$secret_error"; then
              provider_error_class='rate_limit'
            elif grep -Eiq 'internal server|service unavailable|bad gateway|gateway timeout|\b5[0-9][0-9]\b' "$secret_error"; then
              provider_error_class='provider_service'
            elif grep -Eiq 'invalid account|account[^[:alnum:]]+(not found|permission|scope)' "$secret_error"; then
              provider_error_class='account_or_scope'
            fi

            rm -f "$secret_error"

            jq \
              --arg provider_error_class "$provider_error_class" \
              --arg provider_error_code "$provider_error_code" \
              --arg blocked_stage "$blocked_stage" \
              --argjson provider_cli_exit_status "$secret_status" \
              --argjson provider_worker_found "$provider_worker_found" \
              '.provider_error_class = $provider_error_class
               | .provider_error_code = (if $provider_error_code == "" then null else $provider_error_code end)
               | .provider_cli_exit_status = $provider_cli_exit_status
               | .provider_worker_found = $provider_worker_found
               | .blocked_stage = $blocked_stage' \
              "$receipt" > "$tmp"
            mv "$tmp" "$receipt"

            if [[ "$provider_error_class" == "worker_not_found" ]]; then
              echo 'bootstrap_required=true' >> "$GITHUB_OUTPUT"
              echo '::notice title=Review-email Worker bootstrap required::Worker is absent. The workflow may create the Worker without Email Routing, then stop for secret provisioning.'
              exit 0
            fi

            echo "::error title=Review-email Worker provider read failed::Cloudflare secret-name readback failed safely classified as ${provider_error_class}; code=${provider_error_code:-unknown}; exit=${secret_status}. Raw provider stderr was classified then deleted without emission."
            exit "$secret_status"
          fi

          rm -f "$secret_error"
          jq '.provider_worker_found = true' "$receipt" > "$tmp"
          mv "$tmp" "$receipt"

          for required in FOUNDER_REVIEW_FOUNDER_EMAIL FOUNDER_REVIEW_EMAIL_INGRESS_SECRET; do
            if ! jq -e --arg required "$required" 'any(.[]; .name == $required)' "$secret_receipt" >/dev/null; then
              jq '.blocked_stage = "required_worker_secret_names"' "$receipt" > "$tmp"
              mv "$tmp" "$receipt"
              echo "::error title=Missing review-email Worker secret::$required is not installed on founder-control-room-review-email."
              exit 1
            fi
          done

          jq '.required_secret_names_verified = true | .blocked_stage = "provider_deploy"' "$receipt" > "$tmp"
          mv "$tmp" "$receipt"
          echo 'bootstrap_required=false' >> "$GITHUB_OUTPUT"
          echo 'Required review-email Worker secret names are present. Values were not read.'

      - name: Bootstrap missing review-email Worker without routing
        if: steps.secret_state.outputs.bootstrap_required == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_REVIEW_EMAIL_DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          receipt='test-results/fcr-review-email-worker-reconcile.json'
          bootstrap_config='wrangler.email.bootstrap.toml'
          deploy_log="$RUNNER_TEMP/review-email-worker-bootstrap.log"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import tomllib

          source_path = Path('wrangler.email.toml')
          source = source_path.read_text(encoding='utf-8')
          parsed = tomllib.loads(source)
          expected = ['review@foundercontrolroom.org']
          if parsed.get('addresses') != expected:
              raise SystemExit('canonical review-email config must contain exactly one top-level review@ address before bootstrap')

          kept = []
          removed = 0
          for line in source.splitlines():
              if re.fullmatch(r'\s*addresses\s*=\s*\[\s*"review@foundercontrolroom\.org"\s*\]\s*', line):
                  removed += 1
                  continue
              kept.append(line)

          if removed != 1:
              raise SystemExit('bootstrap config must remove exactly one canonical addresses declaration')

          bootstrap = '\n'.join(kept) + '\n'
          Path('wrangler.email.bootstrap.toml').write_text(bootstrap, encoding='utf-8')
          parsed_bootstrap = tomllib.loads(bootstrap)
          if 'addresses' in parsed_bootstrap:
              raise SystemExit('bootstrap config must not contain Email Routing addresses')
          PY

          set +e
          npx --yes wrangler@4.129.0 deploy --config "$bootstrap_config" 2>&1 | tee "$deploy_log"
          deploy_status=${PIPESTATUS[0]}
          set -e

          if (( deploy_status != 0 )); then
            tmp="${receipt}.tmp"
            jq '.blocked_stage = "provider_bootstrap_deploy_failed"' "$receipt" > "$tmp"
            mv "$tmp" "$receipt"
            rm -f "$bootstrap_config"
            echo "::error title=Review-email Worker bootstrap failed::Wrangler exited with status $deploy_status before any Email Routing rule was declared."
            exit "$deploy_status"
          fi

          tmp="${receipt}.tmp"
          jq '.provider_worker_found = true
              | .provider_deploy_succeeded = true
              | .blocked_stage = "service_binding_proof"' "$receipt" > "$tmp"
          mv "$tmp" "$receipt"

          grep -F 'FOUNDER_CONTROL_ROOM_API (founder-control-room)' "$deploy_log" >/dev/null || {
            rm -f "$bootstrap_config"
            echo '::error title=Service Binding proof missing::Bootstrap Worker deploy succeeded without routing, but Wrangler output did not prove FOUNDER_CONTROL_ROOM_API -> founder-control-room.'
            exit 1
          }

          jq '.service_binding_verified = true
              | .blocked_stage = "provider_secret_bootstrap"' "$receipt" > "$tmp"
          mv "$tmp" "$receipt"
          rm -f "$bootstrap_config"

          {
            echo '## Review-email Worker bootstrap receipt'
            echo
            echo '- Worker created/updated without Email Routing addresses.'
            echo '- No review@ rule was declared by the bootstrap config.'
            echo '- Private FOUNDER_CONTROL_ROOM_API -> founder-control-room binding was observed in Wrangler output.'
            echo '- Next gate: provision required Worker secret names, then rerun canonical reconciliation.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy review-email Worker
        if: steps.secret_state.outputs.bootstrap_required != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_REVIEW_EMAIL_DEPLOY_TOKEN }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/review-email-worker-deploy.log"
          receipt='test-results/fcr-review-email-worker-reconcile.json'

          set +e
          npx --yes wrangler@4.129.0 deploy --config wrangler.email.toml 2>&1 | tee "$deploy_log"
          deploy_status=${PIPESTATUS[0]}
          set -e
          if (( deploy_status != 0 )); then
            tmp="${receipt}.tmp"
            jq '.blocked_stage = "provider_deploy_failed"' "$receipt" > "$tmp"
            mv "$tmp" "$receipt"
            echo "::error title=Review-email Worker deployment failed::Wrangler exited with status $deploy_status."
            exit "$deploy_status"
          fi

          tmp="${receipt}.tmp"
          jq '.provider_deploy_succeeded = true | .blocked_stage = "service_binding_proof"' "$receipt" > "$tmp"
          mv "$tmp" "$receipt"

          grep -F 'FOUNDER_CONTROL_ROOM_API (founder-control-room)' "$deploy_log" >/dev/null || {
            echo '::error title=Service Binding proof missing::Worker deploy succeeded, but Wrangler output did not prove FOUNDER_CONTROL_ROOM_API -> founder-control-room. Provider deployment remains recorded as successful; binding proof remains false.'
            exit 1
          }

          tmp="${receipt}.tmp"
          jq '.service_binding_verified = true | .blocked_stage = "provider_email_routing_readback"' "$receipt" > "$tmp"
          mv "$tmp" "$receipt"
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted reconciliation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcr-review-email-worker-reconcile-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/fcr-review-email-worker-reconcile.json
          if-no-files-found: error
          retention-days: 30
