name: PR 851 documentation repair

on:
  push:
    branches:
      - feat/github-app-capability-contract

permissions:
  contents: write

concurrency:
  group: pr851-doc-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/github-app-capability-contract
          fetch-depth: 0

      - name: Apply bounded documentation truth repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          readme = Path('README.md')
          providers = Path('docs/PROVIDERS.md')
          receipt = Path('docs/DOCUMENTATION_TRUTH_RECEIPT.json')

          readme_text = readme.read_text()
          readme_marker = 'Capability-aware GitHub App repository authority is now provider-observed before use.'
          if readme_marker not in readme_text:
              anchor = 'Source policy is not live GitHub provider truth. Current rulesets, bypass actors, required checks, native review settings, and provider enforcement require fresh GitHub provider readback before a merge decision.\n'
              addition = '''\nCapability-aware GitHub App repository authority is now provider-observed before use. Production paths that rely on installation authority must declare the exact repository permissions they need, observe the live App installation and permission map for the bound `owner/repo`, fail closed when any required permission is absent, and only then mint the repository-scoped installation token. `createCapabilityAwareAppRepositoryProvider(...)` deliberately has no ambient `GITHUB_TOKEN` fallback. Capability proves only that GitHub granted the installed App a bounded operation class; it does not grant founder approval, merge, deploy, publication, spend, secret, billing, or destructive authority. Arbitrary upstream fork creation remains a separate founder user-authority lane when the FCR App is not installed on the source repository.\n'''
              if anchor not in readme_text:
                  raise SystemExit('README anchor not found')
              readme_text = readme_text.replace(anchor, anchor + addition, 1)
              readme.write_text(readme_text)

          providers_text = providers.read_text()
          providers_marker = '`createCapabilityAwareAppRepositoryProvider(...)` is the production capability-aware GitHub App entrypoint.'
          if providers_marker not in providers_text:
              anchor = 'Production GitHub authentication should prefer short-lived installation credentials from an FCR-owned GitHub App configured at runtime with `GITHUB_APP_ID` and `GITHUB_PRIVATE_KEY`; `GITHUB_TOKEN` remains a bounded local/development fallback. The release-coverage witness uses the same App-aware, repository-scoped construction path. If either App variable is set without the other, construction fails closed instead of silently degrading to a fallback token. Install the App only on `jussray/founder-control-room` unless a broader repository scope is separately reviewed and proven.\n'
              addition = '''\n`createCapabilityAwareAppRepositoryProvider(...)` is the production capability-aware GitHub App entrypoint for any subsystem that intends to rely on App read or write authority. The caller declares the exact GitHub repository permissions required by the operation; FCR observes the bound repository's live installation identity and permission map, derives bounded read/write capability, fails closed before token minting when a permission is missing, and returns the authority evidence beside the provider. This path intentionally does not fall back to ambient `GITHUB_TOKEN`. A granted capability is not approval and does not bypass founder-final, merge, deploy, publication, ruleset, secret, database, billing, or destructive-action gates. GitHub App installation authority also must not be mislabeled as founder-user authority: operations such as forking an arbitrary upstream repository remain outside this lane when the App is not installed on the source repository.\n'''
              if anchor not in providers_text:
                  raise SystemExit('PROVIDERS anchor not found')
              providers_text = providers_text.replace(anchor, anchor + addition, 1)
              providers.write_text(providers_text)

          data = json.loads(receipt.read_text())
          changes = data.setdefault('changes', [])

          claims_by_path = {
              'src/providers/RepositoryProviderFactory.ts': [
                  '`src/providers/RepositoryProviderFactory.ts` must require configured GitHub App credentials and provider-observed installation permissions before returning capability-aware repository authority; this path must not fall back to ambient `GITHUB_TOKEN`, and capability evidence alone must not authorize merge, deploy, publication, or other independently gated mutations.'
              ],
              'src/providers/githubAppCapabilities.ts': [
                  '`src/providers/githubAppCapabilities.ts` must derive readable and writable repository capabilities only from GitHub\'s observed installation permission map, treat write as satisfying read but never vice versa, preserve raw permissions without inventing implemented authority, and fail closed when a required permission is absent.'
              ],
              'src/providers/trustedGithubGovernanceObserver.ts': [
                  '`src/providers/trustedGithubGovernanceObserver.ts` must require live `administration: read` GitHub App installation evidence before token minting or Chief ruleset reads; observed `checks: write` capability remains non-authorizing until a separately contracted producer and authority path exist.'
              ],
              'docs/PROVIDERS.md': [
                  '`docs/PROVIDERS.md` must document the capability-aware GitHub App path, its no-ambient-token-fallback production rule, and the installation-versus-user authority boundary without claiming arbitrary-upstream fork authority.'
              ],
          }

          def ensure_claim(path, claim):
              entry = next((item for item in changes if item.get('path') == path), None)
              if entry is None:
                  entry = {'path': path, 'claims': []}
                  changes.append(entry)
              claims = entry.setdefault('claims', [])
              if claim not in claims:
                  claims.append(claim)

          for path, claims in claims_by_path.items():
              for claim in claims:
                  ensure_claim(path, claim)

          ensure_claim(
              'README.md',
              '`README.md` must state that production GitHub App authority is capability-aware and provider-observed before token minting, has no ambient `GITHUB_TOKEN` fallback on that path, does not convert capability into approval, and cannot impersonate founder-user authority for arbitrary upstream forks outside the App installation boundary.'
          )

          receipt.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Commit exact documentation repair
        shell: bash
        run: |
          set -euo pipefail
          git add README.md docs/PROVIDERS.md docs/DOCUMENTATION_TRUTH_RECEIPT.json
          if git diff --cached --quiet; then
            echo 'No documentation repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(github-app): bind capability authority truth'
          git push origin HEAD:feat/github-app-capability-contract
