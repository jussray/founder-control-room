name: PR Recovery Exact-Head Driver

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact lowercase 40-character commit SHA to diagnose
        required: true
        type: string
      reason:
        description: Why recovery diagnostics are needed
        required: false
        default: manual recovery
        type: string

permissions:
  contents: read

concurrency:
  group: pr-recovery-${{ github.repository }}-${{ inputs.expected_head_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TARGET_SHA: ${{ inputs.expected_head_sha }}

jobs:
  code-diagnostics:
    name: Recovery Code Diagnostic Packet
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Validate immutable target input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "expected_head_sha must be a lowercase 40-character Git SHA."
            exit 2
          }

      - name: Check out immutable target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert immutable target
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          printf 'target_sha=%s\nobserved_sha=%s\nreason=%s\n' \
            "$TARGET_SHA" "$observed" "${{ inputs.reason }}"
          test "$observed" = "$TARGET_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies once
        shell: bash
        run: |
          set -o pipefail
          mkdir -p recovery-logs
          npm ci 2>&1 | tee recovery-logs/npm-ci.log

      - name: Run code recovery diagnostics
        shell: bash
        run: |
          set +e
          : > recovery-logs/code-summary.txt
          failed=0

          run_check() {
            name="$1"
            shift
            echo "::group::${name}"
            "$@" 2>&1 | tee "recovery-logs/${name}.log"
            status=${PIPESTATUS[0]}
            printf '%s=%s\n' "$name" "$status" >> recovery-logs/code-summary.txt
            if [ "$status" -ne 0 ]; then
              failed=1
            fi
            echo "::endgroup::"
          }

          run_check typecheck npm run typecheck
          run_check lint npm run lint
          run_check unit-tests npm test -- --coverage --reporter=json --outputFile=recovery-logs/test-results.json
          run_check terminal-contract npm run verify:terminal-contract
          run_check ai-skills npm run verify:ai-skills
          run_check production-build npm run build

          printf 'overall=%s\n' "$failed" >> recovery-logs/code-summary.txt
          cat recovery-logs/code-summary.txt
          exit "$failed"

      - name: Upload code recovery packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-recovery-code-${{ env.TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery-logs/
          if-no-files-found: warn
          retention-days: 7

  migration-diagnostics:
    name: Recovery Migration Diagnostic Packet
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Validate immutable target input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "expected_head_sha must be a lowercase 40-character Git SHA."
            exit 2
          }

      - name: Check out immutable target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert immutable target
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          printf 'target_sha=%s\nobserved_sha=%s\nreason=%s\n' \
            "$TARGET_SHA" "$observed" "${{ inputs.reason }}"
          test "$observed" = "$TARGET_SHA"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Run migration recovery diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p recovery-logs
          failed=0
          started=0

          if [ ! -f supabase/config.toml ]; then
            supabase init 2>&1 | tee recovery-logs/supabase-init.log
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then failed=1; fi
          fi

          supabase db start 2>&1 | tee recovery-logs/supabase-start.log
          if [ "${PIPESTATUS[0]}" -eq 0 ]; then
            started=1
            supabase db lint --local --fail-on error 2>&1 | tee recovery-logs/migration-lint.log
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then failed=1; fi
          else
            failed=1
          fi

          if [ "$started" -eq 1 ]; then
            supabase stop --no-backup 2>&1 | tee recovery-logs/supabase-stop.log
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then failed=1; fi
          fi

          printf 'migration-overall=%s\n' "$failed" | tee recovery-logs/migration-summary.txt
          exit "$failed"

      - name: Upload migration recovery packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-recovery-migration-${{ env.TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery-logs/
          if-no-files-found: warn
          retention-days: 7
