name: Portfolio Commercial Architecture

on:
  push:
    branches: [main]
    paths:
      - 'config/portfolio-commercial-architecture.json'
      - 'docs/COMMERCIAL_PRODUCT_GRADUATION_RULE.md'
      - 'scripts/verify-portfolio-commercial-architecture.mjs'
      - '.github/workflows/portfolio-commercial-architecture.yml'
  pull_request:
    paths:
      - 'config/portfolio-commercial-architecture.json'
      - 'docs/COMMERCIAL_PRODUCT_GRADUATION_RULE.md'
      - 'scripts/verify-portfolio-commercial-architecture.mjs'
      - '.github/workflows/portfolio-commercial-architecture.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify portfolio commercial architecture
        run: node scripts/verify-portfolio-commercial-architecture.mjs
