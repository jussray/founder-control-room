name: FCR Worker Reconcile

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact current main commit approved for Worker reconciliation
        required: true
        type: string
      deployment_approval_id:
        description: Auditable founder approval reference
        required: true
        type: string
      deployment_reason:
        description: Short reason for this Worker reconciliation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fcr-worker-reconcile-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  authority-gate:
    name: Worker Reconcile Authority and Exact-Head Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      DEPLOYMENT_APPROVAL_ID: ${{ inputs.deployment_approval_id }}
      DEPLOYMENT_REASON: ${{ inputs.deployment_reason }}
    steps:
      - name: Checkout exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify production authority and current main
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid exact head::expected_head_sha must be a lowercase 40-character commit SHA."
            exit 1
          fi
          if [[ ! "$DEPLOYMENT_APPROVAL_ID" =~ ^[A-Za-z0-9._:-]{8,200}$ ]]; then
            echo "::error title=Invalid production approval reference::deployment_approval_id must be an auditable 8-200 character reference."
            exit 1
          fi

          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin refs/heads/main:refs/remotes/origin/main
          CURRENT_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"

          echo "Expected approved SHA: $EXPECTED_HEAD_SHA"
          echo "Checked-out SHA:       $ACTUAL_HEAD_SHA"
          echo "Current main SHA:       $CURRENT_MAIN_SHA"
          echo "Approval reference:     $DEPLOYMENT_APPROVAL_ID"

          test "$ACTUAL_HEAD_SHA" = "$EXPECTED_HEAD_SHA"
          test "$CURRENT_MAIN_SHA" = "$EXPECTED_HEAD_SHA"

      - name: Validate Worker-only production configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo '::error title=Missing Worker reconcile credential::Set CLOUDFLARE_API_TOKEN in the GitHub production environment before reconciliation.'
            exit 1
          fi

          python3 - <<'PY'
          import os
          import sys

          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          if not token:
              print('::error title=Missing Worker reconcile credential::CLOUDFLARE_API_TOKEN is empty.')
              sys.exit(1)

          try:
              token.encode('ascii')
          except UnicodeEncodeError:
              print('::error title=Malformed Worker deploy credential::CLOUDFLARE_API_TOKEN contains non-ASCII characters and cannot be used as an HTTP Authorization value. Re-copy the exact Cloudflare-issued token.')
              sys.exit(1)

          if any(ord(char) < 33 or ord(char) > 126 or char.isspace() for char in token):
              print('::error title=Malformed Worker deploy credential::CLOUDFLARE_API_TOKEN contains whitespace or non-printable characters. Re-copy the exact Cloudflare-issued token.')
              sys.exit(1)

          if token.lower().startswith('bearer '):
              print('::error title=Malformed Worker deploy credential::Store only the raw Cloudflare API token, without a Bearer prefix.')
              sys.exit(1)

          if token.startswith('CLOUDFLARE_API_TOKEN='):
              print('::error title=Malformed Worker deploy credential::Store only the raw Cloudflare API token, without a NAME=value wrapper.')
              sys.exit(1)

          if len(token) >= 2 and token[0] == token[-1] and token[0] in {'"', "'"}:
              print('::error title=Malformed Worker deploy credential::Store only the raw Cloudflare API token, without wrapping quotes.')
              sys.exit(1)

          print('Canonical Cloudflare Worker deploy token is header-safe. The token value was not printed.')
          PY

          ACCOUNT_ID="$(sed -nE 's/^account_id[[:space:]]*=[[:space:]]*"([0-9a-f]+)"[[:space:]]*$/\1/p' wrangler.worker.toml | head -n 1)"
          if [[ ! "$ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo '::error title=Invalid Worker account authority::wrangler.worker.toml must declare a 32-character lowercase Cloudflare account_id.'
            exit 1
          fi

          echo "Cloudflare Worker deploy token is present and header-safe."
          echo "Cloudflare account authority is declared in wrangler.worker.toml."

      - name: Record bounded authority receipt
        shell: bash
        run: |
          {
            echo "## Worker reconciliation authority receipt"
            echo
            echo "- Exact approved head: \`$EXPECTED_HEAD_SHA\`"
            echo "- Approval reference: \`$DEPLOYMENT_APPROVAL_ID\`"
            echo "- Reason: ${DEPLOYMENT_REASON:-not supplied}"
            echo "- Mutation scope: Cloudflare Worker \`founder-control-room\` via \`wrangler.worker.toml\`"
            echo "- Credential preflight: canonical deploy token present and HTTP-header-safe; value never printed"
            echo "- Cloudflare account authority: declarative \`wrangler.worker.toml account_id\`"
            echo "- Existing Worker runtime secrets: preserved except \`FOUNDER_SIGNAL_AUTOMATION_GRANT_JSON\`, which this workflow forces disabled"
            echo "- Supabase database mutation: skipped by workflow design"
            echo "- Publication scheduling: absent by workflow design"
          } >> "$GITHUB_STEP_SUMMARY"

  worker-deploy:
    name: Reconcile Canonical Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    needs: authority-gate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Force publication grant disabled on canonical Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FOUNDER_SIGNAL_AUTOMATION_GRANT_JSON: >-
            {"id":"founder-signal-draft-only-v2","enabled":false,"routes":[{"channel":"linkedin","audienceSegment":"build-in-public"},{"channel":"facebook","audienceSegment":"build-in-public"}],"repositories":[],"repositoryScope":{"mode":"all_owned","owner":"jussray"},"approvedRecipientIds":[],"expiresAt":null}
        shell: bash
        run: |
          set -euo pipefail
          grant_file="$(mktemp)"
          trap 'rm -f "$grant_file"' EXIT
          chmod 600 "$grant_file"
          printf '%s' "$FOUNDER_SIGNAL_AUTOMATION_GRANT_JSON" > "$grant_file"
          ./node_modules/.bin/wrangler secret put FOUNDER_SIGNAL_AUTOMATION_GRANT_JSON \
            --config wrangler.worker.toml < "$grant_file"

      - name: Deploy only the canonical Worker configuration
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.110.0'
          command: deploy --config wrangler.worker.toml --var GIT_SHA:${{ inputs.expected_head_sha }}

  runtime-proof:
    name: Prove Canonical API Origin and Exact SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: worker-deploy
    env:
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      API_ORIGIN: https://api.foundercontrolroom.org
    steps:
      - name: Verify health, service identity, and exact deployed SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results

          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT

          health_body=''
          version_body=''
          for attempt in 1 2 3 4 5 6; do
            : > "$headers"
            candidate_health="$(curl --silent --show-error --fail \
              --proto '=https' --proto-redir '=https' --max-redirs 0 \
              --connect-timeout 10 --max-time 20 \
              --dump-header "$headers" \
              "$API_ORIGIN/health" 2>/dev/null || true)"
            candidate_version="$(curl --silent --show-error --fail \
              --proto '=https' --proto-redir '=https' --max-redirs 0 \
              --connect-timeout 10 --max-time 20 \
              "$API_ORIGIN/version" 2>/dev/null || true)"

            if tr -d '\r' < "$headers" | grep -Eiq '^x-founder-control-room-service:[[:space:]]*founder-control-room$' \
              && jq -e '.ok == true' <<<"$candidate_health" >/dev/null 2>&1 \
              && jq -e --arg expected "$EXPECTED_HEAD_SHA" '.service == "founder-control-room" and .gitSha == $expected and .founderSignalAutomationGrant.configured == true and .founderSignalAutomationGrant.enabled == false' <<<"$candidate_version" >/dev/null 2>&1; then
              health_body="$candidate_health"
              version_body="$candidate_version"
              break
            fi
            sleep 10
          done

          if [[ -z "$health_body" || -z "$version_body" ]]; then
            echo '::error title=Worker reconciliation proof failed::api.foundercontrolroom.org did not prove canonical service identity and exact deployed SHA.'
            exit 1
          fi

          jq -n \
            --arg scope "worker_reconcile" \
            --arg api_origin "$API_ORIGIN" \
            --arg expected_sha "$EXPECTED_HEAD_SHA" \
            --arg service "$(jq -r '.service' <<<"$version_body")" \
            --arg live_sha "$(jq -r '.gitSha' <<<"$version_body")" \
            --argjson health "$health_body" \
            '{
              scope: $scope,
              api_origin: $api_origin,
              expected_sha: $expected_sha,
              service: $service,
              live_sha: $live_sha,
              health: $health,
              supabase_db_mutation: false,
              proof_of_ship: false
            }' > test-results/fcr-worker-reconcile.json

          cat test-results/fcr-worker-reconcile.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted reconciliation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcr-worker-reconcile-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/fcr-worker-reconcile.json
          if-no-files-found: warn
          retention-days: 30
