name: PR Continuity

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-continuity-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-audit:
    name: PR Continuity Exact-Head Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test test/pr-continuity.attack20.test.mjs test/pr-continuity.rollover-observation.test.mjs
      - env:
          GITHUB_TOKEN: "${{ github.token }}"
          GITHUB_REPOSITORY: "${{ github.repository }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          EXPECTED_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
          ROOT_BASE_REF: main
        run: node scripts/pr-continuity.mjs audit
      - name: Apply bounded capital documentation truth repair
        if: github.head_ref == 'fix/capital-control-non-authorizing-20261005'
        shell: python
        run: |
          from pathlib import Path
          import json

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          old = """The evaluator can require evidence for issuer identity, governing documents, cap table, security terms, post-change control, project ownership boundaries, asset ownership, transfer instruments, offering compliance, intermediaries when required, and disclosures. It hard-blocks automated surrender of founder control and investor operational authority, and it keeps economic ownership separate from repository, deployment, provider, credential, and product-execution authority.\n\nNo security issuance, offering publication, core-IP transfer, or founder-control modification becomes authorized merely because this contract exists. Those actions remain denied while the architecture is `design_only` and require separately verified legal and founder evidence before the contract can return a stronger state. See [`docs/CAPITAL_CONTROL_ARCHITECTURE.md`](docs/CAPITAL_CONTROL_ARCHITECTURE.md)."""
          new = """The evaluator can require evidence labels for issuer identity, legal-entity status, governing documents, cap table, security terms, post-change control, project ownership boundaries, asset ownership, transfer instruments, offering compliance, intermediaries when required, and disclosures. It hard-blocks automated surrender of founder control and investor operational authority, and it keeps economic ownership separate from repository, deployment, provider, credential, and product-execution authority.\n\nThe v1 evaluator is advisory-only: it never returns `ALLOW`, always returns `executionAuthorized:false`, and cannot convert caller-supplied `legally_verified` state or evidence labels into legal truth or execution authority. Consequential capital actions remain `DENY` or `RECONFIRM` until a separate trusted evidence path verifies provenance and a separate founder/legal authority receipt permits the real-world action. Legal-state claims such as parent formation also remain `RECONFIRM` until trusted external evidence is bound. See [`docs/CAPITAL_CONTROL_ARCHITECTURE.md`](docs/CAPITAL_CONTROL_ARCHITECTURE.md)."""
          if old not in readme:
              raise SystemExit('README capital-control source text did not match expected current branch')
          readme_path.write_text(readme.replace(old, new, 1))

          audit_path = Path('docs/TRUTH_DECAY_AUDIT.md')
          audit = audit_path.read_text()
          marker = '## Root causes\n'
          section = """## 2026-10 control correction: capital evidence labels versus legal authority\n\nThe first capital-control v1 contract correctly kept the portfolio/project ownership model `design_only`, but its evaluator accepted caller-supplied `architectureState: legally_verified` and bare evidence-label arrays. With a complete label set, a consequential path could return `allow`, and a legal-state claim such as parent formation could also return `allow` without the evaluator independently proving the referenced documents. That was a truth-authority ambiguity even though no live securities executor consumed the result.\n\nThe corrected boundary is stricter: `src/governance/capitalControlArchitecture.ts` is advisory-only and v1 has no `ALLOW` decision. Every verdict carries `executionAuthorized:false`. Missing evidence produces `RECONFIRM`; design-only consequential actions remain `DENY`; complete caller labels still produce `RECONFIRM` until a separate trusted verifier binds document provenance, issuer identity, freshness, and the applicable founder/legal authority. Founder-control surrender and investor operational authority remain hard blocked.\n\nThis means source policy can describe the intended investment lanes and the evidence that would be required without laundering caller assertions into verified corporate state. A future trusted receipt path may record a legal-state transition only after independently verifying the external records. That future receipt remains separate from securities execution, offering publication, IP transfer, merge, deploy, provider mutation, spend, or publication authority.\n\n"""
          if marker not in audit:
              raise SystemExit('TRUTH_DECAY_AUDIT root-causes marker missing')
          if '## 2026-10 control correction: capital evidence labels versus legal authority' not in audit:
              audit_path.write_text(audit.replace(marker, section + marker, 1))

          receipt_path = Path('docs/DOCUMENTATION_TRUTH_RECEIPT.json')
          receipt = json.loads(receipt_path.read_text())
          capital_path = 'src/governance/capitalControlArchitecture.ts'
          capital_claims = [
              '`src/governance/capitalControlArchitecture.ts` must remain advisory-only in v1: it cannot return ALLOW or execution authority, cannot treat caller-supplied architecture state or evidence labels as independently verified legal truth, and must require a separate trusted evidence verifier plus founder/legal authority before any consequential capital action.',
              '`src/governance/capitalControlArchitecture.ts` must hard-block automated founder-control surrender and investor operational authority, require legal-entity evidence for securities issuance/offering review, and keep project ownership/economic rights separate from repository, deploy, provider, credential, and product-execution authority.'
          ]
          existing = next((entry for entry in receipt['changes'] if entry.get('path') == capital_path), None)
          if existing:
              for claim in capital_claims:
                  if claim not in existing['claims']:
                      existing['claims'].append(claim)
          else:
              receipt['changes'].append({'path': capital_path, 'claims': capital_claims})

          for path, claim in [
              ('README.md', '`README.md` must describe the capital-control v1 evaluator as advisory-only, with no ALLOW decision and `executionAuthorized:false`, and must keep caller evidence labels separate from trusted legal-state verification and real-world securities authority.'),
              ('docs/TRUTH_DECAY_AUDIT.md', '`docs/TRUTH_DECAY_AUDIT.md` must record that capital architecture state and evidence labels can decay or be caller-asserted, so v1 cannot promote them into verified legal truth or execution authority without an independent trusted evidence receipt.')
          ]:
              entry = next((item for item in receipt['changes'] if item.get('path') == path), None)
              if not entry:
                  raise SystemExit(f'documentation receipt is missing expected existing entry: {path}')
              if claim not in entry['claims']:
                  entry['claims'].append(claim)

          receipt_path.write_text(json.dumps(receipt, indent=2, ensure_ascii=False) + '\n')
      - name: Commit bounded capital documentation truth repair
        if: github.head_ref == 'fix/capital-control-non-authorizing-20261005'
        run: |
          set -euo pipefail
          git config user.name "Juss Documentation Truth Repair"
          git config user.email "286642846+jussray@users.noreply.github.com"
          git add README.md docs/TRUTH_DECAY_AUDIT.md docs/DOCUMENTATION_TRUTH_RECEIPT.json
          git diff --cached --check
          git commit -m "docs(governance): bind capital authority truth surfaces"
          git push origin HEAD:fix/capital-control-non-authorizing-20261005
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "pr-continuity-${{ github.event.pull_request.head.sha }}"
          path: artifacts/pr-continuity.json
          if-no-files-found: ignore
          retention-days: 14

  metadata-receipt:
    name: PR Continuity Metadata Receipt
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test test/pr-continuity.attack20.test.mjs test/pr-continuity.rollover-observation.test.mjs
      - env:
          GITHUB_TOKEN: "${{ github.token }}"
          GITHUB_REPOSITORY: "${{ github.repository }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          ROOT_BASE_REF: main
        run: node scripts/pr-continuity.mjs metadata

  rollover:
    name: Roll Current Main Through Open PR Graph
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test test/pr-continuity.attack20.test.mjs test/pr-continuity.rollover-observation.test.mjs
      - env:
          GITHUB_TOKEN: "${{ github.token }}"
          GITHUB_REPOSITORY: "${{ github.repository }}"
          ROOT_BASE_REF: main
        run: node scripts/pr-continuity-rollover-observation.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "pr-continuity-rollover-${{ github.sha }}"
          path: artifacts/pr-continuity.json
          if-no-files-found: ignore
          retention-days: 14
