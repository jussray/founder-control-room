name: Goalfix Vertical Slice Proof

on:
  pull_request:
    paths:
      - 'src/goalfix/**'
      - 'src/http/routes/goalfix.ts'
      - 'src/http/routes/__tests__/goalfix.integration.test.ts'
      - 'src/http/server.ts'
      - 'src/index.ts'
      - 'public/control-room/goalfix.html'
      - 'public/control-room/goalfix.js'
      - 'public/control-room/index.html'
      - 'e2e/goalfix-proof.mjs'
      - 'package.json'
      - '.github/workflows/goalfix-vertical-slice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goalfix-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  goalfix-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          printf 'Verified exact head: %s\n' "$actual"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Goalfix exact head
        run: npm run typecheck

      - name: Run focused Goalfix contracts
        run: npm run verify:goalfix

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture desktop and mobile Goalfix proof
        run: npm run proof:goalfix

      - name: Upload Goalfix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goalfix-playwright-${{ env.EXPECTED_HEAD_SHA }}
          path: artifacts/goalfix
          if-no-files-found: error
          retention-days: 30