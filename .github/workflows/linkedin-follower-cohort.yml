name: LinkedIn Follower Cohort

on:
  push:
    branches:
      - codex/provider-neutral-founder-content-contracts
    paths:
      - scripts/linkedin_follower_cohort.py
      - scripts/test_linkedin_follower_cohort.py
      - docs/founder-signal-engine/linkedin-follower-cohorts.md
      - .github/workflows/linkedin-follower-cohort.yml
  pull_request:
    paths:
      - scripts/linkedin_follower_cohort.py
      - scripts/test_linkedin_follower_cohort.py
      - docs/founder-signal-engine/linkedin-follower-cohorts.md
      - .github/workflows/linkedin-follower-cohort.yml
  repository_dispatch:
    types:
      - linkedin-follower-snapshot-ready

permissions:
  contents: read
  actions: read

jobs:
  contract-test:
    name: follower cohort contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify deterministic cohort engine
        run: python3 -m unittest scripts/test_linkedin_follower_cohort.py

  reconcile-private-snapshot:
    name: reconcile authorized private snapshot
    if: github.event_name == 'repository_dispatch'
    needs: contract-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download private follower snapshot
        shell: bash
        env:
          SNAPSHOT_URL: ${{ secrets.LINKEDIN_FOLLOWER_SNAPSHOT_URL }}
          SNAPSHOT_TOKEN: ${{ secrets.LINKEDIN_FOLLOWER_SNAPSHOT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SNAPSHOT_URL:-}" ]]; then
            echo "BLOCKED_SOURCE: LINKEDIN_FOLLOWER_SNAPSHOT_URL is not configured." >&2
            exit 1
          fi
          if [[ -z "${SNAPSHOT_TOKEN:-}" ]]; then
            echo "BLOCKED_SOURCE_AUTH: LINKEDIN_FOLLOWER_SNAPSHOT_TOKEN is required for authenticated source access." >&2
            exit 1
          fi
          echo "::add-mask::${SNAPSHOT_URL}"
          echo "::add-mask::${SNAPSHOT_TOKEN}"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${SNAPSHOT_TOKEN}" \
            "${SNAPSHOT_URL}" \
            --output follower-snapshot.json

      - name: Recover latest redacted cohort receipt
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=linkedin-follower-cohort-latest&per_page=100" \
              --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty'
          )"

          if [[ -z "${artifact_id}" ]]; then
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mkdir -p previous-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > previous.zip
          unzip -q previous.zip -d previous-artifact
          if [[ ! -f previous-artifact/follower-cohort-receipt.json ]]; then
            echo "BLOCKED_PREDECESSOR_ARTIFACT: latest cohort artifact does not contain follower-cohort-receipt.json." >&2
            exit 1
          fi
          cp previous-artifact/follower-cohort-receipt.json previous-follower-cohort-receipt.json
          echo "found=true" >> "${GITHUB_OUTPUT}"

      - name: Reconcile cohort
        shell: bash
        env:
          LINKEDIN_FOLLOWER_ID_HMAC_KEY: ${{ secrets.LINKEDIN_FOLLOWER_ID_HMAC_KEY }}
          LINKEDIN_FOLLOWER_ID_HMAC_EPOCH: ${{ vars.LINKEDIN_FOLLOWER_ID_HMAC_EPOCH }}
          PREVIOUS_FOUND: ${{ steps.previous.outputs.found }}
        run: |
          set -euo pipefail
          if [[ -z "${LINKEDIN_FOLLOWER_ID_HMAC_KEY:-}" ]]; then
            echo "BLOCKED_PRIVACY_KEY: LINKEDIN_FOLLOWER_ID_HMAC_KEY is required." >&2
            exit 1
          fi
          if (( ${#LINKEDIN_FOLLOWER_ID_HMAC_KEY} < 32 )); then
            echo "BLOCKED_PRIVACY_KEY: LINKEDIN_FOLLOWER_ID_HMAC_KEY must contain at least 32 characters." >&2
            exit 1
          fi
          if [[ -z "${LINKEDIN_FOLLOWER_ID_HMAC_EPOCH:-}" ]]; then
            echo "BLOCKED_PRIVACY_EPOCH: LINKEDIN_FOLLOWER_ID_HMAC_EPOCH is required." >&2
            exit 1
          fi
          echo "::add-mask::${LINKEDIN_FOLLOWER_ID_HMAC_KEY}"
          if [[ "${PREVIOUS_FOUND:-}" == "true" ]]; then
            python3 scripts/linkedin_follower_cohort.py \
              follower-snapshot.json \
              --previous-receipt previous-follower-cohort-receipt.json \
              --output follower-cohort-receipt.json
          else
            python3 scripts/linkedin_follower_cohort.py \
              follower-snapshot.json \
              --output follower-cohort-receipt.json
          fi

      - name: Ensure redacted privacy invariants
        shell: bash
        env:
          EXPECTED_IDENTITY_KEY_EPOCH: ${{ vars.LINKEDIN_FOLLOWER_ID_HMAC_EPOCH }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path('follower-cohort-receipt.json').read_text())
          privacy = receipt.get('privacy', {})
          if privacy.get('raw_identity_persisted') is not False:
              raise SystemExit('redacted receipt privacy invariant failed')
          if privacy.get('public_receipt_contains_names') is not False:
              raise SystemExit('redacted receipt names invariant failed')
          if privacy.get('public_receipt_contains_profile_urls') is not False:
              raise SystemExit('redacted receipt profile URL invariant failed')
          if privacy.get('private_key_persisted') is not False:
              raise SystemExit('redacted receipt private-key invariant failed')
          if privacy.get('member_identity_scheme') != 'HMAC-SHA256/private-runtime-key/v1':
              raise SystemExit('redacted receipt keyed-identity invariant failed')
          if privacy.get('identity_key_epoch') != os.environ.get('EXPECTED_IDENTITY_KEY_EPOCH'):
              raise SystemExit('redacted receipt identity-key epoch invariant failed')
          if privacy.get('redacted_metadata_policy') != 'ALLOWLISTED_ENUMS_ONLY':
              raise SystemExit('redacted receipt enum-redaction invariant failed')
          print(json.dumps(receipt.get('summary', {}), sort_keys=True))
          PY

      - name: Upload redacted cohort receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linkedin-follower-cohort-latest
          path: follower-cohort-receipt.json
          if-no-files-found: error
          retention-days: 90
