name: Capability Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.control/**'
      - 'schemas/capability-contract.v1.schema.json'
      - 'scripts/verify-capability-contract.mjs'
      - 'scripts/verify-direct-browser-contract.mjs'
      - 'src/capabilities/**'
      - 'src/lib/pluginCenter.ts'
      - 'src/http/routes/capabilities.ts'
      - 'src/http/routes/pluginCenter.ts'
      - 'src/http/routes/__tests__/pluginCenter.integration.test.ts'
      - 'src/http/routes/__tests__/pluginCenterRevocation.integration.test.ts'
      - 'src/http/routes/__tests__/tinyFishObservation.integration.test.ts'
      - 'src/http/routes/__tests__/ultrathinkSharedReasoning.integration.test.ts'
      - 'public/control-room/plugin-center.html'
      - 'public/assets/plugins/ultrathink.svg'
      - 'e2e/plugin-center-ultrathink-proof.mjs'
      - 'e2e/ultrathink-shared-runtime-proof.mjs'
      - 'package.json'
      - '.github/workflows/capability-contract.yml'
  push:
    branches: [main]
    paths:
      - '.control/**'
      - 'schemas/capability-contract.v1.schema.json'
      - 'scripts/verify-capability-contract.mjs'
      - 'scripts/verify-direct-browser-contract.mjs'
      - 'src/capabilities/**'
      - 'src/lib/pluginCenter.ts'
      - 'src/http/routes/capabilities.ts'
      - 'src/http/routes/pluginCenter.ts'
      - 'src/http/routes/__tests__/pluginCenter.integration.test.ts'
      - 'src/http/routes/__tests__/pluginCenterRevocation.integration.test.ts'
      - 'src/http/routes/__tests__/tinyFishObservation.integration.test.ts'
      - 'src/http/routes/__tests__/ultrathinkSharedReasoning.integration.test.ts'
      - 'public/control-room/plugin-center.html'
      - 'public/assets/plugins/ultrathink.svg'
      - 'e2e/plugin-center-ultrathink-proof.mjs'
      - 'e2e/ultrathink-shared-runtime-proof.mjs'
      - 'package.json'
      - '.github/workflows/capability-contract.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:capability-contract
      - run: >-
          npx vitest run
          src/capabilities/__tests__/score.test.ts
          src/capabilities/__tests__/workbenchRegistry.test.ts
          src/capabilities/__tests__/bubbleLabShadow.test.ts
          src/capabilities/__tests__/tinyFishWebObservation.test.ts
          src/capabilities/__tests__/sharedCapabilityRuntime.test.ts
          src/capabilities/__tests__/ultrathinkSharedReasoning.test.ts
          src/http/routes/__tests__/pluginCenter.integration.test.ts
          src/http/routes/__tests__/pluginCenterRevocation.integration.test.ts
          src/http/routes/__tests__/tinyFishObservation.integration.test.ts
          src/http/routes/__tests__/ultrathinkSharedReasoning.integration.test.ts
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capability Workbench Playwright
        run: FCR_E2E_SCENARIO=capability-workbench node e2e/direct-browser-run.mjs
      - name: Plugin Center Playwright
        run: node e2e/plugin-center-ultrathink-proof.mjs
      - name: ULTRATHINK Shared Runtime Playwright
        run: node e2e/ultrathink-shared-runtime-proof.mjs
      - name: Upload capability browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-workbench-mobile-${{ github.sha }}
          path: test-results/capabilities-workbench-mobile.png
          if-no-files-found: ignore
      - name: Upload Plugin Center browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-center-${{ github.sha }}
          path: test-results/plugin-center-ultrathink-*.png
          if-no-files-found: error
      - name: Upload ULTRATHINK shared runtime proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultrathink-shared-runtime-${{ github.sha }}
          path: |
            test-results/ultrathink-shared-runtime-receipt.json
            test-results/ultrathink-shared-runtime-mobile.png
          if-no-files-found: error
