name: Repair reservation PostgreSQL proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/sql/repository-repair-reservation.sql'
      - 'scripts/test_repository_repair_reservation.py'
      - '.github/workflows/repair-reservation-postgres.yml'
      - 'supabase/migrations/20260715225222_enforce_free_first_repair_missions.sql'
      - 'supabase/migrations/20260715230035_scope_repair_mission_policy_trigger.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reservation:
    name: Isolated PostgreSQL reservation and contention
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm candidate and initialize local database
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          sudo systemctl start postgresql
          sudo -n -u postgres createdb -h /var/run/postgresql -p 5432 fcr_repair_reservation_ci
      - name: Run synthetic transaction and concurrency tests
        run: python3 scripts/test_repository_repair_reservation.py --disposable-ci-db
