name: n8n Conveyor Live Probe

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current Founder Control Room main SHA to probe
        required: true
        type: string
      capability_plan_json:
        description: Exact juss-v10/capability-plan@v1 JSON supplied from the Chief AI boundary
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: n8n-conveyor-live-probe-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      N8N_CONVEYOR_PROBE_HEAD_SHA: ${{ inputs.target_sha }}
      N8N_CONVEYOR_CAPABILITY_PLAN_JSON: ${{ inputs.capability_plan_json }}
    steps:
      - name: Check out protected default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify immutable current-main target and probe inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.repository.default_branch }}" = "main"
          [[ "${N8N_CONVEYOR_PROBE_HEAD_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${N8N_CONVEYOR_PROBE_HEAD_SHA}"
          test -n "${N8N_CONVEYOR_CAPABILITY_PLAN_JSON}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked trusted dependencies
        run: npm ci

      - name: Run bounded live receipt probe
        env:
          N8N_CONVEYOR_WEBHOOK_URL: ${{ secrets.N8N_CONVEYOR_WEBHOOK_URL }}
          N8N_CONVEYOR_BEARER_TOKEN: ${{ secrets.N8N_CONVEYOR_BEARER_TOKEN }}
          SUPABASE_URL: https://oojzfmmywbvficgybaxd.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FCR_V10_RECEIPT_PERSISTENCE_REQUIRED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${N8N_CONVEYOR_WEBHOOK_URL}"
          test -n "${N8N_CONVEYOR_BEARER_TOKEN}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY}"
          test "${FCR_V10_RECEIPT_PERSISTENCE_REQUIRED}" = "true"
          npx tsx scripts/verify-n8n-conveyor-live.ts | tee n8n-live-probe-receipt.json

      - name: Upload retained receipt
        uses: actions/upload-artifact@v4
        with:
          name: n8n-live-probe-${{ inputs.target_sha }}
          path: n8n-live-probe-receipt.json
          if-no-files-found: error
