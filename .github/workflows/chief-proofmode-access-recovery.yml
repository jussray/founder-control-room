name: Chief ProofMode Access Recovery

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: 'Exact current FCR main SHA approved to control the Chief Access repair'
        required: true
        type: string
      mode:
        description: 'Inspect or repair only the exact immutable Chief preview Service Auth policy'
        required: true
        default: check
        type: choice
        options:
          - check
          - repair
      target_url:
        description: 'Exact immutable Chief workers.dev preview origin'
        required: true
        type: string
      approval_reference:
        description: 'Auditable founder approval reference; required for repair'
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: chief-proofmode-access-recovery-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
  CHIEF_ACCESS_MODE: ${{ inputs.mode }}
  CHIEF_ACCESS_TARGET_URL: ${{ inputs.target_url }}
  CLOUDFLARE_ACCOUNT_ID: '9b59861bd1747cf7525571b4c51d2aa0'
  CHIEF_ACCESS_APP_NAME: 'chief-ai - Cloudflare Workers'

jobs:
  recover:
    name: Verify or repair exact Chief ProofMode Service Auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out exact approved FCR current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact FCR main, target, and founder mutation approval
        env:
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error title=Invalid exact head::expected_head_sha must be a lowercase 40-character SHA.'
            exit 1
          fi
          if [[ "$CHIEF_ACCESS_MODE" != 'check' && "$CHIEF_ACCESS_MODE" != 'repair' ]]; then
            echo '::error title=Invalid mode::mode must be check or repair.'
            exit 1
          fi

          actual="$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          test "$current_main" = "$EXPECTED_HEAD_SHA"

          target_origin="$(node -e '
            const raw = process.argv[1];
            try {
              const url = new URL(raw);
              if (
                url.protocol !== "https:"
                || url.username
                || url.password
                || url.search
                || url.hash
                || (url.pathname !== "/" && url.pathname !== "")
                || !/^[0-9a-f]{8}-chief-ai\.mcgill-raylene\.workers\.dev$/i.test(url.hostname)
              ) process.exit(1);
              process.stdout.write(url.origin);
            } catch { process.exit(1); }
          ' "$CHIEF_ACCESS_TARGET_URL")" || {
            echo '::error title=Invalid Chief target::target_url must be one immutable Chief workers.dev preview origin.'
            exit 1
          }
          printf 'CHIEF_ACCESS_TARGET_URL=%s\n' "$target_origin" >> "$GITHUB_ENV"

          approval_reference_receipt='not-required-for-read-only'
          if [[ "$CHIEF_ACCESS_MODE" == 'repair' ]]; then
            if [[ ! "$APPROVAL_REFERENCE" =~ ^[A-Za-z0-9._:-]{8,200}$ ]]; then
              echo '::error title=Missing mutation approval::repair requires an auditable 8-200 character approval_reference.'
              exit 1
            fi
            approval_reference_receipt="sha256:$(printf '%s' "$APPROVAL_REFERENCE" | sha256sum | awk '{print $1}')"
          elif [[ -n "${APPROVAL_REFERENCE:-}" ]]; then
            echo '::error title=Unexpected approval::check must not carry approval_reference.'
            exit 1
          fi
          printf 'APPROVAL_REFERENCE_RECEIPT=%s\n' "$approval_reference_receipt" >> "$GITHUB_ENV"

          {
            echo '## Chief ProofMode Access authority gate'
            echo
            echo "- Exact FCR current main: \`$EXPECTED_HEAD_SHA\`"
            echo "- Mode: \`$CHIEF_ACCESS_MODE\`"
            echo "- Target: \`$target_origin\`"
            echo "- Approval reference receipt: \`$approval_reference_receipt\`"
            echo '- Allowed mutation: create one specific non_identity Service Auth policy on one exact immutable Chief preview host'
            echo '- Wildcard/public multi-destination/worker/preview_worker mutation: blocked'
            echo '- Existing conflicting named policy overwrite: blocked'
            echo '- DNS, Worker route, deployment, database, secret, and application mutation: none'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse unresolved prior Chief Access repair
        id: reconcile_gate
        if: inputs.mode == 'repair'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/485/comments?per_page=100" \
            | node scripts/chief-proofmode-access-reconciliation-state.mjs "$CHIEF_ACCESS_TARGET_URL" >/dev/null; then
            echo '::error title=Chief Access reconciliation required::trusted subject-bound reconciliation remains unresolved for this exact target; a matching provider subject must clear the latch before another repair can execute.'
            exit 1
          fi

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prove Chief Access bounded-repair contracts
        run: |
          node --check scripts/reconcile-chief-proofmode-access.mjs
          node --check scripts/resolve-chief-proofmode-access-selector.mjs
          node --check scripts/chief-proofmode-access-reconciliation-state.mjs
          node --test scripts/reconcile-chief-proofmode-access.node-test.mjs
          node --test scripts/reconcile-chief-proofmode-access-subject.node-test.mjs
          node --test scripts/resolve-chief-proofmode-access-selector.node-test.mjs
          node --test scripts/chief-proofmode-access-reconciliation-state.node-test.mjs
          node --test scripts/chief-proofmode-access-bridge-contract.node-test.mjs
          node --test scripts/fcr-cloudflare-bridge-contract.node-test.mjs

      - name: Resolve canonical Chief service-token identity
        id: selector
        env:
          CHIEF_ACCESS_CLIENT_ID_SECRET: ${{ secrets.CHIEF_CLOUDFLARE_ACCESS_CLIENT_ID }}
          CHIEF_ACCESS_CLIENT_ID_VARIABLE: ${{ vars.CHIEF_CLOUDFLARE_ACCESS_CLIENT_ID }}
          GENERIC_ACCESS_CLIENT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          GENERIC_ACCESS_CLIENT_ID_VARIABLE: ${{ vars.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CHIEF_ACCESS_SERVICE_TOKEN_ID_VARIABLE: ${{ vars.CHIEF_CLOUDFLARE_ACCESS_SERVICE_TOKEN_ID }}
          GENERIC_ACCESS_SERVICE_TOKEN_ID_VARIABLE: ${{ vars.CLOUDFLARE_ACCESS_SERVICE_TOKEN_ID }}
          CHIEF_SELECTOR_REQUIRE_IDENTITY: ${{ inputs.mode == 'repair' && 'true' || 'false' }}
        run: node scripts/resolve-chief-proofmode-access-selector.mjs

      - name: Persist repair-in-progress reconciliation latch
        if: inputs.mode == 'repair' && steps.selector.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RETURN_ISSUE: '485'
        shell: bash
        run: |
          set -euo pipefail
          latch='test-results/chief-proofmode-access-reconciliation-latch.md'
          mkdir -p test-results
          {
            echo "<!-- chief-proofmode-access-reconciliation:v2 target=$CHIEF_ACCESS_TARGET_URL disposition=REPAIR_IN_PROGRESS subject=pending head=$EXPECTED_HEAD_SHA run=$GITHUB_RUN_ID -->"
            echo
            echo '## Chief ProofMode Access reconciliation latch'
            echo
            echo '- Disposition: `REPAIR_IN_PROGRESS`'
            echo '- Provider subject: `pending provider readback`'
            echo "- Exact FCR authority head: \`$EXPECTED_HEAD_SHA\`"
            echo "- Chief target: \`$CHIEF_ACCESS_TARGET_URL\`"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo '- A later repair is blocked until this same run terminates safely or exact provider-subject evidence clears every unresolved subject.'
          } > "$latch"
          gh issue comment "$RETURN_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$latch"

      - name: Inspect current Chief Service Auth with dedicated read authority
        if: inputs.mode == 'check'
        env:
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
        run: node scripts/reconcile-chief-proofmode-access.mjs >/dev/null 2>&1

      - name: Apply exact-host Chief Service Auth with dedicated admin authority
        id: apply
        if: inputs.mode == 'repair'
        env:
          CLOUDFLARE_ACCESS_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_ADMIN_API_TOKEN }}
        shell: bash
        run: |
          set +e
          node scripts/reconcile-chief-proofmode-access.mjs >/dev/null 2>&1
          status=$?
          set -e
          if [[ -f test-results/chief-proofmode-access-recovery.json ]]; then
            cp test-results/chief-proofmode-access-recovery.json test-results/chief-proofmode-access-mutation.json
          fi
          exit "$status"

      - name: Re-read repaired policy with provider authority
        id: reread
        if: ${{ always() && inputs.mode == 'repair' && steps.selector.outcome == 'success' }}
        env:
          CHIEF_ACCESS_MODE: check
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_ADMIN_API_TOKEN }}
        run: node scripts/reconcile-chief-proofmode-access.mjs >/dev/null 2>&1

      - name: Return sanitized Chief Access receipt to founder control issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RETURN_ISSUE: '485'
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RECONCILIATION_GATE_OUTCOME: ${{ steps.reconcile_gate.outcome }}
          SELECTOR_OUTCOME: ${{ steps.selector.outcome }}
          SELECTOR_CLIENT_SOURCE: ${{ steps.selector.outputs.client_id_source }}
          SELECTOR_TOKEN_SOURCE: ${{ steps.selector.outputs.service_token_id_source }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          REREAD_OUTCOME: ${{ steps.reread.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          current_receipt='test-results/chief-proofmode-access-recovery.json'
          mutation_receipt='test-results/chief-proofmode-access-mutation.json'
          public_receipt='test-results/chief-proofmode-access-public-receipt.md'
          mkdir -p test-results

          safe_head='UNKNOWN'
          if [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then safe_head="$EXPECTED_HEAD_SHA"; fi
          safe_target='UNKNOWN'
          if [[ "$CHIEF_ACCESS_TARGET_URL" =~ ^https://[0-9a-fA-F]{8}-chief-ai\.mcgill-raylene\.workers\.dev$ ]]; then
            safe_target="$CHIEF_ACCESS_TARGET_URL"
          fi
          safe_approval='unavailable'
          if [[ "${APPROVAL_REFERENCE_RECEIPT:-}" == 'not-required-for-read-only' || "${APPROVAL_REFERENCE_RECEIPT:-}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            safe_approval="$APPROVAL_REFERENCE_RECEIPT"
          fi

          validate_receipt() {
            local path="$1"
            jq -e -s --arg target "$safe_target" '
              def iso8601: type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$");
              def allowed_scope: . == "public_exact_host" or . == "public_path_or_multi_destination" or . == "preview_worker" or . == "worker";
              def allowed_reason: . == "service-token-binding-missing"
                or . == "service-token-binding-ambiguous"
                or . == "service-auth-policy-missing"
                or . == "service-auth-policy-conflict"
                or . == "access-application-ambiguous-or-unresolved"
                or . == "service-token-invalid-or-ambiguous"
                or . == "access-scope-not-repair-eligible"
                or . == "provider-read-credential-missing"
                or . == "provider-read-failed"
                or . == "provider-write-outcome-unknown"
                or . == "provider-write-verification-failed"
                or . == "bounded-check-failed";
              def allowed_mutation_outcome: . == "none" or . == "performed" or . == "unknown";
              def allowed_subject: . == null or (type == "string" and test("^sha256:[0-9a-f]{64}$"));
              length == 1 and (.[0]
                | type == "object"
                and .schemaVersion == 2
                and .scope == "chief-proofmode-access-recovery"
                and (.observedAt | iso8601)
                and (.mode == "check" or .mode == "repair")
                and (.state == "configured" or .state == "blocked")
                and (.mutationOutcome | allowed_mutation_outcome)
                and (
                  if .mutationOutcome == "none" then .mutationPerformed == false
                  elif .mutationOutcome == "performed" then .mutationPerformed == true
                  else .mutationPerformed == null
                  end
                )
                and .targetOrigin == $target
                and (.subjectFingerprint | allowed_subject)
                and (
                  if .state == "configured" then
                    .mutationOutcome != "unknown"
                    and (.accessScope | allowed_scope)
                    and (.applicationId | type == "string" and length > 0 and length <= 200)
                    and (.policyId == null or (.policyId | type == "string" and length <= 200))
                    and (.serviceTokenId | type == "string" and length > 0 and length <= 200)
                    and (.subjectFingerprint | type == "string" and test("^sha256:[0-9a-f]{64}$"))
                    and (.reasonCode == null)
                  else
                    (.reasonCode | allowed_reason)
                    and (.accessScope == null)
                    and (.applicationId == null)
                    and (.policyId == null)
                    and (.serviceTokenId == null)
                  end
                )
              )
            ' "$path" >/dev/null 2>&1
          }

          current_receipt_valid=false
          current_state=''
          current_subject=''
          if [[ "$safe_target" != 'UNKNOWN' && -f "$current_receipt" ]] && validate_receipt "$current_receipt"; then
            current_receipt_valid=true
            current_state="$(jq -r '.state' "$current_receipt")"
            current_subject="$(jq -r '.subjectFingerprint // ""' "$current_receipt")"
          fi

          mutation_receipt_valid=false
          mutation_outcome=''
          mutation_subject=''
          if [[ "$safe_target" != 'UNKNOWN' && -f "$mutation_receipt" ]] && validate_receipt "$mutation_receipt"; then
            mutation_receipt_valid=true
            mutation_outcome="$(jq -r '.mutationOutcome' "$mutation_receipt")"
            mutation_subject="$(jq -r '.subjectFingerprint // ""' "$mutation_receipt")"
          fi

          reconciliation_disposition=''
          reconciliation_subject=''
          if [[ "$safe_target" != 'UNKNOWN' && "$safe_head" != 'UNKNOWN' ]]; then
            if [[ "$CHIEF_ACCESS_MODE" == 'repair' ]]; then
              if [[ "$RECONCILIATION_GATE_OUTCOME" == 'success' ]]; then
                if [[ "$REREAD_OUTCOME" == 'success' && "$current_receipt_valid" == 'true' && "$current_state" == 'configured' && "$current_subject" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  reconciliation_disposition='CLEAR'
                  reconciliation_subject="$current_subject"
                elif [[ "$mutation_receipt_valid" == 'true' && "$mutation_outcome" == 'none' ]]; then
                  reconciliation_disposition='CLEAR'
                  reconciliation_subject='pending'
                else
                  reconciliation_disposition='RECONCILE_REQUIRED'
                  if [[ "$mutation_subject" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                    reconciliation_subject="$mutation_subject"
                  elif [[ "$current_subject" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                    reconciliation_subject="$current_subject"
                  else
                    reconciliation_subject='pending'
                  fi
                fi
              fi
            elif [[ "$current_receipt_valid" == 'true' && "$current_state" == 'configured' && "$current_subject" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              reconciliation_disposition='CLEAR'
              reconciliation_subject="$current_subject"
            fi
          fi

          {
            if [[ -n "$reconciliation_disposition" && -n "$reconciliation_subject" ]]; then
              echo "<!-- chief-proofmode-access-reconciliation:v2 target=$safe_target disposition=$reconciliation_disposition subject=$reconciliation_subject head=$safe_head run=$GITHUB_RUN_ID -->"
              echo
            fi
            echo '## Chief ProofMode Cloudflare Access receipt'
            echo
            echo "- Exact FCR authority head: \`$safe_head\`"
            echo "- Chief target: \`$safe_target\`"
            echo "- Requested mode: \`$CHIEF_ACCESS_MODE\`"
            echo "- Founder approval receipt: \`$safe_approval\`"
            echo "- Workflow run: $WORKFLOW_RUN_URL"
            echo "- Job status: \`$JOB_STATUS\`"
            echo "- Client selector source class: \`${SELECTOR_CLIENT_SOURCE:-unresolved}\`"
            echo "- Service-token selector source class: \`${SELECTOR_TOKEN_SOURCE:-unresolved}\`"
            if [[ -n "$reconciliation_disposition" ]]; then
              echo "- Reconciliation disposition: \`$reconciliation_disposition\`"
              echo "- Reconciliation subject: \`$reconciliation_subject\`"
            fi

            if [[ "$current_receipt_valid" != 'true' ]]; then
              echo '- Current provider receipt: `missing-or-malformed`'
              echo '- Current provider truth: `UNKNOWN`'
            else
              echo '- Current provider receipt: `present`'
              if [[ "$current_state" == 'blocked' ]]; then
                echo '- Current provider truth: `BLOCKED`'
              else
                echo '- Current provider truth: `CONFIGURED`'
              fi
              echo
              echo '```json'
              jq -s '.[0] | if .state == "blocked" then {schemaVersion, scope, observedAt, mode, state, mutationOutcome, mutationPerformed, targetOrigin, reasonCode, subjectFingerprint} else {schemaVersion, scope, observedAt, mode, state, mutationOutcome, mutationPerformed, targetOrigin, accessScope, policyId, subjectFingerprint} end' "$current_receipt"
              echo '```'
            fi

            if [[ "$CHIEF_ACCESS_MODE" == 'repair' ]]; then
              if [[ "$mutation_receipt_valid" != 'true' ]]; then
                echo '- Mutation receipt: `missing-or-malformed`'
              else
                echo '- Mutation receipt: `present`'
                echo
                echo '```json'
                jq -s '.[0] | if .state == "blocked" then {schemaVersion, scope, observedAt, mode, state, mutationOutcome, mutationPerformed, targetOrigin, reasonCode, subjectFingerprint} else {schemaVersion, scope, observedAt, mode, state, mutationOutcome, mutationPerformed, targetOrigin, accessScope, policyId, subjectFingerprint} end' "$mutation_receipt"
                echo '```'
              fi
            fi

            if [[ "$reconciliation_disposition" == 'RECONCILE_REQUIRED' ]]; then
              echo '- Retry authority: `BLOCKED`; read-only provider evidence must clear the same unresolved provider subject. A configured result for another app/token identity cannot clear this latch.'
            fi
            echo '- Browser/runtime proof: `NOT CLAIMED HERE`; rerun Chief exact-head Playwright after provider repair.'
          } > "$public_receipt"

          gh issue comment "$RETURN_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$public_receipt"
          cat "$public_receipt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized Chief Access evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chief-proofmode-access-public-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/chief-proofmode-access-public-receipt.md
          if-no-files-found: ignore
          retention-days: 30
