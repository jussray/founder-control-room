name: LinkedIn Post Analytics

on:
  push:
    branches:
      - codex/provider-neutral-founder-content-contracts
    paths:
      - scripts/linkedin_analytics_continuity.py
      - scripts/test_linkedin_analytics_continuity.py
      - scripts/linkedin_post_performance.py
      - scripts/test_linkedin_post_performance.py
      - docs/founder-signal-engine/linkedin-analytics-continuity.md
      - .github/workflows/linkedin-post-analytics.yml
  pull_request:
    paths:
      - scripts/linkedin_analytics_continuity.py
      - scripts/test_linkedin_analytics_continuity.py
      - scripts/linkedin_post_performance.py
      - scripts/test_linkedin_post_performance.py
      - docs/founder-signal-engine/linkedin-analytics-continuity.md
      - .github/workflows/linkedin-post-analytics.yml
  repository_dispatch:
    types:
      - linkedin-analytics-snapshot-ready

permissions:
  contents: read
  actions: read

jobs:
  contract-test:
    name: post analytics contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify deterministic continuity and performance engines
        run: |
          python3 -m unittest scripts/test_linkedin_analytics_continuity.py
          python3 -m unittest scripts/test_linkedin_post_performance.py

  reconcile-private-analytics:
    name: reconcile authorized private LinkedIn analytics
    if: github.event_name == 'repository_dispatch'
    needs: contract-test
    runs-on: ubuntu-latest
    env:
      WINDOW_START: ${{ github.event.client_payload.start }}
      WINDOW_END: ${{ github.event.client_payload.end }}
      WINDOW_ROLE: ${{ github.event.client_payload.window_role }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download private LinkedIn XLSX
        shell: bash
        env:
          ANALYTICS_URL: ${{ secrets.LINKEDIN_ANALYTICS_SNAPSHOT_URL }}
          ANALYTICS_TOKEN: ${{ secrets.LINKEDIN_ANALYTICS_SNAPSHOT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${ANALYTICS_URL:-}" ]]; then
            echo "BLOCKED_SOURCE: LINKEDIN_ANALYTICS_SNAPSHOT_URL is not configured." >&2
            exit 1
          fi
          if [[ ! "${WINDOW_START:-}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "BLOCKED_SOURCE: dispatch payload must provide start=YYYY-MM-DD." >&2
            exit 1
          fi
          if [[ ! "${WINDOW_END:-}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "BLOCKED_SOURCE: dispatch payload must provide end=YYYY-MM-DD." >&2
            exit 1
          fi
          if [[ "${WINDOW_ROLE:-}" != "historical_365" && "${WINDOW_ROLE:-}" != "recent_90" ]]; then
            echo "BLOCKED_SOURCE: window_role must be historical_365 or recent_90." >&2
            exit 1
          fi
          echo "ARTIFACT_NAME=linkedin-post-analytics-${WINDOW_ROLE}" >> "${GITHUB_ENV}"
          echo "::add-mask::${ANALYTICS_URL}"
          if [[ -n "${ANALYTICS_TOKEN:-}" ]]; then
            echo "::add-mask::${ANALYTICS_TOKEN}"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${ANALYTICS_TOKEN}" \
              "${ANALYTICS_URL}" \
              --output linkedin-analytics.xlsx
          else
            curl --fail --silent --show-error --location \
              "${ANALYTICS_URL}" \
              --output linkedin-analytics.xlsx
          fi

      - name: Recover latest same-window redacted receipt
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
              --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty'
          )"

          if [[ -z "${artifact_id}" ]]; then
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mkdir -p previous-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > previous.zip
          unzip -q previous.zip -d previous-artifact
          if [[ ! -f previous-artifact/linkedin-post-analytics-receipt.json ]]; then
            echo "BLOCKED_PREDECESSOR_ARTIFACT: latest analytics artifact does not contain linkedin-post-analytics-receipt.json." >&2
            exit 1
          fi
          cp previous-artifact/linkedin-post-analytics-receipt.json previous-linkedin-post-analytics-receipt.json
          echo "found=true" >> "${GITHUB_OUTPUT}"

      - name: Normalize and reconcile post continuity
        shell: bash
        env:
          LINKEDIN_POST_ID_HMAC_KEY: ${{ secrets.LINKEDIN_POST_ID_HMAC_KEY }}
          LINKEDIN_POST_ID_HMAC_EPOCH: ${{ vars.LINKEDIN_POST_ID_HMAC_EPOCH }}
          PREVIOUS_FOUND: ${{ steps.previous.outputs.found }}
        run: |
          set -euo pipefail
          if [[ -z "${LINKEDIN_POST_ID_HMAC_KEY:-}" ]]; then
            echo "BLOCKED_PRIVACY_KEY: LINKEDIN_POST_ID_HMAC_KEY is required." >&2
            exit 1
          fi
          if (( ${#LINKEDIN_POST_ID_HMAC_KEY} < 32 )); then
            echo "BLOCKED_PRIVACY_KEY: LINKEDIN_POST_ID_HMAC_KEY must contain at least 32 characters." >&2
            exit 1
          fi
          if [[ -z "${LINKEDIN_POST_ID_HMAC_EPOCH:-}" ]]; then
            echo "BLOCKED_PRIVACY_EPOCH: LINKEDIN_POST_ID_HMAC_EPOCH is required." >&2
            exit 1
          fi
          echo "::add-mask::${LINKEDIN_POST_ID_HMAC_KEY}"
          if [[ "${PREVIOUS_FOUND:-}" == "true" ]]; then
            python3 scripts/linkedin_analytics_continuity.py \
              linkedin-analytics.xlsx \
              --start "${WINDOW_START}" \
              --end "${WINDOW_END}" \
              --previous-json previous-linkedin-post-analytics-receipt.json \
              --output linkedin-post-analytics-private.json
          else
            python3 scripts/linkedin_analytics_continuity.py \
              linkedin-analytics.xlsx \
              --start "${WINDOW_START}" \
              --end "${WINDOW_END}" \
              --output linkedin-post-analytics-private.json
          fi

      - name: Derive ranked post performance
        shell: bash
        env:
          LINKEDIN_POST_ID_HMAC_KEY: ${{ secrets.LINKEDIN_POST_ID_HMAC_KEY }}
          LINKEDIN_POST_ID_HMAC_EPOCH: ${{ vars.LINKEDIN_POST_ID_HMAC_EPOCH }}
        run: |
          set -euo pipefail
          if [[ -z "${LINKEDIN_POST_ID_HMAC_KEY:-}" ]]; then
            echo "BLOCKED_PRIVACY_KEY: LINKEDIN_POST_ID_HMAC_KEY is required." >&2
            exit 1
          fi
          if [[ -z "${LINKEDIN_POST_ID_HMAC_EPOCH:-}" ]]; then
            echo "BLOCKED_PRIVACY_EPOCH: LINKEDIN_POST_ID_HMAC_EPOCH is required." >&2
            exit 1
          fi
          echo "::add-mask::${LINKEDIN_POST_ID_HMAC_KEY}"
          python3 scripts/linkedin_post_performance.py \
            linkedin-analytics.xlsx \
            --start "${WINDOW_START}" \
            --end "${WINDOW_END}" \
            --window-role "${WINDOW_ROLE}" \
            --output linkedin-post-performance-private.json

      - name: Bind source digest and redact provider locators
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source = Path('linkedin-analytics.xlsx').read_bytes()
          continuity = json.loads(Path('linkedin-post-analytics-private.json').read_text())
          performance = json.loads(Path('linkedin-post-performance-private.json').read_text())
          source_sha = hashlib.sha256(source).hexdigest()

          continuity_privacy = continuity.get('privacy', {})
          performance_privacy = performance.get('privacy', {})
          identity_epoch = continuity_privacy.get('post_identity_key_epoch')
          if not identity_epoch or performance_privacy.get('post_identity_key_epoch') != identity_epoch:
              raise SystemExit('post identity epoch mismatch between continuity and performance receipts')
          if continuity_privacy.get('post_identity_scheme') != 'HMAC-SHA256/private-runtime-key/v1':
              raise SystemExit('continuity post identity scheme mismatch')
          if performance_privacy.get('post_identity_scheme') != 'HMAC-SHA256/private-runtime-key/v1':
              raise SystemExit('performance post identity scheme mismatch')

          continuity['source']['sha256'] = source_sha
          for post in continuity.get('posts', []):
              post.pop('post_url', None)
              post.pop('linkedin_post_id', None)

          receipt = {
              'contract': 'linkedin-post-evidence@v1',
              'authority': 'observation_only',
              'source': {
                  'sha256': source_sha,
                  'window_role': performance['window']['role'],
                  'window_start': performance['window']['start'],
                  'window_end': performance['window']['end'],
              },
              'privacy': {
                  'raw_xlsx_persisted': False,
                  'post_urls_persisted': False,
                  'linkedin_post_ids_persisted': False,
                  'public_receipt_contains_only_observation_evidence': True,
                  'post_identity_scheme': 'HMAC-SHA256/private-runtime-key/v1',
                  'post_identity_key_epoch': identity_epoch,
                  'private_key_persisted': False,
              },
              'continuity': continuity,
              'performance': performance,
          }
          Path('linkedin-post-analytics-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Verify redacted receipt invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          receipt = json.loads(Path('linkedin-post-analytics-receipt.json').read_text())
          privacy = receipt.get('privacy', {})
          if privacy.get('raw_xlsx_persisted') is not False:
              raise SystemExit('raw XLSX privacy invariant failed')
          if privacy.get('private_key_persisted') is not False:
              raise SystemExit('post identity private-key invariant failed')
          if privacy.get('post_identity_scheme') != 'HMAC-SHA256/private-runtime-key/v1':
              raise SystemExit('post identity scheme invariant failed')
          if not privacy.get('post_identity_key_epoch'):
              raise SystemExit('post identity key epoch missing')
          encoded = json.dumps(receipt)
          if 'linkedin.com/posts/' in encoded:
              raise SystemExit('provider post URL leaked into redacted receipt')
          if receipt.get('source', {}).get('window_role') not in {'historical_365', 'recent_90'}:
              raise SystemExit('window role invariant failed')
          source_sha = receipt.get('source', {}).get('sha256', '')
          if len(source_sha) != 64:
              raise SystemExit('source digest missing from redacted post receipt')
          fingerprints = [
              post.get('fingerprint', '')
              for section in ('continuity', 'performance')
              for post in receipt.get(section, {}).get('posts', [])
          ]
          if any(not re.fullmatch(r'[0-9a-f]{32}', fp) for fp in fingerprints):
              raise SystemExit('post fingerprint must be a 32-character keyed HMAC identifier')
          print(json.dumps({
              'window_role': receipt['source']['window_role'],
              'identity_key_epoch': privacy['post_identity_key_epoch'],
              'continuity_summary': receipt['continuity'].get('summary', {}),
              'performance_summary': receipt['performance'].get('summary', {}),
          }, sort_keys=True))
          PY

      - name: Upload redacted post evidence receipt
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: linkedin-post-analytics-receipt.json
          if-no-files-found: error
          retention-days: 90
