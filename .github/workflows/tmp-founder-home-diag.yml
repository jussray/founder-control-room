# TEMPORARY — diagnostic only. Posts the tail of the real E2E harness output as
# a PR comment because job logs / artifacts are not downloadable from the
# authoring session. Removed before merge; grants no authority and gates nothing.
name: tmp founder-home e2e diagnostic

on:
  push:
    branches: [feat/founder-home-cinematic-shell]

permissions:
  contents: read
  pull-requests: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run the real harness, capture output
        run: |
          set +e
          echo "== build" > diag.txt
          npm run build >> diag.txt 2>&1
          echo "== pages-auth-callback-proof" >> diag.txt
          node e2e/pages-auth-callback-proof.mjs >> diag.txt 2>&1
          echo "== direct-browser-run (full)" >> diag.txt
          FCR_E2E_SCENARIO=full node e2e/direct-browser-run.mjs >> diag.txt 2>&1
          echo "== direct-browser-run (guarded-terminal)" >> diag.txt
          FCR_E2E_SCENARIO=guarded-terminal node e2e/direct-browser-run.mjs >> diag.txt 2>&1
          echo "== direct-browser-run (capability-workbench)" >> diag.txt
          FCR_E2E_SCENARIO=capability-workbench node e2e/direct-browser-run.mjs >> diag.txt 2>&1
          echo "== done" >> diag.txt
          true
      - name: Post tail as PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '<!-- tmp-founder-home-diag -->'; echo '```'; grep -n "FAIL\|Error\|error\|E2E RESULT\|^==\|\[[0-9]" diag.txt | grep -v "Node.js 20\|npm warn\|ExperimentalWarning" | tail -150; echo '```'; } > comment.md
          gh pr comment 900 --repo "${{ github.repository }}" --body-file comment.md
