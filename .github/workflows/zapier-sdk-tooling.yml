name: Zapier SDK tooling

on:
  pull_request:
    paths:
      - "tools/zapier/**"
      - ".github/workflows/zapier-sdk-tooling.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/zapier/package-lock.json

      - name: Install isolated tooling dependencies
        run: npm ci --prefix tools/zapier --ignore-scripts --no-audit --no-fund

      - name: Typecheck Zapier SDK tooling
        run: npm --prefix tools/zapier run typecheck

      - name: Verify redaction contract
        run: npm --prefix tools/zapier test

  minimum-supported-node:
    name: Minimum supported Node 20
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prove Node 20 consumer compatibility
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/tools/zapier \
            node:20-bookworm-slim \
            sh -lc 'npm ci --ignore-scripts --no-audit --no-fund && npm run typecheck && npm test'
