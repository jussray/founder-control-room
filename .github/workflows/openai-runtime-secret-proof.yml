name: OpenAI Runtime Secret Proof

on:
  push:
    branches: [main]
    paths:
      - 'wrangler.worker.toml'
      - '.github/workflows/openai-runtime-secret-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fcr-openai-runtime-secret-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.sha }}
  RECEIPT_PATH: test-results/openai-runtime-secret-proof.json
  FCR_PROVIDER_URL: https://api.foundercontrolroom.org/_debug/provider

jobs:
  prove-openai-secret-presence:
    name: Prove OpenAI secret name on canonical Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Prove provider-held OpenAI secret presence
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$RECEIPT_PATH")"
          provider_json="$(mktemp)"
          secret_names="$(mktemp)"
          trap 'rm -f "$provider_json" "$secret_names"' EXIT

          evidence_mode=''

          # Prefer the live runtime's existing presence-only debug contract. It exposes
          # booleans only and avoids depending on Cloudflare control-plane credentials.
          if curl --fail --silent --show-error --max-time 15 "$FCR_PROVIDER_URL" > "$provider_json"; then
            if node - "$provider_json" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (payload?.openaiKeyPresent !== true) process.exit(1);
          NODE
            then
              evidence_mode='runtime-debug'
            fi
          fi

          # Fallback to provider control-plane secret-name readback. This preserves the
          # original proof lane and fails closed if the canonical Cloudflare credential
          # is unavailable or malformed.
          if [ -z "$evidence_mode" ]; then
            test -n "${CLOUDFLARE_API_TOKEN:-}" || {
              echo '::error title=OpenAI runtime proof blocked::Live runtime did not prove OPENAI_API_KEY presence and the canonical Cloudflare read credential is unavailable.'
              exit 1
            }

            ./node_modules/.bin/wrangler secret list --config wrangler.worker.toml > "$secret_names"

            if ! grep -q 'OPENAI_API_KEY' "$secret_names"; then
              echo '::error title=OpenAI runtime secret missing::OPENAI_API_KEY is not bound to the canonical founder-control-room Worker.'
              exit 1
            fi
            evidence_mode='cloudflare-secret-name'
          fi

          EVIDENCE_MODE="$evidence_mode" OBSERVED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            kind: 'fcr/openai-runtime-secret-proof@v2',
            repository: 'jussray/founder-control-room',
            worker: 'founder-control-room',
            headSha: process.env.EXPECTED_HEAD_SHA,
            secretName: 'OPENAI_API_KEY',
            present: true,
            evidenceMode: process.env.EVIDENCE_MODE,
            secretValueRead: false,
            providerMutation: false,
            observedAt: process.env.OBSERVED_AT,
          };
          fs.writeFileSync(process.env.RECEIPT_PATH, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

          echo "OPENAI_API_KEY presence VERIFIED for founder-control-room via ${evidence_mode}; value was never read or printed."
          cat "$RECEIPT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted proof receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fcr-openai-runtime-secret-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: warn
          retention-days: 30
