name: Runtime Secret Proof

on:
  push:
    branches: [main]
    paths:
      - 'wrangler.worker.toml'
      - '.github/workflows/openai-runtime-secret-proof.yml'
      - 'scripts/provider-credential-contract.mjs'
      - 'scripts/provider-credential-contract.node-test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fcr-runtime-secret-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.sha }}
  RECEIPT_PATH: test-results/runtime-secret-proof.json

jobs:
  prove-runtime-secret-presence:
    name: Prove canonical Worker secret registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Prove credential classifier contract
        run: node --test scripts/provider-credential-contract.node-test.mjs

      - name: Validate Cloudflare deployment credential shape
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          node scripts/provider-credential-contract.mjs \
            --env CLOUDFLARE_API_TOKEN \
            --account-id-env CLOUDFLARE_ACCOUNT_ID \
            --require-account-id true \
            --purpose fcr-production-worker-secret-proof \
            --output "$RECEIPT_PATH"

      - name: Prove every provider-held runtime secret name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          secret_names="$(mktemp)"
          required_names="$(mktemp)"
          trap 'rm -f "$secret_names" "$required_names"' EXIT

          python3 - <<'PY' > "$required_names"
          import tomllib
          with open('wrangler.worker.toml', 'rb') as handle:
              config = tomllib.load(handle)
          for name in config.get('secrets', {}).get('required', []):
              print(name)
          PY

          test -s "$required_names" || {
            echo '::error title=Empty runtime secret registry::wrangler.worker.toml [secrets].required must contain at least one binding name.'
            exit 1
          }

          ./node_modules/.bin/wrangler secret list --config wrangler.worker.toml --format json > "$secret_names"

          REQUIRED_NAMES_PATH="$required_names" SECRET_NAMES_PATH="$secret_names" node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const required = fs.readFileSync(process.env.REQUIRED_NAMES_PATH, 'utf8')
            .split(/\r?\n/)
            .map((value) => value.trim())
            .filter(Boolean);
          const listed = JSON.parse(fs.readFileSync(process.env.SECRET_NAMES_PATH, 'utf8'));
          const providerNames = new Set(
            Array.isArray(listed)
              ? listed.map((entry) => typeof entry === 'string' ? entry : entry?.name).filter(Boolean)
              : [],
          );
          const missing = required.filter((name) => !providerNames.has(name));

          if (missing.length > 0) {
            for (const name of missing) {
              console.error(`::error title=Runtime secret missing::${name} is required by wrangler.worker.toml but is not bound to the canonical founder-control-room Worker.`);
            }
            process.exit(1);
          }

          const fingerprint = crypto
            .createHash('sha256')
            .update(required.slice().sort().join('\n'))
            .digest('hex');
          const credentialReceipt = JSON.parse(fs.readFileSync(process.env.RECEIPT_PATH, 'utf8'));
          const receipt = {
            ...credentialReceipt,
            kind: 'fcr/runtime-secret-proof@v4',
            repository: 'jussray/founder-control-room',
            worker: 'founder-control-room',
            headSha: process.env.EXPECTED_HEAD_SHA,
            boundary: 'provider-secret-registry',
            requiredSecretNames: required,
            requiredSecretNameCount: required.length,
            requiredSecretRegistryFingerprint: `sha256:${fingerprint}`,
            providerSecretRegistryChecked: true,
            providerSecretRegistryPresent: true,
            verified: true,
            secretValueRead: false,
            secretValuePrinted: false,
            providerMutation: false,
          };
          fs.writeFileSync(process.env.RECEIPT_PATH, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

          echo 'All canonical founder-control-room runtime secret names VERIFIED in Cloudflare; values were never read or printed.'
          cat "$RECEIPT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Finalize fail-closed boundary receipt
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = process.env.RECEIPT_PATH;
          let receipt = {};
          if (fs.existsSync(path)) {
            receipt = JSON.parse(fs.readFileSync(path, 'utf8'));
          }
          const finalized = {
            ...receipt,
            kind: 'fcr/runtime-secret-proof@v4',
            repository: 'jussray/founder-control-room',
            worker: 'founder-control-room',
            headSha: process.env.EXPECTED_HEAD_SHA,
            boundary: receipt.ok === false ? 'credential-shape' : 'provider-secret-registry',
            verified: false,
            providerSecretRegistryChecked: receipt.ok === false ? false : (receipt.providerSecretRegistryChecked ?? false),
            secretValueRead: false,
            secretValuePrinted: false,
            providerMutation: false,
            observedAt: receipt.observedAt || new Date().toISOString(),
          };
          fs.writeFileSync(path, `${JSON.stringify(finalized, null, 2)}\n`);
          console.log(JSON.stringify(finalized, null, 2));
          NODE

      - name: Upload redacted proof receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fcr-runtime-secret-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 30
