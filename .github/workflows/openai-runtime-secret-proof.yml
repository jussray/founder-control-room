name: OpenAI Runtime Secret Proof

on:
  push:
    branches: [main]
    paths:
      - 'wrangler.worker.toml'
      - '.github/workflows/openai-runtime-secret-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fcr-openai-runtime-secret-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.sha }}
  RECEIPT_PATH: test-results/openai-runtime-secret-proof.json

jobs:
  prove-openai-secret-presence:
    name: Prove OpenAI secret name on canonical Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Prove provider-held OpenAI secret presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo '::error title=Missing Cloudflare read credential::CLOUDFLARE_API_TOKEN is required for presence-only proof.'
            exit 1
          }

          mkdir -p "$(dirname "$RECEIPT_PATH")"
          secret_names="$(mktemp)"
          trap 'rm -f "$secret_names"' EXIT

          ./node_modules/.bin/wrangler secret list --config wrangler.worker.toml > "$secret_names"

          if ! grep -q 'OPENAI_API_KEY' "$secret_names"; then
            echo '::error title=OpenAI runtime secret missing::OPENAI_API_KEY is not bound to the canonical founder-control-room Worker.'
            exit 1
          fi

          OBSERVED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            kind: 'fcr/openai-runtime-secret-proof@v1',
            repository: 'jussray/founder-control-room',
            worker: 'founder-control-room',
            headSha: process.env.EXPECTED_HEAD_SHA,
            secretName: 'OPENAI_API_KEY',
            present: true,
            secretValueRead: false,
            providerMutation: false,
            observedAt: process.env.OBSERVED_AT,
          };
          fs.writeFileSync(process.env.RECEIPT_PATH, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

          echo 'OPENAI_API_KEY presence VERIFIED on canonical founder-control-room Worker; value was never read or printed.'
          cat "$RECEIPT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted proof receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fcr-openai-runtime-secret-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: warn
          retention-days: 30
