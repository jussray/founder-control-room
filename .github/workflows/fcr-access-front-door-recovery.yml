name: FCR Access Front Door Recovery

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: 'Exact current main SHA approved for FCR front-door inspection or recovery'
        required: true
        type: string
      apply:
        description: 'Apply only the exact foundercontrolroom.org public Access destination bypass'
        required: true
        type: boolean
        default: false
      approval_reference:
        description: 'Auditable founder approval reference; required when apply=true'
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: fcr-access-front-door-recovery-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
  CLOUDFLARE_ACCOUNT_ID: '9b59861bd1747cf7525571b4c51d2aa0'

jobs:
  recover:
    name: Inspect or restore FCR public Access front door
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out exact approved current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact current main and mutation approval
        env:
          APPLY: ${{ inputs.apply }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error title=Invalid exact head::expected_head_sha must be a lowercase 40-character commit SHA.'
            exit 1
          fi

          actual="$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          test "$current_main" = "$EXPECTED_HEAD_SHA"

          approval_reference_receipt='not-required-for-read-only'
          if [[ "$APPLY" == 'true' ]]; then
            if [[ ! "$APPROVAL_REFERENCE" =~ ^[A-Za-z0-9._:-]{8,200}$ ]]; then
              echo '::error title=Missing mutation approval::apply=true requires an auditable 8-200 character approval_reference.'
              exit 1
            fi
            approval_reference_receipt="sha256:$(printf '%s' "$APPROVAL_REFERENCE" | sha256sum | awk '{print $1}')"
          elif [[ -n "${APPROVAL_REFERENCE:-}" ]]; then
            echo '::error title=Unexpected mutation approval::apply=false must not carry approval_reference.'
            exit 1
          fi

          {
            echo '## FCR front-door authority gate'
            echo
            echo "- Exact current main: \`$EXPECTED_HEAD_SHA\`"
            echo "- Apply requested: \`$APPLY\`"
            echo "- Approval reference receipt: \`$approval_reference_receipt\`"
            echo '- Random stranger contract: public front door reachable; founder control plane remains founder-authorized'
            echo '- Mutation scope: create only foundercontrolroom.org/* as a public Access destination with Bypass Everyone'
            echo '- Existing non-managed public destination: accepted only when exact destination and Everyone bypass semantics are independently verified'
            echo '- Existing all-workers protection: preserved'
            echo '- DNS mutation: none'
            echo '- Worker route mutation: none'
            echo '- Database mutation: none'
            echo '- Failed stranger browser proof: rollback only the run-created managed Access application'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prove credential and bounded recovery contracts
        id: contracts
        run: |
          node --test scripts/provider-credential-contract.node-test.mjs
          node --test scripts/reconcile-cloudflare-access-public-zone.node-test.mjs
          node --test scripts/fcr-cloudflare-bridge-contract.node-test.mjs
          node --test scripts/fcr-stranger-front-door-contract.node-test.mjs

      - name: Inspect live Access state without mutation
        id: access_inspect
        if: inputs.apply != true
        continue-on-error: true
        env:
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
        run: node scripts/reconcile-cloudflare-access-public-zone.mjs >/dev/null 2>&1

      - name: Apply exact public destination with dedicated admin authority
        id: access_apply
        if: inputs.apply == true
        continue-on-error: true
        env:
          CLOUDFLARE_ACCESS_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_ADMIN_API_TOKEN }}
        run: node scripts/reconcile-cloudflare-access-public-zone.mjs --apply >/dev/null 2>&1

      - name: Install Chromium for stranger front-door proof
        id: chromium
        if: always() && steps.contracts.outcome == 'success'
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Verify stranger reachability and founder containment with Playwright
        id: stranger_browser
        if: always() && steps.contracts.outcome == 'success' && steps.chromium.outcome == 'success'
        continue-on-error: true
        run: node scripts/verify-fcr-front-door-playwright.mjs >/dev/null 2>&1

      - name: Roll back run-created public destination after failed apply or stranger proof
        id: rollback
        if: (failure() && inputs.apply == true) || (always() && inputs.apply == true && (steps.access_apply.outcome == 'failure' || steps.stranger_browser.outcome == 'failure'))
        continue-on-error: true
        env:
          CLOUDFLARE_ACCESS_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_ADMIN_API_TOKEN }}
        run: node scripts/reconcile-cloudflare-access-public-zone.mjs --rollback >/dev/null 2>&1

      - name: Evaluate independent provider and stranger evidence
        id: evidence_gate
        if: always()
        continue-on-error: true
        env:
          APPLY: ${{ inputs.apply }}
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          ACCESS_INSPECT_OUTCOME: ${{ steps.access_inspect.outcome }}
          ACCESS_APPLY_OUTCOME: ${{ steps.access_apply.outcome }}
          CHROMIUM_OUTCOME: ${{ steps.chromium.outcome }}
          STRANGER_BROWSER_OUTCOME: ${{ steps.stranger_browser.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          provider_outcome="$ACCESS_INSPECT_OUTCOME"
          if [[ "$APPLY" == 'true' ]]; then
            provider_outcome="$ACCESS_APPLY_OUTCOME"
          fi

          printf 'contracts=%s\nprovider=%s\nchromium=%s\nstranger_browser=%s\nrollback=%s\n' \
            "$CONTRACTS_OUTCOME" \
            "$provider_outcome" \
            "$CHROMIUM_OUTCOME" \
            "$STRANGER_BROWSER_OUTCOME" \
            "$ROLLBACK_OUTCOME"

          test "$CONTRACTS_OUTCOME" = 'success'
          test "$provider_outcome" = 'success'
          test "$CHROMIUM_OUTCOME" = 'success'
          test "$STRANGER_BROWSER_OUTCOME" = 'success'

          if [[ "$APPLY" == 'true' && "$ROLLBACK_OUTCOME" == 'failure' ]]; then
            echo '::error title=Rollback failed::A bounded Access mutation may require manual review.'
            exit 1
          fi

      - name: Return sanitized recovery receipt to founder control issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RETURN_ISSUE: '485'
          EVIDENCE_GATE_OUTCOME: ${{ steps.evidence_gate.outcome }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          access_receipt='test-results/fcr-access-front-door-recovery.json'
          browser_receipt='test-results/fcr-access-front-door-browser-proof.json'
          public_receipt='test-results/fcr-access-front-door-public-receipt.md'
          mkdir -p test-results

          safe_expected_head_sha='UNKNOWN'
          if [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            safe_expected_head_sha="$EXPECTED_HEAD_SHA"
          fi

          {
            echo '## FCR Cloudflare Access + stranger-path receipt'
            echo
            echo "- Exact head: \`$safe_expected_head_sha\`"
            echo "- Workflow run: $WORKFLOW_RUN_URL"
            echo "- Evidence gate: \`$EVIDENCE_GATE_OUTCOME\`"

            if [[ ! -f "$access_receipt" ]]; then
              echo '- Access provider receipt: `missing`'
              echo '- Provider truth: `UNKNOWN` because the workflow ended before a structured Access receipt was produced.'
            elif [[ "$safe_expected_head_sha" == 'UNKNOWN' ]] || ! jq -e -s \
              --arg expectedHeadSha "$safe_expected_head_sha" \
              --arg accountId "$CLOUDFLARE_ACCOUNT_ID" '
                def iso8601:
                  type == "string"
                  and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$");
                def digits_or_null:
                  . == null or (type == "string" and test("^[0-9]+$"));
                def bool_or_null:
                  . == null or type == "boolean";
                def credential_source:
                  . == null
                  or . == "CLOUDFLARE_ACCESS_API_TOKEN"
                  or . == "CLOUDFLARE_ACCESS_ADMIN_API_TOKEN";
                def credential_failure:
                  type == "object"
                  and (.source == "CLOUDFLARE_ACCESS_API_TOKEN" or .source == "CLOUDFLARE_ACCESS_ADMIN_API_TOKEN")
                  and (
                    .reason == "missing"
                    or .reason == "account-id-substitution"
                    or .reason == "non-ascii"
                    or .reason == "bearer-prefix"
                    or .reason == "assignment-wrapper"
                    or .reason == "wrapping-quotes"
                    or .reason == "whitespace"
                    or .reason == "non-printable"
                    or .reason == "provider-read-failed"
                  )
                  and ((has("status") | not) or .status == null or (.status | type == "number" and floor == . and . >= 100 and . <= 599))
                  and ((has("providerCodes") | not) or (.providerCodes | type == "array" and all(.[]; type == "number" and floor == .)));
                length == 1
                and (
                  .[0]
                  | type == "object"
                  and .schemaVersion == 2
                  and .scope == "fcr-access-front-door-recovery"
                  and (.observedAt | iso8601)
                  and (.workflowRunId | digits_or_null)
                  and (.workflowRunAttempt | digits_or_null)
                  and .expectedHeadSha == $expectedHeadSha
                  and (
                    .state == "unknown"
                    or .state == "clear"
                    or .state == "attention"
                    or .state == "mutated-needs-browser-proof"
                    or .state == "blocked"
                  )
                  and (.applyRequested | type == "boolean")
                  and (.mutationPerformed | type == "boolean")
                  and (.rollbackPerformed | type == "boolean")
                  and .accountId == $accountId
                  and .zone == "foundercontrolroom.org"
                  and (.credentialSource | credential_source)
                  and (.credentialFailures | type == "array" and all(.[]; credential_failure))
                  and (.denyUnmatchedRequests | bool_or_null)
                  and (.alreadyExempt | bool_or_null)
                  and (.matchingApplicationCount == null or (.matchingApplicationCount | type == "number" and floor == . and . >= 0))
                  and (
                    .action == "none"
                    or .action == "would-create-public-bypass"
                    or .action == "already-public-bypass"
                    or .action == "created-public-bypass"
                    or .action == "rolled-back-public-bypass"
                  )
                  and (
                    .classification == null
                    or .classification == "account-authority-mismatch"
                    or .classification == "dedicated-admin-credential-required"
                    or .classification == "dedicated-read-credential-required"
                    or .classification == "provider-read-failed"
                    or .classification == "provider-credential-invalid"
                    or .classification == "duplicate-managed-public-bypass"
                    or .classification == "managed-public-bypass-drift"
                    or .classification == "managed-public-bypass-policy-drift"
                    or .classification == "existing-public-access-app-requires-review"
                    or .classification == "provider-apply-failed"
                    or .classification == "provider-recovery-failed"
                    or .classification == "rollback-scope-mismatch"
                    or .classification == "rollback-managed-app-id-missing"
                    or .classification == "rollback-managed-app-not-unique"
                    or .classification == "rollback-managed-app-drift"
                    or .classification == "rollback-failed"
                  )
                )
              ' "$access_receipt" >/dev/null 2>&1; then
              echo '- Access provider receipt: `malformed`'
              echo '- Provider truth: `UNKNOWN` because the structured Access receipt failed the single-document public schema allowlist.'
            else
              echo '- Access provider receipt: `present`'
              echo
              echo '```json'
              jq -s '.[0] | {
                schemaVersion,
                scope,
                observedAt,
                workflowRunId,
                workflowRunAttempt,
                expectedHeadSha,
                state,
                applyRequested,
                mutationPerformed,
                rollbackPerformed,
                accountId,
                zone,
                credentialSource,
                credentialFailures: [.credentialFailures[] | {source, reason, status, providerCodes}],
                denyUnmatchedRequests,
                alreadyExempt,
                matchingApplicationCount,
                action,
                classification,
                reviewReason: (
                  if .classification != "existing-public-access-app-requires-review" then null
                  elif .blocker == "More than one Access application targets the FCR public apex; refusing to infer ownership or mutate automatically." then "multiple-matching-apps"
                  elif .blocker == "An existing non-managed Access application targets the FCR apex with broader or different destination scope; manual review is required before mutation." then "destination-scope"
                  elif .blocker == "An existing non-managed Access application owns the exact FCR public destination but is not an Everyone bypass; manual review is required before mutation." then "missing-everyone-bypass"
                  else "unspecified"
                  end
                )
              }' "$access_receipt"
              echo '```'
            fi

            if [[ ! -f "$browser_receipt" ]]; then
              echo
              echo '- Browser proof receipt: `missing` (stranger-path)'
            elif [[ "$safe_expected_head_sha" == 'UNKNOWN' ]] || ! jq -e -s \
              --arg expectedHeadSha "$safe_expected_head_sha" '
                def iso8601:
                  type == "string"
                  and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$");
                def status_or_null:
                  . == null or (type == "number" and floor == . and . >= 100 and . <= 599);
                def origin_or_null:
                  . == null or (type == "string" and test("^https://[A-Za-z0-9.-]+(?::[0-9]{1,5})?$"));
                length == 1
                and (
                  .[0]
                  | type == "object"
                  and .schemaVersion == 1
                  and .scope == "fcr-access-front-door-browser-proof"
                  and (.observedAt | iso8601)
                  and .expectedHeadSha == $expectedHeadSha
                  and .audience == "random-stranger"
                  and .requestedOrigin == "https://foundercontrolroom.org"
                  and .publicOrigin == "https://www.foundercontrolroom.org"
                  and (.finalOrigin | origin_or_null)
                  and (.navigationStatus | status_or_null)
                  and (.controlRoomStatus | status_or_null)
                  and (.founderSignInVisible | type == "boolean")
                  and (.founderShellVisible | type == "boolean")
                  and (.authMeStatus | status_or_null)
                  and (.founderAuthorityContained | type == "boolean")
                  and (.apiVersionStatus | status_or_null)
                  and (.apiVersionMatchesExpectedSha | type == "boolean")
                  and (.state == "unknown" or .state == "proven" or .state == "failed")
                  and ((has("error") | not) or .error == null or (.error | type == "string" and length <= 2000))
                )
              ' "$browser_receipt" >/dev/null 2>&1; then
              echo
              echo '- Browser proof receipt: `malformed` (stranger-path)'
              echo '- Browser proof: `UNKNOWN` because the structured stranger-path receipt failed the single-document public schema allowlist.'
            else
              echo
              echo '- Browser proof receipt: `present` (stranger-path)'
              echo
              echo '```json'
              jq -s '.[0] | {
                schemaVersion,
                scope,
                observedAt,
                expectedHeadSha,
                audience,
                requestedOrigin,
                publicOrigin,
                finalOriginIsFcr: (.finalOrigin != null and (.finalOrigin == .requestedOrigin or .finalOrigin == .publicOrigin)),
                accessInterceptDetected: (((.finalOrigin // "") | test("cloudflareaccess\\.com"; "i")) or ((.error // "") | test("Cloudflare Access"; "i"))),
                navigationStatus,
                controlRoomStatus,
                founderSignInVisible,
                founderShellVisible,
                authMeStatus,
                founderAuthorityContained,
                apiVersionStatus,
                apiVersionMatchesExpectedSha,
                state,
                errorPresent: (((.error // "") | length) > 0)
              }' "$browser_receipt"
              echo '```'
            fi
          } > "$public_receipt"

          gh issue comment "$RETURN_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$public_receipt"
          cat "$public_receipt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fcr-access-front-door-public-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/fcr-access-front-door-public-receipt.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail closed after retaining independent provider and stranger evidence
        if: always() && steps.evidence_gate.outcome != 'success'
        shell: bash
        run: |
          echo '::error title=FCR front-door authority not proven::Provider and stranger-path evidence were retained; at least one required witness is not green.'
          exit 1
