name: FCR Access Front Door Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/reconcile-cloudflare-access-public-zone.mjs'
      - 'scripts/reconcile-cloudflare-access-public-zone.node-test.mjs'
      - '.github/workflows/fcr-access-front-door-recovery.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  CLOUDFLARE_ACCOUNT_ID: '9b59861bd1747cf7525571b4c51d2aa0'

jobs:
  recover:
    name: Restore FCR application-owned auth front door
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/domain-runtime-authority' &&
      github.event.pull_request.user.login == 'jussray'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact repair head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact repair head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          printf 'Verified FCR Access recovery head: %s\n' "$actual"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prove bounded recovery behavior
        run: node --test scripts/reconcile-cloudflare-access-public-zone.node-test.mjs

      - name: Inspect provider state without mutation
        env:
          CLOUDFLARE_ACCESS_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_ADMIN_API_TOKEN }}
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/reconcile-cloudflare-access-public-zone.mjs

      - name: Apply one-zone Access exemption
        env:
          CLOUDFLARE_ACCESS_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_ADMIN_API_TOKEN }}
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/reconcile-cloudflare-access-public-zone.mjs --apply

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify recovered front door with Playwright
        run: npx playwright test -c playwright.domain.config.ts

      - name: Upload recovery browser artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fcr-access-front-door-recovery-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            test-results/domain-authority/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
