name: QuickScan Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/quickscan/**'
      - 'src/http/routes/quickscan.ts'
      - 'src/http/routes/__tests__/quickscan.integration.test.ts'
      - 'src/http/webhooks/stripeQuickScan.ts'
      - 'src/http/webhooks/__tests__/stripeQuickScan.test.ts'
      - 'src/http/server.ts'
      - 'public/control-room/quickscan.*'
      - 'e2e/quickscan-proof.mjs'
      - 'scripts/build-pages.mjs'
      - '.github/workflows/quickscan-proof.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  proof:
    name: QuickScan Exact-Head Proof
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Focused domain and route tests
        run: npx vitest run src/quickscan/__tests__/engine.test.ts src/quickscan/__tests__/stripeWebhook.test.ts src/quickscan/__tests__/chiefOpenaiClient.test.ts src/http/routes/__tests__/quickscan.integration.test.ts src/http/webhooks/__tests__/stripeQuickScan.test.ts
      - name: Build Pages assets
        run: npm run build:pages
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Playwright control-board proof
        run: node e2e/quickscan-proof.mjs
