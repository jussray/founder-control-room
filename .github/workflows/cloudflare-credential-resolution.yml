name: Cloudflare Production Credential Diagnostic

# Founder-dispatched, current-main-only observation. It never deploys and never
# prints the credential. This workflow must not execute a branch's mutable code
# with a deploy credential.
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main SHA approved for this read-only diagnostic
        required: true
        type: string

permissions:
  contents: read

jobs:
  production-scope:
    name: Production environment credential (current main only)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the approved subject is current main
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ inputs.expected_main_sha }}"
          if [[ ! "$expected" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid approval subject::expected_main_sha must be a full 40-character SHA."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin main
          observed="$(git rev-parse origin/main)"
          checked_out="$(git rev-parse HEAD)"
          if [[ "$observed" != "$expected" || "$checked_out" != "$expected" ]]; then
            echo "::error title=Stale approval subject::The supplied SHA is not the current main head."
            exit 1
          fi

      - name: Diagnose the production credential without disclosure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACCOUNT_ID="$(sed -nE 's/^account_id[[:space:]]*=[[:space:]]*"([0-9a-f]+)"[[:space:]]*$/\1/p' wrangler.worker.toml | head -n 1)"
          python3 scripts/diagnose-cloudflare-credential.py production "$ACCOUNT_ID"
