name: Cloudflare Credential Resolution Diagnostic

# Read-only. Shows WHICH CLOUDFLARE_API_TOKEN value each secret scope resolves
# and whether Cloudflare accepts it. Never deploys, never prints the token.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cloudflare-credential-resolution.yml
      - scripts/diagnose-cloudflare-credential.py

permissions:
  contents: read

jobs:
  repository-scope:
    name: Repository/organization secret (no environment)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose resolved credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACCOUNT_ID="$(sed -nE 's/^account_id[[:space:]]*=[[:space:]]*"([0-9a-f]+)"[[:space:]]*$/\1/p' wrangler.worker.toml | head -n 1)"
          python3 scripts/diagnose-cloudflare-credential.py repository "$ACCOUNT_ID"

  production-scope:
    name: Production environment (what Deploy and Reconcile receive)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose resolved credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACCOUNT_ID="$(sed -nE 's/^account_id[[:space:]]*=[[:space:]]*"([0-9a-f]+)"[[:space:]]*$/\1/p' wrangler.worker.toml | head -n 1)"
          python3 scripts/diagnose-cloudflare-credential.py production "$ACCOUNT_ID"
