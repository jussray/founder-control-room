name: One-Shot Deploy Credential Gate Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_one-shot-deploy-credential-gate-repair.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-deploy-credential-gate-repair
  cancel-in-progress: false

env:
  EXPECTED_PARENT_SHA: 6525a4440f9832832804415d9f6eac921cc18693
  REPAIR_WORKFLOW: .github/workflows/_one-shot-deploy-credential-gate-repair.yml

jobs:
  repair:
    name: Unify canonical Deploy credential gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact repair commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Verify exact parent and exclusive branch lease
        shell: bash
        run: |
          set -euo pipefail
          actual_parent="$(git rev-parse HEAD^)"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "Expected parent: $EXPECTED_PARENT_SHA"
          echo "Actual parent:   $actual_parent"
          echo "Workflow SHA:    $GITHUB_SHA"
          echo "Remote main:     $remote_main"
          test "$actual_parent" = "$EXPECTED_PARENT_SHA"
          test "$remote_main" = "$GITHUB_SHA"

      - name: Replace only the duplicated Deploy credential validator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy.yml')
          text = path.read_text(encoding='utf-8')
          step_header = '      - name: Verify provider-held Worker secret names before mutation\n'
          legacy_start = "          python3 - <<'PY'\n"
          next_boundary = '          secret_receipt="$RUNNER_TEMP/fcr-worker-secret-names.json"\n'

          if text.count(step_header) != 1:
              raise SystemExit('expected exactly one provider-held Worker secret preflight step')
          step_index = text.index(step_header)
          start = text.find(legacy_start, step_index)
          end = text.find(next_boundary, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('legacy Deploy credential validator boundaries were not found; refusing mutation')

          legacy = text[start:end]
          required_markers = (
              "token.encode('ascii')",
              "re.fullmatch(r'[0-9a-f]{32}', account_id)",
              'CLOUDFLARE_API_TOKEN',
              'CLOUDFLARE_ACCOUNT_ID',
          )
          missing = [marker for marker in required_markers if marker not in legacy]
          if missing:
              raise SystemExit(f'legacy validator contract changed; missing markers: {missing!r}')

          replacement = (
              '          credential_receipt="$RUNNER_TEMP/fcr-deploy-credential-shape.json"\n'
              '          node scripts/provider-credential-contract.mjs \\\n'
              '            --env CLOUDFLARE_API_TOKEN \\\n'
              '            --account-id-env CLOUDFLARE_ACCOUNT_ID \\\n'
              '            --require-account-id true \\\n'
              '            --purpose fcr-production-deploy-authority \\\n'
              '            --output "$credential_receipt"\n\n'
          )
          updated = text[:start] + replacement + text[end:]
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify shared credential contract and focused diff
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/provider-credential-contract.node-test.mjs
          grep -Fq -- '--purpose fcr-production-deploy-authority' .github/workflows/deploy.yml
          grep -Fq -- 'node scripts/provider-credential-contract.mjs' .github/workflows/deploy.yml
          if grep -Fq "token.encode('ascii')" .github/workflows/deploy.yml; then
            echo '::error title=Legacy Deploy credential validator survived::Refusing to commit duplicated credential logic.'
            exit 1
          fi
          git diff --check

      - name: Remove one-shot workflow and commit focused repair
        shell: bash
        run: |
          set -euo pipefail
          rm "$REPAIR_WORKFLOW"
          git add .github/workflows/deploy.yml "$REPAIR_WORKFLOW"

          mapfile -t changed < <(git diff --cached --name-only | sort)
          printf 'Changed paths:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/_one-shot-deploy-credential-gate-repair.yml'
          test "${changed[1]}" = '.github/workflows/deploy.yml'

          git config user.name 'Juss'
          git config user.email '286642846+jussray@users.noreply.github.com'
          git commit -m 'fix(deploy): unify Cloudflare credential authority gate'

      - name: Recheck lease and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "Workflow SHA: $GITHUB_SHA"
          echo "Remote main:  $remote_main"
          test "$remote_main" = "$GITHUB_SHA"
          git push origin HEAD:main
