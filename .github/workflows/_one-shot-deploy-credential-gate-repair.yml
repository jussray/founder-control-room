name: One-Shot Deploy Credential Gate Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_one-shot-deploy-credential-gate-repair.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-deploy-credential-gate-repair
  cancel-in-progress: false

env:
  EXPECTED_PARENT_SHA: 8653bf2585e55f136c84fead566342367de677b4
  REPAIR_WORKFLOW: .github/workflows/_one-shot-deploy-credential-gate-repair.yml

jobs:
  repair:
    name: Unify canonical Deploy credential gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact repair commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Verify exact parent and exclusive branch lease
        shell: bash
        run: |
          set -euo pipefail
          actual_parent="$(git rev-parse HEAD^)"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "Expected parent: $EXPECTED_PARENT_SHA"
          echo "Actual parent:   $actual_parent"
          echo "Workflow SHA:    $GITHUB_SHA"
          echo "Remote main:     $remote_main"
          test "$actual_parent" = "$EXPECTED_PARENT_SHA"
          test "$remote_main" = "$GITHUB_SHA"

      - name: Replace only the duplicated Deploy credential validator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy.yml')
          text = path.read_text(encoding='utf-8')

          old = '''          python3 - <<'PYBLOCK'
          import os
          import re
          import sys

          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          account_id = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')

          try:
              token.encode('ascii')
          except UnicodeEncodeError:
              print('::error title=Malformed Cloudflare API token::CLOUDFLARE_API_TOKEN contains non-ASCII characters. Re-copy the exact Cloudflare-issued token.')
              sys.exit(1)

          if any(ord(char) < 33 or ord(char) > 126 or char.isspace() for char in token):
              print('::error title=Malformed Cloudflare API token::CLOUDFLARE_API_TOKEN contains whitespace or non-printable characters. Re-copy the exact Cloudflare-issued token.')
              sys.exit(1)

          if not re.fullmatch(r'[0-9a-f]{32}', account_id):
              print('::error title=Invalid Cloudflare account authority::CLOUDFLARE_ACCOUNT_ID must be a 32-character lowercase hexadecimal account ID.')
              sys.exit(1)

          print('Cloudflare production credential is header-safe and account authority is structurally valid. The token value was not printed.')
          PYBLOCK
'''.replace("PYBLOCK", "PY")

          new = '''          credential_receipt="$RUNNER_TEMP/fcr-deploy-credential-shape.json"
          node scripts/provider-credential-contract.mjs \\
            --env CLOUDFLARE_API_TOKEN \\
            --account-id-env CLOUDFLARE_ACCOUNT_ID \\
            --require-account-id true \\
            --purpose fcr-production-deploy-authority \\
            --output "$credential_receipt"
'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one legacy validator block, found {count}; refusing mutation')

          updated = text.replace(old, new, 1)
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify shared credential contract and focused diff
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/provider-credential-contract.node-test.mjs
          grep -Fq -- '--purpose fcr-production-deploy-authority' .github/workflows/deploy.yml
          grep -Fq -- 'node scripts/provider-credential-contract.mjs' .github/workflows/deploy.yml
          if grep -Fq "token.encode('ascii')" .github/workflows/deploy.yml; then
            echo '::error title=Legacy Deploy credential validator survived::Refusing to commit duplicated credential logic.'
            exit 1
          fi
          git diff --check

      - name: Remove one-shot workflow and commit focused repair
        shell: bash
        run: |
          set -euo pipefail
          rm "$REPAIR_WORKFLOW"
          git add .github/workflows/deploy.yml "$REPAIR_WORKFLOW"

          mapfile -t changed < <(git diff --cached --name-only | sort)
          printf 'Changed paths:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/_one-shot-deploy-credential-gate-repair.yml'
          test "${changed[1]}" = '.github/workflows/deploy.yml'

          git config user.name 'Juss'
          git config user.email '286642846+jussray@users.noreply.github.com'
          git commit -m 'fix(deploy): unify Cloudflare credential authority gate'

      - name: Recheck lease and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "Workflow SHA: $GITHUB_SHA"
          echo "Remote main:  $remote_main"
          test "$remote_main" = "$GITHUB_SHA"
          git push origin HEAD:main
