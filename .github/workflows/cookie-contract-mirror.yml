name: Founder Cookie Contract Mirror

on:
  push:
    branches: [main]
    paths:
      - '.security/cookies.json'
      - 'media/truthmode-live-action-founder-video.json'
      - 'scripts/mint-media-script-cookie.ts'
      - 'scripts/verify-cookie-contract.mjs'
      - 'scripts/verify-founder-onboarding.mjs'
      - 'scripts/verify-guarded-terminal-contract.mjs'
      - 'src/auth/**'
      - 'src/reconciliation/types.ts'
      - 'src/lib/operatorContinuity.ts'
      - 'src/lib/mediaContinuity.ts'
      - 'src/lib/mediaMissionContinuity.ts'
      - 'src/lib/__tests__/operatorContinuity.test.ts'
      - 'src/lib/__tests__/mediaContinuity.test.ts'
      - 'src/lib/__tests__/mediaMissionContinuity.test.ts'
      - 'src/http/middleware/**'
      - 'src/http/routes/auth.ts'
      - 'src/terminal/registry.ts'
      - '.github/workflows/cookie-contract-mirror.yml'
  pull_request:
    paths:
      - '.security/cookies.json'
      - 'media/truthmode-live-action-founder-video.json'
      - 'scripts/mint-media-script-cookie.ts'
      - 'scripts/verify-cookie-contract.mjs'
      - 'scripts/verify-founder-onboarding.mjs'
      - 'scripts/verify-guarded-terminal-contract.mjs'
      - 'src/auth/**'
      - 'src/reconciliation/types.ts'
      - 'src/lib/operatorContinuity.ts'
      - 'src/lib/mediaContinuity.ts'
      - 'src/lib/mediaMissionContinuity.ts'
      - 'src/lib/__tests__/operatorContinuity.test.ts'
      - 'src/lib/__tests__/mediaContinuity.test.ts'
      - 'src/lib/__tests__/mediaMissionContinuity.test.ts'
      - 'src/http/middleware/**'
      - 'src/http/routes/auth.ts'
      - 'src/terminal/registry.ts'
      - '.github/workflows/cookie-contract-mirror.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cookie-contract:
    name: Founder and portfolio cookie contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - run: node scripts/verify-cookie-contract.mjs
      - run: npx vitest run src/lib/__tests__/operatorContinuity.test.ts src/lib/__tests__/mediaContinuity.test.ts src/lib/__tests__/mediaMissionContinuity.test.ts
      - name: Mint exact-head live-action script cookie
        run: npx tsx scripts/mint-media-script-cookie.ts
      - name: Upload media script cookie receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: media-script-cookie-${{ github.sha }}
          path: .proof/media-script-cookie.json
          if-no-files-found: error
          retention-days: 7
      - run: node scripts/verify-founder-onboarding.mjs
      - run: node scripts/verify-guarded-terminal-contract.mjs