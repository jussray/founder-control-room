name: Portfolio Compatibility Candidate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'schemas/portfolio-release.schema.json'
      - 'release-policy/repositories.json'
      - 'releases/portfolio-v0.1.0.json'
      - 'scripts/validate_portfolio_release.py'
      - '.github/workflows/portfolio-compatibility.yml'
permissions:
  contents: read
jobs:
  manifest-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Fail-closed release preflight
        run: python scripts/validate_portfolio_release.py
