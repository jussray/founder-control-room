name: URLFix Candidate Proof

on:
  push:
    branches:
      - 'feat/urlfix-v0.2.0-candidate'
    paths:
      - '.ai/skills/urlfix/**'
      - '.claude/skills/urlfix/**'
      - 'config/urlfix*.json'
      - 'e2e/urlfix-proof.ts'
      - 'scripts/urlfix-merge-review-contract.mjs'
      - 'scripts/verify-urlfix-skill.mjs'
      - 'skills/urlfix/**'
      - 'src/lib/urlfix.ts'
      - 'src/lib/__tests__/urlfix.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/urlfix-candidate-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urlfix-candidate-proof-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.sha }}

jobs:
  urlfix-proof:
    name: Exact-head URLFix contract + Playwright proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact candidate head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify URLFix contract and attack tests
        run: npm run verify:urlfix

      - name: Type check exact candidate
        run: npm run typecheck

      - name: Lint URLFix source and focused tests
        run: npx eslint src/lib/urlfix.ts src/lib/__tests__/urlfix.test.ts --max-warnings 0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run same-witness Playwright proof
        env:
          URLFIX_PROOF_DIR: ${{ runner.temp }}/urlfix-proof
        run: npx tsx e2e/urlfix-proof.ts

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: urlfix-candidate-failure-${{ github.run_id }}
          path: |
            test-results
            playwright-report
            ${{ runner.temp }}/urlfix-proof
          if-no-files-found: ignore
          retention-days: 14
