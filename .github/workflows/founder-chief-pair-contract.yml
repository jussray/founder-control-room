name: Founder Control Room / Chief AI Pair Contract

on:
  pull_request:
    paths:
      - 'config/founder-chief-pair.contract.json'
      - 'docs/FOUNDER_INTELLIGENCE_CONSTITUTION.md'
      - 'scripts/verify-founder-chief-pair.mjs'
      - 'src/founder-os-lab/projectAdapters.ts'
      - 'src/founder-os-lab/capabilityKernel.ts'
      - 'src/founder-os-lab/engine.ts'
      - 'src/lib/n8nConveyor.ts'
      - 'src/lib/n8nConveyorRuntime.ts'
      - 'automation/n8n/founder-conveyor.workflow.json'
      - '.github/workflows/founder-chief-pair-contract.yml'
  push:
    branches: [main]
    paths:
      - 'config/founder-chief-pair.contract.json'
      - 'docs/FOUNDER_INTELLIGENCE_CONSTITUTION.md'
      - 'scripts/verify-founder-chief-pair.mjs'
      - 'src/founder-os-lab/projectAdapters.ts'
      - 'src/founder-os-lab/capabilityKernel.ts'
      - 'src/founder-os-lab/engine.ts'
      - 'src/lib/n8nConveyor.ts'
      - 'src/lib/n8nConveyorRuntime.ts'
      - 'automation/n8n/founder-conveyor.workflow.json'
      - '.github/workflows/founder-chief-pair-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-pair-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Founder Control Room source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: founder-control-room
          persist-credentials: false

      - name: Resolve paired Chief AI authority
        id: pair-ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FCR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          selected_ref="main"
          source="chief-ai-machine/main"
          remote="https://github.com/jussray/chief-ai-machine.git"

          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$FCR_HEAD_REF" ]; then
            git check-ref-format --branch "$FCR_HEAD_REF" >/dev/null
            if git ls-remote --exit-code --heads "$remote" "refs/heads/$FCR_HEAD_REF" >/dev/null 2>&1; then
              selected_ref="$FCR_HEAD_REF"
              source="paired-same-name-branch"
            fi
          fi

          selected_sha="$(git ls-remote --exit-code --heads "$remote" "refs/heads/$selected_ref" | awk 'NR==1 {print $1}')"
          printf '%s' "$selected_sha" | grep -Eq '^[0-9a-f]{40}$'

          printf 'ref=%s\n' "$selected_ref" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$selected_sha" >> "$GITHUB_OUTPUT"
          printf 'source=%s\n' "$source" >> "$GITHUB_OUTPUT"
          {
            echo '## Founder ↔ Chief pair authority'
            echo
            printf -- '- FCR exact source: `%s`\n' "$GITHUB_SHA"
            printf -- '- Chief logical ref selected: `%s`\n' "$selected_ref"
            printf -- '- Chief exact SHA selected: `%s`\n' "$selected_sha"
            printf -- '- Selection mode: `%s`\n' "$source"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out exact Chief AI authority
        uses: actions/checkout@v4
        with:
          repository: jussray/chief-ai-machine
          ref: ${{ steps.pair-ref.outputs.sha }}
          path: chief-ai-machine
          persist-credentials: false

      - name: Verify exact Chief AI checkout
        shell: bash
        working-directory: chief-ai-machine
        env:
          EXPECTED_CHIEF_SHA: ${{ steps.pair-ref.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHIEF_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify local and cross-repository pair contract
        working-directory: founder-control-room
        env:
          PAIR_CONTRACT_PATH: ../chief-ai-machine/config/founder-chief-pair.contract.json
          PAIR_CROSS_REPO_REQUIRED: 'true'
          PAIR_SELECTED_REF: ${{ steps.pair-ref.outputs.ref }}
          PAIR_SELECTED_SHA: ${{ steps.pair-ref.outputs.sha }}
          PAIR_SELECTION_MODE: ${{ steps.pair-ref.outputs.source }}
        run: node scripts/verify-founder-chief-pair.mjs
