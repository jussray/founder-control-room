name: Founder Control Room / Chief AI Pair Contract

on:
  pull_request:
    paths:
      - 'config/founder-chief-pair.contract.json'
      - 'docs/FOUNDER_INTELLIGENCE_CONSTITUTION.md'
      - 'scripts/verify-founder-chief-pair.mjs'
      - 'src/founder-os-lab/projectAdapters.ts'
      - 'src/founder-os-lab/capabilityKernel.ts'
      - 'src/founder-os-lab/engine.ts'
      - 'src/lib/n8nConveyor.ts'
      - 'src/lib/n8nConveyorRuntime.ts'
      - 'automation/n8n/founder-conveyor.workflow.json'
      - '.github/workflows/founder-chief-pair-contract.yml'
  push:
    branches: [main]
    paths:
      - 'config/founder-chief-pair.contract.json'
      - 'docs/FOUNDER_INTELLIGENCE_CONSTITUTION.md'
      - 'scripts/verify-founder-chief-pair.mjs'
      - 'src/founder-os-lab/projectAdapters.ts'
      - 'src/founder-os-lab/capabilityKernel.ts'
      - 'src/founder-os-lab/engine.ts'
      - 'src/lib/n8nConveyor.ts'
      - 'src/lib/n8nConveyorRuntime.ts'
      - 'automation/n8n/founder-conveyor.workflow.json'
      - '.github/workflows/founder-chief-pair-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-pair-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Founder Control Room source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: founder-control-room
          persist-credentials: false

      - name: Resolve paired Chief AI authority
        id: pair-ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FCR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          remote="https://github.com/jussray/chief-ai-machine.git"
          raw_base="https://raw.githubusercontent.com/jussray/chief-ai-machine"
          api_base="https://api.github.com/repos/jussray/chief-ai-machine"
          local_contract="founder-control-room/config/founder-chief-pair.contract.json"

          selected_ref="main"
          source="chief-ai-machine/main"
          selected_sha="$(git ls-remote --exit-code --heads "$remote" 'refs/heads/main' | awk 'NR==1 {print $1}')"
          printf '%s' "$selected_sha" | grep -Eq '^[0-9a-f]{40}$'

          if [ "$EVENT_NAME" = "pull_request" ]; then
            local_digest="$(sha256sum "$local_contract" | awk '{print $1}')"
            main_contract="$(mktemp)"
            curl --fail --silent --show-error --location \
              "$raw_base/$selected_sha/config/founder-chief-pair.contract.json" \
              --output "$main_contract"
            main_digest="$(sha256sum "$main_contract" | awk '{print $1}')"

            if [ "$local_digest" != "$main_digest" ]; then
              candidate_pr="$(jq -r '.candidatePairing.chiefAIPullRequest // empty' "$local_contract")"

              if printf '%s' "$candidate_pr" | grep -Eq '^[1-9][0-9]*$'; then
                candidate_json="$(curl --fail --silent --show-error \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "$api_base/pulls/$candidate_pr")"

                candidate_state="$(printf '%s' "$candidate_json" | jq -r '.state')"
                candidate_head_repo="$(printf '%s' "$candidate_json" | jq -r '.head.repo.full_name // empty')"
                candidate_base_repo="$(printf '%s' "$candidate_json" | jq -r '.base.repo.full_name // empty')"
                candidate_sha="$(printf '%s' "$candidate_json" | jq -r '.head.sha // empty')"
                candidate_ref="$(printf '%s' "$candidate_json" | jq -r '.head.ref // empty')"

                test "$candidate_state" = "open"
                test "$candidate_head_repo" = "jussray/chief-ai-machine"
                test "$candidate_base_repo" = "jussray/chief-ai-machine"
                printf '%s' "$candidate_sha" | grep -Eq '^[0-9a-f]{40}$'
                git check-ref-format --branch "$candidate_ref" >/dev/null

                remote_pr_sha="$(git ls-remote --exit-code "$remote" "refs/pull/$candidate_pr/head" | awk 'NR==1 {print $1}')"
                test "$remote_pr_sha" = "$candidate_sha"

                selected_ref="pull/$candidate_pr/head"
                selected_sha="$candidate_sha"
                source="paired-contract-candidate"
              elif [ -n "$FCR_HEAD_REF" ]; then
                git check-ref-format --branch "$FCR_HEAD_REF" >/dev/null
                if git ls-remote --exit-code --heads "$remote" "refs/heads/$FCR_HEAD_REF" >/dev/null 2>&1; then
                  selected_ref="$FCR_HEAD_REF"
                  selected_sha="$(git ls-remote --exit-code --heads "$remote" "refs/heads/$FCR_HEAD_REF" | awk 'NR==1 {print $1}')"
                  source="paired-same-name-branch"
                fi
              fi
            fi
          fi

          printf '%s' "$selected_sha" | grep -Eq '^[0-9a-f]{40}$'
          printf 'ref=%s\n' "$selected_ref" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$selected_sha" >> "$GITHUB_OUTPUT"
          printf 'source=%s\n' "$source" >> "$GITHUB_OUTPUT"
          {
            echo '## Founder ↔ Chief pair authority'
            echo
            printf -- '- FCR exact source: `%s`\n' "$GITHUB_SHA"
            printf -- '- Chief logical ref selected: `%s`\n' "$selected_ref"
            printf -- '- Chief exact SHA selected: `%s`\n' "$selected_sha"
            printf -- '- Selection mode: `%s`\n' "$source"
            if [ "$source" = "paired-contract-candidate" ]; then
              echo '- Truth boundary: candidate alignment does not grant main, merge, runtime, deployment, publication, or founder authority.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out exact Chief AI authority
        uses: actions/checkout@v4
        with:
          repository: jussray/chief-ai-machine
          ref: ${{ steps.pair-ref.outputs.sha }}
          path: chief-ai-machine
          persist-credentials: false

      - name: Verify exact Chief AI checkout
        shell: bash
        working-directory: chief-ai-machine
        env:
          EXPECTED_CHIEF_SHA: ${{ steps.pair-ref.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHIEF_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify local and cross-repository pair contract
        working-directory: founder-control-room
        env:
          PAIR_CONTRACT_PATH: ../chief-ai-machine/config/founder-chief-pair.contract.json
          PAIR_CROSS_REPO_REQUIRED: 'true'
          PAIR_SELECTED_REF: ${{ steps.pair-ref.outputs.ref }}
          PAIR_SELECTED_SHA: ${{ steps.pair-ref.outputs.sha }}
          PAIR_SELECTION_MODE: ${{ steps.pair-ref.outputs.source }}
        run: node scripts/verify-founder-chief-pair.mjs
