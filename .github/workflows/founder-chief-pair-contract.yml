name: Founder Control Room / Chief AI Pair Contract

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'config/founder-chief-pair.contract.json'
      - '.control-room/founder-chief-pair-peer-lock.json'
      - 'docs/FOUNDER_INTELLIGENCE_CONSTITUTION.md'
      - 'docs/PUBLIC_COMMUNICATION_TRUTH_CONTRACT.md'
      - 'package.json'
      - 'scripts/verify-founder-chief-pair.mjs'
      - 'test/founder-chief-pair-peer-lock.test.mjs'
      - 'src/lib/standingFounderPolicy.ts'
      - 'src/founder-os-lab/projectAdapters.ts'
      - 'src/founder-os-lab/capabilityKernel.ts'
      - 'src/founder-os-lab/engine.ts'
      - 'src/lib/n8nConveyor.ts'
      - 'src/lib/n8nConveyorRuntime.ts'
      - 'automation/n8n/founder-conveyor.workflow.json'
      - '.github/workflows/founder-chief-pair-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-pair-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Founder Control Room source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: founder-control-room
          persist-credentials: false

      - name: Determine whether pair-enforcement truth changed
        id: pair-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          required=true

          if [ "$EVENT_NAME" = "pull_request" ]; then
            printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
            printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'
            git -C founder-control-room fetch --no-tags --depth=1 \
              https://github.com/jussray/founder-control-room.git "$BASE_SHA"

            required=false
            while IFS= read -r path; do
              case "$path" in
                config/founder-chief-pair.contract.json|\
                .control-room/founder-chief-pair-peer-lock.json|\
                docs/FOUNDER_INTELLIGENCE_CONSTITUTION.md|\
                docs/PUBLIC_COMMUNICATION_TRUTH_CONTRACT.md|\
                package.json|\
                scripts/verify-founder-chief-pair.mjs|\
                src/lib/standingFounderPolicy.ts|\
                src/founder-os-lab/projectAdapters.ts|\
                src/founder-os-lab/capabilityKernel.ts|\
                src/founder-os-lab/engine.ts|\
                src/lib/n8nConveyor.ts|\
                src/lib/n8nConveyorRuntime.ts|\
                automation/n8n/founder-conveyor.workflow.json|\
                .github/workflows/founder-chief-pair-contract.yml)
                  required=true
                  break
                  ;;
              esac
            done < <(git -C founder-control-room diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi

          printf 'required=%s\n' "$required" >> "$GITHUB_OUTPUT"
          {
            echo '## Founder ↔ Chief pair scope'
            echo
            printf -- '- event: `%s`\n' "$EVENT_NAME"
            printf -- '- pair-enforcement changed: `%s`\n' "$required"
            if [ "$required" != "true" ]; then
              echo '- Required check context still reports on this PR, but cross-repository peer-candidate validation is not applicable because the pair-enforcement surface is unchanged.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pair contract unchanged for this pull request
        if: steps.pair-scope.outputs.required != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'Pair-enforcement surface unchanged; required verify-pair-contract context is satisfied without coupling this unrelated FCR change to Chief candidate state.'

      - name: Resolve contract-paired Chief authorities
        if: steps.pair-scope.outputs.required == 'true'
        id: pair-ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_FCR_PR: ${{ github.event.pull_request.number || '' }}
          FCR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          contract="founder-control-room/config/founder-chief-pair.contract.json"
          peer_lock="founder-control-room/.control-room/founder-chief-pair-peer-lock.json"
          remote="https://github.com/jussray/chief-ai-machine.git"

          jq -e '
            .relationship.topology == "standalone-peers"
            and .relationship.controlRoom.independentlyCallable == true
            and .relationship.controlRoom.ownsIdentity == true
            and .relationship.controlRoom.ownsLifecycle == true
            and .relationship.controlRoom.ownsReceipts == true
            and .relationship.controlRoom.ownsFailureState == true
            and .relationship.controlRoom.ownsContinuityMarkers == true
            and .relationship.chiefAI.independentlyCallable == true
            and .relationship.chiefAI.ownsIdentity == true
            and .relationship.chiefAI.ownsLifecycle == true
            and .relationship.chiefAI.ownsReceipts == true
            and .relationship.chiefAI.ownsFailureState == true
            and .relationship.chiefAI.ownsContinuityMarkers == true
            and .relationship.crossSystem.sharedRuntimeRequired == false
            and .relationship.crossSystem.identityCollapseAllowed == false
            and .relationship.crossSystem.implicitAuthorityTransferAllowed == false
            and .relationship.crossSystem.receiptCollapseAllowed == false
            and .relationship.crossSystem.failureCollapseAllowed == false
            and .relationship.crossSystem.continuityCollapseAllowed == false
            and .relationship.crossSystem.evidenceCreatesAuthority == false
            and .relationship.crossSystem.cooperationMayProceedWithinEachSystemsOwnAuthority == true
            and (.relationship.continuityBoundary | contains("non-secret"))
            and (.relationship.continuityBoundary | contains("non-authorizing"))
            and (.relationship.continuityBoundary | contains("recipient-side verification"))
            and (.relationship.continuityBoundary | contains("never transfers authority"))
            and (.relationship.cooperationBoundary | contains("independently valid systems"))
            and (.relationship.cooperationBoundary | contains("distinct receipts"))
            and (.relationship.cooperationBoundary | contains("never silently replaces"))
          ' "$contract" >/dev/null

          jq -e '
            .schema == "fcr/founder-chief-pair-peer-lock@v1"
            and .repository == "jussray/founder-control-room"
            and .scope == "pull-request-candidate-only"
            and .chiefAIPair.repository == "jussray/chief-ai-machine"
            and .chiefAINecessaryFixPolicy.repository == "jussray/chief-ai-machine"
            and (.chiefAIPair.expectedHeadSha | test("^[0-9a-f]{40}$"))
            and (.chiefAINecessaryFixPolicy.expectedHeadSha | test("^[0-9a-f]{40}$"))
            and .authorizesMerge == false
            and .authorizesDeployment == false
            and .authorizesProviderMutation == false
            and .runtimeTruthProven == false
          ' "$peer_lock" >/dev/null

          pair_ref="main"
          pair_sha=""
          policy_ref="main"
          policy_sha=""
          pair_source="chief-ai-machine/main"
          policy_source="chief-ai-machine/main"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            configured_fcr_pr="$(jq -r '.candidatePairing.founderControlRoomPullRequest' "$contract")"
            chief_pr="$(jq -r '.candidatePairing.chiefAIPullRequest' "$contract")"
            policy_pr="$(jq -r '.candidatePairing.chiefAINecessaryFixPolicyPullRequest' "$contract")"
            locked_fcr_pr="$(jq -r '.founderControlRoom.pullRequest' "$peer_lock")"
            locked_pair_pr="$(jq -r '.chiefAIPair.pullRequest' "$peer_lock")"
            locked_pair_sha="$(jq -r '.chiefAIPair.expectedHeadSha' "$peer_lock")"
            locked_policy_pr="$(jq -r '.chiefAINecessaryFixPolicy.pullRequest' "$peer_lock")"
            locked_policy_sha="$(jq -r '.chiefAINecessaryFixPolicy.expectedHeadSha' "$peer_lock")"

            test "$configured_fcr_pr" = "$CURRENT_FCR_PR"
            test "$locked_fcr_pr" = "$CURRENT_FCR_PR"
            printf '%s' "$chief_pr" | grep -Eq '^[1-9][0-9]*$'
            printf '%s' "$policy_pr" | grep -Eq '^[1-9][0-9]*$'
            test "$policy_pr" != "$chief_pr"
            test "$locked_pair_pr" = "$chief_pr"
            test "$locked_policy_pr" = "$policy_pr"
            printf '%s' "$locked_pair_sha" | grep -Eq '^[0-9a-f]{40}$'
            printf '%s' "$locked_policy_sha" | grep -Eq '^[0-9a-f]{40}$'

            pair_json="$(curl --fail-with-body --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/jussray/chief-ai-machine/pulls/${chief_pr}")"
            jq -e '
              .state == "open"
              and .merged_at == null
              and .base.ref == "main"
              and .head.repo.full_name == "jussray/chief-ai-machine"
              and (.head.sha | test("^[0-9a-f]{40}$"))
            ' <<<"$pair_json" >/dev/null
            pair_ref="refs/pull/${chief_pr}/head"
            pair_sha="$(jq -r '.head.sha' <<<"$pair_json")"
            test "$pair_sha" = "$locked_pair_sha"
            test "$(git ls-remote --exit-code "$remote" "$pair_ref" | awk 'NR==1 {print $1}')" = "$pair_sha"
            pair_source="candidate-locked-chief-pr-${chief_pr}"

            policy_json="$(curl --fail-with-body --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/jussray/chief-ai-machine/pulls/${policy_pr}")"
            jq -e '
              .state == "open"
              and .merged_at == null
              and .base.ref == "main"
              and .head.repo.full_name == "jussray/chief-ai-machine"
              and (.head.sha | test("^[0-9a-f]{40}$"))
            ' <<<"$policy_json" >/dev/null
            policy_ref="refs/pull/${policy_pr}/head"
            policy_sha="$(jq -r '.head.sha' <<<"$policy_json")"
            test "$policy_sha" = "$locked_policy_sha"
            test "$(git ls-remote --exit-code "$remote" "$policy_ref" | awk 'NR==1 {print $1}')" = "$policy_sha"
            policy_source="candidate-locked-chief-policy-pr-${policy_pr}"
          else
            pair_sha="$(git ls-remote --exit-code "$remote" 'refs/heads/main' | awk 'NR==1 {print $1}')"
            policy_sha="$pair_sha"
          fi

          printf '%s' "$pair_sha" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$policy_sha" | grep -Eq '^[0-9a-f]{40}$'
          printf 'pair_ref=%s\n' "$pair_ref" >> "$GITHUB_OUTPUT"
          printf 'pair_sha=%s\n' "$pair_sha" >> "$GITHUB_OUTPUT"
          printf 'policy_ref=%s\n' "$policy_ref" >> "$GITHUB_OUTPUT"
          printf 'policy_sha=%s\n' "$policy_sha" >> "$GITHUB_OUTPUT"
          printf 'pair_source=%s\n' "$pair_source" >> "$GITHUB_OUTPUT"
          printf 'policy_source=%s\n' "$policy_source" >> "$GITHUB_OUTPUT"
          {
            echo '## Founder ↔ Chief pair authority'
            echo
            printf -- '- FCR exact source: `%s`\n' "$FCR_HEAD_SHA"
            printf -- '- Chief pair ref / SHA: `%s` / `%s`\n' "$pair_ref" "$pair_sha"
            printf -- '- Chief policy ref / SHA: `%s` / `%s`\n' "$policy_ref" "$policy_sha"
            printf -- '- Pair selection mode: `%s`\n' "$pair_source"
            printf -- '- Policy selection mode: `%s`\n' "$policy_source"
            echo '- Candidate peer SHAs are immutable FCR-local evidence bindings; any live peer-head movement fails closed.'
            echo '- Topology: `standalone-peers`'
            echo '- Pair and policy carriers remain separate proof subjects.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out exact Chief AI pair authority
        if: steps.pair-scope.outputs.required == 'true'
        uses: actions/checkout@v4
        with:
          repository: jussray/chief-ai-machine
          ref: ${{ steps.pair-ref.outputs.pair_sha }}
          path: chief-ai-machine
          persist-credentials: false

      - name: Check out exact Chief necessary-fix policy carrier
        if: steps.pair-scope.outputs.required == 'true'
        uses: actions/checkout@v4
        with:
          repository: jussray/chief-ai-machine
          ref: ${{ steps.pair-ref.outputs.policy_sha }}
          path: chief-ai-policy
          persist-credentials: false

      - name: Verify exact Chief checkouts
        if: steps.pair-scope.outputs.required == 'true'
        shell: bash
        env:
          EXPECTED_PAIR_SHA: ${{ steps.pair-ref.outputs.pair_sha }}
          EXPECTED_POLICY_SHA: ${{ steps.pair-ref.outputs.policy_sha }}
        run: |
          set -euo pipefail
          test "$(git -C chief-ai-machine rev-parse HEAD)" = "$EXPECTED_PAIR_SHA"
          test "$(git -C chief-ai-policy rev-parse HEAD)" = "$EXPECTED_POLICY_SHA"

      - uses: actions/setup-node@v4
        if: steps.pair-scope.outputs.required == 'true'
        with:
          node-version: '24'

      - name: Verify peer-lock source contract
        if: steps.pair-scope.outputs.required == 'true'
        working-directory: founder-control-room
        run: node --test test/founder-chief-pair-peer-lock.test.mjs

      - name: Verify local and cross-repository pair contract
        if: steps.pair-scope.outputs.required == 'true'
        working-directory: founder-control-room
        env:
          PAIR_CONTRACT_PATH: ../chief-ai-machine/config/founder-chief-pair.contract.json
          PAIR_NECESSARY_FIX_POLICY_PATH: ../chief-ai-policy/.control-room/necessary-fix-policy.json
          PAIR_CROSS_REPO_REQUIRED: 'true'
          PAIR_PEER_LOCK_REQUIRED: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          PAIR_SELECTED_REF: ${{ steps.pair-ref.outputs.pair_ref }}
          PAIR_SELECTED_SHA: ${{ steps.pair-ref.outputs.pair_sha }}
          PAIR_SELECTION_MODE: ${{ steps.pair-ref.outputs.pair_source }}
          PAIR_POLICY_REF: ${{ steps.pair-ref.outputs.policy_ref }}
          PAIR_POLICY_SHA: ${{ steps.pair-ref.outputs.policy_sha }}
        run: node scripts/verify-founder-chief-pair.mjs
