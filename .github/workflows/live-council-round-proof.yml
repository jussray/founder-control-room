name: Live Council Round Proof

on:
  push:
    paths:
      - 'src/lib/councilRound.ts'
      - 'src/lib/operatorRelay*.ts'
      - 'src/lib/__tests__/councilRound.test.ts'
      - 'src/http/routes/missions.ts'
      - 'src/http/routes/operatorRelay.ts'
      - 'src/http/routes/__tests__/missions.liveCouncil.integration.test.ts'
      - 'src/http/routes/__tests__/operatorRelayFcrSource.route.test.ts'
      - 'e2e/live-council-round-proof.mjs'
      - '.github/workflows/live-council-round-proof.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/councilRound.ts'
      - 'src/lib/operatorRelay*.ts'
      - 'src/lib/__tests__/councilRound.test.ts'
      - 'src/http/routes/missions.ts'
      - 'src/http/routes/operatorRelay.ts'
      - 'src/http/routes/__tests__/missions.liveCouncil.integration.test.ts'
      - 'src/http/routes/__tests__/operatorRelayFcrSource.route.test.ts'
      - 'e2e/live-council-round-proof.mjs'
      - '.github/workflows/live-council-round-proof.yml'

permissions:
  contents: read

concurrency:
  group: live-council-round-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Live Council Round Proof
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck exact subject
        run: npm run typecheck

      - name: Run focused Council tests
        run: npx vitest run src/lib/__tests__/councilRound.test.ts src/lib/__tests__/operatorRelayBridge.test.ts src/lib/__tests__/operatorRelayAuthz.test.ts src/http/routes/__tests__/operatorRelayFcrSource.route.test.ts src/http/routes/__tests__/missions.liveCouncil.integration.test.ts

      - name: Build exact subject
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Prove browser Council chain
        run: node e2e/live-council-round-proof.mjs
