name: Repair Founder Session Deploy Wiring

on:
  push:
    branches:
      - fix/founder-permission-hardening-current-0884bef4
    paths:
      - .github/workflows/repair-founder-session-deploy-wiring.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/founder-permission-hardening-current-0884bef4
          fetch-depth: 0

      - name: Patch exact deploy wiring
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/deploy.yml')
          text = path.read_text()

          env_old = '          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}\n          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}\n'
          env_new = '          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}\n          FOUNDER_SESSION_ENCRYPTION_KEY: ${{ secrets.FOUNDER_SESSION_ENCRYPTION_KEY }}\n          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}\n'
          list_old = '            SUPABASE_PUBLISHABLE_KEY\n            GITHUB_WEBHOOK_SECRET\n'
          list_new = '            SUPABASE_PUBLISHABLE_KEY\n            FOUNDER_SESSION_ENCRYPTION_KEY\n            GITHUB_WEBHOOK_SECRET\n'

          if text.count(env_old) != 2:
              raise SystemExit(f'expected exactly 2 deploy env wiring sites, found {text.count(env_old)}')
          if text.count(list_old) != 2:
              raise SystemExit(f'expected exactly 2 deploy secret-list sites, found {text.count(list_old)}')

          text = text.replace(env_old, env_new)
          text = text.replace(list_old, list_new)

          if text.count('FOUNDER_SESSION_ENCRYPTION_KEY: ${{ secrets.FOUNDER_SESSION_ENCRYPTION_KEY }}') != 2:
              raise SystemExit('expected founder session encryption key in authority-gate and worker env')
          if text.count('            FOUNDER_SESSION_ENCRYPTION_KEY\n') != 2:
              raise SystemExit('expected founder session encryption key in required and Wrangler secret lists')

          path.write_text(text)

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | paste -sd, -)" = ".github/workflows/deploy.yml"
          test "$(grep -c 'FOUNDER_SESSION_ENCRYPTION_KEY: \${{ secrets.FOUNDER_SESSION_ENCRYPTION_KEY }}' .github/workflows/deploy.yml)" -eq 2
          test "$(grep -c '^            FOUNDER_SESSION_ENCRYPTION_KEY$' .github/workflows/deploy.yml)" -eq 2

      - name: Commit repair to existing carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy.yml
          git commit -m 'fix(auth): wire founder session encryption into deploy'
          git push origin HEAD:fix/founder-permission-hardening-current-0884bef4
