name: Repair Founder Session Deploy Wiring

on:
  push:
    branches:
      - fix/founder-permission-hardening-current-0884bef4
    paths:
      - .github/workflows/repair-founder-session-deploy-wiring.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/founder-permission-hardening-current-0884bef4
          fetch-depth: 0

      - name: Patch exact deploy wiring
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/deploy.yml')
          text = path.read_text()
          replacements = [
              (
                  '          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}\n          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}\n',
                  '          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}\n          FOUNDER_SESSION_ENCRYPTION_KEY: ${{ secrets.FOUNDER_SESSION_ENCRYPTION_KEY }}\n          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}\n',
                  1,
              ),
              (
                  '            SUPABASE_PUBLISHABLE_KEY\n            GITHUB_WEBHOOK_SECRET\n',
                  '            SUPABASE_PUBLISHABLE_KEY\n            FOUNDER_SESSION_ENCRYPTION_KEY\n            GITHUB_WEBHOOK_SECRET\n',
                  1,
              ),
              (
                  '            SUPABASE_PUBLISHABLE_KEY\n            GITHUB_WEBHOOK_SECRET\n            GITHUB_APP_ID\n',
                  '            SUPABASE_PUBLISHABLE_KEY\n            FOUNDER_SESSION_ENCRYPTION_KEY\n            GITHUB_WEBHOOK_SECRET\n            GITHUB_APP_ID\n',
                  1,
              ),
              (
                  '          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}\n          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}\n',
                  '          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}\n          FOUNDER_SESSION_ENCRYPTION_KEY: ${{ secrets.FOUNDER_SESSION_ENCRYPTION_KEY }}\n          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}\n',
                  1,
              ),
          ]

          for old, new, expected_count in replacements:
              count = text.count(old)
              if count < expected_count:
                  raise SystemExit(f'expected deploy wiring pattern missing: {old!r}')
              text = text.replace(old, new, expected_count)

          required = [
              'FOUNDER_SESSION_ENCRYPTION_KEY: ${{ secrets.FOUNDER_SESSION_ENCRYPTION_KEY }}',
              '            FOUNDER_SESSION_ENCRYPTION_KEY\n',
              '            FOUNDER_SESSION_ENCRYPTION_KEY\n            GITHUB_WEBHOOK_SECRET\n            GITHUB_APP_ID',
          ]
          if any(marker not in text for marker in required):
              raise SystemExit('founder session deploy wiring did not survive exact patch')

          path.write_text(text)

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | paste -sd, -)" = ".github/workflows/deploy.yml"
          grep -q 'FOUNDER_SESSION_ENCRYPTION_KEY: \${{ secrets.FOUNDER_SESSION_ENCRYPTION_KEY }}' .github/workflows/deploy.yml
          test "$(grep -c '^            FOUNDER_SESSION_ENCRYPTION_KEY$' .github/workflows/deploy.yml)" -ge 2

      - name: Commit repair to existing carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy.yml
          git commit -m 'fix(auth): wire founder session encryption into deploy'
          git push origin HEAD:fix/founder-permission-hardening-current-0884bef4
