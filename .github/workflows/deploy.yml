name: Deploy

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact current main commit approved for production deployment
        required: true
        type: string
      deployment_approval_id:
        description: Founder Control Room production decision or approval reference
        required: true
        type: string
      deployment_reason:
        description: Short reason for this production deployment
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  authority-gate:
    name: Production Authority and Exact-Head Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      DEPLOYMENT_APPROVAL_ID: ${{ inputs.deployment_approval_id }}
      DEPLOYMENT_REASON: ${{ inputs.deployment_reason }}
    steps:
      - name: Checkout exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify production authority and current main
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid exact head::expected_head_sha must be a lowercase 40-character commit SHA."
            exit 1
          fi
          if [[ ! "$DEPLOYMENT_APPROVAL_ID" =~ ^[A-Za-z0-9._:-]{8,200}$ ]]; then
            echo "::error title=Invalid production approval reference::deployment_approval_id must be an auditable 8-200 character reference."
            exit 1
          fi

          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin refs/heads/main:refs/remotes/origin/main
          CURRENT_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"

          echo "Expected approved SHA: $EXPECTED_HEAD_SHA"
          echo "Checked-out SHA:       $ACTUAL_HEAD_SHA"
          echo "Current main SHA:       $CURRENT_MAIN_SHA"
          echo "Approval reference:     $DEPLOYMENT_APPROVAL_ID"

          test "$ACTUAL_HEAD_SHA" = "$EXPECTED_HEAD_SHA"
          test "$CURRENT_MAIN_SHA" = "$EXPECTED_HEAD_SHA"

      - name: Validate required production configuration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          FOUNDER_SESSION_ENCRYPTION_KEY: ${{ secrets.FOUNDER_SESSION_ENCRYPTION_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          GITHUB_APP_ID: ${{ secrets.APP_ID }}
          GITHUB_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          FOUNDER_SIGNAL_ENGINE_MCP_TOKEN: ${{ secrets.FOUNDER_SIGNAL_ENGINE_MCP_TOKEN }}
          ZAPIER_FOUNDER_SIGNAL_ENGINE_HOOK_URL: ${{ secrets.ZAPIER_FOUNDER_SIGNAL_ENGINE_HOOK_URL }}
          FOUNDER_REVIEW_EMAIL_INGRESS_SECRET: ${{ secrets.FOUNDER_REVIEW_EMAIL_INGRESS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          required=(
            SUPABASE_DB_URL
            SUPABASE_SERVICE_ROLE_KEY
            SUPABASE_PUBLISHABLE_KEY
            FOUNDER_SESSION_ENCRYPTION_KEY
            GITHUB_WEBHOOK_SECRET
            GITHUB_APP_ID
            GITHUB_PRIVATE_KEY
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            DEPLOY_URL
            FOUNDER_SIGNAL_ENGINE_MCP_TOKEN
            ZAPIER_FOUNDER_SIGNAL_ENGINE_HOOK_URL
            FOUNDER_REVIEW_EMAIL_INGRESS_SECRET
          )
          missing=()

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf '::error title=Missing production configuration::Set these GitHub production environment secrets before deployment: %s\n' "${missing[*]}"
            exit 1
          fi

          echo "All required production configuration names are present."

      - name: Record authority receipt
        shell: bash
        run: |
          {
            echo "## Production authority receipt"
            echo
            echo "- Exact approved head: \`$EXPECTED_HEAD_SHA\`"
            echo "- Approval reference: \`$DEPLOYMENT_APPROVAL_ID\`"
            echo "- Reason: ${DEPLOYMENT_REASON:-not supplied}"
            echo "- Trigger: manual workflow dispatch"
            echo "- Broad Founder Signal automation grant: disabled"
            echo "- Proof-of-ship scheduled publication: enabled with 20-minute founder review"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 1. Supabase migrations ──────────────────────────────────────────────────────
  supabase-migrate:
    name: Supabase DB Push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    needs: authority-gate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: supabase/setup-cli@v2
        with:
          version: 2.101.0

      - name: Report Supabase CLI version
        run: supabase --version

      - name: Validate Supabase deployment configuration
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "::error title=Missing Supabase database URL::Set SUPABASE_DB_URL in the GitHub production environment before deploying."
            exit 1
          fi

          SUPABASE_DB_URL="$SUPABASE_DB_URL" python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          parsed = urlparse(os.environ['SUPABASE_DB_URL'])
          errors = []

          if parsed.scheme not in {'postgres', 'postgresql'}:
              errors.append('SUPABASE_DB_URL must use the postgres or postgresql scheme')
          if not parsed.hostname:
              errors.append('SUPABASE_DB_URL must include a database hostname')
          if not parsed.username:
              errors.append('SUPABASE_DB_URL must include a database username')
          if parsed.password is None or parsed.password == '':
              errors.append('SUPABASE_DB_URL must include the database password')
          if parsed.path.rstrip('/') != '/postgres':
              errors.append('SUPABASE_DB_URL must target the postgres database')

          try:
              port = parsed.port
          except ValueError:
              errors.append('SUPABASE_DB_URL contains an invalid port')
              port = None

          if port != 5432:
              errors.append('SUPABASE_DB_URL must use port 5432 for migration sessions')

          if errors:
              for error in errors:
                  print(f'::error title=Invalid Supabase database URL::{error}')
              raise SystemExit(1)

          if parsed.hostname.startswith('db.') and parsed.hostname.endswith('.supabase.co'):
              print(
                  '::warning title=Direct Supabase endpoint detected::'
                  'GitHub-hosted runners are IPv4-only. Prefer the Supavisor session pooler URL unless the project has the IPv4 add-on.'
              )

          print('Supabase deployment configuration is present and structurally valid.')
          PY

      - name: Capture pre-deploy migration ledger
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REMOTE_MIGRATION_LIST_PATH: test-results/migration-ledger-before.txt
          MIGRATION_LEDGER_RECEIPT_PATH: test-results/migration-ledger-before.json
          MIGRATION_LEDGER_PHASE: preflight
          REQUIRED_MIGRATION_VERSIONS: 20260723000000,20260803011000
        run: |
          set -euo pipefail
          mkdir -p test-results
          supabase migration list --db-url "$SUPABASE_DB_URL" | tee "$REMOTE_MIGRATION_LIST_PATH"
          node scripts/verify-production-migration-ledger.mjs

      - name: Preview migrations
        run: |
          set -euo pipefail
          supabase db push \
            --dry-run \
            --include-all \
            --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Push migrations
        run: |
          set -euo pipefail
          supabase db push \
            --yes \
            --include-all \
            --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Verify post-push migration ledger
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REMOTE_MIGRATION_LIST_PATH: test-results/migration-ledger-after.txt
          MIGRATION_LEDGER_RECEIPT_PATH: test-results/migration-ledger-after.json
          MIGRATION_LEDGER_PHASE: post-push
          REQUIRED_MIGRATION_VERSIONS: 20260723000000,20260803011000
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL" | tee "$REMOTE_MIGRATION_LIST_PATH"
          node scripts/verify-production-migration-ledger.mjs

      - name: Record migration ledger summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Supabase migration ledger"
            echo
            echo "- Required security migrations: \`20260723000000\`, \`20260803011000\`"
            echo "- Pre-deploy receipt: \`migration-ledger-before.json\`"
            echo "- Post-push receipt: \`migration-ledger-after.json\`"
            echo "- Remote-only versions are blocked before mutation."
            echo "- Missing local migrations are included even when production already has newer migration versions."
            echo "- Any local-only version remaining after push fails the deployment."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload migration ledger receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-migration-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/migration-ledger-before.txt
            test-results/migration-ledger-before.json
            test-results/migration-ledger-after.txt
            test-results/migration-ledger-after.json
          if-no-files-found: warn
          retention-days: 30

  # ── 2. Cloudflare Worker deploy ──────────────────────────────────────────────
  worker-deploy:
    name: Wrangler Deploy
    runs-on: ubuntu-latest
    environment: production
    needs: supabase-migrate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker with broad Founder Signal grant disabled
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.110.0'
          command: deploy --config wrangler.worker.toml --var GIT_SHA:${{ inputs.expected_head_sha }}
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY
            SUPABASE_PUBLISHABLE_KEY
            FOUNDER_SESSION_ENCRYPTION_KEY
            GITHUB_WEBHOOK_SECRET
            GITHUB_APP_ID
            GITHUB_PRIVATE_KEY
            FOUNDER_SIGNAL_AUTOMATION_GRANT_JSON
            FOUNDER_SIGNAL_ENGINE_MCP_TOKEN
            ZAPIER_FOUNDER_SIGNAL_ENGINE_HOOK_URL
            FOUNDER_REVIEW_EMAIL_INGRESS_SECRET
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          FOUNDER_SESSION_ENCRYPTION_KEY: ${{ secrets.FOUNDER_SESSION_ENCRYPTION_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          GITHUB_APP_ID: ${{ secrets.APP_ID }}
          GITHUB_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          FOUNDER_SIGNAL_ENGINE_MCP_TOKEN: ${{ secrets.FOUNDER_SIGNAL_ENGINE_MCP_TOKEN }}
          ZAPIER_FOUNDER_SIGNAL_ENGINE_HOOK_URL: ${{ secrets.ZAPIER_FOUNDER_SIGNAL_ENGINE_HOOK_URL }}
          FOUNDER_REVIEW_EMAIL_INGRESS_SECRET: ${{ secrets.FOUNDER_REVIEW_EMAIL_INGRESS_SECRET }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_SESSIONS_KV_NAMESPACE_ID: ${{ secrets.CF_SESSIONS_KV_NAMESPACE_ID }}
          CF_FEATURE_FLAGS_KV_NAMESPACE_ID: ${{ secrets.CF_FEATURE_FLAGS_KV_NAMESPACE_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          FOUNDER_SIGNAL_AUTOMATION_GRANT_JSON: >-
            {"id":"founder-signal-draft-only-v2","enabled":false,"routes":[{"channel":"linkedin","audienceSegment":"build-in-public"},{"channel":"facebook","audienceSegment":"build-in-public"}],"repositories":[],"repositoryScope":{"mode":"all_owned","owner":"jussray"},"approvedRecipientIds":[],"expiresAt":null}

  pages-release:
    name: Cloudflare Pages Production Release
    needs: worker-deploy
    uses: ./.github/workflows/pages-production-release.yml
    with:
      expected_head_sha: ${{ inputs.expected_head_sha }}
    secrets: inherit

  # ── 3. Post-deploy exact-SHA and fail-closed broad grant proof ───────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: pages-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head_sha }}
          persist-credentials: false

      - name: Verify Worker health and identity
        run: |
          set -euo pipefail
          DEPLOY_URL="${DEPLOY_URL%/}"
          HEADERS="$(mktemp)"
          trap 'rm -f "$HEADERS"' EXIT
          BODY=$(curl --fail --silent --show-error --dump-header "$HEADERS" "$DEPLOY_URL/health")
          tr -d '\r' < "$HEADERS" | grep -Eiq '^x-founder-control-room-service:[[:space:]]*founder-control-room$'
          BODY="$BODY" python3 - <<'PY'
          import json
          import os

          body = json.loads(os.environ['BODY'])
          if body != {'ok': True}:
              raise SystemExit(f'unexpected health payload: {body!r}')
          PY
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}

      - name: Verify exact deployed commit and disabled broad automation grant
        run: |
          set -euo pipefail
          DEPLOY_URL="${DEPLOY_URL%/}"
          BODY=$(curl --fail --silent --show-error "$DEPLOY_URL/version")
          BODY="$BODY" EXPECTED_SHA="${{ inputs.expected_head_sha }}" python3 - <<'PY'
          import json
          import os

          body = json.loads(os.environ['BODY'])
          expected_sha = os.environ['EXPECTED_SHA']
          deployed_sha = body.get('gitSha')
          grant = body.get('founderSignalAutomationGrant') or {}

          print(f'Expected SHA: {expected_sha}')
          print(f'Deployed SHA: {deployed_sha}')
          print(f'Grant configured: {grant.get("configured")}')
          print(f'Grant enabled: {grant.get("enabled")}')

          if body.get('service') != 'founder-control-room':
              raise SystemExit('service identity payload is missing or incorrect')
          if deployed_sha != expected_sha:
              raise SystemExit('exact deployment proof failed')
          if grant != {'configured': True, 'enabled': False}:
              raise SystemExit('broad Founder Signal automation grant fail-closed read-back failed')
          PY
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}

      - name: Verify public guardrail surface
        run: |
          set -euo pipefail
          DEPLOY_URL="${DEPLOY_URL%/}"
          BODY=$(curl --fail --silent --show-error "$DEPLOY_URL/guardrails.json")
          BODY="$BODY" python3 - <<'PY'
          import json
          import os

          body = json.loads(os.environ['BODY'])
          if body.get('sensitiveFieldsIncluded') is not False:
              raise SystemExit('guardrail surface is not public-safe')
          if body.get('standingMergeAuthority') is not True:
              raise SystemExit('standing merge authority is not active')
          PY
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}

      - name: Verify public Pages shell and exact API proxy
        run: |
          set -euo pipefail
          PUBLIC_URL="${PUBLIC_URL%/}"

          PAGE=$(curl --fail --silent --show-error "$PUBLIC_URL/")
          grep -qi 'Founder Control Room' <<<"$PAGE"

          HEADERS="$(mktemp)"
          trap 'rm -f "$HEADERS"' EXIT
          HEALTH_BODY=$(curl --fail --silent --show-error --dump-header "$HEADERS" "$PUBLIC_URL/health")
          tr -d '\r' < "$HEADERS" | grep -Eiq '^x-founder-control-room-service:[[:space:]]*founder-control-room$'
          HEALTH_BODY="$HEALTH_BODY" python3 - <<'PY'
          import json
          import os

          body = json.loads(os.environ['HEALTH_BODY'])
          if body != {'ok': True}:
              raise SystemExit(f'unexpected public health payload: {body!r}')
          PY

          VERSION_BODY=$(curl --fail --silent --show-error "$PUBLIC_URL/version")
          VERSION_BODY="$VERSION_BODY" EXPECTED_SHA="${{ inputs.expected_head_sha }}" python3 - <<'PY'
          import json
          import os

          body = json.loads(os.environ['VERSION_BODY'])
          if body.get('service') != 'founder-control-room':
              raise SystemExit('public proxy reached the wrong service')
          if body.get('gitSha') != os.environ['EXPECTED_SHA']:
              raise SystemExit('public proxy exact deployment proof failed')
          PY
        env:
          PUBLIC_URL: https://foundercontrolroom.org

  # ── 4. Verified proof-of-ship payload ───────────────────────────────────────
  proof-of-ship:
    name: Proof of Ship — Verify and Schedule with Founder Review
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    needs: smoke-test
    if: needs.smoke-test.result == 'success'
    env:
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      ZAPIER_CATCH_HOOK_URL: ${{ secrets.ZAPIER_CATCH_HOOK_URL }}
      PROOF_OF_SHIP_STEERING_GRANT_ID: ${{ secrets.PROOF_OF_SHIP_STEERING_GRANT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      PUBLISH_ALLOWED: 'true'
      LINKEDIN_BASELINE_PATH: config/linkedin-rising-floor-baseline.json
      REPOSITORY_PUBLICATION_POLICY_PATH: config/proof-of-ship-repository-policy.json
    steps:
      - name: Check out the exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify meaningful release
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          commit_message="$(git show -s --format=%s "$EXPECTED_HEAD_SHA")"
          commit_author="$(git show -s --format='%an <%ae>' "$EXPECTED_HEAD_SHA")"
          commit_body="$(git show -s --format=%b "$EXPECTED_HEAD_SHA")"
          parent_line="$(git rev-list --parents -n 1 "$EXPECTED_HEAD_SHA")"
          parent_count=$(( $(wc -w <<<"$parent_line") - 1 ))

          repository_allowed=false
          repository_policy_sha256=''
          repository_contract_id=''
          repository_sensitive=true
          if [[ -f "$REPOSITORY_PUBLICATION_POLICY_PATH" ]] && jq -e --arg repo "$GITHUB_REPOSITORY" '
            .version == 1 and
            .repository == $repo and
            .owner == "jussray" and
            .publication_eligible == true and
            (.sensitive_repository | type == "boolean") and
            .privacy_safe_marketing_contract.approved == true and
            (.privacy_safe_marketing_contract.contract_id | type == "string" and length > 0)
          ' "$REPOSITORY_PUBLICATION_POLICY_PATH" >/dev/null; then
            repository_allowed=true
            repository_policy_sha256="$(sha256sum "$REPOSITORY_PUBLICATION_POLICY_PATH" | awk '{print $1}')"
            repository_contract_id="$(jq -r '.privacy_safe_marketing_contract.contract_id' "$REPOSITORY_PUBLICATION_POLICY_PATH")"
            repository_sensitive="$(jq -r '.sensitive_repository' "$REPOSITORY_PUBLICATION_POLICY_PATH")"
          fi

          mapfile -t changed_paths < <(
            git diff-tree --root --no-commit-id --name-only -r -m "$EXPECTED_HEAD_SHA" \
              | sed '/^$/d' \
              | sort -u
          )

          has_non_doc_path=false
          meaningful_paths=()
          migration_versions=()
          for path in "${changed_paths[@]}"; do
            case "$path" in
              docs/*|*.md|*.mdx)
                continue
                ;;
            esac

            has_non_doc_path=true
            meaningful_paths+=("$path")
            if [[ "$path" =~ ^supabase/migrations/([0-9]+)_[^/]+\.sql$ ]]; then
              migration_versions+=("${BASH_REMATCH[1]}")
            fi
          done

          if ((${#changed_paths[@]} > 0)); then
            changed_paths_json="$(printf '%s\n' "${changed_paths[@]}" | jq -Rsc 'split("\n") | map(select(length > 0)) | .[0:40]')"
          else
            changed_paths_json='[]'
          fi
          if ((${#meaningful_paths[@]} > 0)); then
            meaningful_paths_json="$(printf '%s\n' "${meaningful_paths[@]}" | jq -Rsc 'split("\n") | map(select(length > 0)) | .[0:40]')"
          else
            meaningful_paths_json='[]'
          fi
          if ((${#migration_versions[@]} > 0)); then
            migration_versions_json="$(printf '%s\n' "${migration_versions[@]}" | jq -Rsc 'split("\n") | map(select(length > 0)) | unique')"
          else
            migration_versions_json='[]'
          fi

          pr_response='[]'
          if [[ -n "${GITHUB_TOKEN:-}" ]]; then
            pr_response="$(curl --silent --show-error --fail \
              --proto '=https' --proto-redir '=https' --max-redirs 0 \
              --connect-timeout 10 --max-time 20 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD_SHA/pulls" \
              || true)"
            [[ "$pr_response" == \[* ]] || pr_response='[]'
          fi

          pr_url="$(jq -r '.[0].html_url // empty' <<<"$pr_response" 2>/dev/null || true)"
          pr_title="$(jq -r '.[0].title // empty' <<<"$pr_response" 2>/dev/null || true)"
          merged_at="$(jq -r '.[0].merged_at // empty' <<<"$pr_response" 2>/dev/null || true)"

          conventional_commit_re='^(feat|fix|perf)(\([^)]*\))?!?:'
          commit_type=''
          for title in "$commit_message" "$pr_title"; do
            if [[ "$title" =~ $conventional_commit_re ]]; then
              commit_type="${BASH_REMATCH[1]}"
              break
            fi
          done

          is_wip=false
          case "${commit_message,,}" in
            wip|wip:*|'wip '*|'wip('*|'[wip]'*) is_wip=true ;;
          esac

          merged_to_main=false
          if ((parent_count >= 2)) || [[ -n "$merged_at" ]]; then
            merged_to_main=true
          fi

          meaningful=false
          if [[ "$commit_message" != *'[skip ci]'* ]] \
            && [[ "$commit_message" != *'[skip post]'* ]] \
            && ! grep -Eiq 'dependabot' <<<"$commit_author" \
            && [[ "$is_wip" == false ]] \
            && [[ "$repository_allowed" == true ]] \
            && [[ "$has_non_doc_path" == true ]] \
            && { [[ -n "$commit_type" ]] || [[ "$merged_to_main" == true ]]; }; then
            meaningful=true
          fi

          commit_body_summary="$(BODY="$commit_body" python3 - <<'PY'
          import os
          import re

          text = os.environ.get('BODY', '').strip()
          text = re.split(r'\n\s*\n', text, maxsplit=1)[0]
          text = re.sub(
              r'(?i)\b(?:bearer|token|secret|password|api[_ -]?key)\s*[:=]\s*\S+',
              '[redacted]',
              text,
          )
          text = re.sub(r'\s+', ' ', text)
          print(text[:1000])
          PY
          )"

          meaningful_json=false
          [[ "$meaningful" == true ]] && meaningful_json=true
          wip_json=false
          [[ "$is_wip" == true ]] && wip_json=true

          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg commit_sha "$EXPECTED_HEAD_SHA" \
            --arg commit_title "$commit_message" \
            --arg commit_body "$commit_body_summary" \
            --arg commit_author "$commit_author" \
            --arg commit_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${EXPECTED_HEAD_SHA}" \
            --arg pr_url "$pr_url" \
            --arg pr_title "$pr_title" \
            --arg commit_type "$commit_type" \
            --arg repository_policy_sha256 "$repository_policy_sha256" \
            --arg repository_contract_id "$repository_contract_id" \
            --argjson repository_sensitive "$repository_sensitive" \
            --argjson repository_allowed "$(if [[ "$repository_allowed" == true ]]; then echo true; else echo false; fi)" \
            --argjson changed_paths "$changed_paths_json" \
            --argjson meaningful_paths "$meaningful_paths_json" \
            --argjson migration_versions "$migration_versions_json" \
            --argjson is_wip "$wip_json" \
            --arg meaningful_reason "$(if [[ "$merged_to_main" == true ]]; then echo merged-pr-to-main; elif [[ -n "$commit_type" ]]; then echo conventional-commit; else echo filtered; fi)" \
            --argjson meaningful "$meaningful_json" \
            '{
              repo: $repo,
              commit_sha: $commit_sha,
              commit_title: $commit_title,
              commit_body: $commit_body,
              commit_author: $commit_author,
              commit_url: $commit_url,
              pr_url: $pr_url,
              pr_title: $pr_title,
              commit_type: (if $commit_type == "" then "merge" else $commit_type end),
              repository_allowed: $repository_allowed,
              repository_policy: {mode: "repo_owned_privacy_receipt", owner: "jussray"},
              repository_eligibility_receipt: (if $repository_allowed then {
                repository: $repo,
                commit_sha: $commit_sha,
                policy_sha256: $repository_policy_sha256,
                privacy_safe_marketing_approved: true,
                contract_id: $repository_contract_id,
                sensitive_repository: $repository_sensitive
              } else null end),
              changed_paths: $changed_paths,
              changed_paths_summary: ($meaningful_paths | join(", ")),
              migration_versions: $migration_versions,
              is_wip: $is_wip,
              meaningful: $meaningful,
              meaningful_reason: $meaningful_reason,
              live_state: "not_verified",
              supabase_state: "pending",
              supabase_migration_version: null,
              supabase_receipt: null,
              cloudflare_deployment_id: null,
              cloudflare_live_sha: null,
              cloudflare_receipt: null,
              publish_allowed: false,
              idempotency_key: null,
              proof_url: null,
              github_actions_run_url: null
            }' > proof-context.json

          echo "meaningful=$meaningful_json" >> "$GITHUB_OUTPUT"
          {
            echo '### Proof-of-Ship classification'
            jq '{repo, commit_sha, repository_allowed, repository_policy, repository_eligibility_receipt, meaningful, meaningful_reason, changed_paths_summary, migration_versions}' proof-context.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skip non-meaningful activity
        if: steps.classify.outputs.meaningful != 'true'
        run: |
          echo 'No verified build-in-public event: filtered by commit, author, repository privacy eligibility, or changed paths.'

      - name: Verify changed Supabase migrations on the remote database
        if: steps.classify.outputs.meaningful == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t target_versions < <(jq -r '.migration_versions[]' proof-context.json)
          if ((${#target_versions[@]} == 0)); then
            jq '.supabase_state = "not_applicable" | .supabase_receipt = null | .supabase_migration_version = null' \
              proof-context.json > proof-context.next.json
            mv proof-context.next.json proof-context.json
            echo 'No migration changed in this release; Supabase receipt is not applicable.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ -z "${SUPABASE_DB_URL:-}" ]]; then
            echo '::error title=Supabase proof blocked::SUPABASE_DB_URL is required when a migration changed.'
            exit 1
          fi
          if ! command -v psql >/dev/null 2>&1; then
            echo '::error title=Supabase proof blocked::The runner does not provide psql.'
            exit 1
          fi

          if ! remote_versions="$(PGCONNECT_TIMEOUT=15 psql "$SUPABASE_DB_URL" \
            -v ON_ERROR_STOP=1 -Atq \
            -c 'SELECT version::text FROM supabase_migrations.schema_migrations ORDER BY version DESC;' \
            2>/dev/null)"; then
            echo '::error title=Supabase proof failed::The remote migration history could not be queried.'
            exit 1
          fi

          for target in "${target_versions[@]}"; do
            if ! grep -Fxq "$target" <<<"$remote_versions"; then
              echo "::error title=Supabase migration not verified::Migration $target is not present in the remote schema_migrations table."
              exit 1
            fi
          done

          target_versions_csv="$(IFS=', '; echo "${target_versions[*]}")"
          jq --arg receipt "schema_migrations: $target_versions_csv" \
            --arg version "$target_versions_csv" \
            '.supabase_state = "verified" | .supabase_receipt = $receipt | .supabase_migration_version = $version' \
            proof-context.json > proof-context.next.json
          mv proof-context.next.json proof-context.json
          echo "Supabase receipt verified for migration version(s): $target_versions_csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the live Worker still reports the deployed SHA
        if: steps.classify.outputs.meaningful == 'true'
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_URL="${DEPLOY_URL%/}"
          if [[ "$DEPLOY_URL" != https://* ]]; then
            echo '::error title=Cloudflare proof blocked::DEPLOY_URL must be an HTTPS origin.'
            exit 1
          fi

          version_body=''
          for attempt in 1 2 3 4 5 6; do
            candidate="$(curl --silent --show-error \
              --proto '=https' --proto-redir '=https' --max-redirs 0 \
              --connect-timeout 10 --max-time 20 \
              "$DEPLOY_URL/version" 2>/dev/null || true)"
            if [[ -n "$candidate" ]] && jq -e --arg expected "$EXPECTED_HEAD_SHA" \
              '.service == "founder-control-room" and .gitSha == $expected' \
              <<<"$candidate" >/dev/null 2>&1; then
              version_body="$candidate"
              break
            fi
            sleep 10
          done

          if [[ -z "$version_body" ]]; then
            echo '::error title=Cloudflare SHA proof failed::The live Worker did not report the exact deployed commit SHA.'
            exit 1
          fi

          live_sha="$(jq -r '.gitSha' <<<"$version_body")"
          deployment_id="$(jq -r '.deploymentId // .deployment_id // empty' <<<"$version_body")"
          jq --arg live_sha "$live_sha" \
            --arg deployment_id "$deployment_id" \
            --arg receipt "$DEPLOY_URL/version -> gitSha=$live_sha" \
            '.cloudflare_live_sha = $live_sha | .cloudflare_deployment_id = (if $deployment_id == "" then null else $deployment_id end) | .cloudflare_receipt = $receipt' \
            proof-context.json > proof-context.next.json
          mv proof-context.next.json proof-context.json
          echo "Cloudflare receipt verified: $DEPLOY_URL/version reports $live_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain verified proof for founder review
        if: steps.classify.outputs.meaningful == 'true' && env.PUBLISH_ALLOWED != 'true'
        shell: bash
        run: |
          set -euo pipefail

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          idempotency_key="${GITHUB_REPOSITORY}:${EXPECTED_HEAD_SHA}"
          verified_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq --arg run_url "$run_url" \
            --arg idempotency_key "$idempotency_key" \
            --arg verified_at "$verified_at" \
            '.live_state = "verified" |
             .publish_allowed = false |
             .PUBLISH_ALLOWED = false |
             .idempotency_key = $idempotency_key |
             .proof_url = $run_url |
             .github_actions_run_url = $run_url |
             .source_event = "workflow_dispatch" |
             .verified_at = $verified_at |
             .source_commit_sha = .commit_sha |
             .authorization_mode = "founder-review-required" |
             .destination_mode = "founder_review" |
             .buffer_method = "none" |
             .buffer_save_to_draft = false |
             .buffer_terminal_action = "hold" |
             .share_now_allowed = false' \
            proof-context.json > proof-review.json

          jq -e '
            .live_state == "verified" and
            .publish_allowed == false and
            .PUBLISH_ALLOWED == false and
            .authorization_mode == "founder-review-required" and
            .destination_mode == "founder_review" and
            .buffer_method == "none" and
            .buffer_terminal_action == "hold" and
            .share_now_allowed == false and
            .cloudflare_live_sha == .commit_sha
          ' proof-review.json >/dev/null

          {
            echo '### Verified proof retained for founder review'
            jq '{repo, commit_sha, pr_url, commit_url, live_state, supabase_state, cloudflare_live_sha, proof_url, idempotency_key, publish_allowed, PUBLISH_ALLOWED, authorization_mode, destination_mode, buffer_method, buffer_terminal_action}' proof-review.json
            echo
            echo 'No Zapier Catch Hook or Buffer scheduling request was sent. Publication remains blocked until a separately reviewed authority change.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload founder-review proof artifact
        if: steps.classify.outputs.meaningful == 'true' && env.PUBLISH_ALLOWED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: proof-of-ship-founder-review-${{ inputs.expected_head_sha }}
          path: proof-review.json
          if-no-files-found: error
          retention-days: 30

      - name: POST verified proof payload to Zapier Catch Hook
        if: steps.classify.outputs.meaningful == 'true' && env.PUBLISH_ALLOWED == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${PUBLISH_ALLOWED:-false}" != true ]]; then
            echo '::error title=Publication gate blocked::PUBLISH_ALLOWED must be true for the scheduled-publication contract.'
            exit 1
          fi
          if [[ -z "${ZAPIER_CATCH_HOOK_URL:-}" ]]; then
            echo '::error title=Zapier proof blocked::The configured Catch Hook URL is missing.'
            exit 1
          fi
          if [[ -z "${PROOF_OF_SHIP_STEERING_GRANT_ID:-}" ]]; then
            echo '::error title=Publication grant blocked::Set PROOF_OF_SHIP_STEERING_GRANT_ID to explicitly activate scheduled publication.'
            exit 1
          fi
          if [[ ! "$PROOF_OF_SHIP_STEERING_GRANT_ID" =~ ^[A-Za-z0-9._:-]{1,100}$ ]]; then
            echo '::error title=Publication grant blocked::PROOF_OF_SHIP_STEERING_GRANT_ID contains unsupported characters.'
            exit 1
          fi
          if [[ ! -f "$LINKEDIN_BASELINE_PATH" ]]; then
            echo '::error title=LinkedIn baseline missing::The checked-in rising-floor baseline receipt is required before scheduling LinkedIn.'
            exit 1
          fi

          jq -e '
            .version == 1 and
            .platform == "linkedin" and
            .source.verified == true and
            (.source.created_at_utc | type == "string" and length > 0) and
            (.baseline_ref | type == "string" and length > 0) and
            (.period.end | type == "string" and length > 0) and
            (.period.complete == true or (.period.complete == false and .partial_day_receipt.complete == false)) and
            (.policy.max_age_hours | type == "number" and . > 0) and
            (.policy.max_period_lag_days | type == "number" and . >= 0) and
            .policy.stale_behavior == "fail_closed_before_linkedin_schedule" and
            .policy.partial_window_policy == "never_classify_an_incomplete_or_rolling_window_as_a_decline_without_like_for_like_evidence" and
            .policy.target_mode == "beat_previous_verified_floor_without_sacrificing_quality"
          ' "$LINKEDIN_BASELINE_PATH" >/dev/null

          LINKEDIN_BASELINE_PATH="$LINKEDIN_BASELINE_PATH" python3 - <<'PY'
          import json
          import os
          from datetime import date, datetime, timedelta, timezone

          path = os.environ['LINKEDIN_BASELINE_PATH']
          with open(path, encoding='utf-8') as handle:
              baseline = json.load(handle)

          source_created = datetime.fromisoformat(
              baseline['source']['created_at_utc'].replace('Z', '+00:00')
          )
          if source_created.tzinfo is None:
              raise SystemExit('LinkedIn baseline stale: source timestamp must include timezone')
          source_created = source_created.astimezone(timezone.utc)

          now = datetime.now(timezone.utc)
          if source_created > now + timedelta(minutes=5):
              raise SystemExit('LinkedIn baseline stale: source timestamp is in the future')

          max_age_hours = int(baseline['policy']['max_age_hours'])
          age = now - source_created
          if age > timedelta(hours=max_age_hours):
              raise SystemExit(
                  f'LinkedIn baseline stale: source age {age} exceeds {max_age_hours} hours'
              )

          period_end = date.fromisoformat(baseline['period']['end'])
          period_lag_days = (now.date() - period_end).days
          max_period_lag_days = int(baseline['policy']['max_period_lag_days'])
          if period_lag_days < 0:
              raise SystemExit('LinkedIn baseline stale: period end is in the future')
          if period_lag_days > max_period_lag_days:
              raise SystemExit(
                  'LinkedIn baseline stale: '
                  f'period lag {period_lag_days} days exceeds {max_period_lag_days}'
              )

          print(
              'LinkedIn baseline freshness verified: '
              f'age_hours={age.total_seconds() / 3600:.2f}, '
              f'period_lag_days={period_lag_days}'
          )
          PY

          jq -e '
            (.meaningful == true) and
            (.repository_allowed == true) and
            (.repository_policy.mode == "repo_owned_privacy_receipt") and
            (.repository_policy.owner == "jussray") and
            (.repo | startswith("jussray/")) and
            (.repository_eligibility_receipt.repository == .repo) and
            (.repository_eligibility_receipt.commit_sha == .commit_sha) and
            (.repository_eligibility_receipt.privacy_safe_marketing_approved == true) and
            (.repository_eligibility_receipt.policy_sha256 | test("^[0-9a-f]{64}$")) and
            (.repository_eligibility_receipt.contract_id | length > 0) and
            (.commit_sha | test("^[0-9a-f]{40}$")) and
            ((.supabase_state == "verified") or (.supabase_state == "not_applicable")) and
            (.cloudflare_live_sha == .commit_sha)
          ' proof-context.json >/dev/null

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          idempotency_key="${GITHUB_REPOSITORY}:${EXPECTED_HEAD_SHA}"
          verified_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          scheduled_at="$(date -u -d "$verified_at + 20 minutes" +%Y-%m-%dT%H:%M:%SZ)"
          invocation_id="$(python3 - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )"
          batch_id="$invocation_id"
          steering_grant_id="$PROOF_OF_SHIP_STEERING_GRANT_ID"
          founder_approval_id="standing-policy:${steering_grant_id}:${invocation_id}"
          linkedin_baseline_json="$(jq -c '.' "$LINKEDIN_BASELINE_PATH")"
          linkedin_baseline_ref="$(jq -r '.baseline_ref' "$LINKEDIN_BASELINE_PATH")"

          jq --arg run_url "$run_url" \
            --arg idempotency_key "$idempotency_key" \
            --arg verified_at "$verified_at" \
            --arg scheduled_at "$scheduled_at" \
            --arg invocation_id "$invocation_id" \
            --arg batch_id "$batch_id" \
            --arg steering_grant_id "$steering_grant_id" \
            --arg founder_approval_id "$founder_approval_id" \
            --arg linkedin_baseline_ref "$linkedin_baseline_ref" \
            --argjson linkedin_baseline "$linkedin_baseline_json" \
            '.live_state = "verified" |
             .publish_allowed = true |
             .PUBLISH_ALLOWED = true |
             .idempotency_key = $idempotency_key |
             .proof_url = $run_url |
             .github_actions_run_url = $run_url |
             .source_event = "workflow_dispatch" |
             .verified_at = $verified_at |
             .source_commit_sha = .commit_sha |
             .invocation_id = $invocation_id |
             .batch_id = $batch_id |
             .steering_grant_id = $steering_grant_id |
             .founder_approval_id = $founder_approval_id |
             .authorization_mode = "standing-policy" |
             .schedule_policy_id = "buffer-20-minute-review-v1" |
             .notification_mode = "gmail_campaign_digest" |
             .generated_at = $verified_at |
             .scheduled_at = $scheduled_at |
             .review_deadline = $scheduled_at |
             .review_window_minutes = 20 |
             .share_now_allowed = false |
             .destination_mode = "schedule" |
             .buffer_provider_action = "buffer_add_to_queue" |
             .buffer_method = "schedule" |
             .buffer_save_to_draft = false |
             .buffer_api_sharing_mode = "customScheduled" |
             .content_mode = "proof-led-build-in-public" |
             .requested_channels = ["x", "linkedin"] |
             .requested_content_fields = ["x_draft", "linkedin_draft"] |
             .linkedin_strategy_required = true |
             .linkedin_rising_floor_ready = false |
             .linkedin_baseline_ref = $linkedin_baseline_ref |
             .linkedin_baseline = $linkedin_baseline |
             .linkedin_baseline_freshness_checked_at = $verified_at |
             .linkedin_required_output_fields = [
               "linkedin_rising_floor_ready",
               "linkedin_baseline_ref",
               "linkedin_growth_hypothesis",
               "linkedin_24h_gate",
               "linkedin_48h_gate",
               "linkedin_next_mutation"
             ] |
             .buffer_terminal_action = "schedule"' \
            proof-context.json > proof-payload.json

          jq -e --arg expected_receipt "$founder_approval_id" '
            .live_state == "verified" and
            .publish_allowed == true and
            .PUBLISH_ALLOWED == true and
            .repository_policy.mode == "repo_owned_privacy_receipt" and
            .repository_policy.owner == "jussray" and
            (.repo | startswith("jussray/")) and
            (.repository_eligibility_receipt.repository == .repo) and
            (.repository_eligibility_receipt.commit_sha == .commit_sha) and
            (.repository_eligibility_receipt.privacy_safe_marketing_approved == true) and
            (.repository_eligibility_receipt.policy_sha256 | test("^[0-9a-f]{64}$")) and
            (.repository_eligibility_receipt.contract_id | length > 0) and
            .destination_mode == "schedule" and
            .buffer_method == "schedule" and
            .buffer_save_to_draft == false and
            .share_now_allowed == false and
            .schedule_policy_id == "buffer-20-minute-review-v1" and
            .authorization_mode == "standing-policy" and
            .linkedin_strategy_required == true and
            .linkedin_rising_floor_ready == false and
            .linkedin_baseline.source.verified == true and
            .linkedin_baseline_ref == .linkedin_baseline.baseline_ref and
            (.linkedin_baseline_freshness_checked_at | length > 0) and
            (.linkedin_required_output_fields | index("linkedin_rising_floor_ready") != null) and
            (.linkedin_required_output_fields | index("linkedin_growth_hypothesis") != null) and
            (.linkedin_required_output_fields | index("linkedin_24h_gate") != null) and
            (.linkedin_required_output_fields | index("linkedin_48h_gate") != null) and
            (.linkedin_required_output_fields | index("linkedin_next_mutation") != null) and
            (.invocation_id | test("^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$")) and
            .founder_approval_id == $expected_receipt and
            (.proof_url | startswith("https://")) and
            (.idempotency_key | length > 0) and
            .cloudflare_live_sha == .commit_sha
          ' proof-payload.json >/dev/null

          curl --silent --show-error --fail \
            --proto '=https' --proto-redir '=https' --max-redirs 0 \
            --connect-timeout 10 --max-time 30 \
            -H 'Content-Type: application/json' \
            --data-binary @proof-payload.json \
            --output /dev/null \
            "$ZAPIER_CATCH_HOOK_URL"

          {
            echo '### Verified proof payload sent for scheduled publication'
            jq '{repo, commit_sha, pr_url, commit_url, live_state, supabase_state, supabase_migration_version, cloudflare_live_sha, proof_url, idempotency_key, publish_allowed, PUBLISH_ALLOWED, repository_policy, repository_eligibility_receipt, destination_mode, buffer_method, scheduled_at, review_deadline, linkedin_strategy_required, linkedin_rising_floor_ready, linkedin_baseline_ref, linkedin_baseline_freshness_checked_at, linkedin_required_output_fields, buffer_terminal_action}' proof-payload.json
            echo
            echo 'The downstream Zap must dedupe by idempotency_key, use ChatGPT Conversation with the verified fresh LinkedIn baseline, populate the required rising-floor strategy fields, validate proof URLs, and schedule through the Buffer firewall under the 20-minute review-window contract.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 5. Post-deploy database reconciliation inspection ───────────────────────
  reconcile:
    name: Post-Deploy Reconciliation
    runs-on: ubuntu-latest
    needs: smoke-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Control Room database inspection
        run: npx tsx src/reconciliation/scripts/self-reconcile.ts
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Record reconciliation ingestion gate
        run: |
          echo "Database inspection completed."
          echo "Cross-service reconciliation POSTs remain disabled until the deployed Worker has a durable ingestion consumer."
