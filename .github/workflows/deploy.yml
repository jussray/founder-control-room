name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Supabase migrations ──────────────────────────────────────────────────────
  supabase-migrate:
    name: Supabase DB Push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.101.0

      - name: Report Supabase CLI version
        run: supabase --version

      - name: Preview migrations
        run: |
          set -euo pipefail
          supabase db push \
            --dry-run \
            --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Push migrations
        run: |
          set -euo pipefail
          supabase db push \
            --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  # ── 2. Cloudflare Worker deploy ──────────────────────────────────────────────
  worker-deploy:
    name: Wrangler Deploy
    runs-on: ubuntu-latest
    environment: production
    needs: supabase-migrate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.110.0'
          command: deploy --config wrangler.toml --var GIT_SHA:${{ github.sha }}
          secrets: |
            FOUNDER_SIGNAL_AUTOMATION_GRANT_JSON
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_SESSIONS_KV_NAMESPACE_ID: ${{ secrets.CF_SESSIONS_KV_NAMESPACE_ID }}
          CF_FEATURE_FLAGS_KV_NAMESPACE_ID: ${{ secrets.CF_FEATURE_FLAGS_KV_NAMESPACE_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          FOUNDER_SIGNAL_AUTOMATION_GRANT_JSON: >-
            {"id":"founder-approved-auto-distribution-v1","enabled":true,"routes":[{"channel":"linkedin","audienceSegment":"build-in-public"},{"channel":"facebook","audienceSegment":"build-in-public"}],"repositories":["jussray/Sekret-Bip"],"approvedRecipientIds":[],"expiresAt":null}

  # ── 3. Post-deploy exact-SHA and grant proof ────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: worker-deploy
    steps:
      - uses: actions/checkout@v4

      - name: Verify Worker health
        run: |
          set -euo pipefail
          DEPLOY_URL="${DEPLOY_URL%/}"
          BODY=$(curl --fail --silent --show-error "$DEPLOY_URL/health")
          BODY="$BODY" python3 - <<'PY'
          import json
          import os

          body = json.loads(os.environ['BODY'])
          if body != {'ok': True}:
              raise SystemExit(f'unexpected health payload: {body!r}')
          PY
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}

      - name: Verify exact deployed commit and social grant
        run: |
          set -euo pipefail
          DEPLOY_URL="${DEPLOY_URL%/}"
          BODY=$(curl --fail --silent --show-error "$DEPLOY_URL/version")
          BODY="$BODY" EXPECTED_SHA="$GITHUB_SHA" python3 - <<'PY'
          import json
          import os

          body = json.loads(os.environ['BODY'])
          expected_sha = os.environ['EXPECTED_SHA']
          deployed_sha = body.get('gitSha')
          grant = body.get('founderSignalAutomationGrant') or {}

          print(f'Expected SHA: {expected_sha}')
          print(f'Deployed SHA: {deployed_sha}')
          print(f'Grant configured: {grant.get("configured")}')
          print(f'Grant enabled: {grant.get("enabled")}')

          if deployed_sha != expected_sha:
              raise SystemExit('exact deployment proof failed')
          if grant != {'configured': True, 'enabled': True}:
              raise SystemExit('social grant activation read-back failed')
          PY
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}

      - name: Verify public guardrail surface
        run: |
          set -euo pipefail
          DEPLOY_URL="${DEPLOY_URL%/}"
          BODY=$(curl --fail --silent --show-error "$DEPLOY_URL/guardrails.json")
          BODY="$BODY" python3 - <<'PY'
          import json
          import os

          body = json.loads(os.environ['BODY'])
          if body.get('sensitiveFieldsIncluded') is not False:
              raise SystemExit('guardrail surface is not public-safe')
          if body.get('standingMergeAuthority') is not True:
              raise SystemExit('standing merge authority is not active')
          PY
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}

  # ── 4. Post-deploy database reconciliation inspection ───────────────────────
  reconcile:
    name: Post-Deploy Reconciliation
    runs-on: ubuntu-latest
    needs: smoke-test
    # Reconciliation drift is retained as evidence but does not roll back a
    # deployment that already passed exact-SHA and public-surface proof.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Control Room database inspection
        run: npx tsx src/reconciliation/scripts/self-reconcile.ts
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Record reconciliation ingestion gate
        run: |
          echo "Database inspection completed."
          echo "Cross-service reconciliation POSTs remain disabled until the deployed Worker has a durable ingestion consumer."
