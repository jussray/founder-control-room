name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
      - name: Record and verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify MCP boundaries
        run: npm run verify:mcp
      - name: Type check
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
      - name: Record and verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
      - name: Record and verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
      - name: Record and verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for Playwright harness
        shell: bash
        run: |
          sudo mkdir -p /opt/pw-browsers
          sudo chown -R "$USER:$USER" /opt/pw-browsers
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright install --with-deps chromium

      - name: Run Playwright browser proof
        run: npm run test:e2e
        env:
          NODE_ENV: test
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers

  rls-contract:
    name: RLS migration contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
      - name: Record and verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify every public migration table has reviewed RLS state
        shell: bash
        run: |
          set -o pipefail
          npm run verify:rls-contract 2>&1 | tee rls-contract-report.txt
      - name: Upload RLS contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rls-contract-report
          path: rls-contract-report.txt
          if-no-files-found: error
          retention-days: 14

  migration-lint:
    name: Migration lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Lint migrations
        run: supabase db lint --local
        continue-on-error: true

  gate0-diagnostic:
    name: Gate 0 base diagnostic
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Cloudflare diagnostic for exact base main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          printf 'gate0_base_sha=%s\n' "$BASE_SHA"

          run_id="$(
            gh api "/repos/${REPOSITORY}/actions/workflows/cloudflare-build-diagnostic.yml/runs?branch=main&status=completed&per_page=100" \
              | jq -r --arg sha "$BASE_SHA" \
                '.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success") | .id' \
              | head -n 1
          )"

          if [ -z "$run_id" ]; then
            echo "Gate 0 blocked: no successful Cloudflare Build Diagnostic exists for exact base main ${BASE_SHA}."
            exit 1
          fi

          printf 'gate0_diagnostic_run_id=%s\n' "$run_id"
          echo "Gate 0 base diagnostic passed for ${BASE_SHA}."

  required-gate:
    name: Required Gate
    if: ${{ always() }}
    needs:
      - typecheck
      - lint
      - test
      - e2e
      - rls-contract
      - gate0-diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Enforce load-bearing CI results
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          RLS_RESULT: ${{ needs.rls-contract.result }}
          GATE0_RESULT: ${{ needs.gate0-diagnostic.result }}
        run: |
          set -euo pipefail
          printf 'event=%s\ntypecheck=%s\nlint=%s\ntest=%s\ne2e=%s\nrls=%s\ngate0=%s\n' \
            "$EVENT_NAME" \
            "$TYPECHECK_RESULT" \
            "$LINT_RESULT" \
            "$TEST_RESULT" \
            "$E2E_RESULT" \
            "$RLS_RESULT" \
            "$GATE0_RESULT"

          for result in \
            "$TYPECHECK_RESULT" \
            "$LINT_RESULT" \
            "$TEST_RESULT" \
            "$E2E_RESULT" \
            "$RLS_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Required Gate blocked: at least one load-bearing CI job is not successful."
              exit 1
            fi
          done

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$GATE0_RESULT" != "success" ]; then
            echo "Required Gate blocked: exact base main does not have a successful Gate 0 diagnostic receipt."
            exit 1
          fi

          if [ "$EVENT_NAME" != "pull_request" ] && [ "$GATE0_RESULT" != "skipped" ]; then
            echo "Required Gate blocked: unexpected Gate 0 diagnostic state for non-PR event."
            exit 1
          fi

          echo "Required Gate passed for ${EXPECTED_HEAD_SHA}."
