name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  DOC_TRUTH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  TEST_DISCOVERY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
      - name: Record and verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify MCP boundaries
        run: npm run verify:mcp
      - name: Type check
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
      - name: Record and verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
      - name: Record and verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
      - name: Record and verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for Playwright harness
        shell: bash
        run: |
          sudo mkdir -p /opt/pw-browsers
          sudo chown -R "$USER:$USER" /opt/pw-browsers
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright install --with-deps chromium

      - name: Run Playwright browser proof
        run: npm run test:e2e
        env:
          NODE_ENV: test
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
      - name: Record and verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python unit tests
        run: python3 -m unittest scripts.test_whoami scripts.test_capability_receipt -v

  rls-contract:
    name: RLS migration contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
      - name: Record and verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify every public migration table has reviewed RLS state
        shell: bash
        run: |
          set -o pipefail
          npm run verify:rls-contract 2>&1 | tee rls-contract-report.txt
      - name: Upload RLS contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rls-contract-report
          path: rls-contract-report.txt
          if-no-files-found: error
          retention-days: 14

  documentation-truth:
    name: Documentation truth
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head with history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\nbase=%s\n' "$EXPECTED_HEAD_SHA" "$actual" "$DOC_TRUTH_BASE_SHA"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify documentation truth
        run: node scripts/verify-documentation-truth.mjs
      - name: Upload documentation truth report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-truth-ci-${{ github.run_id }}
          path: artifacts/documentation-truth-report.json
          if-no-files-found: error
          retention-days: 14

  cloudflare-bridge-authority:
    name: Cloudflare bridge authority contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare bridge syntax and authority contracts
        run: |
          node --check scripts/provider-credential-contract.mjs
          node --check scripts/reconcile-cloudflare-access-public-zone.mjs
          node --check scripts/verify-fcr-front-door-playwright.mjs
          node --test scripts/provider-credential-contract.node-test.mjs
          node --test scripts/reconcile-cloudflare-access-public-zone.node-test.mjs
          node --test scripts/fcr-cloudflare-bridge-contract.node-test.mjs

  test-discovery:
    name: Test discovery ratchet
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - name: Record and verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove the discovery ratchet rejects baseline laundering
        run: node --test scripts/verify-test-discovery.node-test.mjs
      - name: Verify no test is excluded from default discovery without base-bound debt
        run: npm run verify:test-discovery

  migration-lint:
    name: Migration lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Lint migrations
        run: supabase db lint --local
        continue-on-error: true

  required-gate:
    name: Required Gate
    if: ${{ always() }}
    needs:
      - typecheck
      - lint
      - test
      - e2e
      - python-tests
      - rls-contract
      - test-discovery
      - documentation-truth
      - cloudflare-bridge-authority
    runs-on: ubuntu-latest
    steps:
      - name: Enforce load-bearing CI results
        shell: bash
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          RLS_RESULT: ${{ needs.rls-contract.result }}
          DISCOVERY_RESULT: ${{ needs.test-discovery.result }}
          DOCUMENTATION_TRUTH_RESULT: ${{ needs.documentation-truth.result }}
          CLOUDFLARE_AUTHORITY_RESULT: ${{ needs.cloudflare-bridge-authority.result }}
        run: |
          set -euo pipefail
          printf 'typecheck=%s\nlint=%s\ntest=%s\ne2e=%s\npython=%s\nrls=%s\ndiscovery=%s\ndocumentation_truth=%s\ncloudflare_authority=%s\n' \
            "$TYPECHECK_RESULT" \
            "$LINT_RESULT" \
            "$TEST_RESULT" \
            "$E2E_RESULT" \
            "$PYTHON_RESULT" \
            "$RLS_RESULT" \
            "$DISCOVERY_RESULT" \
            "$DOCUMENTATION_TRUTH_RESULT" \
            "$CLOUDFLARE_AUTHORITY_RESULT"

          for result in \
            "$TYPECHECK_RESULT" \
            "$LINT_RESULT" \
            "$TEST_RESULT" \
            "$E2E_RESULT" \
            "$PYTHON_RESULT" \
            "$RLS_RESULT" \
            "$DISCOVERY_RESULT" \
            "$DOCUMENTATION_TRUTH_RESULT" \
            "$CLOUDFLARE_AUTHORITY_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Required Gate blocked: at least one load-bearing CI job is not successful."
              exit 1
            fi
          done

          echo "Required Gate passed for ${EXPECTED_HEAD_SHA}."
