name: Active Defense Proof

on:
  push:
    branches:
      - feat/active-defense-hallway-48000
    paths:
      - 'src/security/activeDefense.ts'
      - 'src/security/activeDefense.test.ts'
      - 'src/worker/cf-entry.ts'
      - '.github/workflows/active-defense-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused unit proof
        run: npx vitest run src/security/activeDefense.test.ts
      - name: Type proof
        run: npm run typecheck
      - name: Worker dry-run proof
        run: npm run cf:dry-run
