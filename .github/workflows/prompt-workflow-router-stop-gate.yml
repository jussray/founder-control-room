name: Prompt Workflow Router Stop Gate

on:
  pull_request:
    paths:
      - 'src/http/server.ts'
      - 'src/http/routes/builderPromptWorkflow.ts'
      - 'scripts/prompt-workflow-router-gate.mjs'
      - '.github/workflows/prompt-workflow-router-stop-gate.yml'

permissions:
  contents: read

jobs:
  runtime-path-present:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/prompt-workflow-router-gate.mjs
