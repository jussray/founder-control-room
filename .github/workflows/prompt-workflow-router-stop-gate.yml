name: Prompt Workflow Router Stop Gate

on:
  pull_request:
    paths:
      - 'src/http/server.ts'
      - 'src/http/routes/builderPromptWorkflow.ts'
      - 'scripts/prompt-workflow-router-gate.mjs'
      - '.github/workflows/prompt-workflow-router-stop-gate.yml'

permissions:
  contents: read

# Superseded pull_request runs are cancelled: only the newest head's result can count.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime-path-present:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/prompt-workflow-router-gate.mjs
