name: Prompt Workflow Router Stop Gate

on:
  pull_request:
    paths:
      - 'src/http/server.ts'
      - 'src/http/routes/builderPromptWorkflow.ts'
      - 'scripts/prompt-workflow-router-gate.mjs'
      - '.github/workflows/prompt-workflow-router-stop-gate.yml'

permissions:
  contents: read

jobs:
  runtime-path-present:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node scripts/prompt-workflow-router-gate.mjs
