name: Reconcile FCR Governance Phase

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

jobs:
  reconcile:
    if: >-
      github.event.issue.number == 418 &&
      github.event.comment.user.id == 286642846 &&
      github.event.comment.user.login == 'jussray' &&
      startsWith(github.event.comment.body, '/reconcile-fcr-governance-phase ')
    name: Reconcile exact FCR governance phase
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: fcr-governance-phase-reconcile
      cancel-in-progress: false
    env:
      GITHUB_APP_ID: ${{ secrets.APP_ID }}
      GITHUB_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    steps:
      - name: Parse founder phase command
        id: command
        env:
          COMMAND_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          parts = os.environ.get('COMMAND_BODY', '').strip().split()
          if len(parts) != 4 or parts[0] != '/reconcile-fcr-governance-phase':
              raise SystemExit(
                  'Expected exactly: /reconcile-fcr-governance-phase <40-char-current-main-sha> <founder_only|independent_review> <approval-reference>'
              )
          main_sha, phase, approval = parts[1], parts[2], parts[3]
          if not re.fullmatch(r'[0-9a-f]{40}', main_sha):
              raise SystemExit('Current main SHA must be a lowercase 40-character commit SHA.')
          if phase not in {'founder_only', 'independent_review'}:
              raise SystemExit('Governance phase must be founder_only or independent_review.')
          if not re.fullmatch(r'[A-Za-z0-9._:-]{8,200}', approval):
              raise SystemExit('Approval reference must use 8-200 auditable characters: A-Z a-z 0-9 . _ : -')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'expected_main_sha={main_sha}\n')
              output.write(f'governance_phase={phase}\n')
              output.write(f'approval_reference={approval}\n')
          PY

      - name: Check out founder-bound exact current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.command.outputs.expected_main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed unless command targets exact current main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ steps.command.outputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          printf 'requested_main=%s\nchecked_out=%s\ncurrent_main=%s\n' "$EXPECTED_MAIN_SHA" "$checked_out" "$current_main"
          test "$checked_out" = "$EXPECTED_MAIN_SHA"
          test "$current_main" = "$EXPECTED_MAIN_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build canonical provider implementation
        run: npm run build

      - name: Reconcile requested phase and prove provider readback
        env:
          EXPECTED_MAIN_SHA: ${{ steps.command.outputs.expected_main_sha }}
          FCR_GOVERNANCE_PHASE: ${{ steps.command.outputs.governance_phase }}
          GOVERNANCE_APPROVAL_REFERENCE: ${{ steps.command.outputs.approval_reference }}
          GOVERNANCE_COMMAND_COMMENT_ID: ${{ github.event.comment.id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import {
            FOUNDER_CONTROL_ROOM_CANONICAL_RULESET_NAME,
            providerForProject,
          } from './dist/providers/providerFactory.js';
          import { getGitHubInstallationToken } from './dist/providers/githubAppAuth.js';
          import { collectFcrGovernancePhase } from './scripts/audit-fcr-governance-phase.mjs';

          const FULL_SHA = /^[0-9a-f]{40}$/;
          const APPROVAL = /^[A-Za-z0-9._:-]{8,200}$/;
          const PHASES = new Set(['founder_only', 'independent_review']);
          const PROJECT_ID = 'founder-control-room';
          const PROJECT = {
            repo_provider: 'github',
            slug: PROJECT_ID,
            repo_identifier: 'jussray/founder-control-room',
          };

          const expectedMainSha = String(process.env.EXPECTED_MAIN_SHA ?? '').trim().toLowerCase();
          const phase = String(process.env.FCR_GOVERNANCE_PHASE ?? '').trim();
          const appId = String(process.env.GITHUB_APP_ID ?? '').trim();
          const privateKey = String(process.env.GITHUB_PRIVATE_KEY ?? '').trim();
          const approvalReference = String(process.env.GOVERNANCE_APPROVAL_REFERENCE ?? '').trim();
          const commandCommentId = String(process.env.GOVERNANCE_COMMAND_COMMENT_ID ?? '').trim();
          const requiredApprovingReviewCount = phase === 'founder_only' ? 0 : 1;

          let beforeMain = null;
          let afterMain = null;
          let result = null;
          let topology = null;
          let failure = null;
          let providerMutationAttempted = false;
          await fs.mkdir('artifacts', { recursive: true });

          try {
            if (!FULL_SHA.test(expectedMainSha)) throw new Error('EXPECTED_MAIN_SHA must be a lowercase full commit SHA');
            if (!PHASES.has(phase)) throw new Error('FCR_GOVERNANCE_PHASE is invalid');
            if (!/^\d+$/.test(appId)) throw new Error('GITHUB_APP_ID must be a numeric trusted App identity');
            if (!privateKey) throw new Error('GITHUB_PRIVATE_KEY is required');
            if (!APPROVAL.test(approvalReference)) throw new Error('GOVERNANCE_APPROVAL_REFERENCE is invalid');

            const provider = providerForProject(PROJECT);
            beforeMain = await provider.resolveRef(PROJECT_ID, 'main');
            if (beforeMain.toLowerCase() !== expectedMainSha) {
              throw new Error(`main moved before governance reconciliation: expected ${expectedMainSha}, observed ${beforeMain}`);
            }
            if (!provider.applyBranchRuleset) throw new Error('Canonical repository provider does not expose applyBranchRuleset');

            providerMutationAttempted = true;
            result = await provider.applyBranchRuleset(PROJECT_ID, {
              name: FOUNDER_CONTROL_ROOM_CANONICAL_RULESET_NAME,
              enforcement: 'active',
              targetRefs: ['main'],
              requirePullRequest: true,
              governancePhase: phase,
              requiredApprovingReviewCount,
              requiredStatusCheckNames: ['Required Gate', 'Verify test-ledger contract'],
              blockForcePushes: true,
              blockDeletion: true,
              bypassActors: [{ kind: 'app', id: appId }],
            });

            afterMain = await provider.resolveRef(PROJECT_ID, 'main');
            if (afterMain.toLowerCase() !== expectedMainSha) {
              throw new Error(`main moved during governance reconciliation: expected ${expectedMainSha}, observed ${afterMain}`);
            }

            const installationToken = await getGitHubInstallationToken(appId, privateKey, PROJECT.repo_identifier);
            topology = await collectFcrGovernancePhase({
              token: installationToken,
              repository: PROJECT.repo_identifier,
              targetRef: 'main',
              phase,
              trustedGitHubAppId: appId,
            });
            if (topology.status !== 'READY' || topology.governancePhase !== phase) {
              throw new Error(`FCR governance phase provider readback failed: ${topology.status}/${topology.governancePhase}`);
            }

            console.log(`Governance phase reconciliation completed at main=${expectedMainSha} phase=${phase}`);
            console.log(`review_ruleset=${result.name} (${result.id})`);
            for (const component of result.components ?? []) {
              console.log(`component=${component.purpose}:${component.name}:${component.id}:${component.enforcement}`);
            }
          } catch (error) {
            failure = {
              name: error instanceof Error ? error.name : 'Error',
              message: error instanceof Error ? error.message : String(error),
            };
            throw error;
          } finally {
            await fs.writeFile(
              'artifacts/github-governance-phase-reconcile.json',
              `${JSON.stringify({
                schema: 'fcr/github-governance-phase-reconcile@v1',
                expectedMainSha,
                governancePhase: phase,
                requiredApprovingReviewCount,
                beforeMain,
                afterMain,
                approvalReference,
                commandCommentId,
                generatedAt: new Date().toISOString(),
                providerMutationAttempted,
                providerMutationState: failure
                  ? providerMutationAttempted ? 'UNKNOWN_OR_PARTIAL' : 'NOT_ATTEMPTED'
                  : 'VERIFIED_COMPLETE',
                result,
                topology,
                failure,
              }, null, 2)}\n`,
              'utf8',
            );
          }
          NODE

      - name: Re-read exact main after provider mutation
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ steps.command.outputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          printf 'expected_main=%s\ncurrent_main_after=%s\n' "$EXPECTED_MAIN_SHA" "$current_main"
          test "$current_main" = "$EXPECTED_MAIN_SHA"

      - name: Retain sanitized phase reconciliation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-governance-phase-${{ steps.command.outputs.governance_phase }}-${{ steps.command.outputs.expected_main_sha }}-${{ github.run_id }}
          path: artifacts/github-governance-phase-reconcile.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize bounded provider-policy mutation
        env:
          EXPECTED_MAIN_SHA: ${{ steps.command.outputs.expected_main_sha }}
          PHASE: ${{ steps.command.outputs.governance_phase }}
          APPROVAL_REFERENCE: ${{ steps.command.outputs.approval_reference }}
          COMMENT_ID: ${{ github.event.comment.id }}
        shell: bash
        run: |
          {
            echo '## FCR governance phase reconciliation complete'
            echo
            echo "- Exact current main: \`$EXPECTED_MAIN_SHA\`"
            echo "- Governance phase: \`$PHASE\`"
            echo "- Approval reference: \`$APPROVAL_REFERENCE\`"
            echo "- Command receipt: issue #418 comment \`$COMMENT_ID\`"
            echo '- Strict exact-head status checks remain zero-bypass.'
            echo '- CodeQL, force-push protection, deletion protection, and pull-request enforcement remain active.'
            echo '- Merge, deployment, database, credential, billing, publication, and branch-deletion authority: none granted by this command.'
          } >> "$GITHUB_STEP_SUMMARY"
