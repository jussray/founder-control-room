name: PR Continuity Metadata

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, auto_merge_enabled, auto_merge_disabled]

permissions: {}

concurrency:
  group: pr-continuity-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata-receipt:
    name: PR Continuity Metadata Receipt
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test test/pr-continuity.attack20.test.mjs test/pr-continuity.rollover-observation.test.mjs
      - env:
          GITHUB_TOKEN: "${{ github.token }}"
          GITHUB_REPOSITORY: "${{ github.repository }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          ROOT_BASE_REF: main
        run: node scripts/pr-continuity.mjs metadata
