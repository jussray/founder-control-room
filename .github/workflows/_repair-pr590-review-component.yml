name: Repair PR 590 review component receipt

on:
  push:
    branches:
      - fix/fcr-integration-authority-a4ca515

permissions:
  contents: write

jobs:
  repair:
    name: Repair partial review mutation receipt
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify one-shot parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "bacb20192cfc20696544f57370e26c3db2b18ec4"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Apply bounded review-component repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one seam, found {count}")
              return text.replace(old, new, 1)

          provider = Path('src/providers/GitHubProvider.ts')
          text = provider.read_text()
          text = replace_once(
              text,
              '    let freshnessComponent: NonNullable<RulesetResult["components"]>[number] | undefined;\n',
              '    let freshnessComponent: NonNullable<RulesetResult["components"]>[number] | undefined;\n'
              '    let reviewComponent: NonNullable<RulesetResult["components"]>[number] | undefined;\n',
              'review component declaration',
          )
          text = replace_once(
              text,
              '''      if (hardenFounderControlRoomMainReview) {
        const { data: readback } = await this.octokit.repos.getRepoRuleset({
''',
              '''      if (hardenFounderControlRoomMainReview) {
        reviewComponent = {
          purpose: "review",
          id: String(data.id),
          name: data.name,
          enforcement: data.enforcement,
        };
        const { data: readback } = await this.octokit.repos.getRepoRuleset({
''',
              'capture review component before readback',
          )
          text = replace_once(
              text,
              '''      const message = error instanceof Error ? error.message : String(error);
      throw new Error(
        `GitHubProvider: FCR review membrane failed after verified strict-freshness ruleset ${freshnessComponent.name} (${freshnessComponent.id}): ${message}`,
      );
''',
              '''      const message = error instanceof Error ? error.message : String(error);
      const reviewMutation = reviewComponent
        ? `; review ruleset ${reviewComponent.name} (${reviewComponent.id}) was also mutated`
        : "";
      throw new Error(
        `GitHubProvider: FCR review membrane failed after verified strict-freshness ruleset ${freshnessComponent.name} (${freshnessComponent.id})${reviewMutation}: ${message}`,
      );
''',
              'partial mutation error receipt',
          )
          provider.write_text(text)

          test = Path('src/providers/__tests__/githubProvider.fcrRulesetHardening.test.ts')
          text = test.read_text()
          anchor = '''  it("surfaces the verified freshness identity when the review mutation fails", async () => {
'''
          regression = '''  it("surfaces both mutated component identities when review readback fails", async () => {
    const widened = reviewReadback();
    widened.bypass_actors = [{
      actor_type: "Integration",
      actor_id: 123,
      bypass_mode: "always",
    }];
    mockGetRepoRuleset.mockImplementation(async ({ ruleset_id }: { ruleset_id: number }) => ({
      data: ruleset_id === 2 ? freshnessReadback() : widened,
    }));

    const provider = buildProvider();
    await expect(provider.applyBranchRuleset("founder-control-room", config))
      .rejects.toThrow(/strict-freshness ruleset .* \\(2\\); review ruleset .* \\(1\\) was also mutated: .*review ruleset 1 read-back mismatch/);

    expect(mockCreateRepoRuleset.mock.calls.map((call) => call[0].name))
      .toEqual([freshnessName(), config.name]);
    expect(mockGetRepoRuleset.mock.calls.map((call) => call[0].ruleset_id))
      .toEqual([2, 1]);
  });

'''
          text = replace_once(text, anchor, regression + anchor, 'review readback regression anchor')
          test.write_text(text)

          providers = Path('docs/PROVIDERS.md')
          text = providers.read_text()
          old = 'A successful provider result receipts **both** ruleset component identities; if the later review mutation fails, the error retains the already-verified freshness ruleset name and ID for reconciliation.'
          new = 'A successful provider result receipts **both** ruleset component identities. If the later review write fails, the error retains the already-verified freshness ruleset identity; if the review object is written but hardened readback then fails, the error retains **both** mutated provider identities for reconciliation.'
          text = replace_once(text, old, new, 'provider docs partial mutation truth')
          providers.write_text(text)

          receipt_path = Path('docs/DOCUMENTATION_TRUTH_RECEIPT.json')
          receipt = json.loads(receipt_path.read_text())
          claims = next(item for item in receipt['changes'] if item['path'] == 'src/providers/GitHubProvider.ts')['claims']
          old_claim = claims[0]
          expected = 'partial failure after freshness verification must retain that component identity for reconciliation.'
          if expected not in old_claim:
              raise RuntimeError('documentation receipt claim seam changed')
          claims[0] = old_claim.replace(
              expected,
              'partial failure after freshness verification must retain the freshness component identity, and a later review-readback failure after a successful review mutation must retain both mutated provider identities for reconciliation.',
          )
          receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - name: Remove one-shot workflow before proof
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_repair-pr590-review-component.yml

      - name: Run focused proof
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck
          npx vitest run src/providers/__tests__/githubProvider.fcrRulesetHardening.test.ts
          git diff --check

      - name: Commit clean repair
        shell: bash
        env:
          TARGET_BRANCH: fix/fcr-integration-authority-a4ca515
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/providers/GitHubProvider.ts \
            src/providers/__tests__/githubProvider.fcrRulesetHardening.test.ts \
            docs/PROVIDERS.md \
            docs/DOCUMENTATION_TRUTH_RECEIPT.json
          git diff --cached --check
          git commit -m 'fix(governance): receipt partial review mutation'
          git push origin "HEAD:${TARGET_BRANCH}"
