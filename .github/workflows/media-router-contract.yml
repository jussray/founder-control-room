name: Media Router Contract

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/mediaRouter.ts'
      - 'src/lib/mediaRouterDomainProtocol.ts'
      - 'src/lib/mediaRouterPhase1Contracts.ts'
      - 'src/lib/mediaExecutionService.ts'
      - 'src/lib/mediaStoryboardStartFrame.ts'
      - 'src/lib/makeVideoStoryboardBridge.ts'
      - 'src/lib/makeVideoNervousSystem.ts'
      - 'src/lib/__tests__/mediaStoryboardStartFrame.test.ts'
      - 'src/lib/__tests__/makeVideoStoryboardBridge.test.ts'
      - 'src/lib/mediaFfmpegRender.ts'
      - 'src/lib/__tests__/makeVideoNervousSystem.test.ts'
      - 'src/lib/__tests__/mediaFfmpegRender.test.ts'
      - 'src/lib/mediaJobExecution.ts'
      - 'src/lib/localFfmpegJobAdapter.ts'
      - 'src/lib/runwayMediaJobAdapter.ts'
      - 'scripts/media-job.mts'
      - 'src/lib/__tests__/mediaJobExecution.test.ts'
      - 'src/lib/__tests__/mediaJobCli.test.ts'
      - 'src/lib/__tests__/runwayMediaJobAdapter.test.ts'
      - 'docs/MEDIA_JOB_EXECUTION.md'
      - 'package.json'
      - 'src/lib/__tests__/mediaRouter*.test.ts'
      - 'src/lib/__tests__/mediaExecutionService.test.ts'
      - 'docs/MEDIA_ROUTER_DOMAIN_PROTOCOL_V1.md'
      - '.github/workflows/media-router-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/mediaRouter.ts'
      - 'src/lib/mediaRouterDomainProtocol.ts'
      - 'src/lib/mediaRouterPhase1Contracts.ts'
      - 'src/lib/mediaExecutionService.ts'
      - 'src/lib/mediaStoryboardStartFrame.ts'
      - 'src/lib/makeVideoStoryboardBridge.ts'
      - 'src/lib/makeVideoNervousSystem.ts'
      - 'src/lib/__tests__/mediaStoryboardStartFrame.test.ts'
      - 'src/lib/__tests__/makeVideoStoryboardBridge.test.ts'
      - 'src/lib/mediaFfmpegRender.ts'
      - 'src/lib/__tests__/makeVideoNervousSystem.test.ts'
      - 'src/lib/__tests__/mediaFfmpegRender.test.ts'
      - 'src/lib/mediaJobExecution.ts'
      - 'src/lib/localFfmpegJobAdapter.ts'
      - 'src/lib/runwayMediaJobAdapter.ts'
      - 'scripts/media-job.mts'
      - 'src/lib/__tests__/mediaJobExecution.test.ts'
      - 'src/lib/__tests__/mediaJobCli.test.ts'
      - 'src/lib/__tests__/runwayMediaJobAdapter.test.ts'
      - 'docs/MEDIA_JOB_EXECUTION.md'
      - 'package.json'
      - 'src/lib/__tests__/mediaRouter*.test.ts'
      - 'src/lib/__tests__/mediaExecutionService.test.ts'
      - 'docs/MEDIA_ROUTER_DOMAIN_PROTOCOL_V1.md'
      - '.github/workflows/media-router-contract.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Media Router exact-head contract proof
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install root toolchain
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Install deterministic rendering tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify media routing and storyboard handoff
        run: npm run verify:media:handoff
