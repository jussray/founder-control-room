name: Founder Signal Engine Review-Only Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: founder-signal-engine-review-only-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe sealed MCP bridge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: founder-signal-engine-review
    steps:
      - name: Prepare immutable probe context
        shell: bash
        run: |
          set -euo pipefail

          invocation_id="$(python - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )"

          {
            echo "INVOCATION_ID=$invocation_id"
            echo "SOURCE_REPOSITORY=jussray/Sekret-Bip"
            echo "SOURCE_PR=599"
            echo "SOURCE_COMMIT_SHA=f4573d360a8fea99b301f33a2a21192525725f7b"
            echo "REQUESTED_ACTION=run_openai_step"
            echo "WORKFLOW_HEAD_SHA=$GITHUB_SHA"
            echo "WORKFLOW_RUN_ID=$GITHUB_RUN_ID"
            echo "APPROVED_API_ORIGIN=https://api.foundercontrolroom.org"
          } >> "$GITHUB_ENV"

      - name: Verify live API service identity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          write_routing_failure() {
            local code="$1"
            local message="$2"
            local http_status="${3:-null}"
            local content_type="${4:-}"
            local service_identity="${5:-}"
            local response_bytes="${6:-0}"
            local response_sha256="${7:-}"
            local live_sha="${8:-}"
            local main_sha="${9:-}"

            jq -n \
              --arg code "$code" \
              --arg message "$message" \
              --arg invocation_id "$INVOCATION_ID" \
              --arg workflow_head_sha "$WORKFLOW_HEAD_SHA" \
              --arg workflow_run_id "$WORKFLOW_RUN_ID" \
              --arg content_type "$content_type" \
              --arg service_identity "$service_identity" \
              --arg response_sha256 "$response_sha256" \
              --arg live_sha "$live_sha" \
              --arg main_sha "$main_sha" \
              --argjson response_bytes "${response_bytes:-0}" \
              --argjson http_status "$http_status" \
              '{
                receiptVersion: 2,
                state: "routing_failure",
                workflowHeadSha: $workflow_head_sha,
                workflowRunId: $workflow_run_id,
                invocationId: $invocation_id,
                httpStatus: $http_status,
                routing: {
                  contentType: (if $content_type == "" then null else $content_type end),
                  serviceIdentity: (if $service_identity == "" then null else $service_identity end),
                  responseBytes: $response_bytes,
                  responseSha256: (if $response_sha256 == "" then null else $response_sha256 end),
                  liveSha: (if $live_sha == "" then null else $live_sha end),
                  mainSha: (if $main_sha == "" then null else $main_sha end)
                },
                error: {code: $code, message: $message},
                result: null
              }' > founder-signal-engine-receipt.json
          }

          main_sha="$(curl --silent --show-error --fail \
            --proto '=https' --proto-redir '=https' --max-redirs 0 \
            --connect-timeout 10 --max-time 20 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/main" \
            | jq -r '.commit.sha')"

          version_curl_exit=0
          version_status="$(curl --silent --show-error \
            --proto '=https' --proto-redir '=https' --max-redirs 0 \
            --connect-timeout 10 --max-time 30 \
            --dump-header version.headers \
            --output version.body \
            --write-out '%{http_code}' \
            "$APPROVED_API_ORIGIN/version" \
            2>version-curl-error.txt)" || version_curl_exit=$?
          version_status="${version_status:-000}"

          version_content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0} END{print value}' version.headers 2>/dev/null || true)"
          version_service_identity="$(awk 'BEGIN{IGNORECASE=1} /^x-founder-control-room-service:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0} END{print value}' version.headers 2>/dev/null || true)"
          version_bytes="$(wc -c < version.body 2>/dev/null || echo 0)"
          version_sha256="$(sha256sum version.body 2>/dev/null | awk '{print $1}' || true)"
          live_sha=''
          if jq -e . version.body >/dev/null 2>&1; then
            live_sha="$(jq -r '.gitSha // empty' version.body)"
          fi

          if [[ "$version_curl_exit" -ne 0 ]]; then
            write_routing_failure \
              "VERSION_TRANSPORT_FAILURE" \
              "The approved API origin could not return a usable /version response." \
              null "$version_content_type" "$version_service_identity" "$version_bytes" "$version_sha256" "$live_sha" "$main_sha"
            echo '::error title=API routing probe failed::The approved API origin failed before an HTTP response.'
            exit 1
          fi

          if [[ "$version_status" -lt 200 || "$version_status" -ge 300 ]]; then
            write_routing_failure \
              "VERSION_HTTP_FAILURE" \
              "The approved API origin returned a non-success status for /version." \
              "$version_status" "$version_content_type" "$version_service_identity" "$version_bytes" "$version_sha256" "$live_sha" "$main_sha"
            echo "::error title=API routing probe failed::/version returned HTTP $version_status."
            exit 1
          fi

          if [[ "$version_service_identity" != 'founder-control-room' ]]; then
            write_routing_failure \
              "WRONG_SERVICE_ORIGIN" \
              "The approved API hostname did not return the Founder Control Room service identity header." \
              "$version_status" "$version_content_type" "$version_service_identity" "$version_bytes" "$version_sha256" "$live_sha" "$main_sha"
            echo '::error title=Wrong API origin::api.foundercontrolroom.org is not reaching the canonical Founder Control Room Worker.'
            exit 1
          fi

          if ! jq -e '.service == "founder-control-room" and (.gitSha | type == "string" and test("^[0-9a-f]{40}$"))' version.body >/dev/null 2>&1; then
            write_routing_failure \
              "INVALID_VERSION_DOCUMENT" \
              "The canonical Worker identity header was present, but /version was not the expected JSON document." \
              "$version_status" "$version_content_type" "$version_service_identity" "$version_bytes" "$version_sha256" "$live_sha" "$main_sha"
            echo '::error title=Invalid Worker version document::The canonical Worker returned an unexpected /version representation.'
            exit 1
          fi

          if [[ "$live_sha" != "$main_sha" ]]; then
            write_routing_failure \
              "STALE_LIVE_DEPLOYMENT" \
              "The API Worker is not serving the current main commit." \
              "$version_status" "$version_content_type" "$version_service_identity" "$version_bytes" "$version_sha256" "$live_sha" "$main_sha"
            echo "::error title=Stale live Worker::Live SHA $live_sha does not match main $main_sha."
            exit 1
          fi

          {
            echo "MAIN_HEAD_SHA=$main_sha"
            echo "LIVE_WORKER_SHA=$live_sha"
          } >> "$GITHUB_ENV"

          {
            echo '### Live API routing preflight'
            echo
            echo "- Service identity: \`$version_service_identity\`"
            echo "- Content-Type: \`${version_content_type:-unknown}\`"
            echo "- Main SHA: \`$main_sha\`"
            echo "- Live Worker SHA: \`$live_sha\`"
            echo "- Version response bytes: \`$version_bytes\`"
            echo "- Version response SHA-256: \`$version_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Call review-only Founder Signal Engine bridge
        id: invoke
        shell: bash
        env:
          MCP_TOKEN: ${{ secrets.FOUNDER_SIGNAL_ENGINE_MCP_TOKEN }}
        run: |
          set -euo pipefail

          write_local_failure() {
            local code="$1"
            local message="$2"
            jq -n \
              --arg code "$code" \
              --arg message "$message" \
              --arg invocation_id "$INVOCATION_ID" \
              --arg workflow_head_sha "$WORKFLOW_HEAD_SHA" \
              --arg workflow_run_id "$WORKFLOW_RUN_ID" \
              '{
                receiptVersion: 2,
                state: "configuration_failure",
                workflowHeadSha: $workflow_head_sha,
                workflowRunId: $workflow_run_id,
                invocationId: $invocation_id,
                httpStatus: null,
                routing: null,
                error: {code: $code, message: $message},
                result: null
              }' > founder-signal-engine-receipt.json
          }

          if [[ -z "${MCP_TOKEN:-}" ]]; then
            write_local_failure "MISSING_MCP_TOKEN" "The sealed Founder Signal Engine MCP token is not configured."
            echo '::error title=Missing sealed MCP token::FOUNDER_SIGNAL_ENGINE_MCP_TOKEN is not configured.'
            exit 2
          fi
          echo "::add-mask::$MCP_TOKEN"

          request_body="$(jq -n \
            --arg invocation_id "$INVOCATION_ID" \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --argjson source_pr "$SOURCE_PR" \
            --arg source_commit_sha "$SOURCE_COMMIT_SHA" \
            --arg requested_action "$REQUESTED_ACTION" \
            --arg steering_grant_id "founder-signal-engine-day3-review-only" \
            --arg audit_path "Founder Control Room issue #73; operator console merge 93a57d0308a9461b3995a4997a35d417fdc7a3bb" \
            --arg rollback_step "Disable the Zapier Catch Hook and preserve the evidence trail." \
            --arg requesting_agent "github-actions-review-probe" \
            '{
              jsonrpc: "2.0",
              id: $invocation_id,
              method: "tools/call",
              params: {
                name: "invoke_founder_signal_engine",
                arguments: {
                  invocationId: $invocation_id,
                  sourceRepository: $source_repository,
                  sourcePr: $source_pr,
                  sourceCommitSha: $source_commit_sha,
                  requestedAction: $requested_action,
                  steeringGrantId: $steering_grant_id,
                  auditPath: $audit_path,
                  rollbackStep: $rollback_step,
                  requestingAgent: $requesting_agent,
                  allowHubSpotWrite: false,
                  founderApprovalId: null
                }
              }
            }')"

          curl_exit=0
          http_status="$(curl --silent --show-error \
            --proto '=https' --proto-redir '=https' --max-redirs 0 \
            --connect-timeout 10 --max-time 45 \
            --dump-header response.headers \
            --output response.body \
            --write-out '%{http_code}' \
            --request POST \
            --url "$APPROVED_API_ORIGIN/mcp/founder-signal-engine" \
            --header 'content-type: application/json' \
            --header "authorization: Bearer $MCP_TOKEN" \
            --data "$request_body" \
            2>curl-error.txt)" || curl_exit=$?
          http_status="${http_status:-000}"

          response_content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0} END{print value}' response.headers 2>/dev/null || true)"
          response_service_identity="$(awk 'BEGIN{IGNORECASE=1} /^x-founder-control-room-service:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0} END{print value}' response.headers 2>/dev/null || true)"
          response_bytes="$(wc -c < response.body 2>/dev/null || echo 0)"
          response_sha256="$(sha256sum response.body 2>/dev/null | awk '{print $1}' || true)"

          routing_json="$(jq -n \
            --arg content_type "$response_content_type" \
            --arg service_identity "$response_service_identity" \
            --arg response_sha256 "$response_sha256" \
            --arg live_sha "$LIVE_WORKER_SHA" \
            --arg main_sha "$MAIN_HEAD_SHA" \
            --argjson response_bytes "${response_bytes:-0}" \
            '{
              contentType: (if $content_type == "" then null else $content_type end),
              serviceIdentity: (if $service_identity == "" then null else $service_identity end),
              responseBytes: $response_bytes,
              responseSha256: (if $response_sha256 == "" then null else $response_sha256 end),
              liveSha: $live_sha,
              mainSha: $main_sha
            }')"

          if [[ "$curl_exit" -ne 0 ]]; then
            jq -n \
              --arg invocation_id "$INVOCATION_ID" \
              --arg workflow_head_sha "$WORKFLOW_HEAD_SHA" \
              --arg workflow_run_id "$WORKFLOW_RUN_ID" \
              --argjson routing "$routing_json" \
              --argjson curl_exit "$curl_exit" \
              '{
                receiptVersion: 2,
                state: "transport_failure",
                workflowHeadSha: $workflow_head_sha,
                workflowRunId: $workflow_run_id,
                invocationId: $invocation_id,
                httpStatus: null,
                routing: $routing,
                transport: {curlExitCode: $curl_exit},
                error: {code: "TRANSPORT_FAILURE", message: "Founder API request failed before a usable HTTP response."},
                result: null
              }' > founder-signal-engine-receipt.json
          elif jq -e . response.body >/dev/null 2>&1; then
            jq \
              --arg http_status "$http_status" \
              --arg workflow_head_sha "$WORKFLOW_HEAD_SHA" \
              --arg workflow_run_id "$WORKFLOW_RUN_ID" \
              --argjson routing "$routing_json" \
              '{
                receiptVersion: 2,
                state: (if (.result.structuredContent.accepted // false) then "bridge_response" else "bridge_rejection" end),
                workflowHeadSha: $workflow_head_sha,
                workflowRunId: $workflow_run_id,
                httpStatus: ($http_status | tonumber),
                routing: $routing,
                jsonrpc: (.jsonrpc // null),
                id: (.id // null),
                error: (if .error then {
                  code: (.error.code // "REMOTE_ERROR"),
                  message: ((.error.message // "Remote bridge error") | tostring | .[0:240])
                } else null end),
                result: (if .result then {
                  isError: (.result.isError // false),
                  structuredContent: {
                    invocationId: (.result.structuredContent.invocationId // null),
                    accepted: (.result.structuredContent.accepted // false),
                    providerHttpStatus: (.result.structuredContent.providerHttpStatus // null),
                    providerResponseKind: ((.result.structuredContent.providerResponseKind // null) | if type == "string" then .[0:80] else . end),
                    zapierRunId: ((.result.structuredContent.zapierRunId // null) | if type == "string" then .[0:160] else . end),
                    zapierRunIdentified: (.result.structuredContent.zapierRunIdentified // false),
                    auditComplete: (.result.structuredContent.auditComplete // false),
                    duplicateBlocked: (.result.structuredContent.duplicateBlocked // false),
                    endToEndProofComplete: (.result.structuredContent.endToEndProofComplete // false),
                    sourceRepository: (.result.structuredContent.sourceRepository // null),
                    sourcePr: (.result.structuredContent.sourcePr // null),
                    sourceCommitSha: (.result.structuredContent.sourceCommitSha // null),
                    requestedAction: (.result.structuredContent.requestedAction // null),
                    nextGate: ((.result.structuredContent.nextGate // null) | if type == "string" then .[0:240] else . end)
                  }
                } else null end)
              }' response.body > founder-signal-engine-receipt.json
          else
            non_json_code='NON_JSON_RESPONSE'
            non_json_message='The canonical Founder API returned a non-JSON response; raw body omitted.'
            if [[ "$response_service_identity" != 'founder-control-room' ]]; then
              non_json_code='WRONG_SERVICE_ORIGIN'
              non_json_message='The MCP request was answered without the canonical Founder Control Room service identity header.'
            elif [[ "${response_content_type,,}" != application/json* ]]; then
              non_json_code='WORKER_NON_JSON_RESPONSE'
              non_json_message='The canonical Worker answered the MCP route with a non-JSON Content-Type.'
            fi

            jq -n \
              --arg http_status "$http_status" \
              --arg invocation_id "$INVOCATION_ID" \
              --arg workflow_head_sha "$WORKFLOW_HEAD_SHA" \
              --arg workflow_run_id "$WORKFLOW_RUN_ID" \
              --arg code "$non_json_code" \
              --arg message "$non_json_message" \
              --argjson routing "$routing_json" \
              '{
                receiptVersion: 2,
                state: "non_json_response",
                workflowHeadSha: $workflow_head_sha,
                workflowRunId: $workflow_run_id,
                invocationId: $invocation_id,
                httpStatus: ($http_status | tonumber),
                routing: $routing,
                error: {code: $code, message: $message},
                result: null
              }' > founder-signal-engine-receipt.json
          fi

          {
            echo '## Founder Signal Engine review-only probe'
            echo
            echo "Workflow head: \`$WORKFLOW_HEAD_SHA\`"
            echo "Workflow run: \`$WORKFLOW_RUN_ID\`"
            echo "Invocation: \`$INVOCATION_ID\`"
            echo
            echo '```json'
            cat founder-signal-engine-receipt.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$curl_exit" -ne 0 ]]; then
            echo '::error title=Bridge transport failure::The review-only bridge did not return a usable HTTP response.'
            exit 1
          fi

          if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
            echo "::error title=Bridge HTTP failure::Founder Signal Engine returned HTTP $http_status."
            exit 1
          fi

          if ! jq -e '.state == "bridge_response"' founder-signal-engine-receipt.json >/dev/null; then
            error_code="$(jq -r '.error.code // "BRIDGE_RESPONSE_INVALID"' founder-signal-engine-receipt.json)"
            echo "::error title=Bridge response invalid::$error_code prevented a correlated JSON-RPC receipt."
            exit 1
          fi

          jq -e \
            --arg invocation_id "$INVOCATION_ID" \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --argjson source_pr "$SOURCE_PR" \
            --arg source_commit_sha "$SOURCE_COMMIT_SHA" \
            --arg requested_action "$REQUESTED_ACTION" \
            '
              .jsonrpc == "2.0" and
              .id == $invocation_id and
              .result.isError == false and
              .result.structuredContent.invocationId == $invocation_id and
              .result.structuredContent.accepted == true and
              .result.structuredContent.sourceRepository == $source_repository and
              .result.structuredContent.sourcePr == $source_pr and
              .result.structuredContent.sourceCommitSha == $source_commit_sha and
              .result.structuredContent.requestedAction == $requested_action
            ' founder-signal-engine-receipt.json >/dev/null || {
              echo '::error title=Receipt correlation failure::The bridge response did not match the exact invocation and source evidence.'
              exit 1
            }

          jq -e '
            (.result.structuredContent.zapierRunIdentified == true) and
            ((.result.structuredContent.zapierRunId // "") | type == "string" and length > 0)
          ' founder-signal-engine-receipt.json >/dev/null || {
            echo '::error title=Zapier execution proof missing::The bridge did not return an explicit matching Zapier run ID.'
            exit 1
          }

      - name: Upload sanitized receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: founder-signal-engine-review-only-receipt
          path: founder-signal-engine-receipt.json
          if-no-files-found: ignore
          retention-days: 7
