name: FutureYou V8 Proof

on:
  pull_request:
    paths:
      - 'src/futureyou/**'
      - 'src/http/routes/futureYou.ts'
      - 'src/http/routes/__tests__/futureYou.integration.test.ts'
      - 'src/http/server.ts'
      - 'src/lib/standingFounderPolicy.ts'
      - 'src/lib/__tests__/standingFounderPolicy.test.ts'
      - 'public/control-room/futureyou-v8.*'
      - 'public/control-room/index.html'
      - 'e2e/futureyou-v8.mjs'
      - 'scripts/verify-futureyou-v8.mjs'
      - 'docs/FUTUREYOU_V8_MISSION_CONTROL.md'
      - 'package.json'
      - '.github/workflows/futureyou-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-futureyou-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify static, unit, and route contracts
        run: npm run verify:futureyou-v8
      - name: Verify standing founder policy
        run: npx vitest run src/lib/__tests__/standingFounderPolicy.test.ts
      - name: Render cockpit proof
        run: node e2e/futureyou-v8.mjs
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: futureyou-v8-cockpit-${{ github.sha }}
          path: |
            artifacts/futureyou-v8-cockpit-desktop.png
            artifacts/futureyou-v8-cockpit-mobile.png
            artifacts/futureyou-v8-autonomy-receipt.json
          if-no-files-found: error
          retention-days: 14