name: AI Company Container Sandbox

on:
  pull_request:
    paths:
      - 'labs/ai-company/process-sandbox/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ai-company-container-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-company-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-container-sandbox:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate head
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$TARGET_SHA" || {
            echo "Expected $TARGET_SHA but checked out $actual_sha" >&2
            exit 1
          }
          echo "Verified exact candidate head: $actual_sha"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Docker engine
        run: docker version

      - name: Prove container sandbox
        run: npm run verify:ai-company-container
