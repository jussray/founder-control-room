name: Main Release Provenance PR Contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TARGET_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  contract:
    name: Main release provenance contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$TARGET_SHA" "$actual"
          test "$actual" = "$TARGET_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Run provenance adversarial tests
        run: node --test scripts/verify-main-release-provenance.node-test.mjs
