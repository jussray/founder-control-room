name: Verification Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: verification-core-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verification-core:
    name: Verification Core exact-head proof
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install root toolchain
        run: npm ci --no-audit --no-fund

      - name: Typecheck Verification Core
        run: npm --prefix packages/ultrathink-verification-core run typecheck

      - name: Run Verification Core refusal suite
        run: npm --prefix packages/ultrathink-verification-core test
        env:
          NODE_ENV: test
