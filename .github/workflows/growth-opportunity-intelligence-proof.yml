name: Growth Opportunity Intelligence Proof

on:
  push:
    paths:
      - 'src/growth/**'
      - 'src/quickscan/store.ts'
      - 'src/http/routes/quickscan.ts'
      - 'src/http/routes/__tests__/quickscan.opportunity.integration.test.ts'
      - 'public/control-room/quickscan.html'
      - 'public/control-room/quickscan.js'
      - 'src/config/projectShells.ts'
      - 'src/config/__tests__/projectShells.test.ts'
      - '.control-room/receipts/2026-09-26-growth-opportunity-intelligence.json'
      - '.github/workflows/growth-opportunity-intelligence-proof.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/growth/**'
      - 'src/quickscan/store.ts'
      - 'src/http/routes/quickscan.ts'
      - 'src/http/routes/__tests__/quickscan.opportunity.integration.test.ts'
      - 'public/control-room/quickscan.html'
      - 'public/control-room/quickscan.js'
      - 'src/config/projectShells.ts'
      - 'src/config/__tests__/projectShells.test.ts'
      - '.control-room/receipts/2026-09-26-growth-opportunity-intelligence.json'
      - '.github/workflows/growth-opportunity-intelligence-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growth-opportunity-intelligence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-head-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact head and current main ancestry
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main "$EXPECTED_HEAD_SHA"
          printf 'current-main=%s\n' "$(git rev-parse origin/main)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck repository source
        run: npm run typecheck

      - name: Run focused opportunity and QuickScan tests
        run: >-
          npx vitest run
          src/growth/__tests__/opportunityIntelligence.test.ts
          src/growth/__tests__/quickScanOpportunityBridge.test.ts
          src/http/routes/__tests__/quickscan.opportunity.integration.test.ts
          src/config/__tests__/projectShells.test.ts

      - name: Build Pages exact head
        run: npm run build:pages

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start exact-head Pages witness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 3000 --bind 127.0.0.1 --directory dist-pages > /tmp/fcr-pages.log 2>&1 &
          echo $! > /tmp/fcr-pages.pid
          timeout 30s npx wait-on http://127.0.0.1:3000

      - name: Run Playwright desktop and mobile proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/growth-opportunity-intelligence
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const origin = 'http://127.0.0.1:3000';
          const browser = await chromium.launch({ headless: true });
          const cases = [
            { name: 'desktop', viewport: { width: 1440, height: 900 } },
            { name: 'mobile', viewport: { width: 390, height: 844 } },
          ];

          const quickScanFixture = {
            contract: 'founder-control-room/quickscan@v1',
            authority: {
              sendExternal: false,
              executeN8n: false,
              stripeWebhookConfigured: true,
              chiefConfigured: false,
            },
            prospects: [
              {
                id: 'manual-paid',
                businessName: 'Manual Claim Studio',
                ownerName: 'Maya',
                segment: 'salon_studio_team_owner',
                lifecycleState: 'paid',
                score: { total: 7 },
                evidence: [],
                approvals: [],
                qualification: null,
                payment: { status: 'paid', amountCents: 24900 },
                audit: [],
                opportunity: {
                  priorityBand: 'unknown',
                  score: 0,
                  nextGate: 'verify_problem_offer_fit',
                },
              },
              {
                id: 'stripe-paid',
                businessName: 'Verified Revenue Studio',
                ownerName: 'Jae',
                segment: 'salon_studio_team_owner',
                lifecycleState: 'paid',
                score: { total: 8 },
                evidence: [],
                approvals: [],
                qualification: null,
                payment: {
                  status: 'paid',
                  amountCents: 24900,
                  verifiedBy: 'stripe_webhook',
                  stripeEventId: 'evt_proof_001',
                },
                audit: [],
                opportunity: {
                  priorityBand: 'won',
                  score: 55,
                  nextGate: 'deliver_and_verify_customer_value',
                },
              },
            ],
          };

          try {
            for (const testCase of cases) {
              const page = await browser.newPage({ viewport: testCase.viewport });

              const rootResponse = await page.goto(origin, { waitUntil: 'domcontentloaded' });
              if (!rootResponse || rootResponse.status() >= 400) {
                throw new Error(`${testCase.name} root navigation failed: ${rootResponse?.status() ?? 'no-response'}`);
              }
              const rootBody = (await page.locator('body').innerText()).trim();
              if (rootBody.length < 20) {
                throw new Error(`${testCase.name} rendered root body is unexpectedly empty`);
              }
              await page.screenshot({
                path: `artifacts/growth-opportunity-intelligence/${testCase.name}-root.png`,
                fullPage: true,
              });

              await page.route(/\/quickscan$/, async (route) => {
                await route.fulfill({
                  status: 200,
                  contentType: 'application/json',
                  body: JSON.stringify(quickScanFixture),
                });
              });

              const quickScanResponse = await page.goto(`${origin}/control-room/quickscan.html`, { waitUntil: 'domcontentloaded' });
              if (!quickScanResponse || quickScanResponse.status() >= 400) {
                throw new Error(`${testCase.name} QuickScan navigation failed: ${quickScanResponse?.status() ?? 'no-response'}`);
              }
              await page.waitForFunction(() => document.querySelectorAll('.prospect').length === 2);
              const quickScanBody = await page.locator('body').innerText();
              for (const expected of [
                'Manual Claim Studio',
                'Verified Revenue Studio',
                'unknown · 0/100',
                'won · 55/100',
                'Collected\n1',
                'Verified revenue\n$249.00',
              ]) {
                if (!quickScanBody.includes(expected)) {
                  throw new Error(`${testCase.name} QuickScan witness missing: ${expected}`);
                }
              }
              await page.screenshot({
                path: `artifacts/growth-opportunity-intelligence/${testCase.name}-quickscan.png`,
                fullPage: true,
              });

              console.log(JSON.stringify({
                case: testCase.name,
                rootStatus: rootResponse.status(),
                quickScanStatus: quickScanResponse.status(),
                verifiedRevenueText: '$249.00',
                manualPaidExcludedFromCollectedRevenue: true,
                url: page.url(),
              }));
              await page.close();
            }
          } finally {
            await browser.close();
          }
          NODE

      - name: Preserve proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-opportunity-intelligence-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            artifacts/growth-opportunity-intelligence/
            /tmp/fcr-pages.log
          if-no-files-found: warn
          retention-days: 14
