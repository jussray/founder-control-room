name: AI Inbox Focused Proof

on:
  pull_request:
    paths:
      - 'src/lib/aiInboxRouting.ts'
      - 'src/lib/__tests__/aiInboxRouting.test.ts'
      - 'src/lib/growthInboxReply.ts'
      - 'src/lib/__tests__/growthInboxReply.test.ts'
      - 'src/http/routes/pluginCenterMessaging.ts'
      - 'src/http/routes/__tests__/pluginCenterMessaging.integration.test.ts'
      - '.github/workflows/ai-inbox-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs for the same pull request only; push, schedule and
  # dispatch runs get a unique group (run_id) and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run AI Inbox focused tests
        run: npx vitest run src/lib/__tests__/aiInboxRouting.test.ts src/lib/__tests__/growthInboxReply.test.ts src/http/routes/__tests__/pluginCenterMessaging.integration.test.ts
      - name: Lint AI Inbox changes
        run: npx eslint src/lib/aiInboxRouting.ts src/lib/__tests__/aiInboxRouting.test.ts src/lib/growthInboxReply.ts src/lib/__tests__/growthInboxReply.test.ts src/http/routes/pluginCenterMessaging.ts src/http/routes/__tests__/pluginCenterMessaging.integration.test.ts --max-warnings 0
