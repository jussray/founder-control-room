name: Economic Intelligence Playwright

on:
  pull_request:
    paths:
      - 'src/economic-intelligence/**'
      - 'src/http/routes/economicIntelligence.ts'
      - 'src/http/server.ts'
      - 'scripts/economic-intelligence-test-server.ts'
      - 'e2e/economic-intelligence-city-agnostic.spec.ts'
      - 'playwright.economic-intelligence.config.ts'
      - 'supabase/migrations/*economic_intelligence*'
      - '.github/workflows/economic-intelligence-playwright.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: economic-intelligence-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  city-agnostic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          printf 'Verified exact head: %s\n' "$actual"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked repository dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck repository source
        run: npm run typecheck

      - name: Run city-agnostic Redteam Playwright proof
        run: npx playwright test -c playwright.economic-intelligence.config.ts

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economic-intelligence-playwright-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            playwright-report/economic-intelligence/
            test-results/
          if-no-files-found: warn
          retention-days: 14
