name: FCR Video Renderer Proof

on:
  push:
    paths:
      - 'src/lib/mediaFfmpegRender.ts'
      - 'src/lib/__tests__/mediaFfmpegRender.test.ts'
      - 'scripts/render-video.mts'
      - 'scripts/verify-video-playback.mjs'
      - '.claude/skills/makevideo/SKILL.md'
      - '.github/workflows/video-renderer-proof.yml'
  pull_request:
    paths:
      - 'src/lib/mediaFfmpegRender.ts'
      - 'src/lib/__tests__/mediaFfmpegRender.test.ts'
      - 'scripts/render-video.mts'
      - 'scripts/verify-video-playback.mjs'
      - '.claude/skills/makevideo/SKILL.md'
      - '.github/workflows/video-renderer-proof.yml'
  workflow_dispatch:

jobs:
  render-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Focused renderer tests
        run: npx vitest run src/lib/__tests__/mediaFfmpegRender.test.ts
      - name: Render through the public CLI
        run: |
          cat > /tmp/fcr-video-proof.json <<'JSON'
          {
            "width": 320,
            "height": 180,
            "fps": 24,
            "segments": [
              {
                "durationSec": 2,
                "background": "#101018",
                "lines": [
                  {
                    "text": "FCR render proof",
                    "sizeFrac": 0.08,
                    "yFrac": 0.5,
                    "color": "#FFFFFF",
                    "bold": true
                  }
                ]
              }
            ]
          }
          JSON
          npx tsx scripts/render-video.mts --input /tmp/fcr-video-proof.json --output /tmp/fcr-video-proof.mp4 | tee /tmp/fcr-video-render.json
          grep -q '"kind": "RENDERED"' /tmp/fcr-video-render.json
          test -s /tmp/fcr-video-proof.mp4
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright playback proof
        run: node scripts/verify-video-playback.mjs --media /tmp/fcr-video-proof.mp4
