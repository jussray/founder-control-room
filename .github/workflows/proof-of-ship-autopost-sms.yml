name: Proof-of-Ship Publish + SMS — Content Approval Hold

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed commit SHA whose verified proof may be reviewed for publication
        required: true
        type: string
      deploy_run_id:
        description: Deploy workflow run that produced the verified founder-review proof artifact
        required: true
        type: string
      founder_approval_id:
        description: Candidate approval reference; not trusted until registry-backed validation exists
        required: true
        type: string
      approved_draft_ref:
        description: Stable reference to the exact founder-reviewed social draft
        required: true
        type: string
      approved_draft_sha256:
        description: Lowercase SHA-256 of the exact founder-reviewed social draft text
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: proof-of-ship-publish-hold-${{ inputs.expected_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publication-authority-gate:
    name: Verify release and hold for content-bound approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
      FOUNDER_APPROVAL_ID: ${{ inputs.founder_approval_id }}
      APPROVED_DRAFT_REF: ${{ inputs.approved_draft_ref }}
      APPROVED_DRAFT_SHA256: ${{ inputs.approved_draft_sha256 }}

    steps:
      - name: Validate exact publication candidate
        shell: bash
        run: |
          set -euo pipefail

          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error title=Invalid exact head::expected_sha must be a lowercase 40-character commit SHA.'
            exit 1
          }
          [[ "$DEPLOY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo '::error title=Invalid deploy run::deploy_run_id must identify the completed Deploy run.'
            exit 1
          }
          [[ "$FOUNDER_APPROVAL_ID" =~ ^[A-Za-z0-9._:-]{8,200}$ ]] || {
            echo '::error title=Invalid approval reference::founder_approval_id must be an auditable 8-200 character reference.'
            exit 1
          }
          [[ ${#APPROVED_DRAFT_REF} -ge 8 && ${#APPROVED_DRAFT_REF} -le 500 ]] || {
            echo '::error title=Invalid reviewed draft reference::approved_draft_ref must be 8-500 characters.'
            exit 1
          }
          [[ "$APPROVED_DRAFT_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo '::error title=Invalid reviewed draft hash::approved_draft_sha256 must be a lowercase SHA-256 digest.'
            exit 1
          }

      - name: Check out exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Download verified Deploy proof artifact
        uses: actions/download-artifact@v4
        with:
          name: proof-of-ship-founder-review-${{ env.EXPECTED_SHA }}
          path: verified-proof
          run-id: ${{ env.DEPLOY_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Validate exact verified release proof
        shell: bash
        run: |
          set -euo pipefail
          proof='verified-proof/proof-review.json'
          test -s "$proof"

          jq -e --arg sha "$EXPECTED_SHA" '
            .meaningful == true and
            .repository_allowed == true and
            .commit_sha == $sha and
            .source_commit_sha == $sha and
            .live_state == "verified" and
            ((.supabase_state == "verified") or (.supabase_state == "not_applicable")) and
            .cloudflare_live_sha == $sha and
            .publish_allowed == false and
            .PUBLISH_ALLOWED == false and
            .authorization_mode == "founder-review-required" and
            .buffer_terminal_action == "hold"
          ' "$proof" >/dev/null

      - name: Enforce registry-backed content approval before any external send
        shell: bash
        run: |
          set -euo pipefail

          {
            echo '### Proof-of-Ship publication HELD'
            echo
            echo "- repository: $GITHUB_REPOSITORY"
            echo "- exact SHA: $EXPECTED_SHA"
            echo "- deploy run: $DEPLOY_RUN_ID"
            echo "- candidate approval ref: $FOUNDER_APPROVAL_ID"
            echo "- reviewed draft ref: $APPROVED_DRAFT_REF"
            echo "- reviewed draft SHA-256: $APPROVED_DRAFT_SHA256"
            echo
            echo 'Release proof is valid, but caller-supplied approval text is not publication authority.'
            echo 'No Zapier, Buffer, SMS, or other external publication mutation is allowed until Founder Control Room can validate and consume a one-time registry-backed approval bound to this exact SHA, draft reference, and draft hash.'
          } >> "$GITHUB_STEP_SUMMARY"

          echo '::error title=Content-bound founder approval registry required::Publication is fail-closed. A caller-supplied founder_approval_id cannot authorize external publication until a one-time registry-backed approval is validated and consumed for this exact SHA and reviewed draft hash.'
          exit 1
