name: Prompt Workflow Router Runtime Proof

on:
  workflow_dispatch:
    inputs:
      runtime_base_url:
        description: Exact deployed FCR runtime base URL
        required: true
        type: string
      expected_release_sha:
        description: Exact 40-character deployed release SHA
        required: true
        type: string
      public_url:
        description: Optional founder-visible URL; defaults to runtime_base_url
        required: false
        type: string
      operator_target:
        description: Bounded peer provider target for the relay proof
        required: false
        default: codex
        type: string

permissions:
  contents: read

jobs:
  playwright-runtime-proof:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      FCR_RUNTIME_BASE_URL: ${{ inputs.runtime_base_url }}
      FCR_OPERATOR_RELAY_WITNESS_REQUIRED: 'true'
      FCR_OPERATOR_RELAY_TARGET: ${{ inputs.operator_target }}
      DEPLOY_URL: ${{ inputs.runtime_base_url }}
      PUBLIC_URL: ${{ inputs.public_url || 'https://foundercontrolroom.org' }}
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify requested checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          test "$EXPECTED_RELEASE_SHA" = "$GITHUB_SHA"
      - name: Validate trusted FCR production targets before exposing credentials
        shell: bash
        env:
          FCR_RUNTIME_BASE_URL: ${{ env.FCR_RUNTIME_BASE_URL }}
          PUBLIC_URL: ${{ env.PUBLIC_URL }}
          FCR_OPERATOR_RELAY_TARGET: ${{ env.FCR_OPERATOR_RELAY_TARGET }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const runtime = new URL(process.env.FCR_RUNTIME_BASE_URL);
          const publicSite = new URL(process.env.PUBLIC_URL);
          if (runtime.origin !== "https://api.foundercontrolroom.org" || runtime.pathname !== "/" || runtime.search || runtime.hash) {
            throw new Error("Runtime witness target must be the canonical FCR API origin.");
          }
          if (publicSite.origin !== "https://foundercontrolroom.org" || publicSite.pathname !== "/" || publicSite.search || publicSite.hash) {
            throw new Error("Browser witness target must be the canonical FCR public origin.");
          }
          const allowedTargets = new Set(["gemini", "codex", "claude-code", "perplexity", "deepseek", "muse"]);
          if (!allowedTargets.has(process.env.FCR_OPERATOR_RELAY_TARGET)) {
            throw new Error("Operator relay target is not an approved peer.");
          }
          console.log("FCR production witness targets validated.");
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prove deployed prompt workflow router
        env:
          FCR_PLAYWRIGHT_FOUNDER_BEARER: ${{ secrets.FCR_PLAYWRIGHT_FOUNDER_BEARER }}
        run: npx playwright test e2e/builder-prompt-workflow-runtime.spec.ts --project=chromium
      - name: Prove exact deployed operator relay and provider receipt
        env:
          FCR_OPERATOR_RELAY_OAUTH_TOKEN: ${{ secrets.FCR_OPERATOR_RELAY_OAUTH_TOKEN }}
        run: npx playwright test e2e/operator-relay-live.spec.ts --project=chromium
