name: Buffer Provider Contract

on:
  pull_request:
    paths:
      - 'config/buffer-provider-contract.json'
      - 'docs/founder-signal-engine/buffer-provider-action-matrix.md'
      - 'docs/founder-signal-engine/v10-buffer-provider-checklist.md'
      - 'tools/zapier/test-buffer-provider-contract.cjs'
      - '.github/workflows/buffer-provider-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Buffer draft-only provider contract
        run: npm run verify:buffer-provider
