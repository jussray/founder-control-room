name: Buffer Provider Contract

on:
  pull_request:
    paths:
      - 'config/buffer-provider-contract.json'
      - 'config/zapier-task-budget.json'
      - 'docs/founder-signal-engine/day3-buffer-content-boundary.md'
      - 'docs/founder-signal-engine/buffer-attack-ten.md'
      - 'docs/founder-signal-engine/auto-distribution-grant-v1.md'
      - 'docs/founder-signal-engine/claude-zapier-operator.md'
      - 'docs/founder-signal-engine/remote-mcp-bridge.md'
      - '.ai/skills/claude-zapier-founder-operator/SKILL.md'
      - 'scripts/verify-zapier-task-budget.mjs'
      - 'test/ai-company-parity.test.ts'
      - 'tools/zapier/buffer-attack-ten.cjs'
      - 'tools/zapier/buffer-content-firewall.cjs'
      - 'tools/zapier/buffer-review-window.cjs'
      - 'tools/zapier/social-attribution-readback.cjs'
      - 'tools/zapier/test-buffer-attack-ten.cjs'
      - 'tools/zapier/test-buffer-content-firewall.cjs'
      - 'tools/zapier/test-buffer-review-window.cjs'
      - 'tools/zapier/test-buffer-provider-contract.cjs'
      - 'tools/zapier/test-social-attribution-readback.cjs'
      - 'package.json'
      - '.github/workflows/buffer-provider-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact candidate head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify executable Buffer review-window contract
        run: npm run verify:buffer-content

      - name: Verify Buffer Attack Ten release contract
        run: node tools/zapier/test-buffer-attack-ten.cjs

      - name: Verify social attribution readback truth boundary
        run: node tools/zapier/test-social-attribution-readback.cjs

      - name: Verify planning envelope and live-capability gates
        run: node scripts/verify-zapier-task-budget.mjs
