name: Security catalog metadata
on:
  push:
    branches: [main, 'skills/security-catalog-v1']
    paths:
      - 'docs/security-skill-catalog.v1.json'
      - 'scripts/check-security-skill-catalog.cjs'
      - '.github/workflows/security-skill-catalog.yml'
  pull_request:
    paths:
      - 'docs/security-skill-catalog.v1.json'
      - 'scripts/check-security-skill-catalog.cjs'
      - '.github/workflows/security-skill-catalog.yml'
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node scripts/check-security-skill-catalog.cjs
