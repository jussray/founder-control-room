name: Founder Repo Cycle

on:
  push:
    branches:
      - main
    paths:
      - .node-version
      - package.json
      - package-lock.json
      - public/**
      - tsconfig*.json
      - eslint.config.*
      - playwright*.config.*
      - vitest*.config.*
      - scripts/**
      - src/**
      - e2e/**
      - .github/workflows/**
  pull_request:
    branches:
      - main
    paths:
      - .node-version
      - package.json
      - package-lock.json
      - public/**
      - tsconfig*.json
      - eslint.config.*
      - playwright*.config.*
      - vitest*.config.*
      - scripts/**
      - src/**
      - e2e/**
      - .github/workflows/**
  workflow_dispatch:
    inputs:
      operation:
        description: Repository cycle operation
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - inspect
          - test
          - build
          - verify
          - merge_gate
      expected_head_sha:
        description: Exact commit SHA approved for this run
        required: true
        type: string
      target_branch:
        description: Branch expected to contain the approved head
        required: true
        default: main
        type: string
      founder_approval_id:
        description: Founder approval receipt/decision ID; required by merge_gate and protected relay proof
        required: false
        type: string
      verify_federated_relay_v31:
        description: Run protected signed durable FCR → Chief → FCR v3.1 roundtrip after repository verification
        required: false
        default: false
        type: boolean
      fcr_relay_base_url:
        description: Exact FCR runtime base URL for relay proof
        required: false
        default: https://api.foundercontrolroom.org
        type: string
      chief_relay_base_url:
        description: Exact immutable Chief workers.dev preview origin
        required: false
        default: ''
        type: string
      chief_relay_target_sha:
        description: Exact Chief runtime SHA for relay proof
        required: false
        default: ''
        type: string
      chief_relay_target_branch:
        description: Exact Chief repository branch carried by the preview runtime
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: founder-repo-cycle-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.target_branch || github.ref }}-${{ inputs.operation || 'verify' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repo-cycle:
    name: ${{ inputs.operation || 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPO_CYCLE_OPERATION: ${{ inputs.operation || 'verify' }}
      TARGET_BRANCH: ${{ inputs.target_branch || github.head_ref || github.ref_name }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha || github.sha }}
      APPROVAL_SOURCE: founder
      FOUNDER_APPROVAL_ID: ${{ inputs.founder_approval_id || '' }}

    steps:
      - name: Verify dispatch ref is still the approved head
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          echo "Dispatch ref head: ${GITHUB_SHA}"
          echo "Approved head:     ${EXPECTED_HEAD_SHA}"
          if [ "${GITHUB_SHA}" != "${EXPECTED_HEAD_SHA}" ]; then
            echo "::error title=Stale repo-cycle dispatch::Target branch moved before workflow dispatch. Reacquire the current head and dispatch again."
            exit 1
          fi

      - name: Checkout approved exact head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify approved head is the current target branch tip
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin "${TARGET_BRANCH}"
          TARGET_TIP_SHA="$(git rev-parse FETCH_HEAD)"
          echo "Target branch:      ${TARGET_BRANCH}"
          echo "Target branch tip:  ${TARGET_TIP_SHA}"
          echo "Expected head:      ${EXPECTED_HEAD_SHA}"
          echo "Checked-out head:   ${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
          if [ "${TARGET_TIP_SHA}" != "${EXPECTED_HEAD_SHA}" ]; then
            echo "::error title=Stale exact-head proof::${TARGET_BRANCH} moved from ${EXPECTED_HEAD_SHA} to ${TARGET_TIP_SHA}. Reacquire current state; predecessor proof is historical."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify Node 24 runtime authority
        run: node scripts/verify-node24-runtime-authority.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run guarded repository cycle
        id: cycle
        run: >-
          node scripts/repo-cycle.mjs
          "${REPO_CYCLE_OPERATION}"
          "--target-branch=${TARGET_BRANCH}"
          "--expected-sha=${EXPECTED_HEAD_SHA}"
          "--approval-source=${APPROVAL_SOURCE}"
          "--approval-id=${FOUNDER_APPROVAL_ID}"

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          MERGE_AUTHORIZED="false"
          if [ -f repo-cycle-result.json ]; then
            MERGE_AUTHORIZED="$(node -e "const r=require('./repo-cycle-result.json'); process.stdout.write(String(r.merge_authorized === true))")"
          fi
          {
            echo "## Founder Repo Cycle"
            echo
            echo "- Operation: \`${REPO_CYCLE_OPERATION}\`"
            echo "- Target branch: \`${TARGET_BRANCH}\`"
            echo "- Approved head: \`${EXPECTED_HEAD_SHA}\`"
            echo "- Approval source: \`founder\`"
            echo "- Approval ID: \`${FOUNDER_APPROVAL_ID:-not supplied}\`"
            echo "- Merge authorized: \`${MERGE_AUTHORIZED}\`"
            echo
            echo "> Only a founder-issued receipt can authorize this exact SHA. This job remains evidence-only and read-only; the exact-SHA receipt is consumed by a separate merge executor."
            if [ -f repo-cycle-result.json ]; then
              echo
              echo "### Result"
              echo '```json'
              cat repo-cycle-result.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-cycle-${{ env.REPO_CYCLE_OPERATION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: repo-cycle-result.json
          if-no-files-found: warn
          retention-days: 30

  relay-v31-proof:
    name: Protected federated relay v3.1 exact-runtime proof
    if: github.event_name == 'workflow_dispatch' && inputs.verify_federated_relay_v31
    needs: repo-cycle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      FOUNDER_APPROVAL_ID: ${{ inputs.founder_approval_id || '' }}
      FCR_FEDERATED_RELAY_BASE_URL: ${{ inputs.fcr_relay_base_url }}
      FCR_FEDERATED_RELAY_SOURCE_SHA: ${{ inputs.expected_head_sha }}
      FCR_FEDERATED_RELAY_SOURCE_BRANCH: ${{ inputs.target_branch }}
      CHIEF_FEDERATED_RELAY_BASE_URL: ${{ inputs.chief_relay_base_url }}
      CHIEF_FEDERATED_RELAY_TARGET_SHA: ${{ inputs.chief_relay_target_sha }}
      CHIEF_FEDERATED_RELAY_TARGET_BRANCH: ${{ inputs.chief_relay_target_branch }}
      CHIEF_RUNTIME_ACCESS_CLIENT_ID: ${{ secrets.CHIEF_CLOUDFLARE_ACCESS_CLIENT_ID || secrets.CLOUDFLARE_ACCESS_CLIENT_ID || vars.CHIEF_CLOUDFLARE_ACCESS_CLIENT_ID || vars.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CHIEF_RUNTIME_ACCESS_CLIENT_SECRET: ${{ secrets.CHIEF_CLOUDFLARE_ACCESS_CLIENT_SECRET || secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Validate protected relay proof authority and inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.operation }}" != 'verify' ]; then
            echo '::error title=Wrong proof operation::Protected relay proof requires operation=verify.'
            exit 1
          fi
          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$CHIEF_FEDERATED_RELAY_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error title=Invalid exact identity::Both FCR and Chief exact lowercase 40-character SHAs are required.'
            exit 1
          fi
          if [ -z "$FOUNDER_APPROVAL_ID" ]; then
            echo '::error title=Missing founder proof approval::Protected relay evidence writes require a founder approval reference.'
            exit 1
          fi
          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null
          git check-ref-format --branch "$CHIEF_FEDERATED_RELAY_TARGET_BRANCH" >/dev/null
          if [ -z "$CHIEF_RUNTIME_ACCESS_CLIENT_ID" ] || [ -z "$CHIEF_RUNTIME_ACCESS_CLIENT_SECRET" ]; then
            echo '::error title=Missing Chief protected runtime credentials::Both Chief Access client credentials are required in the FCR production environment.'
            exit 1
          fi
          node --input-type=module <<'NODE'
          const raw = process.env.CHIEF_FEDERATED_RELAY_BASE_URL;
          let url;
          try { url = new URL(raw); } catch { process.exit(1); }
          if (
            url.protocol !== 'https:'
            || url.username
            || url.password
            || url.search
            || url.hash
            || (url.pathname !== '/' && url.pathname !== '')
            || !/^[0-9a-f]{8}-chief-ai\.mcgill-raylene\.workers\.dev$/i.test(url.hostname)
          ) process.exit(1);
          NODE

      - name: Verify dispatch ref remains exact
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error title=Stale protected relay dispatch::Workflow ref ${GITHUB_SHA} no longer matches ${EXPECTED_HEAD_SHA}."
            exit 1
          fi

      - name: Checkout protected proof subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-read exact FCR branch after repository verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch --no-tags origin "$TARGET_BRANCH"
          current_tip="$(git rev-parse FETCH_HEAD)"
          if [ "$current_tip" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error title=Stale FCR proof subject::${TARGET_BRANCH} moved to ${current_tip}."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build exact FCR proof subject
        run: npm run build

      - name: Prove protected signed durable FCR to Chief to FCR v3.1 roundtrip
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FCR_RELAY_SUPABASE_URL: https://oojzfmmywbvficgybaxd.supabase.co
        run: node scripts/prove-federated-agent-roundtrip-v31-protected.mjs

      - name: Publish protected relay proof summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Protected federated relay v3.1 proof'
            echo
            echo "- FCR exact head: \`${EXPECTED_HEAD_SHA}\`"
            echo "- FCR branch: \`${TARGET_BRANCH}\`"
            echo "- Chief exact head: \`${CHIEF_FEDERATED_RELAY_TARGET_SHA}\`"
            echo "- Chief branch: \`${CHIEF_FEDERATED_RELAY_TARGET_BRANCH}\`"
            echo "- Founder proof approval reference: \`${FOUNDER_APPROVAL_ID}\`"
            if [ -f federated-agent-roundtrip-v31.json ]; then
              echo '- Roundtrip: `VERIFIED`'
            else
              echo '- Roundtrip: `NOT VERIFIED`'
            fi
            echo
            echo '> This proof may write non-authorizing relay evidence only. It does not authorize merge, deploy, provider mutation, or execution authority.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload protected relay evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federated-relay-v31-${{ inputs.expected_head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: federated-agent-roundtrip-v31.json
          if-no-files-found: warn
          retention-days: 30
