name: Founder Repo Cycle

on:
  push:
    branches:
      - main
    paths:
      - .node-version
      - package.json
      - package-lock.json
      - public/**
      - tsconfig*.json
      - eslint.config.*
      - playwright*.config.*
      - vitest*.config.*
      - scripts/**
      - src/**
      - e2e/**
      - .github/workflows/**
  pull_request:
    branches:
      - main
    paths:
      - .node-version
      - package.json
      - package-lock.json
      - public/**
      - tsconfig*.json
      - eslint.config.*
      - playwright*.config.*
      - vitest*.config.*
      - scripts/**
      - src/**
      - e2e/**
      - .github/workflows/**
  workflow_dispatch:
    inputs:
      operation:
        description: Repository cycle operation
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - inspect
          - test
          - build
          - verify
          - merge_gate
      expected_head_sha:
        description: Exact commit SHA approved for this run
        required: true
        type: string
      target_branch:
        description: Branch expected to contain the approved commit
        required: true
        default: main
        type: string
      founder_approval_id:
        description: Founder approval receipt/decision ID; required by merge_gate
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: founder-repo-cycle-${{ github.repository }}-${{ github.event.pull_request.number || inputs.target_branch || github.ref }}-${{ github.event.pull_request.head.sha || inputs.expected_head_sha || github.sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repo-cycle:
    name: ${{ inputs.operation || 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPO_CYCLE_OPERATION: ${{ inputs.operation || 'verify' }}
      TARGET_BRANCH: ${{ inputs.target_branch || github.head_ref || github.ref_name }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha || github.sha }}
      APPROVAL_SOURCE: founder
      FOUNDER_APPROVAL_ID: ${{ inputs.founder_approval_id || '' }}

    steps:
      - name: Checkout approved head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify approved branch lineage and exact head before installing dependencies
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          REMOTE_BRANCH_REF="refs/remotes/origin/${TARGET_BRANCH}"
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:${REMOTE_BRANCH_REF}"
          CURRENT_BRANCH_HEAD_SHA="$(git rev-parse "${REMOTE_BRANCH_REF}")"
          echo "Expected branch:      ${TARGET_BRANCH}"
          echo "Current branch head:  ${CURRENT_BRANCH_HEAD_SHA}"
          echo "Expected exact head:  ${EXPECTED_HEAD_SHA}"
          echo "Checked-out head:     ${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
          git merge-base --is-ancestor "${EXPECTED_HEAD_SHA}" "${REMOTE_BRANCH_REF}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify Node 24 runtime authority
        run: node scripts/verify-node24-runtime-authority.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run guarded repository cycle
        id: cycle
        run: >-
          node scripts/repo-cycle.mjs
          "${REPO_CYCLE_OPERATION}"
          "--target-branch=${TARGET_BRANCH}"
          "--expected-sha=${EXPECTED_HEAD_SHA}"
          "--approval-source=${APPROVAL_SOURCE}"
          "--approval-id=${FOUNDER_APPROVAL_ID}"

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          MERGE_AUTHORIZED="false"
          if [ -f repo-cycle-result.json ]; then
            MERGE_AUTHORIZED="$(node -e "const r=require('./repo-cycle-result.json'); process.stdout.write(String(r.merge_authorized === true))")"
          fi
          {
            echo "## Founder Repo Cycle"
            echo
            echo "- Operation: \`${REPO_CYCLE_OPERATION}\`"
            echo "- Target branch: \`${TARGET_BRANCH}\`"
            echo "- Approved head: \`${EXPECTED_HEAD_SHA}\`"
            echo "- Approval source: \`founder\`"
            echo "- Approval ID: \`${FOUNDER_APPROVAL_ID:-not supplied}\`"
            echo "- Merge authorized: \`${MERGE_AUTHORIZED}\`"
            echo
            echo "> Only a founder-issued receipt can authorize this exact SHA. This workflow remains evidence-only and read-only; the exact-SHA receipt is consumed by a separate merge executor."
            if [ -f repo-cycle-result.json ]; then
              echo
              echo "### Result"
              echo '```json'
              cat repo-cycle-result.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-cycle-${{ env.REPO_CYCLE_OPERATION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: repo-cycle-result.json
          if-no-files-found: warn
          retention-days: 30
