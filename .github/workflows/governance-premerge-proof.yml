name: Governance Premerge Proof

on:
  push:
    branches:
      - 'governance/**'
      - 'security/**'
    paths:
      - 'config/founder-intelligence*.json'
      - 'scripts/verify-founder-intelligence-inheritance.mjs'
      - 'src/config/portfolio.ts'
      - 'src/config/portfolio.test.ts'
      - 'src/config/__tests__/portfolio.sync.test.ts'
      - 'src/governance/__tests__/founderChallengeStack.contract.test.ts'
      - 'src/http/middleware/security.ts'
      - 'src/http/__tests__/rateLimitBaseline.contract.test.ts'
      - 'public/_worker.js'
      - 'public/control-room/sync.html'
      - 'public/control-room/sync.css'
      - 'public/control-room/sync.js'
      - 'e2e/sync-control-room-bridge.spec.ts'
      - '.github/workflows/governance-premerge-proof.yml'

permissions:
  contents: read

concurrency:
  group: governance-premerge-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.sha }}

jobs:
  governance-proof:
    name: Exact-head governance + Playwright proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Founder Intelligence inheritance
        run: node scripts/verify-founder-intelligence-inheritance.mjs

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run focused governance and security contracts
        run: >-
          npx vitest run
          src/config/portfolio.test.ts
          src/config/__tests__/portfolio.sync.test.ts
          src/governance/__tests__/founderChallengeStack.contract.test.ts
          src/http/__tests__/rateLimitBaseline.contract.test.ts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright browser proof
        run: npm run test:e2e
        env:
          NODE_ENV: test

      - name: Run Sync control bridge Playwright proof
        run: npx playwright test -c playwright.config.ts e2e/sync-control-room-bridge.spec.ts
        env:
          NODE_ENV: test

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: governance-premerge-playwright-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14