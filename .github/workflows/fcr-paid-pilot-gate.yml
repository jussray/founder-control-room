name: FCR Non-Chargeable Pilot Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fcr-paid-pilot-gate.mjs'
      - 'scripts/fcr-paid-pilot-gate.test.mjs'
      - '.github/workflows/fcr-paid-pilot-gate.yml'
      - '.github/workflows/playwright.yml'
      - '.github/workflows/deploy.yml'
      - 'scripts/fcr-production-witness-contract.test.mjs'
  push:
    branches: [main]
    paths:
      - 'scripts/fcr-paid-pilot-gate.mjs'
      - 'scripts/fcr-paid-pilot-gate.test.mjs'
      - '.github/workflows/fcr-paid-pilot-gate.yml'

permissions:
  contents: read

# Superseded pull_request runs are cancelled: only the newest head's result can count.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pilot-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run sandbox-only pilot gate tests
        run: node --test scripts/fcr-paid-pilot-gate.test.mjs scripts/fcr-production-witness-contract.test.mjs
