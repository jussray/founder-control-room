name: FCR Cloudflare Build Cost Guard Apply

on:
  push:
    branches:
      - fix/cloudflare-build-cost-guard
    paths:
      - .github/workflows/cloudflare-build-cost-guard-apply.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fcr-cloudflare-build-cost-guard-apply
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply-cost-guard:
    name: Apply and verify FCR Worker build watch-path cost guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: 9b59861bd1747cf7525571b4c51d2aa0
      CF_READ_TOKEN: ${{ secrets.FCR_CLOUDFLARE_BUILDS_USER_TOKEN }}
      CF_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_WORKER_NAME: founder-control-room
    steps:
      - name: Require founder branch and repository credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "jussray"
          test "$GITHUB_REF" = "refs/heads/fix/cloudflare-build-cost-guard"
          [[ "$CF_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]
          test -n "${CF_READ_TOKEN:-}${CF_WRITE_TOKEN:-}"

      - name: Read, repair if required, and verify build watch paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const API = 'https://api.cloudflare.com/client/v4';
          const accountId = String(process.env.CF_ACCOUNT_ID || '').trim();
          const workerName = String(process.env.CF_WORKER_NAME || '').trim();
          const desired = {
            pathIncludes: ['*'],
            pathExcludes: [
              '.agents/**',
              '.ai/**',
              '.github/**',
              'artifacts/**',
              'docs/**',
              'e2e/**',
              'skills/**',
              'test/**',
              '*.md',
            ],
          };

          const cleanList = (value) => [...new Set((Array.isArray(value) ? value : [])
            .map((item) => String(item || '').trim()).filter(Boolean))];
          const sameSet = (left, right) => {
            const a = cleanList(left).sort();
            const b = cleanList(right).sort();
            return a.length === b.length && a.every((value, index) => value === b[index]);
          };
          const normalize = (value) => {
            let token = String(value || '').trim().normalize('NFKC');
            token = token.replace(/^Bearer\s+/iu, '').replace(/[\p{White_Space}\p{Cf}]+/gu, '');
            return /^[\x21-\x7e]+$/.test(token) ? token : '';
          };
          const tokenCandidates = [...new Set([
            normalize(process.env.CF_READ_TOKEN),
            normalize(process.env.CF_WRITE_TOKEN),
          ].filter(Boolean))];

          function providerError(payload, status) {
            const errors = Array.isArray(payload?.errors) ? payload.errors : [];
            return errors.map((entry) => `${entry?.code ?? 'unknown'}:${entry?.message ?? 'provider error'}`).join('; ') || `HTTP ${status}`;
          }

          async function cf(token, path, options = {}) {
            const response = await fetch(`${API}${path}`, {
              method: options.method || 'GET',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: options.body === undefined ? undefined : JSON.stringify(options.body),
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success === false) throw new Error(providerError(payload, response.status));
            return payload?.result;
          }

          async function inspect(token) {
            const scripts = await cf(token, `/accounts/${accountId}/workers/scripts?per_page=100`);
            const matches = (Array.isArray(scripts) ? scripts : []).filter((row) => row?.id === workerName);
            if (matches.length !== 1 || !matches[0]?.tag) throw new Error(`Expected one ${workerName} Worker with a script tag.`);
            const triggers = await cf(token, `/accounts/${accountId}/builds/workers/${matches[0].tag}/triggers`);
            const active = (Array.isArray(triggers) ? triggers : []).filter((row) => !row?.deleted_on);
            const production = active.filter((row) => {
              const includes = cleanList(row?.branch_includes);
              const excludes = cleanList(row?.branch_excludes);
              return includes.includes('main') && !excludes.includes('main') && !excludes.includes('*');
            });
            if (production.length !== 1) throw new Error(`Expected one active main production trigger, found ${production.length}.`);
            return {
              trigger: production[0],
              nonProductionTriggerCount: active.filter((row) => row?.trigger_uuid !== production[0]?.trigger_uuid).length,
            };
          }

          let readToken = null;
          let beforeState = null;
          const readFailures = [];
          for (const token of tokenCandidates) {
            try {
              beforeState = await inspect(token);
              readToken = token;
              break;
            } catch (error) {
              readFailures.push(error instanceof Error ? error.message : String(error));
            }
          }
          if (!readToken || !beforeState) throw new Error(`No refreshed repository token could read FCR Workers Builds state: ${readFailures.join(' | ')}`);

          const triggerUuid = String(beforeState.trigger?.trigger_uuid || '').trim();
          if (!triggerUuid) throw new Error('Production trigger UUID is missing.');
          const before = {
            pathIncludes: cleanList(beforeState.trigger?.path_includes),
            pathExcludes: cleanList(beforeState.trigger?.path_excludes),
          };
          const changeRequired = !sameSet(before.pathIncludes, desired.pathIncludes)
            || !sameSet(before.pathExcludes, desired.pathExcludes);
          const receipt = {
            schema: 'fcr/cloudflare-build-cost-guard@v2',
            generatedAt: new Date().toISOString(),
            worker: workerName,
            branchPolicy: 'main production trigger only',
            before,
            desired,
            after: null,
            applied: false,
            verified: false,
            changeRequired,
            nonProductionTriggerCount: beforeState.nonProductionTriggerCount,
            buildRequested: false,
            deploymentRequested: false,
          };
          const persist = () => fs.writeFileSync('artifacts/cloudflare-build-cost-guard.json', `${JSON.stringify(receipt, null, 2)}\n`);
          persist();

          if (!changeRequired) {
            receipt.after = before;
            receipt.verified = true;
            persist();
            console.log(`FCR_COST_GUARD_ALREADY_CORRECT non_production_triggers=${receipt.nonProductionTriggerCount}`);
            process.exit(0);
          }

          let writeToken = null;
          const writeFailures = [];
          for (const token of tokenCandidates) {
            try {
              await cf(token, `/accounts/${accountId}/builds/triggers/${triggerUuid}`, {
                method: 'PATCH',
                body: { path_includes: desired.pathIncludes, path_excludes: desired.pathExcludes },
              });
              writeToken = token;
              break;
            } catch (error) {
              writeFailures.push(error instanceof Error ? error.message : String(error));
            }
          }
          if (!writeToken) throw new Error(`No refreshed repository token could write FCR Workers Builds state: ${writeFailures.join(' | ')}`);

          try {
            const afterState = await inspect(readToken);
            const after = {
              pathIncludes: cleanList(afterState.trigger?.path_includes),
              pathExcludes: cleanList(afterState.trigger?.path_excludes),
            };
            if (!sameSet(after.pathIncludes, desired.pathIncludes) || !sameSet(after.pathExcludes, desired.pathExcludes)) {
              throw new Error('FCR Cloudflare watch-path readback mismatch.');
            }
            receipt.after = after;
            receipt.applied = true;
            receipt.verified = true;
            receipt.nonProductionTriggerCount = afterState.nonProductionTriggerCount;
            persist();
            console.log(`FCR_COST_GUARD_VERIFIED non_production_triggers=${receipt.nonProductionTriggerCount}`);
          } catch (error) {
            try {
              await cf(writeToken, `/accounts/${accountId}/builds/triggers/${triggerUuid}`, {
                method: 'PATCH',
                body: { path_includes: before.pathIncludes, path_excludes: before.pathExcludes },
              });
              console.error('FCR_COST_GUARD_ROLLBACK_SUCCEEDED');
            } catch {
              console.error('FCR_COST_GUARD_ROLLBACK_FAILED');
            }
            persist();
            throw error;
          }
          NODE

      - name: Upload sanitized cost-guard receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fcr-cloudflare-build-cost-guard-${{ github.run_id }}
          path: artifacts/cloudflare-build-cost-guard.json
          if-no-files-found: warn
          retention-days: 30

  browser-proof:
    name: Attempt Playwright front-door proof after cost guard
    needs: apply-cost-guard
    if: ${{ always() && needs.apply-cost-guard.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Check out exact repair commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright live front-door probe
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const clientId = String(process.env.ACCESS_CLIENT_ID || '').trim();
          const clientSecret = String(process.env.ACCESS_CLIENT_SECRET || '').trim();
          const headers = clientId && clientSecret
            ? { 'CF-Access-Client-Id': clientId, 'CF-Access-Client-Secret': clientSecret }
            : {};
          const browser = await chromium.launch({ headless: true });
          try {
            const context = await browser.newContext({ extraHTTPHeaders: headers });
            const page = await context.newPage();
            const response = await page.goto('https://foundercontrolroom.org/', { waitUntil: 'domcontentloaded' });
            const status = response?.status() ?? 0;
            if (status < 200 || status >= 400) throw new Error(`FCR_FRONT_DOOR_STATUS_${status}`);
            const text = await page.locator('body').innerText();
            if (!/Founder Control Room/i.test(text)) throw new Error('FCR_FRONT_DOOR_IDENTITY_MISSING');
            console.log(`FCR_PLAYWRIGHT_FRONT_DOOR_OK status=${status} access_service_auth=${Boolean(clientId && clientSecret)}`);
          } finally {
            await browser.close();
          }
          NODE
