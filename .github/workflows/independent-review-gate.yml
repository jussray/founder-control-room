name: Independent Review Gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: independent-review-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  independent-review:
    name: Independent Review Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify independent-review gate contracts
        run: node --test scripts/verify-independent-review-required-gate.node-test.mjs

      - name: Verify live provider review on exact head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FCR_TRUSTED_SEMANTIC_REVIEWER_IDS: ${{ vars.FCR_TRUSTED_SEMANTIC_REVIEWER_IDS }}
        run: node scripts/verify-independent-review-required-gate.mjs
