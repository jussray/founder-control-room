name: Independent Review Contract Tests (advisory)

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: independent-review-contract-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  contract-tests:
    name: Independent Review Contract Tests (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head for advisory contract tests
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Record exact candidate head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify independent-review contract semantics
        run: node --test scripts/verify-independent-review-required-gate.node-test.mjs

      - name: Record authority boundary
        shell: bash
        run: |
          printf '%s\n' 'This candidate-controlled workflow is advisory only.'
          printf '%s\n' 'Native GitHub ruleset review enforcement and authoritative provider readback remain merge authority.'
