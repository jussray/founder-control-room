name: Prompt Workflow Router Proof

on:
  pull_request:
    paths:
      - '.ai-skills/gpts/builder-prompt-workflow-router.md'
      - 'src/lib/builderPromptWorkflowRouter.ts'
      - 'src/lib/projectEvidenceAgent.ts'
      - 'src/lib/founderControlDecision.ts'
      - 'src/lib/__tests__/builderPromptWorkflowRouter.test.ts'
      - 'src/lib/__tests__/projectEvidenceAgent.test.ts'
      - 'src/lib/__tests__/founderControlDecision.test.ts'
      - 'src/http/server.ts'
      - 'src/http/routes/builderPromptWorkflow.ts'
      - 'src/http/routes/__tests__/builderPromptWorkflow.integration.test.ts'
      - 'src/http/routes/__tests__/builderPromptWorkflow.server-contract.test.ts'
      - 'src/http/routes/__tests__/builderPromptWorkflow.server-mount.test.ts'
      - 'scripts/verify-prompt-workflow-router.mjs'
      - '.github/workflows/prompt-workflow-router-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Source wiring proof
        run: node scripts/verify-prompt-workflow-router.mjs
      - name: Founder control + deterministic workflow router proof
        run: npx vitest run src/lib/__tests__/founderControlDecision.test.ts src/lib/__tests__/builderPromptWorkflowRouter.test.ts src/lib/__tests__/projectEvidenceAgent.test.ts src/http/routes/__tests__/builderPromptWorkflow.integration.test.ts src/http/routes/__tests__/builderPromptWorkflow.server-contract.test.ts src/http/routes/__tests__/builderPromptWorkflow.server-mount.test.ts
