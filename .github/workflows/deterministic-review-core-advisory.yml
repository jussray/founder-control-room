name: Deterministic Review Core Advisory

on:
  push:
    branches:
      - feat/deterministic-review-executor-6601086

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.sha }}
  DOC_TRUTH_BASE_SHA: ea2b75a45a890b291152bc89c08cecd8ef52706a

jobs:
  deterministic-review-core:
    name: Advisory deterministic review core
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\nbase=%s\n' "$EXPECTED_HEAD_SHA" "$actual" "$DOC_TRUTH_BASE_SHA"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$DOC_TRUTH_BASE_SHA" "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check repository
        run: npm run typecheck

      - name: Run deterministic review core attacks
        run: >-
          npx vitest run
          src/review/deterministicReviewProducer.test.ts
          src/review/deterministicReviewProducer.boundary.test.ts
          src/review/deterministicReviewWitnessPublisher.test.ts
          src/providers/__tests__/deterministicReviewGitHubProvider.test.ts
          src/providers/__tests__/providerFactory.independentReviewBoundary.test.ts

      - name: Verify stacked documentation truth
        run: node scripts/verify-documentation-truth.mjs
