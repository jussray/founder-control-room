name: Deterministic Review Witness

on:
  push:
    branches:
      - feat/deterministic-review-witness-v1-35817fe
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to review from trusted current main
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.sha }}
  DOC_TRUTH_BASE_SHA: 19682c6debfdf1be08a260ae02d6c393b5a6a881

jobs:
  deterministic-review-witness:
    if: github.event_name == 'push'
    name: Advisory deterministic review witness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact head and stacked base
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\nbase=%s\n' "$EXPECTED_HEAD_SHA" "$actual" "$DOC_TRUTH_BASE_SHA"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$DOC_TRUTH_BASE_SHA" "$EXPECTED_HEAD_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check repository
        run: npm run typecheck

      - name: Run deterministic review producer and witness attacks
        run: >-
          npx vitest run
          src/review/deterministicReviewProducer.test.ts
          src/review/deterministicReviewProducer.boundary.test.ts
          src/review/deterministicReviewWitnessPublisher.test.ts
          src/review/deterministicReviewWitnessExecutionTrustRoot.test.ts
          src/review/deterministicReviewFingerprintGate.test.ts
          src/review/founderFinalReviewPolicy.test.ts
          src/providers/__tests__/deterministicReviewGitHubProvider.test.ts
          src/providers/__tests__/providerFactory.independentReviewBoundary.test.ts

      - name: Verify stacked documentation truth
        run: node scripts/verify-documentation-truth.mjs

  publish-trusted-witness:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Publish trusted deterministic review witness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deterministic-review-witness-${{ inputs.pull_request_number }}
      cancel-in-progress: false
    env:
      FCR_REVIEW_PR_NUMBER: ${{ inputs.pull_request_number }}
      EXPECTED_TRUSTED_MAIN_SHA: ${{ github.sha }}
      GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
      GITHUB_PRIVATE_KEY: ${{ secrets.GITHUB_PRIVATE_KEY }}
    steps:
      - name: Check out trusted default-branch implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_TRUSTED_MAIN_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed unless workflow code is exact current main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$EXPECTED_TRUSTED_MAIN_SHA" = "$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          printf 'trusted_workflow_sha=%s\ncurrent_main=%s\n' "$EXPECTED_TRUSTED_MAIN_SHA" "$current_main"
          test "$EXPECTED_TRUSTED_MAIN_SHA" = "$current_main"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build trusted review implementation
        run: npm run build

      - name: Verify witness trust-root contracts before publication
        run: >-
          npx vitest run
          src/review/deterministicReviewProducer.test.ts
          src/review/deterministicReviewProducer.boundary.test.ts
          src/review/deterministicReviewWitnessPublisher.test.ts
          src/review/deterministicReviewWitnessExecutionTrustRoot.test.ts
          src/review/deterministicReviewFingerprintGate.test.ts
          src/review/founderFinalReviewPolicy.test.ts
          src/providers/__tests__/deterministicReviewGitHubProvider.test.ts
          src/providers/__tests__/providerFactory.independentReviewBoundary.test.ts

      - name: Publish and read back exact-head witness
        run: node scripts/publish-deterministic-review-witness.mjs

      - name: Re-read trusted main after publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          printf 'trusted_workflow_sha=%s\ncurrent_main_after=%s\n' "$EXPECTED_TRUSTED_MAIN_SHA" "$current_main"
          test "$EXPECTED_TRUSTED_MAIN_SHA" = "$current_main"

      - name: Retain deterministic review receipt and provider readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deterministic-review-witness-pr-${{ inputs.pull_request_number }}-${{ github.run_id }}
          path: artifacts/deterministic-review-witness.json
          if-no-files-found: error
          retention-days: 30
