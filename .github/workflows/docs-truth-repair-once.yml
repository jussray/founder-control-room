name: Documentation Truth Repair Once

on:
  push:
    branches: [automation/docs-truth-repair-e5d6d87]

permissions:
  contents: write

concurrency:
  group: docs-truth-repair-e5d6d87
  cancel-in-progress: false

env:
  TARGET_MAIN_SHA: 0b3fc9af036571c0b32419e684bca2455dbfb13e
  TARGET_PR_HEAD_SHA: 4577b088dc2e1e9c34098d1b77233de578292c1c
  TARGET_PR_BRANCH: fix/runtime-signal-test-supabase-mock
  TRUTH_RANGE_BASE_SHA: 3a8d622a4eaaec89d3c0120d65ea555e98cd1c7d
  CANDIDATE_TAG: evidence/docs-truth-pr935-rollover-20261005
  EXPECTED_OVERLAP_PATH: src/worker/__tests__/cloudflareRuntimeSignal.test.ts

jobs:
  repair:
    name: Roll PR 935 truth sync to current main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR 935 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_PR_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse stale main or PR head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_PR_HEAD_SHA"
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            "refs/heads/$TARGET_PR_BRANCH:refs/remotes/origin/$TARGET_PR_BRANCH"
          live_main="$(git rev-parse refs/remotes/origin/main)"
          live_pr="$(git rev-parse "refs/remotes/origin/$TARGET_PR_BRANCH")"
          printf 'target_main=%s\nlive_main=%s\ntarget_pr=%s\nlive_pr=%s\n' \
            "$TARGET_MAIN_SHA" "$live_main" "$TARGET_PR_HEAD_SHA" "$live_pr"
          test "$live_main" = "$TARGET_MAIN_SHA"
          test "$live_pr" = "$TARGET_PR_HEAD_SHA"

      - name: Roll current main into PR and preserve main on the known overlap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FCR Truth Repair'
          git config user.email '286642846+jussray@users.noreply.github.com'

          set +e
          git merge --no-ff --no-commit refs/remotes/origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            printf 'conflicts=%s\n' "$conflicts"
            test "$conflicts" = "$EXPECTED_OVERLAP_PATH"
            git checkout --theirs -- "$EXPECTED_OVERLAP_PATH"
            git add "$EXPECTED_OVERLAP_PATH"
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m 'chore: roll PR 935 truth sync to current main'

      - name: Prove PR delta is documentation-only and truth is current
        shell: bash
        run: |
          set -euo pipefail
          delta="$(git diff --name-only refs/remotes/origin/main...HEAD)"
          printf 'pr_delta:\n%s\n' "$delta"
          test "$delta" = $'README.md\ndocs/DOCUMENTATION_TRUTH_RECEIPT.json\ndocs/TRUTH_DECAY_AUDIT.md'
          git diff --check refs/remotes/origin/main...HEAD
          DOC_TRUTH_BASE_SHA="$TRUTH_RANGE_BASE_SHA" node scripts/verify-documentation-truth.mjs
          candidate_sha="$(git rev-parse HEAD)"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"

      - name: Stage verified rolled candidate as tag only
        env:
          REPO_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          live_main="$(git ls-remote "$remote" refs/heads/main | awk 'NR==1 {print $1}')"
          live_pr="$(git ls-remote "$remote" "refs/heads/$TARGET_PR_BRANCH" | awk 'NR==1 {print $1}')"
          existing_tag="$(git ls-remote "$remote" "refs/tags/$CANDIDATE_TAG" | awk 'NR==1 {print $1}')"
          printf 'target_main=%s\nlive_main=%s\ntarget_pr=%s\nlive_pr=%s\ncandidate=%s\nexisting_tag=%s\n' \
            "$TARGET_MAIN_SHA" "$live_main" "$TARGET_PR_HEAD_SHA" "$live_pr" "$CANDIDATE_SHA" "$existing_tag"
          test "$live_main" = "$TARGET_MAIN_SHA"
          test "$live_pr" = "$TARGET_PR_HEAD_SHA"
          test -z "$existing_tag"
          git push "$remote" "HEAD:refs/tags/$CANDIDATE_TAG"
