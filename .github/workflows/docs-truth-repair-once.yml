name: Documentation Truth Repair Once

on:
  push:
    branches: [automation/docs-truth-repair-e5d6d87]

permissions:
  contents: write

concurrency:
  group: docs-truth-repair-e5d6d87
  cancel-in-progress: false

env:
  TARGET_MAIN_SHA: e5d6d87885553d018a9af2fcb97eb7aa7d8d2bf5
  TARGET_PR_HEAD_SHA: b9cd73775d88e50c2b2de81f5dcc7f5d6afe12de
  TARGET_PR_BRANCH: fix/runtime-signal-test-supabase-mock
  TRUTH_RANGE_BASE_SHA: 3a8d622a4eaaec89d3c0120d65ea555e98cd1c7d
  STORYENGINE_SHA: 91af998c2c7adad0792dd394735ca738b92ab26d
  PREDECESSOR_PLAYWRIGHT_RUN_ID: '37346101986'
  CANDIDATE_TAG: evidence/docs-truth-pr935-candidate-20261005

jobs:
  repair:
    name: Stage exact PR 935 truth candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR 935 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_PR_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse stale main or PR head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_PR_HEAD_SHA"
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            "refs/heads/$TARGET_PR_BRANCH:refs/remotes/origin/$TARGET_PR_BRANCH"
          live_main="$(git rev-parse refs/remotes/origin/main)"
          live_pr="$(git rev-parse "refs/remotes/origin/$TARGET_PR_BRANCH")"
          printf 'target_main=%s\nlive_main=%s\ntarget_pr=%s\nlive_pr=%s\n' \
            "$TARGET_MAIN_SHA" "$live_main" "$TARGET_PR_HEAD_SHA" "$live_pr"
          test "$live_main" = "$TARGET_MAIN_SHA"
          test "$live_pr" = "$TARGET_PR_HEAD_SHA"

      - name: Refresh only the required truth artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          predecessor_sha = os.environ['TARGET_MAIN_SHA']
          story_sha = os.environ['STORYENGINE_SHA']
          run_id = os.environ['PREDECESSOR_PLAYWRIGHT_RUN_ID']

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          paragraph = (
              f"On October 5, 2026, FCR predecessor `main@{predecessor_sha}` rebound the StoryEngine federation evidence subject to exact StoryEngine `{story_sha}` and completed Playwright run `{run_id}`, including live-ref freshness, immutable peer checkout, exact StoryEngine runtime startup, and the FCR-to-StoryEngine receipt loop. "
              "That witness belongs only to that predecessor FCR/StoryEngine pair. Any successor FCR head must earn fresh exact-head browser proof before present-tense federation readiness can be claimed; this receipt grants no merge, production deploy, publication, spend, or provider-mutation authority."
          )
          if paragraph not in readme:
              marker = "\nSee [`docs/REPOSITORY_FEDERATION.md`](docs/REPOSITORY_FEDERATION.md)."
              if marker not in readme:
                  raise SystemExit('README StoryEngine insertion marker not found')
              readme = readme.replace(marker, f"\n{paragraph}\n{marker}", 1)
              readme_path.write_text(readme)

          truth_path = Path('docs/TRUTH_DECAY_AUDIT.md')
          truth = truth_path.read_text()
          heading = '## 2026-10-05 StoryEngine predecessor witness reacquired; successor proof required'
          section = (
              f"\n\n{heading}\n\n"
              f"The prior StoryEngine evidence pin drifted from live `refs/heads/main`. FCR predecessor `{predecessor_sha}` selected exact StoryEngine `{story_sha}` as the successor evidence subject and intentionally expired the older federation green rather than carrying it forward.\n\n"
              f"Playwright run `{run_id}` then succeeded on that exact predecessor FCR head: it rechecked the live StoryEngine ref, checked out the immutable peer SHA, started the exact StoryEngine runtime, and completed the FCR-to-StoryEngine directive/receipt browser loop. That proof is historical for any later FCR head. A successor candidate must earn its own exact-head Playwright federation witness; none of this evidence authorizes merge, production deployment, publication, spend, or provider mutation."
          )
          if heading not in truth:
              truth_path.write_text(truth.rstrip() + section + '\n')

          receipt_path = Path('docs/DOCUMENTATION_TRUTH_RECEIPT.json')
          receipt = json.loads(receipt_path.read_text())
          purpose_suffix = ' It also records the October 5 StoryEngine predecessor browser witness while requiring every successor FCR head to earn fresh exact-head federation proof.'
          if purpose_suffix.strip() not in receipt['purpose']:
              receipt['purpose'] = receipt['purpose'].rstrip() + purpose_suffix

          claim = (
              f"On October 5, 2026, `.github/workflows/playwright.yml` on FCR predecessor `{predecessor_sha}` bound StoryEngine `{story_sha}` and Playwright run `{run_id}` verified the live ref, immutable peer checkout, exact peer runtime, and FCR-to-StoryEngine receipt loop. That evidence is predecessor-only; successor FCR heads require fresh exact-head browser proof and receive no merge, deploy, production, publication, spend, or provider-mutation authority from this receipt."
          )
          change = next((item for item in receipt['changes'] if item.get('path') == '.github/workflows/playwright.yml'), None)
          if change is None:
              raise SystemExit('documentation receipt lacks playwright evidence-authority entry')
          if claim not in change['claims']:
              change['claims'].append(claim)
          receipt_path.write_text(json.dumps(receipt, indent=2, ensure_ascii=False) + '\n')
          PY

          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'README.md\ndocs/DOCUMENTATION_TRUTH_RECEIPT.json\ndocs/TRUTH_DECAY_AUDIT.md'
          git diff --check

      - name: Commit candidate and verify cumulative truth range
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FCR Truth Repair'
          git config user.email '286642846+jussray@users.noreply.github.com'
          git add README.md docs/TRUTH_DECAY_AUDIT.md docs/DOCUMENTATION_TRUTH_RECEIPT.json
          git commit -m 'docs(truth): bind StoryEngine predecessor witness'
          candidate_sha="$(git rev-parse HEAD)"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"
          DOC_TRUTH_BASE_SHA="$TRUTH_RANGE_BASE_SHA" node scripts/verify-documentation-truth.mjs

      - name: Stage verified candidate as tag only
        env:
          REPO_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          live_main="$(git ls-remote "$remote" refs/heads/main | awk 'NR==1 {print $1}')"
          live_pr="$(git ls-remote "$remote" "refs/heads/$TARGET_PR_BRANCH" | awk 'NR==1 {print $1}')"
          existing_tag="$(git ls-remote "$remote" "refs/tags/$CANDIDATE_TAG" | awk 'NR==1 {print $1}')"
          printf 'target_main=%s\nlive_main=%s\ntarget_pr=%s\nlive_pr=%s\ncandidate=%s\nexisting_tag=%s\n' \
            "$TARGET_MAIN_SHA" "$live_main" "$TARGET_PR_HEAD_SHA" "$live_pr" "$CANDIDATE_SHA" "$existing_tag"
          test "$live_main" = "$TARGET_MAIN_SHA"
          test "$live_pr" = "$TARGET_PR_HEAD_SHA"
          test -z "$existing_tag"
          git push "$remote" "HEAD:refs/tags/$CANDIDATE_TAG"
