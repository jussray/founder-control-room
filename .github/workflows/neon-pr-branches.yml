name: Create/Delete Branch for Pull Request

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: neon-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  create_neon_branch:
    name: Create Neon Branch
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'opened' ||
       github.event.action == 'reopened' ||
       github.event.action == 'synchronize')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify Neon preview scope
        id: neon_scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed_files"
          if grep -Eq '^(supabase/migrations/|supabase/seed\.sql$)' <<<"$changed_files"; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
            echo 'Database-affecting changes detected; Neon preview required.'
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
            echo 'No database-affecting changes detected; skipping Neon preview.'
          fi

      - name: Validate Neon configuration
        if: steps.neon_scope.outputs.required == 'true'
        shell: bash
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEON_PROJECT_ID" || { echo 'NEON_PROJECT_ID is not configured' >&2; exit 1; }
          test -n "$NEON_API_KEY" || { echo 'NEON_API_KEY is not configured' >&2; exit 1; }

      - name: Set branch expiration
        if: steps.neon_scope.outputs.required == 'true'
        shell: bash
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon Branch
        if: steps.neon_scope.outputs.required == 'true'
        id: create_neon_branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      - name: Verify branch creation result
        if: steps.neon_scope.outputs.required == 'true'
        shell: bash
        env:
          NEON_BRANCH_ID: ${{ steps.create_neon_branch.outputs.branch_id }}
        run: |
          set -euo pipefail
          test -n "$NEON_BRANCH_ID" || { echo 'Neon create action returned no branch_id' >&2; exit 1; }

  delete_neon_branch:
    name: Delete Neon Branch
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify Neon preview scope
        id: neon_scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed_files"
          if grep -Eq '^(supabase/migrations/|supabase/seed\.sql$)' <<<"$changed_files"; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
            echo 'Database-affecting changes detected; Neon preview cleanup required.'
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
            echo 'No database-affecting changes detected; no Neon preview to clean up.'
          fi

      - name: Validate Neon configuration
        if: steps.neon_scope.outputs.required == 'true'
        shell: bash
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEON_PROJECT_ID" || { echo 'NEON_PROJECT_ID is not configured' >&2; exit 1; }
          test -n "$NEON_API_KEY" || { echo 'NEON_API_KEY is not configured' >&2; exit 1; }

      - name: Delete Neon Branch
        if: steps.neon_scope.outputs.required == 'true'
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
