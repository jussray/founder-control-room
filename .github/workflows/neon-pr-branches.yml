name: Create/Delete Branch for Pull Request

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: neon-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  create_neon_branch:
    name: Create Neon Branch
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'opened' ||
       github.event.action == 'reopened' ||
       github.event.action == 'synchronize')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Classify Neon preview scope
        id: neon_scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mapfile -t CHANGED_FILES < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename'
          )

          NEEDS_NEON=false
          for path in "${CHANGED_FILES[@]}"; do
            case "$path" in
              supabase/*)
                NEEDS_NEON=true
                break
                ;;
            esac
          done

          echo "needs_neon=${NEEDS_NEON}" >> "$GITHUB_OUTPUT"
          if [ "$NEEDS_NEON" = "true" ]; then
            echo 'Supabase change detected; Neon preview branch is required.'
          else
            echo 'No supabase/ change detected; Neon preview branch is not required.'
          fi

      - name: Record non-database no-op
        if: steps.neon_scope.outputs.needs_neon == 'false'
        shell: bash
        run: echo 'Neon preview skipped because this PR does not change supabase/.'

      - name: Validate Neon configuration
        if: steps.neon_scope.outputs.needs_neon == 'true'
        shell: bash
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEON_PROJECT_ID" || { echo 'NEON_PROJECT_ID is not configured' >&2; exit 1; }
          test -n "$NEON_API_KEY" || { echo 'NEON_API_KEY is not configured' >&2; exit 1; }

      - name: Set branch expiration
        if: steps.neon_scope.outputs.needs_neon == 'true'
        shell: bash
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon Branch
        if: steps.neon_scope.outputs.needs_neon == 'true'
        id: create_neon_branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      - name: Verify branch creation result
        if: steps.neon_scope.outputs.needs_neon == 'true'
        shell: bash
        env:
          NEON_BRANCH_ID: ${{ steps.create_neon_branch.outputs.branch_id }}
          NEON_DB_URL: ${{ steps.create_neon_branch.outputs.db_url }}
        run: |
          set -euo pipefail
          test -n "$NEON_BRANCH_ID" || { echo 'Neon create action returned no branch_id' >&2; exit 1; }
          test -n "$NEON_DB_URL" || { echo 'Neon create action returned no database URL' >&2; exit 1; }
          echo 'Neon branch identity and private database URL output are present. URL value was not printed.'

      - name: Check out exact PR head for migration proof
        if: steps.neon_scope.outputs.needs_neon == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact PR head
        if: steps.neon_scope.outputs.needs_neon == 'true'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Establish authoritative FCR preview baseline
        if: steps.neon_scope.outputs.needs_neon == 'true'
        shell: bash
        env:
          NEON_DB_URL: ${{ steps.create_neon_branch.outputs.db_url }}
        run: |
          set -euo pipefail

          HAS_PROJECTS="$(psql "$NEON_DB_URL" -X -Atqc "select to_regclass('public.projects') is not null")"
          HAS_FOUNDER_USERS="$(psql "$NEON_DB_URL" -X -Atqc "select to_regclass('public.founder_users') is not null")"

          if [ "$HAS_PROJECTS" = "t" ] && [ "$HAS_FOUNDER_USERS" = "t" ]; then
            echo 'Core FCR preview baseline already exists.'
            exit 0
          fi
          if [ "$HAS_PROJECTS" != "$HAS_FOUNDER_USERS" ]; then
            echo '::error title=Inconsistent Neon FCR baseline::projects and founder_users must both exist or both be absent before PR migrations run.'
            exit 1
          fi

          # Neon is generic PostgreSQL, while the authoritative FCR migrations
          # target Supabase PostgreSQL. Provide only the auth object signatures
          # needed to replay the real baseline migrations. They return no
          # identity and therefore cannot grant founder authority in preview.
          psql "$NEON_DB_URL" -X -1 -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY,
            email text
          );
          CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb
          LANGUAGE sql STABLE AS $$ SELECT '{}'::jsonb $$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text
          LANGUAGE sql STABLE AS $$ SELECT NULL::text $$;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          SQL

          BASELINE_MIGRATIONS=(
            supabase/migrations/20260711030127_init_control_room_schema.sql
            supabase/migrations/20260711030936_enable_rls_and_founder_policy.sql
            supabase/migrations/20260831153313_bind_founder_authority_to_immutable_user_id.sql
          )
          for migration in "${BASELINE_MIGRATIONS[@]}"; do
            test -f "$migration" || { echo "Missing authoritative FCR baseline migration: $migration" >&2; exit 1; }
            echo "Applying authoritative FCR baseline migration: $migration"
            psql "$NEON_DB_URL" -X -1 -v ON_ERROR_STOP=1 -f "$migration"
          done

          HAS_PROJECTS="$(psql "$NEON_DB_URL" -X -Atqc "select to_regclass('public.projects') is not null")"
          HAS_FOUNDER_USERS="$(psql "$NEON_DB_URL" -X -Atqc "select to_regclass('public.founder_users') is not null")"
          HAS_USER_ID="$(psql "$NEON_DB_URL" -X -Atqc "select count(*) from information_schema.columns where table_schema='public' and table_name='founder_users' and column_name='user_id' and data_type='uuid')"
          test "$HAS_PROJECTS" = "t"
          test "$HAS_FOUNDER_USERS" = "t"
          test "$HAS_USER_ID" = "1"
          echo 'Authoritative FCR core baseline established on Neon with deny/no-user auth compatibility signatures.'

      - name: Execute added migrations on Neon preview
        if: steps.neon_scope.outputs.needs_neon == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEON_DB_URL: ${{ steps.create_neon_branch.outputs.db_url }}
        run: |
          set -euo pipefail

          mapfile -t REWRITTEN_MIGRATIONS < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
              --jq '.[] | select((.filename | startswith("supabase/migrations/")) and (.filename | endswith(".sql")) and .status != "added") | "\(.status) \(.filename)"'
          )
          if (( ${#REWRITTEN_MIGRATIONS[@]} > 0 )); then
            printf '::error title=Migration history rewrite is not preview-safe::%s\n' "${REWRITTEN_MIGRATIONS[*]}"
            exit 1
          fi

          mapfile -t MIGRATIONS < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
              --jq '.[] | select((.filename | startswith("supabase/migrations/")) and (.filename | endswith(".sql")) and .status == "added") | .filename' \
              | sort
          )

          if (( ${#MIGRATIONS[@]} == 0 )); then
            echo 'Supabase scope changed but no added SQL migration was found.'
            exit 0
          fi

          # The preview branch is reused across synchronize events. Keep an
          # isolated CI-only checksum ledger so the exact same migration is
          # skipped on rerun, while changing an already-applied migration fails
          # closed and requires a new append-only migration instead.
          psql "$NEON_DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS ci_preview;
          CREATE TABLE IF NOT EXISTS ci_preview.migration_receipts (
            filename TEXT PRIMARY KEY,
            sha256 TEXT NOT NULL CHECK (sha256 ~ '^[0-9a-f]{64}$'),
            applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          SQL

          for migration in "${MIGRATIONS[@]}"; do
            if [[ ! "$migration" =~ ^supabase/migrations/[0-9]{14}_[A-Za-z0-9_]+\.sql$ ]]; then
              echo "::error title=Invalid migration path::$migration is not a canonical append-only migration filename."
              exit 1
            fi
            test -f "$migration" || { echo "Missing migration file: $migration" >&2; exit 1; }

            CHECKSUM="$(sha256sum "$migration" | awk '{print $1}')"
            # The migration path is interpolated only after the strict filename
            # allowlist above; it therefore cannot contain a quote or SQL token.
            EXISTING="$(psql "$NEON_DB_URL" -X -Atq \
              -c "SELECT sha256 FROM ci_preview.migration_receipts WHERE filename = '$migration';")"

            if [ -n "$EXISTING" ]; then
              if [ "$EXISTING" = "$CHECKSUM" ]; then
                echo "Preview migration already applied with matching checksum: $migration"
                continue
              fi
              echo "::error title=Applied migration changed::$migration was already executed on this preview with a different checksum. Add a new migration instead of rewriting history."
              exit 1
            fi

            echo "Applying preview migration atomically: $migration"
            psql "$NEON_DB_URL" -X -1 -v ON_ERROR_STOP=1 -f "$migration"
            psql "$NEON_DB_URL" -X -v ON_ERROR_STOP=1 \
              -c "INSERT INTO ci_preview.migration_receipts(filename, sha256) VALUES ('$migration', '$CHECKSUM');"
          done

      - name: Verify workspace tenancy preview schema when present
        if: steps.neon_scope.outputs.needs_neon == 'true'
        shell: bash
        env:
          NEON_DB_URL: ${{ steps.create_neon_branch.outputs.db_url }}
        run: |
          set -euo pipefail
          HAS_WORKSPACES="$(psql "$NEON_DB_URL" -X -Atqc "select to_regclass('public.workspaces') is not null")"
          if [ "$HAS_WORKSPACES" != "t" ]; then
            echo 'Workspace tenancy table is not part of this preview.'
            exit 0
          fi

          FOUNDER_WORKSPACE="$(psql "$NEON_DB_URL" -X -Atqc "select count(*) from information_schema.columns where table_schema='public' and table_name='founder_users' and column_name='workspace_id' and data_type='uuid' and is_nullable='NO')"
          FOUNDER_ROLE="$(psql "$NEON_DB_URL" -X -Atqc "select count(*) from information_schema.columns where table_schema='public' and table_name='founder_users' and column_name='account_role' and is_nullable='NO')"
          PROJECT_WORKSPACE="$(psql "$NEON_DB_URL" -X -Atqc "select count(*) from information_schema.columns where table_schema='public' and table_name='projects' and column_name='workspace_id' and data_type='uuid' and is_nullable='NO')"
          WORKSPACE_RLS="$(psql "$NEON_DB_URL" -X -Atqc "select relrowsecurity from pg_class where oid='public.workspaces'::regclass")"
          test "$FOUNDER_WORKSPACE" = "1"
          test "$FOUNDER_ROLE" = "1"
          test "$PROJECT_WORKSPACE" = "1"
          test "$WORKSPACE_RLS" = "t"
          echo 'Workspace tenancy Neon preview schema verified: founder and project ownership are non-null and workspace RLS is enabled.'

      - name: Verify FCR commerce preview schema when present
        if: steps.neon_scope.outputs.needs_neon == 'true'
        shell: bash
        env:
          NEON_DB_URL: ${{ steps.create_neon_branch.outputs.db_url }}
        run: |
          set -euo pipefail
          HAS_FCR_COMMERCE="$(psql "$NEON_DB_URL" -X -Atqc "select to_regclass('public.fcr_commerce_receipts') is not null")"
          if [ "$HAS_FCR_COMMERCE" != "t" ]; then
            echo 'FCR commerce table is not part of this preview; generic migration execution completed.'
            exit 0
          fi

          EVENT_COLUMN="$(psql "$NEON_DB_URL" -X -Atqc "select count(*) from information_schema.columns where table_schema='public' and table_name='fcr_commerce_receipts' and column_name='event_id' and data_type='uuid' and is_nullable='NO')"
          EVENT_INDEX="$(psql "$NEON_DB_URL" -X -Atqc "select count(*) from pg_indexes where schemaname='public' and tablename='fcr_commerce_receipts' and indexname='fcr_commerce_receipts_provider_event_uidx'")"
          RLS_ENABLED="$(psql "$NEON_DB_URL" -X -Atqc "select relrowsecurity from pg_class where oid='public.fcr_commerce_receipts'::regclass")"
          ROW_COUNT="$(psql "$NEON_DB_URL" -X -Atqc "select count(*) from public.fcr_commerce_receipts")"

          test "$EVENT_COLUMN" = "1"
          test "$EVENT_INDEX" = "1"
          test "$RLS_ENABLED" = "t"
          test "$ROW_COUNT" = "0"
          echo 'FCR commerce Neon preview schema verified: event identity present, RLS enabled, zero synthetic revenue rows.'

  delete_neon_branch:
    name: Delete Neon Branch
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Classify Neon preview scope
        id: neon_scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mapfile -t CHANGED_FILES < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename'
          )

          NEEDS_NEON=false
          for path in "${CHANGED_FILES[@]}"; do
            case "$path" in
              supabase/*)
                NEEDS_NEON=true
                break
                ;;
            esac
          done

          echo "needs_neon=${NEEDS_NEON}" >> "$GITHUB_OUTPUT"
          if [ "$NEEDS_NEON" = "true" ]; then
            echo 'Supabase change detected; Neon preview cleanup is required.'
          else
            echo 'No supabase/ change detected; no Neon preview is expected for this PR.'
          fi

      - name: Record non-database cleanup no-op
        if: steps.neon_scope.outputs.needs_neon == 'false'
        shell: bash
        run: echo 'Neon cleanup skipped because this PR does not change supabase/.'

      - name: Validate Neon configuration
        if: steps.neon_scope.outputs.needs_neon == 'true'
        shell: bash
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEON_PROJECT_ID" || { echo 'NEON_PROJECT_ID is not configured' >&2; exit 1; }
          test -n "$NEON_API_KEY" || { echo 'NEON_API_KEY is not configured' >&2; exit 1; }

      - name: Delete Neon Branch
        if: steps.neon_scope.outputs.needs_neon == 'true'
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}