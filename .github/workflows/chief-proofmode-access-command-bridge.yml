name: Chief ProofMode Access Command Bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  authorize:
    if: >-
      github.event.issue.number == 485 &&
      github.event.comment.user.login == 'jussray' &&
      github.event.comment.user.id == 286642846
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.parse.outputs.sha }}
      mode: ${{ steps.parse.outputs.mode }}
      target: ${{ steps.parse.outputs.target }}
      approval_reference: ${{ steps.parse.outputs.approval_reference }}
      authority_comment_id: ${{ steps.parse.outputs.authority_comment_id }}

    steps:
      - name: Parse exact founder Chief Access command
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          AUTHORITY_COMMENT_ID: ${{ github.event.comment.id }}
        shell: bash
        run: |
          set -euo pipefail
          read -r command mode sha target approval extra <<< "$COMMENT_BODY"

          if [[ "$command" != '/cloudflare-chief-access' ]]; then
            echo 'Not a Chief Access command; exiting without recovery.'
            exit 0
          fi
          if [[ "$mode" != 'check' && "$mode" != 'repair' ]]; then
            echo '::error title=Invalid Chief Access command::mode must be check or repair.'
            exit 1
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error title=Invalid exact head::command must bind to a lowercase 40-character FCR main SHA.'
            exit 1
          fi
          target_origin="$(node -e '
            try {
              const url = new URL(process.argv[1]);
              if (
                url.protocol !== "https:"
                || url.username
                || url.password
                || url.search
                || url.hash
                || (url.pathname !== "/" && url.pathname !== "")
                || !/^[0-9a-f]{8}-chief-ai\.mcgill-raylene\.workers\.dev$/i.test(url.hostname)
              ) process.exit(1);
              process.stdout.write(url.origin);
            } catch { process.exit(1); }
          ' "$target")" || {
            echo '::error title=Invalid Chief target::target must be one immutable Chief workers.dev preview origin.'
            exit 1
          }
          if [[ -n "${extra:-}" ]]; then
            echo '::error title=Unexpected arguments::command contains extra fields.'
            exit 1
          fi

          if [[ "$mode" == 'check' ]]; then
            if [[ -n "${approval:-}" ]]; then
              echo '::error title=Unexpected approval::check accepts no approval reference.'
              exit 1
            fi
            approval_reference=''
          else
            if [[ ! "${approval:-}" =~ ^[A-Za-z0-9._:-]{8,200}$ ]]; then
              echo '::error title=Missing mutation approval::repair requires an auditable 8-200 character approval reference.'
              exit 1
            fi
            approval_reference="$approval"
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "target=$target_origin" >> "$GITHUB_OUTPUT"
          echo "approval_reference=$approval_reference" >> "$GITHUB_OUTPUT"
          echo "authority_comment_id=$AUTHORITY_COMMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Verify command SHA is exact FCR current main
        if: steps.parse.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.parse.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          printf 'expected=%s\ncurrent_main=%s\n' "$EXPECTED_HEAD_SHA" "$current_main"
          test "$current_main" = "$EXPECTED_HEAD_SHA"

  recover:
    name: Founder-bound Chief Access recovery
    needs: authorize
    if: needs.authorize.outputs.sha != ''
    uses: ./.github/workflows/chief-proofmode-access-recovery.yml
    with:
      expected_head_sha: ${{ needs.authorize.outputs.sha }}
      mode: ${{ needs.authorize.outputs.mode }}
      target_url: ${{ needs.authorize.outputs.target }}
      approval_reference: ${{ needs.authorize.outputs.approval_reference }}
      authority_comment_id: ${{ needs.authorize.outputs.authority_comment_id }}
    secrets: inherit
