name: Pages API Recovery Playwright

on:
  push:
    branches: [main]
    paths:
      - 'public/_worker.js'
      - 'public/_headers'
      - 'public/robots.txt'
      - 'public/sitemap.xml'
      - 'public/llms.txt'
      - 'public/crawlers.json'
      - 'public/juss-rayy/**'
      - 'public/work.html'
      - 'scripts/build-pages.mjs'
      - 'src/http/__tests__/seoAssets.test.ts'
      - 'e2e/pages-api-recovery.spec.ts'
      - 'e2e/public-work-directory.spec.ts'
      - '.github/workflows/pages-api-recovery-playwright.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/_worker.js'
      - 'public/_headers'
      - 'public/robots.txt'
      - 'public/sitemap.xml'
      - 'public/llms.txt'
      - 'public/crawlers.json'
      - 'public/juss-rayy/**'
      - 'public/work.html'
      - 'scripts/build-pages.mjs'
      - 'src/http/server.ts'
      - 'src/http/__tests__/pagesEdgeProxy.test.ts'
      - 'src/http/__tests__/server.integration.test.ts'
      - 'src/http/__tests__/seoAssets.test.ts'
      - 'e2e/pages-api-recovery.spec.ts'
      - 'e2e/public-work-directory.spec.ts'
      - '.github/workflows/pages-api-recovery-playwright.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-api-recovery-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-pages-api-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          printf 'Verified exact Pages recovery head: %s\n' "$actual"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Cloudflare Pages bundle
        run: npm run build:pages

      - name: Verify normalized public discovery output
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const founder = readFileSync('dist-pages/juss-rayy/index.html', 'utf8');
          const work = readFileSync('dist-pages/work.html', 'utf8');
          if (!founder.includes('<link rel="canonical" href="https://www.foundercontrolroom.org/juss-rayy/"')) {
            throw new Error('deployed founder canonical is not normalized to the public www origin');
          }
          if (!founder.includes('<meta itemprop="dateModified" content="2026-09-16" />')) {
            throw new Error('deployed founder dateModified is stale');
          }
          if (!work.includes('<link rel="canonical" href="https://www.foundercontrolroom.org/work.html"')) {
            throw new Error('public work directory canonical is missing');
          }
          NODE

      - name: Run focused behavior tests
        run: >-
          npx vitest run
          src/http/__tests__/pagesEdgeProxy.test.ts
          src/http/__tests__/server.integration.test.ts
          src/http/__tests__/seoAssets.test.ts

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rendered Pages recovery, founder identity, crawler, and public-work proof
        run: >-
          npx playwright test -c playwright.config.ts
          e2e/pages-api-recovery.spec.ts
          e2e/public-work-directory.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-api-recovery-playwright-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
