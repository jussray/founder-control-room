name: Jira native claim focused verification

on:
  push:
    branches:
      - fix/fcr-native-jira-claim-20261103
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jira-claim-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck repository
        run: npm run typecheck
      - name: Run Jira claim unit tests
        run: npx vitest run src/lib/__tests__/jiraActionReplayGate.test.ts src/lib/__tests__/jiraActionExecutor.test.ts src/lib/__tests__/jiraSupabaseActionStore.test.ts
      - name: Verify migration in ephemeral PostgreSQL
        env:
          PGPASSWORD: test-only-password
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/jira_action_claims_verify.sql
