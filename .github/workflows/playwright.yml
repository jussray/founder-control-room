name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [Deploy]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: playwright-e2e-${{ github.event.pull_request.number || github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  playwright:
    if: github.event_name != 'workflow_run'
    name: Playwright E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Make E2E harness use Playwright browser discovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('e2e/run.mjs')
          source = path.read_text()
          source = source.replace(
              "const CHROME_PATH = '/opt/pw-browsers/chromium-1194/chrome-linux/chrome';",
              "const CHROME_PATH = process.env.CHROME_PATH;",
          )
          source = source.replace(
              "const browser = await chromium.launch({ executablePath: CHROME_PATH, headless: true, args: ['--no-sandbox'] });",
              "const browser = await chromium.launch({ ...(CHROME_PATH ? { executablePath: CHROME_PATH } : {}), headless: true, args: ['--no-sandbox'] });",
          )
          path.write_text(source)
          PY
          grep -n "CHROME_PATH\|chromium.launch" e2e/run.mjs

      - name: Run E2E harness
        shell: bash
        run: |
          mkdir -p logs
          set +e
          npm run test:e2e 2>&1 | tee logs/e2e.log
          status=${PIPESTATUS[0]}
          echo "E2E harness exit status: ${status}" | tee -a logs/e2e.log
          exit "${status}"
        env:
          NODE_ENV: test
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}

      - name: Prove Repository Settings canonical ruleset safety
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test e2e/repository-settings-ruleset.spec.ts --reporter=list 2>&1 | tee logs/repository-settings-ruleset.log

      - name: Prove mobile Content Manager flow
        shell: bash
        run: |
          set -euo pipefail
          node e2e/content-manager-proof.mjs 2>&1 | tee logs/content-manager-proof.log

      - name: Prove mobile conveyor readiness states
        shell: bash
        run: |
          set -euo pipefail
          node e2e/conveyor-readiness-proof.mjs 2>&1 | tee logs/conveyor-readiness-proof.log

      - name: Prove Control Room truth receipts
        shell: bash
        run: |
          set -euo pipefail
          node e2e/control-room-truth-receipt-proof.mjs 2>&1 | tee logs/control-room-truth-receipt-proof.log

      - name: Prove Bip Genesis demo provenance
        shell: bash
        run: |
          set -euo pipefail
          node e2e/genesis-demo-proof.mjs 2>&1 | tee logs/genesis-demo-proof.log

      - name: Prove Founder Switchboard controls
        shell: bash
        run: |
          set -euo pipefail
          node e2e/founder-switchboard-proof.mjs 2>&1 | tee logs/founder-switchboard-proof.log

      - name: Prove Strategic Security Posture
        shell: bash
        run: |
          set -euo pipefail
          node e2e/security-posture-proof.mjs 2>&1 | tee logs/security-posture-proof.log

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-${{ env.EXPECTED_HEAD_SHA }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload traces and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-test-results-${{ env.EXPECTED_HEAD_SHA }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-logs-${{ env.EXPECTED_HEAD_SHA }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30

  production-release-witness:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    name: Production Playwright Exact-SHA Witness
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: production
    env:
      PRODUCTION_RELEASE_WITNESS_REQUIRED: 'true'
      EXPECTED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
      PUBLIC_URL: https://foundercontrolroom.org

    steps:
      - name: Check out the Deploy run head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Record and verify witness source head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'deploy_run_head=%s\nchecked_out=%s\n' "$EXPECTED_RELEASE_SHA" "$actual"
          test "$actual" = "$EXPECTED_RELEASE_SHA"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Prove deployed runtime and browser share the Deploy run SHA
        run: npx playwright test e2e/production-release-sha.spec.ts --reporter=list

      - name: Upload production release witness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-release-witness-${{ github.event.workflow_run.head_sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30

  repair-pr580-freshness:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 580 && github.event.pull_request.head.repo.full_name == github.repository
    name: Repair PR 580 reviewed-ref freshness seam
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out exact PR head with write credential
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Patch only the reviewed-ref freshness seam and focused regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          approvals = Path('src/http/routes/approvals.ts')
          text = approvals.read_text()
          old_decl = """        let independentReviewEvidence: Record<string, unknown> | null = null;
        let founderFinalReviewEvidence: Record<string, unknown> | null = null;
"""
          new_decl = """        let independentReviewEvidence: Record<string, unknown> | null = null;
        let founderFinalReviewEvidence: Record<string, unknown> | null = null;
        let reviewedBaseSha: string | null = null;
"""
          assert text.count(old_decl) == 1
          text = text.replace(old_decl, new_decl, 1)

          old_pin = """          const pinned = pinnedResult.review;
          const founderFinalMode = pinned.policy.founderFinalApprovalRequired === true;
"""
          new_pin = """          const pinned = pinnedResult.review;
          reviewedBaseSha = pinned.baseSha;
          const founderFinalMode = pinned.policy.founderFinalApprovalRequired === true;
"""
          assert text.count(old_pin) == 1
          text = text.replace(old_pin, new_pin, 1)

          old_freshness = """        // This is deliberately after review/founder-final validation. Provider
        // reads may take time; the mutable head must still equal the approved
        // SHA at the last possible moment before integration.
        const currentHeadSha = await provider.resolveRef(project.slug, head);
        if (currentHeadSha !== expectedHeadSha) {
          throw new Error(
            `Branch moved after verification: current ${currentHeadSha}, approved ${expectedHeadSha}.`,
          );
        }

        const mergeCommitSha = await provider.integrate(project.slug, base, head);
"""
          new_freshness = """        // This is deliberately after review/founder-final validation. Provider
        // reads may take time; both mutable FCR refs must still equal the
        // reviewed candidate at the last possible moment before integration.
        if (isFounderControlRoomRepository(projectRow)) {
          if (!reviewedBaseSha) {
            throw new Error('Independent review gate blocked: reviewed base SHA is unavailable before integration');
          }
          const currentBaseSha = await provider.resolveRef(project.slug, base);
          if (currentBaseSha !== reviewedBaseSha) {
            throw new Error(
              `Base moved after verification: current ${currentBaseSha}, reviewed ${reviewedBaseSha}.`,
            );
          }
        }

        const currentHeadSha = await provider.resolveRef(project.slug, head);
        if (currentHeadSha !== expectedHeadSha) {
          throw new Error(
            `Branch moved after verification: current ${currentHeadSha}, approved ${expectedHeadSha}.`,
          );
        }

        const mergeCommitSha = await provider.integrate(project.slug, base, head);
"""
          assert text.count(old_freshness) == 1
          approvals.write_text(text.replace(old_freshness, new_freshness, 1))

          test = Path('src/http/routes/__tests__/approvals.independentReview.integration.test.ts')
          t = test.read_text()
          old_default = """  mockResolveRef.mockResolvedValue(HEAD_SHA);
"""
          new_default = """  mockResolveRef.mockImplementation(async (_projectId: string, ref: string) => (
    ref === 'main' ? BASE_SHA : HEAD_SHA
  ));
"""
          assert t.count(old_default) == 1
          t = t.replace(old_default, new_default, 1)

          old_expect = """    expect(mockResolveRef).toHaveBeenLastCalledWith('founder-control-room', 'mission/review-gate');
    expect(mockIntegrate).toHaveBeenCalledWith('founder-control-room', 'main', 'mission/review-gate');
"""
          new_expect = """    expect(mockResolveRef).toHaveBeenNthCalledWith(1, 'founder-control-room', 'main');
    expect(mockResolveRef).toHaveBeenNthCalledWith(2, 'founder-control-room', 'mission/review-gate');
    expect(mockIntegrate).toHaveBeenCalledWith('founder-control-room', 'main', 'mission/review-gate');
"""
          assert t.count(old_expect) == 1
          t = t.replace(old_expect, new_expect, 1)

          anchor = """  it('fails closed after deterministic review when founder-final confirmation is missing', async () => {
"""
          regression = """  it('fails closed when the reviewed base moves before FCR integration', async () => {
    executeStack({ founderFinal: true });
    clearReviewGate();
    const movedBaseSha = 'c'.repeat(40);
    mockResolveRef.mockImplementation(async (_projectId: string, ref: string) => (
      ref === 'main' ? movedBaseSha : HEAD_SHA
    ));

    const response = await request(buildApp())
      .post(`/approvals/${MISSION_ID}/execute`)
      .set('Authorization', BEARER)
      .send({
        actionType: 'merge',
        idempotencyKey: 'founder-final-base-moved',
        payload: {
          head: 'mission/review-gate',
          base: 'main',
          expectedHeadSha: HEAD_SHA,
          independentReviews: [{ reviewHash: REVIEW_HASH }],
          founderFinalReview: { pullRequestNumber: 470, confirmExactCandidate: true },
        },
      });

    expect(response.status).toBe(409);
    expect(response.body.error).toMatch(/Base moved after verification/);
    expect(mockResolveRef).toHaveBeenCalledWith('founder-control-room', 'main');
    expect(mockIntegrate).not.toHaveBeenCalled();
  });

"""
          assert t.count(anchor) == 1
          test.write_text(t.replace(anchor, regression + anchor, 1))
          PY

      - name: Run focused regressions before committing
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx vitest run src/http/routes/__tests__/approvals.independentReview.integration.test.ts src/providers/__tests__/githubProvider.fcrPullRequestMerge.test.ts

      - name: Commit only repaired source and regression
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/http/routes/approvals.ts src/http/routes/__tests__/approvals.independentReview.integration.test.ts
          git diff --cached --check
          git commit -m 'fix(governance): reacquire FCR base before integration'
          git push origin "HEAD:${TARGET_BRANCH}"
