name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: playwright-e2e-${{ github.event.pull_request.number || github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  STORYENGINE_PEER_SHA: 9a3a1e1db4d29923138b0a6c0da3d23650f2e6bd
  STORYENGINE_PEER_REF: refs/heads/feat/intent-aware-inbound-routing-20260825
  STORYENGINE_PEER_URL: http://127.0.0.1:3901
  STORYENGINE_PEER_API_KEY: fcr-ci-product-build

jobs:
  playwright:
    if: github.event_name != 'workflow_run'
    name: Playwright E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record and verify exact head and base ancestry
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\nbase=%s\n' "$EXPECTED_HEAD_SHA" "$actual" "$PR_BASE_SHA"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          if [ -n "$PR_BASE_SHA" ]; then
            if ! git merge-base --is-ancestor "$PR_BASE_SHA" "$EXPECTED_HEAD_SHA"; then
              echo "STALE_BASE: $PR_BASE_SHA is not an ancestor of $EXPECTED_HEAD_SHA" >&2
              exit 1
            fi
          fi

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Make E2E harness use Playwright browser discovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('e2e/run.mjs')
          source = path.read_text()
          source = source.replace(
              "const CHROME_PATH = '/opt/pw-browsers/chromium-1194/chrome-linux/chrome';",
              "const CHROME_PATH = process.env.CHROME_PATH;",
          )
          source = source.replace(
              "const browser = await chromium.launch({ executablePath: CHROME_PATH, headless: true, args: ['--no-sandbox'] });",
              "const browser = await chromium.launch({ ...(CHROME_PATH ? { executablePath: CHROME_PATH } : {}), headless: true, args: ['--no-sandbox'] });",
          )
          path.write_text(source)
          PY
          grep -n "CHROME_PATH\|chromium.launch" e2e/run.mjs

      - name: Run E2E harness
        shell: bash
        run: |
          mkdir -p logs
          set +e
          npm run test:e2e 2>&1 | tee logs/e2e.log
          status=${PIPESTATUS[0]}
          echo "E2E harness exit status: ${status}" | tee -a logs/e2e.log
          exit "${status}"
        env:
          NODE_ENV: test
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}

      - name: Verify live StoryEngine peer ref still pinned
        shell: bash
        run: |
          set -euo pipefail
          live="$(git ls-remote https://github.com/jussray/StoryEngine.git "$STORYENGINE_PEER_REF" | awk 'NR==1 {print $1}')"
          printf 'storyengine_live_ref=%s\nstoryengine_expected=%s\nstoryengine_live=%s\n' "$STORYENGINE_PEER_REF" "$STORYENGINE_PEER_SHA" "$live"
          test -n "$live"
          test "$live" = "$STORYENGINE_PEER_SHA"

      - name: Check out exact StoryEngine federation peer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jussray/StoryEngine
          ref: ${{ env.STORYENGINE_PEER_SHA }}
          path: .federation/storyengine
          persist-credentials: false

      - name: Verify immutable StoryEngine federation peer
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C .federation/storyengine rev-parse HEAD)"
          printf 'storyengine_expected=%s\nstoryengine_actual=%s\n' "$STORYENGINE_PEER_SHA" "$actual"
          test "$actual" = "$STORYENGINE_PEER_SHA"

      - name: Install StoryEngine federation peer
        run: npm ci --prefix .federation/storyengine/story-engine

      - name: Start exact StoryEngine federation runtime
        shell: bash
        env:
          L99_API_KEYS_JSON: '[{"key":"fcr-ci-product-build","actor_id":"fcr-storyengine-control-room","tenant_id":"founder-control-room","role":"administrator","workspace_ids":["*"]}]'
        run: |
          set -euo pipefail
          mkdir -p logs
          export PORT=3901
          export EXPECTED_HEAD_SHA="$STORYENGINE_PEER_SHA"
          export L99_RELEASE_SHA="$STORYENGINE_PEER_SHA"
          export L99_DB_PATH="$RUNNER_TEMP/storyengine-federation.db"
          nohup node .federation/storyengine/story-engine/server.js > logs/storyengine-federation.log 2>&1 &
          echo $! > "$RUNNER_TEMP/storyengine-federation.pid"

          ready=0
          for _ in $(seq 1 40); do
            if curl --fail --silent "$STORYENGINE_PEER_URL/runtime-identity" > "$RUNNER_TEMP/storyengine-identity.json"; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat logs/storyengine-federation.log >&2 || true
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const identity = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/storyengine-identity.json', 'utf8'));
          if (identity.service !== 'l99-story-engine') throw new Error(`unexpected StoryEngine service: ${identity.service}`);
          if (identity.release_sha !== process.env.STORYENGINE_PEER_SHA) {
            throw new Error(`StoryEngine release mismatch: ${identity.release_sha}`);
          }
          console.log(JSON.stringify(identity, null, 2));
          NODE

      - name: Prove FCR to StoryEngine receipt loop in Playwright
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test e2e/product-build-federation.spec.ts --reporter=list 2>&1 | tee logs/product-build-federation.log

      - name: Prove Repository Settings canonical ruleset safety
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test e2e/repository-settings-ruleset.spec.ts --reporter=list 2>&1 | tee logs/repository-settings-ruleset.log

      - name: Prove mobile Content Manager flow
        shell: bash
        run: |
          set -euo pipefail
          node e2e/content-manager-proof.mjs 2>&1 | tee logs/content-manager-proof.log

      - name: Prove mobile conveyor readiness states
        shell: bash
        run: |
          set -euo pipefail
          node e2e/conveyor-readiness-proof.mjs 2>&1 | tee logs/conveyor-readiness-proof.log

      - name: Prove Control Room truth receipts
        shell: bash
        run: |
          set -euo pipefail
          node e2e/control-room-truth-receipt-proof.mjs 2>&1 | tee logs/control-room-truth-receipt-proof.log

      - name: Prove Evidence Trust Plane
        shell: bash
        run: |
          set -euo pipefail
          node e2e/evidence-trust-plane-proof.mjs 2>&1 | tee logs/evidence-trust-plane-proof.log

      - name: Prove Founder capital decision card
        shell: bash
        run: |
          set -euo pipefail
          node e2e/founder-capital-decision-proof.mjs 2>&1 | tee logs/founder-capital-decision-proof.log

      - name: Prove evidence-aware mission board
        shell: bash
        run: |
          set -euo pipefail
          node e2e/mission-board-proof.mjs 2>&1 | tee logs/mission-board-proof.log

      - name: Prove Bip Genesis demo provenance
        shell: bash
        run: |
          set -euo pipefail
          node e2e/genesis-demo-proof.mjs 2>&1 | tee logs/genesis-demo-proof.log

      - name: Prove Founder Switchboard controls
        shell: bash
        run: |
          set -euo pipefail
          node e2e/founder-switchboard-proof.mjs 2>&1 | tee logs/founder-switchboard-proof.log

      - name: Prove Strategic Security Posture
        shell: bash
        run: |
          set -euo pipefail
          node e2e/security-posture-proof.mjs 2>&1 | tee logs/security-posture-proof.log

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-${{ env.EXPECTED_HEAD_SHA }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload traces and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-test-results-${{ env.EXPECTED_HEAD_SHA }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-logs-${{ env.EXPECTED_HEAD_SHA }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30

  production-release-witness:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    name: Production Playwright Exact-SHA Witness
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: production
    env:
      PRODUCTION_RELEASE_WITNESS_REQUIRED: 'true'
      EXPECTED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_URL: https://api.foundercontrolroom.org
      PUBLIC_URL: https://foundercontrolroom.org

    steps:
      - name: Check out trusted witness source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record trusted witness source and release evidence
        shell: bash
        run: |
          set -euo pipefail
          witness_source="$(git rev-parse HEAD)"
          printf 'trusted_witness_source=%s\ndeploy_run_head=%s\n' "$witness_source" "$EXPECTED_RELEASE_SHA"
          test "$witness_source" = "$GITHUB_SHA"
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Prove deployed runtime and browser share the Deploy run SHA
        run: npx playwright test e2e/production-release-sha.spec.ts --reporter=list

      - name: Upload production release witness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-release-witness-${{ github.event.workflow_run.head_sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
