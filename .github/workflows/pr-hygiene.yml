name: PR Hygiene

# Keeps open drafts and PRs from piling up. Policy lives in scripts/pr-hygiene.mjs:
# idle drafts are labelled `stale` and closed after a grace period (reversible,
# branches kept); idle ready PRs are only labelled, never closed; `keep-open`
# exempts any PR.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr-hygiene.yml'
      - 'scripts/pr-hygiene.mjs'
      - 'tests/pr-hygiene.test.mjs'
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print the planned actions'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pr-hygiene
  cancel-in-progress: false

jobs:
  policy-test:
    name: PR hygiene policy test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test PR hygiene policy
        run: node --test tests/pr-hygiene.test.mjs

  hygiene:
    name: PR hygiene
    if: github.event_name != 'pull_request'
    needs: policy-test
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply PR hygiene policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HYGIENE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node scripts/pr-hygiene.mjs
